  <style>
    /* ===================================================================== */
    /* DESIGN SYSTEM: ARQUITECTURA MULTITEMA (SLATE METÁLICO & ROSE LUXURY) */
    /* ===================================================================== */
    :root,
    :root[data-theme="slate"] {
      --bg-canvas: #f8fafc;
      --bg-surface-1: #ffffff;
      --bg-surface-2: #f1f5f9;
      --bg-surface-hover: #e2e8f0;
      --border-subtle: #e2e8f0;
      --border-card: #cbd5e1;
      --border-focus: #4f46e5;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-brand: #4f46e5;
      --accent-brand-hover: #4338ca;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-thumb-hover: #94a3b8;
      /* Tokens de Elevación y Sombras (Slate Light) */
      --elevation-1: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      --elevation-2: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --elevation-3: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
      --elevation-hover: 0 10px 20px -5px rgba(15, 23, 42, 0.08), 0 6px 8px -4px rgba(15, 23, 42, 0.04);
    }

    html.dark,
    html.dark[data-theme="slate"] {
      --bg-canvas: #020617;
      --bg-surface-1: #0D1526;
      --bg-surface-2: #1e293b;
      --bg-surface-hover: #243247;
      --border-subtle: rgba(30, 41, 59, 0.45);
      --border-card: #334155;
      --border-focus: #38bdf8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-brand: #38bdf8;
      --accent-brand-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --scrollbar-thumb: #334155;
      --scrollbar-thumb-hover: #475569;
      /* Tokens de Elevación y Sombras (Cobalt Aerodynamic A.2.2) */
      --elevation-1: 0 10px 25px -5px rgba(2, 6, 23, 0.8), 0 8px 10px -6px rgba(30, 58, 138, 0.18);
      --elevation-2: 0 14px 28px -4px rgba(2, 6, 23, 0.85), 0 10px 14px -5px rgba(30, 58, 138, 0.25);
      --elevation-3: 0 25px 50px -12px rgba(2, 6, 23, 0.9), 0 12px 24px -8px rgba(30, 58, 138, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      --elevation-hover: 0 14px 28px -4px rgba(2, 6, 23, 0.85), 0 10px 14px -5px rgba(30, 58, 138, 0.28);
    }

    /* TEMA B: CHAMPAGNE & DUSTY ROSE LUXURY (ALTO CONTRASTE & GLASSMORPHISM) */
    :root[data-theme="rose"] {
      --bg-canvas: #fcf9f7;
      --bg-surface-1: #ffffff;
      --bg-surface-2: #fdf5f3;
      --bg-surface-hover: #f7e8e5;
      --border-subtle: #ebd7d2;
      --border-card: #e2c7c1;
      --border-focus: #b85d6e;
      --text-primary: #1f1317;
      --text-secondary: #584147;
      --text-muted: #8c7278;
      --accent-brand: #b85d6e;
      --accent-brand-hover: #9e4657;
      --accent-champagne: #c99c6b;
      --accent-glow: rgba(184, 93, 110, 0.22);
      --scrollbar-thumb: #e2c7c1;
      --scrollbar-thumb-hover: #cfaca5;
      /* Tokens de Elevación y Sombras (Rose Light) */
      --elevation-1: 0 1px 3px 0 rgba(184, 93, 110, 0.06), 0 1px 2px 0 rgba(184, 93, 110, 0.04);
      --elevation-2: 0 4px 12px -2px rgba(184, 93, 110, 0.1), 0 2px 4px -1px rgba(184, 93, 110, 0.06);
      --elevation-3: 0 20px 30px -6px rgba(184, 93, 110, 0.16), 0 8px 12px -4px rgba(184, 93, 110, 0.08);
      --elevation-hover: 0 6px 16px -4px rgba(184, 93, 110, 0.12), 0 4px 8px -2px rgba(184, 93, 110, 0.06);
    }

    html.dark[data-theme="rose"] {
      --bg-canvas: #120b10;
      --bg-surface-1: #1a1017;
      --bg-surface-2: #241620;
      --bg-surface-hover: #321c2c;
      --border-subtle: #3a1f33;
      --border-card: #4d2642;
      --border-focus: #f2728f;
      --text-primary: #fff2f4;
      --text-secondary: #e6b8c4;
      --text-muted: #af8190;
      --accent-brand: #f06a88;
      --accent-brand-hover: #f887a1;
      --accent-champagne: #e0b484;
      --accent-glow: rgba(240, 106, 136, 0.35);
      --scrollbar-thumb: #451f3b;
      --scrollbar-thumb-hover: #632a53;
      /* Tokens de Elevación y Sombras (Rose Dark) */
      --elevation-1: 0 1px 3px 0 rgba(2, 6, 23, 0.45), inset 0 0 0 1px rgba(240, 106, 136, 0.1);
      --elevation-2: 0 6px 18px -3px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(240, 106, 136, 0.12);
      --elevation-3: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(240, 106, 136, 0.15);
      --elevation-hover: 0 12px 24px -6px rgba(0, 0, 0, 0.55), 0 6px 20px -4px rgba(240, 106, 136, 0.22), inset 0 0 0 1px rgba(240, 106, 136, 0.12);
    }

    /* Reglas de Revestimiento Champagne & Dusty Rose */
    html[data-theme="rose"] body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-primary) !important;
    }

    html[data-theme="rose"] header {
      background-color: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border-color: #ebd7d2 !important;
      box-shadow: 0 4px 20px -2px rgba(184, 93, 110, 0.05) !important;
    }

    html.dark[data-theme="rose"] header {
      background-color: rgba(26, 16, 23, 0.88) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border-color: #3a1f33 !important;
      box-shadow: 0 4px 25px -2px rgba(0, 0, 0, 0.5) !important;
    }

    html[data-theme="rose"] header nav {
      background-color: rgba(253, 245, 243, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      border-color: rgba(235, 215, 210, 0.9) !important;
    }
    html.dark[data-theme="rose"] header nav {
      background-color: rgba(36, 22, 32, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      border-color: rgba(77, 38, 66, 0.7) !important;
    }

    html[data-theme="rose"] .nav-tab-active {
      color: #8f3244 !important;
      background-color: #ffffff !important;
      border-color: #e2c7c1 !important;
      box-shadow: 0 2px 8px -2px rgba(184, 93, 110, 0.15) !important;
    }

    html.dark[data-theme="rose"] .nav-tab-active {
      color: #fddde4 !important;
      background-color: #2b1825 !important;
      border-color: #5d284e !important;
      box-shadow: 0 4px 14px -2px rgba(240, 106, 136, 0.3) !important;
    }

    html[data-theme="rose"] .nav-tab-active::after {
      background: linear-gradient(90deg, transparent, #b85d6e, transparent) !important;
    }
    html.dark[data-theme="rose"] .nav-tab-active::after {
      background: linear-gradient(90deg, transparent, #f06a88, transparent) !important;
      box-shadow: 0 0 10px rgba(240, 106, 136, 0.6) !important;
    }

    /* Estilos limpios y minimalistas para Tarjetas (Kanban, Hábitos, Portafolio) */
    .kanban-card,
    .habit-card,
    .portfolio-card {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.2s ease,
                  background-color 0.15s ease-out,
                  opacity 0.2s ease !important;
      border: 1px solid rgba(226, 232, 240, 0.7) !important;
      box-shadow: var(--elevation-1) !important;
    }
    .kanban-card:hover,
    .habit-card:hover,
    .portfolio-card:hover {
      border-color: rgba(148, 163, 184, 0.5) !important;
      box-shadow: var(--elevation-hover) !important;
    }
    @media (hover: hover) {
      .kanban-card:not(.card-dragging):not(.dragging):not(.sortable-chosen):hover,
      .habit-card:not(.card-dragging):not(.dragging):not(.sortable-chosen):hover,
      .portfolio-card:not(.card-dragging):not(.dragging):not(.sortable-chosen):hover {
        transform: translateY(-1.5px);
      }
    }
    html.dark .kanban-card,
    html.dark .habit-card,
    html.dark .portfolio-card {
      border: 1px solid rgba(30, 41, 59, 0.7) !important;
      background-color: #0f172a !important;
      box-shadow: var(--elevation-1) !important;
    }
    html.dark .kanban-card:hover,
    html.dark .habit-card:hover,
    html.dark .portfolio-card:hover {
      border-color: rgba(99, 102, 241, 0.35) !important;
      box-shadow: var(--elevation-hover) !important;
    }

    html[data-theme="rose"] .kanban-card,
    html[data-theme="rose"] .habit-card,
    html[data-theme="rose"] .portfolio-card {
      background-color: #ffffff !important;
      border: 1px solid rgba(235, 215, 210, 0.85) !important;
      box-shadow: var(--elevation-1) !important;
    }
    html[data-theme="rose"] .kanban-card:hover,
    html[data-theme="rose"] .habit-card:hover,
    html[data-theme="rose"] .portfolio-card:hover {
      border-color: rgba(201, 156, 107, 0.7) !important;
      box-shadow: var(--elevation-hover) !important;
    }
    html.dark[data-theme="rose"] .kanban-card,
    html.dark[data-theme="rose"] .habit-card,
    html.dark[data-theme="rose"] .portfolio-card {
      background-color: #1a1017 !important;
      border: 1px solid rgba(58, 31, 51, 0.85) !important;
      box-shadow: var(--elevation-1) !important;
    }
    html.dark[data-theme="rose"] .kanban-card:hover,
    html.dark[data-theme="rose"] .habit-card:hover,
    html.dark[data-theme="rose"] .portfolio-card:hover {
      border-color: rgba(224, 180, 132, 0.6) !important;
      box-shadow: var(--elevation-hover) !important;
    }

    /* Clases Utilitarias de Elevación Semántica */
    .elevation-1 { box-shadow: var(--elevation-1) !important; }
    .elevation-2 { box-shadow: var(--elevation-2) !important; }
    .elevation-3 { box-shadow: var(--elevation-3) !important; }
    .elevation-hover:hover { box-shadow: var(--elevation-hover) !important; }

    /* ===================================================================== */
    /* TIPIFICACIÓN NUMÉRICA TABULAR: EVITA SALTOS HORIZONTALES EN MÉTRICAS  */
    /* ===================================================================== */
    .tabular-nums,
    .font-mono,
    .monto-financiero,
    .precio,
    .moneda,
    .currency,
    .hora-badge,
    .tiempo-contador,
    .duracion,
    .kpi-valor,
    .progreso-texto,
    .metric-value {
      font-variant-numeric: tabular-nums !important;
      -webkit-font-feature-settings: "tnum" 1 !important;
      font-feature-settings: "tnum" 1 !important;
    }

    html[data-theme="rose"] .kanban-dropzone-active {
      background-color: rgba(253, 245, 243, 0.6) !important;
      border: 1.5px dashed #b85d6e !important;
    }
    html.dark[data-theme="rose"] .kanban-dropzone-active {
      background-color: rgba(240, 106, 136, 0.12) !important;
      border: 1.5px dashed #f06a88 !important;
    }

    /* Estilos Glassmorphism para Drawer de Archivados y Menú Temas */
    #drawer-archivados {
      box-shadow: -10px 0 40px -10px rgba(0, 0, 0, 0.25);
    }
    html.dark #drawer-archivados {
      box-shadow: -10px 0 50px -10px rgba(0, 0, 0, 0.7);
    }
    html[data-theme="rose"] #drawer-archivados {
      background-color: rgba(252, 249, 247, 0.96) !important;
      border-color: #ebd7d2 !important;
    }
    html.dark[data-theme="rose"] #drawer-archivados {
      background-color: rgba(26, 16, 23, 0.96) !important;
      border-color: #3a1f33 !important;
    }
    .drawer-bento-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drawer-bento-card:hover {
      transform: translateY(-1px);
    }

    /* ===================================================================== */
    /* DOCK PREMIUM BENTO / GLASSMORPHISM - BARRA SUPERIOR                    */
    /* ===================================================================== */
    /* DOCK DERECHO: ACABADO 'CARVED GLASS' DE ALTA GAMA (ESTILO LINEAR / RAYCAST) */
    /* Recargar, Atajos, Calendar, Archivados, Tema y Notas                  */
    /* ===================================================================== */
    .header-dock-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 2.25rem; /* h-9 */
      border-radius: 0.75rem; /* rounded-xl (12px) */
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .header-dock-btn:active {
      transform: scale(0.96) !important;
    }

    /* ===================================================================== */
    /* CÁPSULAS TRANSPARENTES E ICONOS FLOTANTES DEL HEADER (DOCK DERECHO)   */
    /* ===================================================================== */
    /* 1. Notas (#btn-nav-notas): Cápsula transparente con borde fino nítido en ámbar */
    #btn-nav-notas {
      background: transparent !important;
      background-color: transparent !important;
      border: 1px solid rgba(217, 119, 6, 0.8) !important; /* amber-600/80 */
      color: #f59e0b !important;
      box-shadow: none !important;
    }
    html.dark #btn-nav-notas {
      color: #fbbf24 !important;
      border-color: rgba(217, 119, 6, 0.8) !important;
    }
    #btn-nav-notas:hover {
      background: rgba(245, 158, 11, 0.10) !important;
      background-color: rgba(245, 158, 11, 0.10) !important;
      border-color: rgba(245, 158, 11, 0.95) !important;
      color: #d97706 !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.20) !important;
    }
    html.dark #btn-nav-notas:hover {
      color: #fef3c7 !important;
      border-color: rgba(251, 191, 36, 0.95) !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25) !important;
    }

    /* 2. Calendar (#btn-header-calendar): Cápsula transparente con borde fino en gris/azul metálico */
    #btn-header-calendar {
      background: transparent !important;
      background-color: transparent !important;
      border: 1px solid rgba(71, 85, 105, 0.8) !important; /* slate-600/80 */
      color: #64748b !important;
      box-shadow: none !important;
    }
    html.dark #btn-header-calendar {
      color: #cbd5e1 !important;
      border-color: rgba(71, 85, 105, 0.8) !important;
    }
    #btn-header-calendar:hover {
      background: rgba(148, 163, 184, 0.10) !important;
      background-color: rgba(148, 163, 184, 0.10) !important;
      border-color: rgba(148, 163, 184, 0.70) !important;
      color: #0f172a !important;
      box-shadow: 0 0 10px rgba(100, 116, 139, 0.15) !important;
    }
    html.dark #btn-header-calendar:hover {
      color: #ffffff !important;
      border-color: rgba(203, 213, 225, 0.70) !important;
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.25) !important;
    }

    /* 3. Archivados (#btn-header-boveda-archivados / #btn-header-archivados): Cápsula transparente naranja */
    #btn-header-boveda-archivados,
    #btn-header-archivados {
      background: transparent !important;
      background-color: transparent !important;
      border: 1px solid rgba(249, 115, 22, 0.8) !important; /* orange-500/80 */
      color: #ea580c !important;
      box-shadow: none !important;
    }
    html.dark #btn-header-boveda-archivados,
    html.dark #btn-header-archivados {
      color: #fb923c !important;
      border-color: rgba(249, 115, 22, 0.8) !important;
    }
    #btn-header-boveda-archivados:hover,
    #btn-header-archivados:hover {
      background: rgba(249, 115, 22, 0.10) !important;
      background-color: rgba(249, 115, 22, 0.10) !important;
      border-color: rgba(249, 115, 22, 0.95) !important;
      color: #c2410c !important;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.20) !important;
    }
    html.dark #btn-header-boveda-archivados:hover,
    html.dark #btn-header-archivados:hover {
      color: #ffedd5 !important;
      border-color: rgba(251, 146, 60, 0.95) !important;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.25) !important;
    }

    /* 4. Iconos Sueltos de Utilidades (Recargar, Atajos, Sol/Tema): Flotantes, limpios, sin marco ni caja en reposo */
    #btn-refresh-global,
    #btn-header-refresh,
    #btn-toggle-shortcuts-modal,
    #btn-shortcuts-config,
    #btn-theme-dropdown {
      background: transparent !important;
      background-color: transparent !important;
      border: 1px solid transparent !important;
      box-shadow: none !important;
      color: #64748b !important;
    }
    html.dark #btn-refresh-global,
    html.dark #btn-header-refresh,
    html.dark #btn-toggle-shortcuts-modal,
    html.dark #btn-shortcuts-config,
    html.dark #btn-theme-dropdown {
      color: #94a3b8 !important;
      background: transparent !important;
      background-color: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
    }
    #btn-refresh-global:hover,
    #btn-header-refresh:hover,
    #btn-toggle-shortcuts-modal:hover,
    #btn-shortcuts-config:hover,
    #btn-theme-dropdown:hover {
      background: rgba(100, 116, 139, 0.15) !important;
      background-color: rgba(100, 116, 139, 0.15) !important;
      border-color: transparent !important;
      color: #0f172a !important;
      box-shadow: none !important;
    }
    html.dark #btn-refresh-global:hover,
    html.dark #btn-header-refresh:hover,
    html.dark #btn-toggle-shortcuts-modal:hover,
    html.dark #btn-shortcuts-config:hover,
    html.dark #btn-theme-dropdown:hover {
      background: rgba(148, 163, 184, 0.15) !important;
      background-color: rgba(148, 163, 184, 0.15) !important;
      border-color: transparent !important;
      color: #f8fafc !important;
      box-shadow: none !important;
    }


    /* Columnas Bento de Hábitos en Rose Theme */
    html[data-theme="rose"] #vista-habitos-wrapper [data-categoria] {
      background-color: #fff9fa !important;
      border-color: #fecdd3 !important;
    }
    html[data-theme="rose"] #vista-habitos-wrapper [data-categoria] > div:first-child {
      background-color: rgba(255, 249, 250, 0.95) !important;
      border-color: #fecdd3 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper [data-categoria] {
      background-color: #1a0f17 !important;
      border-color: #3d1c31 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper [data-categoria] > div:first-child {
      background-color: rgba(26, 15, 23, 0.95) !important;
      border-color: #3d1c31 !important;
    }

    /* Bento KPI Cards y Tarjetas de Hábitos en Modo Oscuro */
    html.dark #vista-habitos-wrapper {
      background-color: #020617 !important;
    }
    html.dark #vista-habitos-wrapper [data-categoria] {
      background-color: #0b1120 !important;
      border-color: #1e293b !important;
    }
    html.dark #vista-habitos-wrapper [data-categoria] > div:first-child {
      background-color: rgba(11, 17, 32, 0.95) !important;
      border-color: #1e293b !important;
    }
    html.dark #vista-habitos-wrapper .habit-card {
      background-color: #0f172a !important;
      border-color: #1e293b !important;
    }
    html.dark #vista-habitos-wrapper [class*="bg-white"] {
      background-color: #0f172a !important;
      border-color: #1e293b !important;
    }

    /* Bento KPI Cards en Rose Theme */
    html[data-theme="rose"]:not(.dark) #vista-habitos-wrapper .bg-white\/80 {
      background-color: rgba(255, 255, 255, 0.88) !important;
      border-color: #fecdd3 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper {
      background-color: #140d12 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper [data-categoria] {
      background-color: #1a0f17 !important;
      border-color: #3d1c31 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper [data-categoria] > div:first-child {
      background-color: rgba(26, 15, 23, 0.95) !important;
      border-color: #3d1c31 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper .habit-card {
      background-color: #1e121a !important;
      border-color: #3d1c31 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper [class*="bg-white"] {
      background-color: #1e121a !important;
      border-color: #3d1c31 !important;
    }
    html.dark[data-theme="rose"] #vista-habitos-wrapper .dark\:bg-slate-900\/80 {
      background-color: rgba(30, 18, 26, 0.88) !important;
      border-color: #4c1d3d !important;
    }

    /* Píldoras de Filtro de Hábitos en Rose Theme */
    html[data-theme="rose"] .chip-filtro-habito.bg-indigo-600 {
      background-color: #e11d48 !important;
      color: #ffffff !important;
    }
    html.dark[data-theme="rose"] .chip-filtro-habito.bg-indigo-600 {
      background-color: #f43f5e !important;
      color: #ffffff !important;
    }

    /* Refinamiento Multitema para Scrollbars */
    html[data-theme="rose"] .custom-scrollbar::-webkit-scrollbar-thumb,
    html[data-theme="rose"] .kanban-col-body::-webkit-scrollbar-thumb {
      background-color: #fecdd3 !important;
    }
    html[data-theme="rose"] .custom-scrollbar::-webkit-scrollbar-thumb:hover,
    html[data-theme="rose"] .kanban-col-body::-webkit-scrollbar-thumb:hover {
      background-color: #fda4af !important;
    }
    html.dark[data-theme="rose"] .custom-scrollbar::-webkit-scrollbar-thumb,

    /* UI/UX FRAMER & SAAS: FLUIDEZ GLOBAL Y MICRO-INTERACCIONES             */
    /* ===================================================================== */

    /* 1. Transición suave de entrada de vistas (Cero corte seco / 60 FPS) */
    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #vista-kanban-wrapper:not(.hidden),

        transform: none !important;
      }

    /* 2. Barra de Navegación de Pestañas: Indicador activo luminoso Framer */
    .nav-tab-active {
      position: relative;
    }
    .nav-tab-active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, transparent);
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.dark .nav-tab-active::after {
      background: linear-gradient(90deg, transparent, #818cf8, transparent);
      box-shadow: 0 0 8px rgba(129, 140, 248, 0.6);
    }

    /* 3. Animación orgánica de apertura de Modales (Scale-up suave) */
    @keyframes modalScaleUp {
      0% {
        opacity: 0;
        transform: scale(0.96) translateY(6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

    .modal-animate-enter {
      animation: modalScaleUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    /* 4. Feedback háptico visual universal en botones activos */
    button:not(:disabled):active {
      transform: scale(0.96);
    }

    /* 6. Hábitos & Vida: Micro-interacciones de Checkmark y Tarjetas Bento */
    @keyframes habitCheckPulse {
      0% {
        transform: scale(0.8);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      60% {
        transform: scale(1.15);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
    .habit-pulse-success {
      animation: habitCheckPulse 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes checkPop {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.18);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes flamePop {
      0% {
        transform: scale(1) rotate(0deg);
      }
      30% {
        transform: scale(1.25) rotate(-6deg);
      }
      60% {
        transform: scale(1.15) rotate(6deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .check-pop {
      animation: checkPop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      will-change: transform, opacity;
    }

    .flame-pop {
      animation: flamePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      will-change: transform;
    }

    /* Regla para checkboxes personalizados e iconos de check al marcarse */

    .habit-card button:has(svg.scale-100),
    .habit-card [data-checked="true"],
    .completado .check-icon,
    :checked + .check-icon,

    }

    @media (prefers-reduced-motion: reduce) {

      .flame-pop,
      .habit-pulse-success,
      input[type="checkbox"]:checked,
      .skeleton-box {
        animation: none !important;

    }

    /* 7. RED LÓGICA & TOPOLOGÍA WBS 360° (BENTO & VECTOR CONNECTORS)            */
    /* ========================================================================= */
    .wbs-viewport-container {
      cursor: grab;
      user-select: none;
    }
    .wbs-viewport-container:active {
      cursor: grabbing;
    }
    .wbs-card {

                  box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1),

    }
    .wbs-connector-path:hover {

    @keyframes wbsCriticalPulse {
      0%, 100% {
        stroke: #f59e0b;
        filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.5));
      }
      50% {
        stroke: #d97706;
        filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.85));
      }
    }
    .wbs-connector-critical {
      animation: wbsCriticalPulse 2s infinite ease-in-out;
    }
    .wbs-connector-highlighted {
      stroke-width: 3.5px !important;
      stroke: #6366f1 !important;
      filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.85)) !important;
      z-index: 50;
    }
    .wbs-connector-highlighted-critical {
      stroke-width: 3.5px !important;
      stroke: #f59e0b !important;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.95)) !important;
      z-index: 50;
    }
    .wbs-node-dimmed {
      opacity: 0.22 !important;
      filter: grayscale(50%) !important;
      pointer-events: auto;
      transition: opacity 0.25s ease, filter 0.25s ease !important;
    }
    .wbs-node-focused {
      opacity: 1 !important;
      filter: none !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.65), 0 10px 25px -5px rgba(99, 102, 241, 0.35) !important;
