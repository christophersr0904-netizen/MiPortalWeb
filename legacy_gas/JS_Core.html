  // ============================================================================
  // UTILIDADES GLOBALES DE FORMATEO (FECHA Y HORA)
  // ============================================================================
  /**
   * Formateador estricto e infalible de hora (elimina epochs 1899 y desbordes de Google Sheets)
   */
  function formatHoraLimpia(val) {
    if (!val) return "--:--";
    if (val instanceof Date) {
      var hh = String(val.getHours()).padStart(2, '0');
      var mm = String(val.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }
    var str = String(val).trim();
    // Si contiene la cadena fecha de 1899 o GMT, extraer únicamente HH:mm
    var match = str.match(/(\d{1,2}):(\d{2})/);
    if (match) {
      return match[1].padStart(2, '0') + ':' + match[2];
    }
    return str.length >= 5 ? str.substring(0, 5) : str;
  }

  /**
   * Formateador de Fecha Humana amigable sin desfases horarios
   */
  function formatFechaHumana(fechaStr) {
    if (!fechaStr) return "Sin fecha";
    var clean = String(fechaStr).split("T")[0].split(" ")[0];
    var parts = clean.split("-");
    if (parts.length !== 3) return clean;
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString("es-PE", { weekday: 'short', day: 'numeric', month: 'short' });
  }

  /**
   * Helper reactivo de archivado automático tras 10 días calendario de completado/conciliado (>10 días).
   * Acepta un string de fecha, objeto Date o entidad del sistema (Tarea, Actividad, Proyecto, Gasto, Ingreso).
   * Devuelve true únicamente si han transcurrido más de 10 días calendario (>10) desde la fecha de completado o conciliación.
   */
  function esElementoArchivado(param) {
    if (!param) return false;
    if (typeof param === 'object' && param._desarchivado === true) return false;
    try {
      var fechaVal = null;
      if (typeof param === 'string' || param instanceof Date) {
        fechaVal = param;
      } else if (typeof param === 'object') {
        var isComp = false;
        // 1. Tarea de Proyecto o Actividad Personal
        var est = String(param.Estado_Tarea || param.Estado || param.estado || '').trim();
        if (est === '04_Completado' || est === '04_Hecho' || est.indexOf('04_Completad') !== -1 || param.Completado === true || param.completado === true) {
          isComp = true;
          fechaVal = param.Fecha_Completado || param.Fecha_Fin_Real || param.Fecha_Programada || param.Fecha || param.fecha;
        }
        // 2. Proyecto de Portafolio
        else if (param.Estado_Proyecto === '06_Cerrado' || param.Estado === '06_Cerrado' || param.Estado_Proyecto === '04_Completado' || param.Estado === '04_Completado' || (param.Avance_Real_Pct !== undefined && Number(param.Avance_Real_Pct) >= 100)) {
          isComp = true;
          fechaVal = param.Fecha_Fin_Real || param.Fecha_Fin_Plan || param.Fecha_Actualizacion || param.Fecha_Creacion;
        }
        // 3. Hábitos (registro completado o frecuencia)
        else if (param.Estado_Habito === 'Completado' || param.Estado_Habito === '04_Completado') {
          isComp = true;
          fechaVal = param.Fecha_Completado || param.Fecha || param.fecha || param.Fecha_Programada;
        }
        // 4. Finanzas (Gastos / Ingresos / Transacciones)
        else if (param.Conciliado === true || param.conciliado === true || (param.Estado_Pago && String(param.Estado_Pago).toLowerCase() === 'pagado') || (param.Estado_Cobro && String(param.Estado_Cobro).toLowerCase() === 'cobrado') || param.isReal === true) {
          isComp = true;
          fechaVal = param.Fecha_Conciliacion || param.Fecha_Gasto || param.Fecha_Ingreso || param.fecha || param.Fecha || param.Fecha_Registro;
        }
        // 5. Ideas (Procesadas o Archivadas)
        else if (param.Estado === 'Procesada' || param.Estado === 'Archivada') {
          isComp = true;
          fechaVal = param.Fecha_Archivado || param.Fecha_Procesada || param.Fecha_Captura;
        }

        if (!isComp || !fechaVal) return false;
      }

      if (!fechaVal) return false;

      var d;
      if (fechaVal instanceof Date) {
        d = new Date(fechaVal.getFullYear(), fechaVal.getMonth(), fechaVal.getDate());
      } else {
        var clean = String(fechaVal).split('T')[0].split(' ')[0].trim();
        var parts = clean.split('-');
        if (parts.length === 3) {
          d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        } else {
          d = new Date(fechaVal);
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }
      }

      if (isNaN(d.getTime())) return false;

      var hoy = new Date();
      var hoyMedianoche = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      var diffMs = hoyMedianoche.getTime() - d.getTime();
      var diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      return diffDias > 10;
    } catch (err) {
      console.warn('[esElementoArchivado] Error de evaluación defensiva:', err);
      return false;
    }
  }
  window.esElementoArchivado = esElementoArchivado;

  /**
   * Conmutador global reactivo para la visibilidad de elementos archivados (>10 días).
   * Ahora abre contextualmente la Bóveda / Drawer lateral derecho con alta fluidez.

  function toggleVerArchivados(modulo) {

  }
  window.toggleVerArchivados = toggleVerArchivados;

  /**
   * Escape defensivo de caracteres HTML para prevenir inyecciones y fallos de renderizado
   */
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
  window.escapeHtml = escapeHtml;

  /**
   * Toast Esquinero Operativo Instantáneo (No bloqueante, 60fps)
   * Diseñado para máxima fluidez y retroalimentación no invasiva (2.5s a 3.0s)
   */
  function mostrarToastOperativo(icono, titulo, detalle, duracion) {
    if (typeof Swal !== 'undefined' && typeof Swal.mixin === 'function') {
      var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: duracion || 2800,
        timerProgressBar: true,
        didOpen: function (toast) {
          toast.addEventListener('mouseenter', Swal.stopTimer);
          toast.addEventListener('mouseleave', Swal.resumeTimer);
        }
      });
      Toast.fire({
        icon: icono || 'success',
        title: titulo || '',
        text: detalle || ''
      });
    }
  }
  window.mostrarToastOperativo = mostrarToastOperativo;

  /**
   * Notificación rápida de Creación exitosa (CRUD)
   * - Icono: Check verde ('success')
   * - Duración: 2800ms
   */
  function notificarCreacion(entidad, nombre, genero) {
    var esFem = genero === 'f';
    var titular = (entidad || 'Elemento') + (esFem ? ' creada correctamente' : ' creado correctamente');
    mostrarToastOperativo('success', titular, nombre || '', 2800);
  }
  window.notificarCreacion = notificarCreacion;

  /**
   * Notificación rápida de Modificación / Actualización exitosa (CRUD)
   * - Icono: Info azul/ámbar ('info')
   * - Duración: 2800ms
   */
  function notificarModificacion(entidad, nombre, genero) {
    var esFem = genero === 'f';
    var titular = (entidad || 'Elemento') + (esFem ? ' actualizada correctamente' : ' actualizado correctamente');
    mostrarToastOperativo('info', titular, nombre || '', 2800);
  }
  window.notificarModificacion = notificarModificacion;

  /**
   * Notificación rápida de Restauración / Deshacer (Undo)
   * - Icono: 'success'
   * - Duración: 2500ms
   */
  function notificarRestauracion(entidad, nombre, genero) {
    var esFem = genero === 'f';
    var titular = '↺ ' + (entidad || 'Elemento') + (esFem ? ' restaurada' : ' restaurado');
    mostrarToastOperativo('success', titular, nombre || '', 2500);
  }
  window.notificarRestauracion = notificarRestauracion;

  // ============================================================================
  // SECCIÓN 2: CICLO DE VIDA E INICIALIZACIÓN

  /**
   * 2.1. Listener del DOM para inicio de escuchadores y sincronización remota
   */
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof initTheme === 'function') initTheme();
    if (typeof aplicarEstadoSidebarDOM === 'function') aplicarEstadoSidebarDOM();
    if (typeof setupDragAndDropKanban === 'function') setupDragAndDropKanban();
    if (typeof inicializarFormularios === 'function') inicializarFormularios();
    if (typeof initShortcuts === 'function') initShortcuts();

    // Restaurar pestaña activa desde localStorage si existe
    try {
      var savedTab = localStorage.getItem('PMO_ACTIVE_TAB');
      if (savedTab && ['kanban', 'portafolio', 'habitos', 'financiero', 'notas'].indexOf(savedTab) !== -1) {
        cambiarVistaGlobal(savedTab);
      }
    } catch (e) { }

    // =========================================================================
    // 0ms PRECARGA INMEDIATA: STALE-WHILE-REVALIDATE DESDE LOCALSTORAGE
    // =========================================================================
    var hayCacheValida = false;
    try {
      var rawLocalCache = localStorage.getItem('PMO_LOCAL_STATE_CACHE');
      if (rawLocalCache) {
        var cachedData = JSON.parse(rawLocalCache);
        if (cachedData && typeof cachedData === 'object' && Array.isArray(cachedData.tareas) && cachedData.tareas.length > 0) {
          aplicarDatosDashboard(cachedData, true);
          hayCacheValida = true;
        }
      }
    } catch (errLocal) {
      console.warn('[Stale-While-Revalidate] Advertencia al precargar caché local:', errLocal);
    }

    // Inyectar skeleton loaders al inicio de la carga cuando no haya datos en DOM o caché
    if (!hayCacheValida && typeof renderKanbanSkeletons === 'function') {
      renderKanbanSkeletons();
    }

    refreshData();
    if (typeof consultarTipoCambioActual === 'function') {
      consultarTipoCambioActual(false);
    }
  });

  // ============================================================================
  // SECCIÓN 3: CAPA DE RED Y BACKEND (google.script.run)
  // ============================================================================

  /**
   * 3.0. Control del Indicador de Sincronización en Vivo (Header Sync Status)
   */
  function setSyncStatus(estado, mensaje) {
    var cont = document.getElementById('sync-status-container');
    var led = document.getElementById('sync-status-led');
    var txt = document.getElementById('sync-status-text');
    var iconRef = document.getElementById('icon-header-refresh');

    if (!cont) return;

    if (estado === 'syncing') {
      cont.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border transition-all cursor-default bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800/60 shadow-2xs';
      if (led) {
        led.innerHTML = '<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>';
      }
      if (txt) txt.textContent = mensaje || 'Sincronizando...';
      if (iconRef) iconRef.classList.add('animate-spin');
    } else if (estado === 'synced') {
      var now = new Date();
      var horaStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      cont.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border transition-all cursor-default bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800/60 shadow-2xs';
      cont.title = 'Última sincronización: ' + horaStr;
      if (led) {
        led.innerHTML = '<span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>';
      }
      if (txt) txt.textContent = 'Al día';
      if (iconRef) iconRef.classList.remove('animate-spin');
    } else if (estado === 'error') {
      cont.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border transition-all cursor-default bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800/60 shadow-2xs';
      cont.title = 'Error en la última sincronización';
      if (led) {
        led.innerHTML = '<span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>';
      }
      if (txt) txt.textContent = 'Error de red';
      if (iconRef) iconRef.classList.remove('animate-spin');
    }
  }

  /**
   * Set en memoria para rastrear firmas 'action:payload' de llamadas RPC en vuelo
   * y evitar peticiones concurrentes idénticas en paralelo.
   */
  var _pendingRpcCalls = new Set();

  /**
   * 3.1. Cliente RPC desacoplado con soporte para deduplicación y respuestas stringificadas
   */
  function callBackend(action, payload, callback, fallback, opts) {
    opts = opts || {};

    var callSignature = action;
    try {
      callSignature += ':' + (payload !== undefined ? JSON.stringify(payload) : '');
    } catch (eSig) {
      callSignature += ':' + String(payload);
    }

    if (_pendingRpcCalls.has(callSignature)) {
      console.warn('[callBackend] Petición RPC idéntica en vuelo descartada:', callSignature);
      return;
    }
    _pendingRpcCalls.add(callSignature);

    setSyncStatus('syncing');

    google.script.run
      .withSuccessHandler(function (rawRes) {
        _pendingRpcCalls.delete(callSignature);
        setSyncStatus('synced');
        var res = rawRes;

        if (typeof rawRes === 'string') {
          try {
            res = JSON.parse(rawRes);
          } catch (e) {
            console.error('[Error al parsear JSON RPC]:', e, rawRes);
          }
        }

        if (!res || typeof res !== 'object') {
          res = { success: false, error: 'Respuesta nula o inválida del servidor: ' + String(rawRes) };
        }

        if (callback) callback(res);
      })
      .withFailureHandler(function (err) {
        _pendingRpcCalls.delete(callSignature);
        setSyncStatus('error');
        console.error('[Error Backend PMO]:', err);
        if (fallback) fallback(err);
        if (!opts.silent) {
          Swal.fire({
            icon: 'error',
            title: 'Error en Servidor',
            text: err.message || err,
            confirmButtonColor: '#4f46e5'
          });
        }
      })
      .apiRouter(action, payload);
  }
  window.callBackend = callBackend;

  /**
   * 3.2. Hidratación y renderizado reactivo de entidades del Dashboard
   * Permite ejecución instantánea (0ms) en precarga local y reconciliación suave desde el servidor
   */
  function aplicarDatosDashboard(data, esPrecargaLocal) {
    if (!data || typeof data !== 'object') return;

    var tieneDatos = (
      Array.isArray(data.proyectos) ||
      Array.isArray(data.tareas) ||
      Array.isArray(data.hitos) ||
      Array.isArray(data.gastos) ||
      Array.isArray(data.actividadesPersonales) ||
      Array.isArray(data.actividades) ||
      Array.isArray(data.ingresos) ||
      Array.isArray(data.notas) ||
      Array.isArray(data.ideas)
    );
    if (!tieneDatos) return;

    state.proyectos = Array.isArray(data.proyectos) ? data.proyectos : [];
    state.hitos = (Array.isArray(data.hitos) ? data.hitos : []).map(function (h) {
      if (!h || typeof h !== 'object') h = {};
      var idH = String(h.ID_Hito || h.idHito || h.id_hito || '').trim();
      var idP = String(h.ID_Proyecto || h.idProyecto || h.id_proyecto || '').trim();
      if (idH.toUpperCase().startsWith('PRO-') && (!idP || idP.toUpperCase().startsWith('HIT-'))) {
        var tempH = idH;
        idH = idP;
        idP = tempH;
      }
      h.ID_Hito = idH;
      h.idHito = idH;
      h.id_hito = idH;
      h.ID_Proyecto = idP;
      h.idProyecto = idP;
      h.id_proyecto = idP;
      return h;
    });

    // Indexación O(1) de hitos para resolución instantánea de proyecto padre
    var hitoToProyectoMap = new Map();
    state.hitos.forEach(function (h) {
      var hid = String(h.ID_Hito || '').trim().toUpperCase();
      var pid = String(h.ID_Proyecto || '').trim();
      if (hid && pid) {
        hitoToProyectoMap.set(hid, pid);
      }
    });

    state.gastos = (Array.isArray(data.gastos) ? data.gastos : []).map(function (g) {
      if (!g || typeof g !== 'object') g = {};
      var idProy = String(g.ID_Proyecto || g.idProyecto || '').trim().toUpperCase();
      var idTar = String(g.ID_Tarea || g.idTarea || g.ID_Entidad_Vinculada || g.idEntidadVinculada || '').trim().toUpperCase();
      var idHit = String(g.ID_Hito || g.idHito || '').trim().toUpperCase();
      var rawTg = String(g.tipoGasto || g.Tipo_Gasto || g.Clasificacion_Origen || g.clasificacionOrigen || '').trim();

      var esProy = (idProy && idProy !== 'PERSONAL' && idProy !== 'VIDA') ||
                   (idTar && idTar.startsWith('TAR-')) ||
                   (idHit && idHit !== 'PERSONAL' && idHit !== '') ||
                   rawTg.toLowerCase().includes('proy') || rawTg.toLowerCase().includes('tarea');

      var tg = esProy ? 'Tarea Proyecto' : 'Actividad Personal';
      g.tipoGasto = tg;
      g.Tipo_Gasto = tg;
      g.Clasificacion_Origen = esProy ? 'Proyecto' : 'Personal';
      g.clasificacionOrigen = g.Clasificacion_Origen;
      return g;
    });
    state.notas = Array.isArray(data.notas) ? data.notas : [];
    if (typeof invalidarCacheNotasVinculadas === 'function') {
      invalidarCacheNotasVinculadas();
    }
    state.ideas = Array.isArray(data.ideas) ? data.ideas : (state.ideas || []);
    if (typeof sincronizarIdeasDesdeState === 'function') {
      try {
        sincronizarIdeasDesdeState();
      } catch (err) {
        console.warn('Advertencia no bloqueante en Ideas:', err);
      }
    }
    state.cuotas = Array.isArray(data.cuotas) ? data.cuotas : (state.cuotas || []);

    if (typeof actualizarCatalogoEtiquetasGlobales === 'function') {
      actualizarCatalogoEtiquetasGlobales();
    }

    var rawActividades = Array.isArray(data.actividadesPersonales) ? data.actividadesPersonales : (Array.isArray(data.actividades) ? data.actividades : []);
    state.actividadesPersonales = rawActividades.map(function (a) {
      if (!a || typeof a !== 'object') a = {};
      var idA = String(a.ID_Actividad || a.ID_Tarea || '').trim();
      a.ID_Actividad = idA;
      a.ID_Tarea = idA;
      a.Nombre_Actividad = String(a.Nombre_Actividad || a.Nombre_Tarea_Actividad || a.Nombre_Tarea || '').trim();
      a.Nombre_Tarea_Actividad = a.Nombre_Actividad;
      var st = (typeof normalizarEstadoTarea === 'function')
        ? normalizarEstadoTarea(a.Estado || a.Estado_Tarea)
        : String(a.Estado || a.Estado_Tarea || 'POR_HACER').trim();
      a.Estado = st;
      a.Estado_Tarea = st;
      a.Categoria_Vida = String(a.Categoria_Vida || 'PERSONAL').trim().toUpperCase();
      a.Tipo_Compromiso = String(a.Tipo_Compromiso || 'HABITUAL').trim().toUpperCase();
      a.Frecuencia_Ciclo = String(a.Frecuencia_Ciclo || 'DIARIA').trim().toUpperCase();
      a.Regla_Repeticion = String(a.Regla_Repeticion || a.reglaRepeticion || '').trim();
      a.Racha_Actual = parseInt(a.Racha_Actual, 10) || 0;

      // Normalización matemática estricta: preserva explícitamente 0 como número
      if (a.Duracion_Horas !== undefined && a.Duracion_Horas !== null && a.Duracion_Horas !== '' && !isNaN(Number(a.Duracion_Horas))) {
        a.Duracion_Horas = Number(a.Duracion_Horas);
      } else {
        a.Duracion_Horas = 1.0;
      }

      // Protección contra race conditions: si la actividad está en tránsito de actualización local, no sobreescribir su estado
      if (window._actividadesEnTransito && window._actividadesEnTransito.has(idA)) {
        var actLocal = (state.actividadesPersonales || []).find(function (loc) {
          return String(loc.ID_Actividad || loc.ID_Tarea || '').trim() === idA;
        });
        if (actLocal) {
          a.Estado = actLocal.Estado;
          a.Estado_Tarea = actLocal.Estado;
          a.Racha_Actual = actLocal.Racha_Actual;
        }
      }
      return a;
    });

    state.ingresos = Array.isArray(data.ingresos) ? data.ingresos : [];
    state.subtareas = (Array.isArray(data.subtareas) ? data.subtareas : []).map(function (s) {
      if (!s || typeof s !== 'object') s = {};
      var sId = String(s.ID_Subtarea || s.idSubtarea || '').trim();
      var sTipo = String(s.Tipo_Padre || s.tipoPadre || 'TAREA').trim().toUpperCase();
      var sPadre = String(s.ID_Padre || s.idPadre || '').trim();
      var sPaso = parseInt(s.Numero_Paso || s.numeroPaso, 10) || 1;

  function sincronizarCacheLocalState() {

      localStorage.setItem('PMO_LOCAL_STATE_CACHE', JSON.stringify(payloadCache));

      console.warn('[PMO_LOCAL_STATE_CACHE] No se pudo guardar en localStorage (cuota excedida o almacenamiento inhabilitado):', eStorage);

  /**
   * 3.3. Sincronización íntegra de las entidades maestras y reconciliación silenciosa
   */
  function refreshData(forceRefresh) {
    if (typeof renderKanbanSkeletons === 'function') {
      var colBacklog = document.getElementById('col-backlog');
      if (colBacklog && colBacklog.querySelectorAll('.kanban-card:not(.kanban-skeleton-card)').length === 0) {
        renderKanbanSkeletons();
      }
    }
    var reqPayload = forceRefresh ? { forceRefresh: true } : {};
    callBackend('getDashboardData', reqPayload, function (res) {
      var data = res;
      if (data && data.data && typeof data.data === 'object' && !Array.isArray(data.data)) {
        data = data.data;
      }

      var tieneDatos = data && typeof data === 'object' && (
        Array.isArray(data.proyectos) ||
        Array.isArray(data.tareas) ||
        Array.isArray(data.hitos) ||
        Array.isArray(data.gastos) ||
        Array.isArray(data.actividadesPersonales) ||
        Array.isArray(data.ingresos) ||
        Array.isArray(data.notas)
      );

      if (data && (data.success === true || data.success === 'true' || tieneDatos)) {
        aplicarDatosDashboard(data, false);
        sincronizarCacheLocalState();
        if (forceRefresh && typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('success', 'Sincronización Completa', 'Datos actualizados en tiempo real desde Google Sheets');
        }
      } else {
        var detalle = (data && data.error) ? data.error : JSON.stringify(res);
        console.error('[Fallo Sincronización Sheets]:', res);
        Swal.fire({
          icon: 'error',
          title: 'Error de Sincronización',
          text: 'No se pudieron sincronizar los datos desde Google Sheets: ' + detalle,
          confirmButtonColor: '#4f46e5'
        });
      }
    }, function (err) {
      console.error('[Error RPC refreshData]:', err);
    });
  }

  /**
   * Construye un índice en memoria { "TAR-001": [nota1, nota2], "PRO-001": [...] }
   * garantizando consultas O(1) a 60 FPS en tablas y tableros masivos.
   */
  function construirIndiceNotasVinculadas() {
    var st = window.state || (typeof state !== 'undefined' ? state : null);
    if (!st || !Array.isArray(st.notas)) return {};
    if (_cacheNotasVinculadas && _indiceVersionConstruida === _notasCacheVersion) {
      return _cacheNotasVinculadas;
    }

    var indice = {};
    function registrarVinculo(idEnt, nota) {
      if (!idEnt || !nota) return;
      var clean = String(idEnt).trim().replace(/^[@#]+/, '').toUpperCase();
      if (!clean) return;

      var idNotaActual = String(nota.ID_Nota || nota.idNota || nota.id || '').trim().toUpperCase();

      function agregarAClave(k) {
        if (!k) return;
        if (!indice[k]) indice[k] = [];
        var yaReg = indice[k].some(function (n) {
          var idN = String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase();
          return idN && idN === idNotaActual;
        });
        if (!yaReg) {
          indice[k].push(nota);
        }
      }

      // Registrar clave exacta
      agregarAClave(clean);

      // Extractor universal de identificadores (ej. "🌱 GYM (ACT-009)", "ACT-009", "TAR-001", etc.)
      var matchId = String(clean).match(/\b(ACT|HAB|TAR|PRO|HIT|ING|GAS)-0*(\d+)\b/i);
      if (matchId) {
        var prefixId = matchId[1].toUpperCase();
        var numSoloId = parseInt(matchId[2], 10);
        if (!isNaN(numSoloId)) {
          var pad3 = ('000' + numSoloId).slice(-3);
          var pad4 = ('0000' + numSoloId).slice(-4);
          var pad2 = ('00' + numSoloId).slice(-2);
          var strNum = String(numSoloId);

          agregarAClave(prefixId + '-' + pad3);
          agregarAClave(prefixId + '-' + strNum);
          agregarAClave(prefixId + '-' + pad4);
          agregarAClave(prefixId + '-' + pad2);
          agregarAClave(strNum);

          if (prefixId === 'ACT' || prefixId === 'HAB') {
            var altP = (prefixId === 'ACT') ? 'HAB' : 'ACT';
            agregarAClave(altP + '-' + pad3);
            agregarAClave(altP + '-' + strNum);
            agregarAClave(altP + '-' + pad4);
            agregarAClave(altP + '-' + pad2);
          }
        }
      }

      // Soporte para identificadores puramente numéricos hacia hábitos y actividades (ej: "1" <-> "ACT-001" y "HAB-001")
      if (/^\d+$/.test(clean)) {
        var numSolo = parseInt(clean, 10);
        if (!isNaN(numSolo)) {
          agregarAClave(String(numSolo));
          agregarAClave('ACT-' + numSolo);
          agregarAClave('ACT-' + ('000' + numSolo).slice(-3));
          agregarAClave('HAB-' + numSolo);
          agregarAClave('HAB-' + ('000' + numSolo).slice(-3));
        }
      }

      // Intercambio automático bidireccional ACT- <-> HAB- (Hábitos y Actividades Personales)
      if (clean.startsWith('ACT-')) {
        agregarAClave('HAB-' + clean.slice(4));
        var numA = clean.slice(4).replace(/^0+/, '');
        if (numA) agregarAClave(numA);
      } else if (clean.startsWith('HAB-')) {
        agregarAClave('ACT-' + clean.slice(4));
        var numH = clean.slice(4).replace(/^0+/, '');
        if (numH) agregarAClave(numH);
      }

      // Normalizaciones numéricas universales para TAR-, ACT-, HAB-, PRO-, HIT-, GAS-, ING-
      // Soporta prefijos complejos con múltiples guiones (ej. PRO-P-M-I-01 <-> PRO-P-M-I-1, TAR-2026-0001 <-> TAR-2026-1)
      var matchNum = clean.match(/^(.*-)(0*)(\d+)$/);
      if (matchNum) {
        var prefix = matchNum[1];
        var numVal = parseInt(matchNum[3], 10);
        if (!isNaN(numVal)) {
          agregarAClave(prefix + numVal);
          agregarAClave(prefix + ('0000' + numVal).slice(-4));
          agregarAClave(prefix + ('000' + numVal).slice(-3));
          agregarAClave(prefix + ('00' + numVal).slice(-2));
          agregarAClave(String(numVal));

          if (prefix.startsWith('ACT-')) {
            var pAlt = 'HAB-' + prefix.slice(4);
            agregarAClave(pAlt + numVal);
            agregarAClave(pAlt + ('0000' + numVal).slice(-4));
            agregarAClave(pAlt + ('000' + numVal).slice(-3));
            agregarAClave(pAlt + ('00' + numVal).slice(-2));
          } else if (prefix.startsWith('HAB-')) {
            var pAlt = 'ACT-' + prefix.slice(4);
            agregarAClave(pAlt + numVal);
            agregarAClave(pAlt + ('0000' + numVal).slice(-4));
            agregarAClave(pAlt + ('000' + numVal).slice(-3));
            agregarAClave(pAlt + ('00' + numVal).slice(-2));

    }

    st.notas.forEach(function (n) {
      if (!n) return;

      // 1. Campo directo de entidad vinculada
      var vDirect = n.ID_Entidad_Vinculada || n.idEntidadVinculada || n.id_entidad || n.ID_Entidad || n.entidadVinculada;
      if (vDirect) registrarVinculo(vDirect, n);

      // 2. Vínculos estructurados: Array o JSON serializado (soporte n.Vinculos y n.vinculos)
      var rawVinculos = n.Vinculos || n.vinculos;
      if (typeof rawVinculos === 'string' && rawVinculos.trim()) {
        try {
          rawVinculos = JSON.parse(rawVinculos);
        } catch (eVinc) {
          var matchesV = String(rawVinculos).toUpperCase().match(/\b(TAR|PRO|HIT|ACT|HAB|GAS|ING)-[A-Z0-9_-]+\b/g);
          if (matchesV) {
            matchesV.forEach(function (m) { registrarVinculo(m, n); });
          }
        }
      }

      if (Array.isArray(rawVinculos)) {
        rawVinculos.forEach(function (v) {
          if (!v) return;
          if (typeof v === 'string') {
            registrarVinculo(v, n);
            return;
          }
          var cod = v.codigo || v.id || v.idEntidad || v.ID_Entidad || v.idTarea || v.idActividad || v.ID_Tarea || v.ID_Actividad || v.ID_Proyecto || v.ID_Hito || v.ID_Gasto || v.ID_Ingreso;
          if (cod) registrarVinculo(cod, n);
          if (v.titulo) registrarVinculo(v.titulo, n);
        });
      } else if (rawVinculos && typeof rawVinculos === 'object') {
        var codObj = rawVinculos.codigo || rawVinculos.id || rawVinculos.idEntidad || rawVinculos.ID_Entidad || rawVinculos.idTarea || rawVinculos.idActividad;
        if (codObj) registrarVinculo(codObj, n);
        if (rawVinculos.titulo) registrarVinculo(rawVinculos.titulo, n);
      }

      // 3. Enlaces_Entidades_JSON
      var rawEnlaces = n.Enlaces_Entidades_JSON || n.enlaces_entidades_json;
      if (rawEnlaces) {
        try {
          var parsed = typeof rawEnlaces === 'string' ? JSON.parse(rawEnlaces) : rawEnlaces;
          if (Array.isArray(parsed)) {
            parsed.forEach(function (v) {
              if (!v) return;
              if (typeof v === 'string') {
                registrarVinculo(v, n);
                return;
              }
              var cod = v.codigo || v.id || v.idEntidad || v.ID_Entidad;
              if (cod) registrarVinculo(cod, n);

          } else if (typeof parsed === 'object' && parsed !== null) {
            var codObjE = parsed.codigo || parsed.id || parsed.idEntidad || parsed.ID_Entidad;
            if (codObjE) registrarVinculo(codObjE, n);
          }
        } catch (e) {
          var strJson = String(rawEnlaces).toUpperCase();
          var matchesJson = strJson.match(/\b(TAR|PRO|HIT|ACT|HAB|GAS|ING)-[A-Z0-9_-]+\b/g);
          if (matchesJson) {
            matchesJson.forEach(function (m) { registrarVinculo(m, n); });
          }
        }
      }

      // 4. WishlistMeta (Gasto vinculado)
      var wMeta = n.WishlistMeta || n.wishlistMeta;
      if (wMeta && wMeta.idGastoVinculado) {

      var rawTags = n.Etiquetas || n.tags || n.etiquetas;
      if (typeof rawTags === 'string' && rawTags.trim()) {

          var parsedTags = JSON.parse(rawTags);

      if (Array.isArray(rawTags)) {
        rawTags.forEach(function (tag) {
          var tStr = String(tag || '').trim().replace(/^[@#]+/, '').toUpperCase();
          if (tStr.startsWith('TAR-') || tStr.startsWith('PRO-') || tStr.startsWith('HIT-') || tStr.startsWith('ACT-') || tStr.startsWith('HAB-') || tStr.startsWith('GAS-') || tStr.startsWith('ING-')) {
            registrarVinculo(tStr, n);
          }
        });
      }

      // 6. Fallback en Menciones textuales en Titulo o Contenido (ej. @TAR-12345 o TAR-12345)
      var strFull = (String(n.Titulo || n.titulo || '') + ' ' + String(n.Contenido || n.contenido || '')).toUpperCase();
      var matches = strFull.match(/\b(TAR|PRO|HIT|ACT|HAB|GAS|ING)-[A-Z0-9_-]+\b/g);
      if (matches) {
        matches.forEach(function (m) {
          registrarVinculo(m, n);
        });
      }

   */
  function obtenerNotasVinculadasAEntidad(idEntidad, tipoEntidad) {
    var st = window.state || (typeof state !== 'undefined' ? state : null);
    if (!idEntidad || !st || !Array.isArray(st.notas)) return [];
    var idNorm = String(idEntidad).trim().replace(/^[@#]+/, '').toUpperCase();
    if (!idNorm) return [];

    var indice = construirIndiceNotasVinculadas();
    if (indice[idNorm] && indice[idNorm].length > 0) {
      return indice[idNorm];
    }

    // Extractor universal de identificadores para consulta (ej. "🌱 GYM (ACT-009)")
    var matchEnt = String(idNorm).match(/\b(ACT|HAB|TAR|PRO|HIT|ING|GAS)-0*(\d+)\b/i);
    if (matchEnt) {
      var pEnt = matchEnt[1].toUpperCase();
      var nEnt = parseInt(matchEnt[2], 10);
      if (!isNaN(nEnt)) {
        var cPad3 = pEnt + '-' + ('000' + nEnt).slice(-3);
        var cNormNum = pEnt + '-' + nEnt;
        var cDig = String(nEnt);
        if (indice[cPad3] && indice[cPad3].length > 0) return indice[cPad3];
        if (indice[cNormNum] && indice[cNormNum].length > 0) return indice[cNormNum];
        if (indice[cDig] && indice[cDig].length > 0) return indice[cDig];

        if (pEnt === 'ACT' || pEnt === 'HAB') {
          var altEnt = (pEnt === 'ACT') ? 'HAB' : 'ACT';
          var aPad3 = altEnt + '-' + ('000' + nEnt).slice(-3);
          var aNorm = altEnt + '-' + nEnt;
          if (indice[aPad3] && indice[aPad3].length > 0) return indice[aPad3];
          if (indice[aNorm] && indice[aNorm].length > 0) return indice[aNorm];
        }
      }
    }

    // Comprobación de alias ACT- <-> HAB-
    var altPref = '';
    if (idNorm.startsWith('ACT-')) altPref = 'HAB-' + idNorm.slice(4);
    else if (idNorm.startsWith('HAB-')) altPref = 'ACT-' + idNorm.slice(4);
    if (altPref && indice[altPref] && indice[altPref].length > 0) {
      return indice[altPref];
    }

    // Comprobación de variante sin ceros / con ceros en el índice
    var matchNum = idNorm.match(/^(.*-)(0*)(\d+)$/);
    if (matchNum) {
      var prefix = matchNum[1];
      var numVal = parseInt(matchNum[3], 10);
      if (!isNaN(numVal)) {
        var alt1 = prefix + numVal;
        if (indice[alt1] && indice[alt1].length > 0) return indice[alt1];
        var alt4 = prefix + ('0000' + numVal).slice(-4);
        if (indice[alt4] && indice[alt4].length > 0) return indice[alt4];
        var alt3 = prefix + ('000' + numVal).slice(-3);
        if (indice[alt3] && indice[alt3].length > 0) return indice[alt3];
        var alt2 = prefix + ('00' + numVal).slice(-2);
        if (indice[alt2] && indice[alt2].length > 0) return indice[alt2];

        if (altPref) {
          var mAlt = altPref.match(/^(.*-)(0*)(\d+)$/);
          if (mAlt) {
            var pAlt = mAlt[1];
            if (indice[pAlt + numVal] && indice[pAlt + numVal].length > 0) return indice[pAlt + numVal];
            if (indice[pAlt + ('0000' + numVal).slice(-4)] && indice[pAlt + ('0000' + numVal).slice(-4)].length > 0) return indice[pAlt + ('0000' + numVal).slice(-4)];
            if (indice[pAlt + ('000' + numVal).slice(-3)] && indice[pAlt + ('000' + numVal).slice(-3)].length > 0) return indice[pAlt + ('000' + numVal).slice(-3)];
          }
        }
      }
    }

    // Fallback directo sobre st.notas para resiliencia absoluta
    var directList = [];
    var yaVistas = {};
    var normSinCeros = idNorm.replace(/-0+/, '-');
    var tipoNorm = String(tipoEntidad || '').trim().toUpperCase();
    var esHabitoOAct = (tipoNorm === 'HABITO' || tipoNorm === 'ACTIVIDAD');
    var esTrx = (tipoNorm === 'GASTO' || tipoNorm === 'INGRESO' || tipoNorm === 'FINANZAS');
    var idDigits = idNorm.replace(/\D/g, '');

    st.notas.forEach(function (n) {
      if (!n) return;
      var idN = String(n.ID_Nota || n.idNota || n.id || '').toUpperCase();
      if (yaVistas[idN]) return;

      var match = false;

      // Directo
      var vDir = String(n.ID_Entidad_Vinculada || n.idEntidadVinculada || n.id_entidad || n.ID_Entidad || n.entidadVinculada || '').trim().replace(/^[@#]+/, '').toUpperCase();
      if (vDir) {
        if (vDir === idNorm || vDir.replace(/-0+/, '-') === normSinCeros) match = true;
        if (!match && altPref && (vDir === altPref || vDir.replace(/-0+/, '-') === altPref.replace(/-0+/, '-'))) match = true;
        if (!match && esHabitoOAct && idDigits && vDir.replace(/\D/g, '') === idDigits) match = true;
        if (!match && esTrx && idDigits && vDir.replace(/\D/g, '') === idDigits) match = true;
        if (!match && matchEnt) {
          var mVDir = vDir.match(/\b(ACT|HAB|TAR|PRO|HIT|ING|GAS)-0*(\d+)\b/i);
          if (mVDir && parseInt(mVDir[2], 10) === parseInt(matchEnt[2], 10)) {
            var pVDir = mVDir[1].toUpperCase();
            var pEDir = matchEnt[1].toUpperCase();
            if (pVDir === pEDir || ((pVDir === 'ACT' || pVDir === 'HAB') && (pEDir === 'ACT' || pEDir === 'HAB'))) {
              match = true;
            }
          }
        }
      }

      // Vinculos
      if (!match) {
        var rawV = n.Vinculos || n.vinculos;
        if (typeof rawV === 'string' && rawV.trim()) {
          try { rawV = JSON.parse(rawV); } catch (e) {}
        }
        var arrV = Array.isArray(rawV) ? rawV : (rawV && typeof rawV === 'object' ? [rawV] : []);
        match = arrV.some(function (v) {
          if (!v) return false;
          var c = typeof v === 'string' ? v : (v.codigo || v.id || v.idEntidad || v.ID_Entidad || v.idTarea || v.idActividad || v.ID_Tarea || v.ID_Actividad);
          var cNorm = String(c || '').trim().replace(/^[@#]+/, '').toUpperCase();
          if (!cNorm) return false;
          if (cNorm === idNorm || cNorm.replace(/-0+/, '-') === normSinCeros) return true;
          if (altPref && (cNorm === altPref || cNorm.replace(/-0+/, '-') === altPref.replace(/-0+/, '-'))) return true;

          // Extractor universal sobre el código de vínculo
          if (matchEnt) {
            var mVC = cNorm.match(/\b(ACT|HAB|TAR|PRO|HIT|ING|GAS)-0*(\d+)\b/i);
            if (mVC && parseInt(mVC[2], 10) === parseInt(matchEnt[2], 10)) {
              var pVC = mVC[1].toUpperCase();
              var pEC = matchEnt[1].toUpperCase();
              if (pVC === pEC || ((pVC === 'ACT' || pVC === 'HAB') && (pEC === 'ACT' || pEC === 'HAB'))) {
                return true;
              }
            }
          }

          // Normalización cruzada de tipos (HABITO <-> ACTIVIDAD, GASTO/INGRESO)
          var cDigits = cNorm.replace(/\D/g, '');
          var vTipo = String((v && v.tipo) || '').trim().toUpperCase();
          if (esHabitoOAct && (vTipo === 'HABITO' || vTipo === 'ACTIVIDAD' || !vTipo)) {
            if (cDigits && idDigits && cDigits === idDigits) return true;
            if (cNorm.replace(/^(ACT|HAB)-0*/, '') === idNorm.replace(/^(ACT|HAB)-0*/, '')) return true;
          }
          if (esTrx && (vTipo === 'GASTO' || vTipo === 'INGRESO' || vTipo === 'FINANZAS' || !vTipo)) {
            if (cDigits && idDigits && cDigits === idDigits) return true;
          }
          return false;
        });
      }

      // Mención textual
      if (!match) {
        var fullTxt = (String(n.Titulo || n.titulo || '') + ' ' + String(n.Contenido || n.contenido || '') + ' ' + String(n.Etiquetas || n.tags || '')).toUpperCase();
        if (fullTxt.indexOf(idNorm) !== -1 || fullTxt.indexOf(normSinCeros) !== -1) {
          match = true;
        }
        if (!match && altPref && (fullTxt.indexOf(altPref) !== -1 || fullTxt.indexOf(altPref.replace(/-0+/, '-')) !== -1)) {
          match = true;
        }
        if (!match && esHabitoOAct && idDigits && (fullTxt.indexOf('ACT-' + idDigits) !== -1 || fullTxt.indexOf('HAB-' + idDigits) !== -1)) {
          match = true;
        }
      }

      if (match) {
        yaVistas[idN] = true;
        directList.push(n);
      }
    });

    if (directList.length > 0) {
      indice[idNorm] = directList;
    }
    return directList;
  }

  /**
   * Extrae un snippet limpio de texto libre de tags HTML y entidades para tooltips y previews
   */
  function extraerSnippetTextoNota(contenido, maxLen) {
    if (!contenido) return '';
    var txt = String(contenido)
      .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
      .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
      .replace(/<br\s*[\/]?>/gi, ' ')
      .replace(/<\/p>/gi, ' ')
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\r/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    var limite = maxLen || 120;
    if (txt.length > limite) {
      return txt.substring(0, limite) + '...';
    }
    return txt;
  }

  /**

  function abrirSelectorNotasVinculadas(idEntidad, tipoEntidad) {

          '<div class="flex items-center justify-between gap-1 mb-1">' +
          '<span class="font-bold text-xs text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 flex items-center gap-1.5">' +
          '<span>' + cfg.icono + '</span>' +
          '<span>' + (idx + 1) + '. ' + escapeHtml(titulo) + '</span>' +
          '</span>' +
          '<span class="text-[9px] font-mono font-bold text-indigo-600 dark:text-indigo-400">Abrir ↗</span>' +
          '</div>' +
          (snippet ? '<p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2 italic">' + escapeHtml(snippet) + '</p>' : '') +
          (fLabel ? '<div class="text-[9px] text-slate-400 mt-1 font-mono">' + fLabel + '</div>' : '') +
          '</div>';
      });
      html += '</div>';

      Swal.fire({
        title: 'Notas Vinculadas (' + notas.length + ')',
        html: html,
        showConfirmButton: false,
        showCloseButton: true,
        customClass: {
          popup: 'rounded-2xl dark:bg-slate-900 border border-slate-200 dark:border-slate-800'
        }
      });
    } else {
      var idN = notas[0].ID_Nota || notas[0].idNota || notas[0].id;
      if (typeof window.abrirModalEditarNotaConDatos === 'function') {
        window.abrirModalEditarNotaConDatos(idN);
      } else if (typeof window.abrirModalEditarNota === 'function') {
        window.abrirModalEditarNota(idN);
      }
    }
  }

  /**
   * Genera el micro-badge interactivo (HTML) para una entidad vinculada
   * - Discrimina visualmente según el tipo de nota:
   *   * Wishlist: 🛒 (Color Ámbar)
   *   * Checklist: ☑️ (Color Sky/Azul)
   *   * Nota simple: 📝 (Color Púrpura)
   * - Si hay más de 1 nota del mismo tipo, acompaña con un micro-contador (ej. ☑️ 2)
   * - Si hay notas de múltiples tipos, renderiza los badges distintivos correspondientes
   * - Hover: Tooltip nativo multilínea con tipo, título y primeras líneas de contenido
   * - Clic: Abre de inmediato el modal de lectura/edición sin ir a la pestaña Notas
   */
  function generarBadgeNotasVinculadas(idEntidad, tipoEntidad, extraClass) {
    var notas = obtenerNotasVinculadasAEntidad(idEntidad, tipoEntidad);
    if (!notas || notas.length === 0) return '';

    // Agrupar notas por tipo semántico
    var grupos = { WISHLIST: [], CHECKLIST: [], NOTA: [] };
    notas.forEach(function (n) {
      var tipo = clasificarTipoNota(n);
      if (grupos[tipo]) grupos[tipo].push(n);
      else grupos.NOTA.push(n);
    });

    var tiposPresentes = ['WISHLIST', 'CHECKLIST', 'NOTA'].filter(function (t) {
      return grupos[t].length > 0;
    });

    var badges = tiposPresentes.map(function (tipo) {
      var cfg = CONFIG_TIPO_NOTA[tipo] || CONFIG_TIPO_NOTA.NOTA;
      var subLista = grupos[tipo];
      var count = subLista.length;
      var primeraNota = subLista[0];
      var idPrimeraNota = primeraNota.ID_Nota || primeraNota.idNota || primeraNota.id || '';

      var tooltip = '';
      if (count === 1) {
        var tit = primeraNota.Titulo || primeraNota.titulo || (cfg.nombre + ' sin título');
        var snip = extraerSnippetTextoNota(primeraNota.Contenido || primeraNota.contenido, 130);
        tooltip = '[' + cfg.nombre + '] ' + tit + (snip ? '\n"' + snip + '"' : '') + '\n\n(Clic para abrir ' + cfg.nombre.toLowerCase() + ')';
      } else {
        tooltip = '[' + cfg.nombre + '] ' + count + ' ' + cfg.nombre + 's vinculadas:\n' +
          subLista.slice(0, 4).map(function (n, i) {
            var t = n.Titulo || n.titulo || (cfg.nombre + ' ' + (i + 1));
            var s = extraerSnippetTextoNota(n.Contenido || n.contenido, 60);
            return (i + 1) + '. ' + t + (s ? ': "' + s + '"' : '');
          }).join('\n') +
          (count > 4 ? '\n... y ' + (count - 4) + ' más' : '') +
          '\n\n(Clic para ver y abrir)';
      }

      var onclickAttr = count === 1
        ? 'event.stopPropagation(); if(typeof window.abrirModalEditarNotaConDatos===\'function\'){ window.abrirModalEditarNotaConDatos(\'' + idPrimeraNota + '\'); }else if(typeof window.abrirModalEditarNota===\'function\'){ window.abrirModalEditarNota(\'' + idPrimeraNota + '\'); }'
        : 'event.stopPropagation(); if(typeof window.abrirSelectorNotasVinculadas===\'function\') window.abrirSelectorNotasVinculadas(\'' + idEntidad + '\', \'' + (tipoEntidad || '') + '\');';

      var contadorHtml = count > 1
        ? '<span class="font-mono text-[9px] font-bold tabular-nums leading-none ml-0.5">' + count + '</span>'
        : '';

      return '<span onclick="' + onclickAttr + '" ' +
        'onmouseenter="if(typeof window.mostrarPopoverNotaHover===\'function\') window.mostrarPopoverNotaHover(event, \'' + idPrimeraNota + '\');" ' +
        'onmouseleave="if(typeof window.ocultarPopoverNotaHover===\'function\') window.ocultarPopoverNotaHover();" ' +
        'onmousemove="if(typeof window.moverPopoverNotaHover===\'function\') window.moverPopoverNotaHover(event);" ' +
        'class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-lg text-[10px] font-semibold border ' + cfg.bgClass + ' ' + (extraClass || '') + ' transition-all active:scale-95 cursor-pointer shadow-2xs z-10" ' +
        'data-tooltip="' + escapeHtml(tooltip) + '">' +
        cfg.svg +
        contadorHtml +
        '</span>';
    });

    return badges.join(' ');
  }

  /**
   * Actualiza reactivamente TODAS las vistas del sistema cuando se crea, edita o elimina una nota
   * No condiciona el re-renderizado solo a la vista activa, garantizando sincronía total instantánea.
   */
  function actualizarVistasActivasNotas() {
    try {
      invalidarCacheNotasVinculadas();

      // 1. Tablero Kanban (Tareas de Proyectos y Actividades Personales en Kanban)
      if (typeof window.aplicarFiltrosCruzados === 'function') {
        try { window.aplicarFiltrosCruzados(); } catch (eK) { console.warn('[actualizarVistasActivasNotas] Kanban:', eK); }
      }
      if (typeof window.renderKanban === 'function' && window.renderKanban !== window.aplicarFiltrosCruzados) {
        try { window.renderKanban(); } catch (eK2) {}
      }

      // 2. Tablero Hábitos y Vida (Actividades Personales)
      if (typeof window.renderTableroActividadesPersonales === 'function') {
        try { window.renderTableroActividadesPersonales(); } catch (eH) { console.warn('[actualizarVistasActivasNotas] Hábitos:', eH); }
      }
      if (typeof window.renderHabitos === 'function' && window.renderHabitos !== window.renderTableroActividadesPersonales) {
        try { window.renderHabitos(); } catch (eH2) {}
      }

      // 2.1 Refresco quirúrgico directo de los slots de micro-badges en DOM
      if (typeof generarBadgeNotasVinculadas === 'function') {
        var slotsHabDom = document.querySelectorAll('.habit-badge-notas-slot[data-id-actividad]');
        if (slotsHabDom && slotsHabDom.length > 0) {
          slotsHabDom.forEach(function (s) {
            var idA = s.getAttribute('data-id-actividad');
            if (idA) s.innerHTML = generarBadgeNotasVinculadas(idA, 'ACTIVIDAD');
          });
        }
        var slotsTaskDom = document.querySelectorAll('.kanban-badge-notas-slot[data-id-tarea]');
        if (slotsTaskDom && slotsTaskDom.length > 0) {
          slotsTaskDom.forEach(function (s) {
            var idT = s.getAttribute('data-id-tarea');
            if (idT) s.innerHTML = generarBadgeNotasVinculadas(idT, 'TAREA');
          });
        }
      }

      // 3. Portafolio de Proyectos
      if (typeof window.renderPortafolioProyectos === 'function') {
        try { window.renderPortafolioProyectos(); } catch (eP) {}
      } else if (typeof window.renderTarjetasPortafolio === 'function') {
        try { window.renderTarjetasPortafolio(); } catch (eP2) {}
      }

      // 4. Módulo Financiero
      if (typeof window.renderTabTransaccionesUnificada === 'function') {
        try { window.renderTabTransaccionesUnificada(); } catch (eF) {}
      }
      if (typeof window.renderTableroFinanciero === 'function') {
        try { window.renderTableroFinanciero(); } catch (eF2) {}
      }

      // 5. Vista de Detalle 360 si hay un proyecto activo abierto
      var st = window.state || (typeof state !== 'undefined' ? state : null);
      if (st && st.proyectoDetalleActivo) {
        var idProyAct = st.proyectoDetalleActivo.ID_Proyecto;
        if (typeof window.renderCascadaHitos === 'function') {
          try { window.renderCascadaHitos(idProyAct); } catch (eD1) {}
        }
        if (st.vistaActual === 'detalle' && typeof window.abrirDetalle360 === 'function') {
          try { window.abrirDetalle360(idProyAct); } catch (eD2) {}
        }
      }

      // 6. Header badges de conteo global
      if (typeof header !== 'undefined' && header.updateBadges) {
        try { header.updateBadges(st || state); } catch (eHb) {}
      }
    } catch (eR) {
      console.warn('[actualizarVistasActivasNotas] Advertencia en refresco reactivo:', eR);
    }
  }

  window.invalidarCacheNotasVinculadas = invalidarCacheNotasVinculadas;
  window.obtenerNotasVinculadasAEntidad = obtenerNotasVinculadasAEntidad;
  window.abrirSelectorNotasVinculadas = abrirSelectorNotasVinculadas;
  window.generarBadgeNotasVinculadas = generarBadgeNotasVinculadas;
  window.clasificarTipoNota = clasificarTipoNota;
  window.actualizarVistasActivasNotas = actualizarVistasActivasNotas;

  window.normalizarCategoriaVida = function (catRaw) {
    var raw = String(catRaw || '').trim().toUpperCase().replace(/[\s-]/g, '_');
    if (raw === 'SALUD_DEPORTE' || raw === 'SALUD' || raw === 'DEPORTE') return 'SALUD_DEPORTE';
    if (raw === 'DESARROLLO_PERSONAL' || raw === 'DESARROLLO_ESTUDIO' || raw === 'ESTUDIO' || raw === 'DESARROLLO') return 'DESARROLLO_ESTUDIO';
    if (raw === 'TRABAJO_CARRERA' || raw === 'LABORAL_HONORARIO' || raw === 'TRABAJO' || raw === 'LABORAL' || raw === 'CARRERA') return 'LABORAL_HONORARIO';
    if (raw === 'FINANZAS_ADMIN' || raw === 'FINANZAS_TRAMITES' || raw === 'FINANZAS' || raw === 'ADMIN') return 'FINANZAS_TRAMITES';
    if (raw === 'HOGAR_FAMILIA' || raw === 'SOCIAL_FAMILIA' || raw === 'HOGAR' || raw === 'FAMILIA' || raw === 'SOCIAL') return 'SOCIAL_FAMILIA';
    if (raw === 'OCIO_SOCIAL' || raw === 'PERSONAL_DESCANSO' || raw === 'OCIO' || raw === 'DESCANSO' || raw === 'PERSONAL') return 'PERSONAL_DESCANSO';
    return 'SALUD_DEPORTE';
  };

  window.calcularDesgloseInversionBienestar = function () {
    var actividades = (window.state && Array.isArray(state.actividadesPersonales)) ? state.actividadesPersonales : [];
    var gastos = (window.state && Array.isArray(state.gastos)) ? state.gastos : [];

    var mapaActividadACategoria = {};
    actividades.forEach(function (act) {
      var idA = String(act.ID_Actividad || act.ID_Tarea || '').trim().toUpperCase();
      if (idA) {
        mapaActividadACategoria[idA] = window.normalizarCategoriaVida(act.Categoria_Vida);
      }
    });

    var keys = ['SALUD_DEPORTE', 'DESARROLLO_ESTUDIO', 'LABORAL_HONORARIO', 'FINANZAS_TRAMITES', 'SOCIAL_FAMILIA', 'PERSONAL_DESCANSO'];
    var desglose = {};
    keys.forEach(function (k) {
      desglose[k] = {
        clave: k,
        config: window.CATEGORIAS_VIDA_CONFIG[k] || { nombre: k, icono: '✨', color: '#10b981' },
        gastoRealPEN: 0,
        actividadesCount: 0,
        gastosCount: 0,
        gastosItems: []
      };
    });

    var actividadesConGastoContabilizado = {};

    // 1. Sumar egresos de state.gastos vinculados a actividades personales (ACT-)
    gastos.forEach(function (g) {
      var idTar = String(g.ID_Tarea || g.ID_Entidad_Vinculada || '').trim().toUpperCase();
      if (idTar && (idTar.startsWith('ACT-') || mapaActividadACategoria[idTar])) {
        var catKey = mapaActividadACategoria[idTar] || 'SALUD_DEPORTE';
        var mPEN = parseFloat(g.Monto_PEN || g.Monto_Original || 0);
        if (desglose[catKey]) {
          desglose[catKey].gastoRealPEN += mPEN;
          desglose[catKey].gastosCount++;
          desglose[catKey].gastosItems.push(g);
        }
        actividadesConGastoContabilizado[idTar] = true;
      }
    });

    // 2. Sumar actividades que tienen Monto_Gasto_Asociado directo sin fila separada en gastos
    actividades.forEach(function (act) {
      var idA = String(act.ID_Actividad || act.ID_Tarea || '').trim().toUpperCase();
      var catKey = window.normalizarCategoriaVida(act.Categoria_Vida);
      if (desglose[catKey]) {
        desglose[catKey].actividadesCount++;
        if (!actividadesConGastoContabilizado[idA]) {
          var mDirecto = parseFloat(act.Monto_Gasto_Asociado) || 0;
          if (mDirecto > 0) {
            desglose[catKey].gastoRealPEN += mDirecto;
          }
        }
      }
    });

    var totalMacroPEN = 0;
    keys.forEach(function (k) {
      totalMacroPEN += desglose[k].gastoRealPEN;
    });

    return {
      totalMacroPEN: totalMacroPEN,
      desglose: desglose,
      dimensiones: keys
    };
  };

  function calcularDiasArchivado(param) {
    if (!param) return 0;
    try {
      var fVal = null;
      if (typeof param === 'string' || param instanceof Date) {
        fVal = param;
      } else if (typeof param === 'object') {
        fVal = param.Fecha_Completado || param.Fecha_Fin_Real || param.Fecha_Conciliacion || param.Fecha_Gasto || param.Fecha_Ingreso || param.Fecha_Programada || param.Fecha_Actualizacion || param.Fecha || param.fecha;
      }
      if (!fVal) return 0;
      var d;
      if (fVal instanceof Date) {
        d = new Date(fVal.getFullYear(), fVal.getMonth(), fVal.getDate());
      } else {
        var clean = String(fVal).split('T')[0].split(' ')[0].trim();
        var parts = clean.split('-');
        if (parts.length === 3) {
          d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        } else {
          d = new Date(fVal);
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }
      }
      if (isNaN(d.getTime())) return 0;
      var hoy = new Date();
      var hoyMed = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      var diffMs = hoyMed.getTime() - d.getTime();
      return Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
    } catch (e) {
      return 0;
    }
  }
  window.calcularDiasArchivado = calcularDiasArchivado;

          icono: esHab ? '🏃' : '👤',
          badgeClase: esHab ? 'bg-emerald-50 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700',
          barColor: esHab ? 'bg-emerald-500' : 'bg-slate-500',
          fecha: a.Fecha_Completado || a.Fecha_Programada || '',
          subtitulo: a.Categoria_Vida || 'Personal',
          dias: calcularDiasArchivado(a)
        });
      }
    });

    // 3. Proyectos de Portafolio
    (state.proyectos || []).forEach(function (p) {
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(p)) {
        countPortafolio++;
        itemsTodos.push({
          id: p.ID_Proyecto,
          titulo: p.Nombre_Proyecto || 'Proyecto sin nombre',
          tipo: 'proyecto',
          seccion: 'portafolio',
          tipoLabel: 'Proyecto Portafolio',
          icono: '💼',
          badgeClase: 'bg-rose-50 dark:bg-rose-950/80 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800',
          barColor: 'bg-rose-500',
          fecha: p.Fecha_Fin_Real || p.Fecha_Fin_Plan || p.Fecha_Actualizacion || '',
          subtitulo: 'Avance: ' + (p.Avance_Real_Pct || 100) + '%',
          dias: calcularDiasArchivado(p)
        });
      }
    });

    // 4. Finanzas (Gastos e Ingresos)
    (state.gastos || []).forEach(function (g) {
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(g)) {
        countFinanzas++;
        itemsTodos.push({
          id: g.ID_Gasto,
          titulo: g.Descripcion_Gasto || 'Gasto conciliado',
          tipo: 'gasto',
          seccion: 'finanzas',
          tipoLabel: 'Gasto Conciliado',
          icono: '💳',
          badgeClase: 'bg-amber-50 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800',
          barColor: 'bg-amber-500',
          fecha: g.Fecha_Conciliacion || g.Fecha_Gasto || '',
          subtitulo: (g.Moneda_Original || 'PEN') + ' ' + (parseFloat(g.Monto_Original || g.Monto_PEN || 0).toLocaleString('es-PE', { minimumFractionDigits: 2 })),
          dias: calcularDiasArchivado(g)
        });
      }
    });

    (state.ingresos || []).forEach(function (ing) {
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(ing)) {
        countFinanzas++;
        itemsTodos.push({
          id: ing.ID_Ingreso,
          titulo: ing.Descripcion_Ingreso || 'Ingreso conciliado',
          tipo: 'ingreso',
          seccion: 'finanzas',
          tipoLabel: 'Ingreso Conciliado',
          icono: '💰',
          badgeClase: 'bg-teal-50 dark:bg-teal-950/80 text-teal-700 dark:text-teal-300 border-teal-200 dark:border-teal-800',
          barColor: 'bg-teal-500',
          fecha: ing.Fecha_Conciliacion || ing.Fecha_Ingreso || '',
          subtitulo: (ing.Moneda_Original || 'PEN') + ' ' + (parseFloat(ing.Monto_Original || ing.Monto_PEN || 0).toLocaleString('es-PE', { minimumFractionDigits: 2 })),
          dias: calcularDiasArchivado(ing)
        });
      }
    });

    // Actualizar contadores de las pestañas
    var cTodos = document.getElementById('count-tab-arch-todos');
    var cKanban = document.getElementById('count-tab-arch-kanban');
    var cPort = document.getElementById('count-tab-arch-portafolio');
    var cHab = document.getElementById('count-tab-arch-habitos');
    var cFin = document.getElementById('count-tab-arch-finanzas');
    var lblFoot = document.getElementById('lbl-total-archivados-footer');

    if (cTodos) cTodos.textContent = itemsTodos.length;
    if (cKanban) cKanban.textContent = countKanban;
    if (cPort) cPort.textContent = countPortafolio;
    if (cHab) cHab.textContent = countHabitos;
    if (cFin) cFin.textContent = countFinanzas;
    if (lblFoot) lblFoot.textContent = itemsTodos.length + ' archivados';

    // Actualizar estilos activos de las pestañas del Drawer
    ['todos', 'kanban', 'portafolio', 'habitos', 'finanzas'].forEach(function (tab) {
      var btnTab = document.getElementById('tab-drawer-' + tab);
      if (btnTab) {
        if (tab === tabActivo) {
          btnTab.className = 'tab-drawer-pill px-3 py-1.5 rounded-xl font-bold transition-all duration-150 flex items-center gap-1.5 shrink-0 bg-amber-500 text-white shadow-2xs cursor-pointer';
        } else {
          btnTab.className = 'tab-drawer-pill px-3 py-1.5 rounded-xl font-medium transition-all duration-150 flex items-center gap-1.5 shrink-0 text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800 cursor-pointer';
        }
      }
    });

    // Filtrar por pestaña y por query
    var itemsFiltrados = itemsTodos.filter(function (item) {
      if (tabActivo !== 'todos' && item.seccion !== tabActivo) return false;
      if (query) {
        var matchTit = (item.titulo || '').toLowerCase().indexOf(query) !== -1;
        var matchId = (item.id || '').toLowerCase().indexOf(query) !== -1;
        var matchSub = (item.subtitulo || '').toLowerCase().indexOf(query) !== -1;
        var matchTipo = (item.tipoLabel || '').toLowerCase().indexOf(query) !== -1;
        if (!matchTit && !matchId && !matchSub && !matchTipo) return false;
      }
      return true;
    });

    // Ordenar de mayor a menor antigüedad de archivado
    itemsFiltrados.sort(function (a, b) {
      return (b.dias || 0) - (a.dias || 0);
    });

    if (itemsFiltrados.length === 0) {
      cont.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-center text-slate-400 dark:text-slate-500 space-y-3">' +
        '<div class="w-16 h-16 rounded-3xl bg-slate-100 dark:bg-slate-800/60 flex items-center justify-center text-3xl shadow-inner border border-slate-200/60 dark:border-slate-800">📦</div>' +
        '<div><h4 class="text-sm font-bold text-slate-700 dark:text-slate-300">Bóveda vacía en este segmento</h4>' +
        '<p class="text-xs text-slate-400 max-w-xs mt-1">No hay elementos finalizados con más de 10 días o coincidentes con tu búsqueda.</p></div></div>';
      return;
    }

    var htmlCards = '';
    itemsFiltrados.forEach(function (item) {
      var fechaHum = item.fecha ? formatFechaHumana(item.fecha) : 'Sin fecha';
      var diasBadge = '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 font-mono shrink-0">⏱️ +' + item.dias + 'd</span>';

      htmlCards += '<div class="drawer-bento-card group p-3.5 pl-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs hover:shadow-md transition-all duration-150 relative overflow-hidden flex flex-col gap-2.5 select-none">' +
        '<div class="absolute left-0 top-0 bottom-0 w-1.5 ' + item.barColor + ' transition-all duration-150 group-hover:w-2"></div>' +
        '<div class="flex items-center justify-between gap-2 flex-wrap">' +
        '  <div class="flex items-center gap-1.5 flex-wrap min-w-0">' +
        '    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[9.5px] font-extrabold uppercase border ' + item.badgeClase + ' font-mono shrink-0 shadow-2xs">' +
        '      <span>' + item.icono + '</span><span>' + item.tipoLabel + '</span>' +
        '    </span>' +
        '    <span class="text-[10px] font-mono font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded-md border border-slate-200 dark:border-slate-700 shrink-0">' + item.id + '</span>' +
        '  </div>' +
        '  ' + diasBadge +
        '</div>' +
        '<div>' +
        '  <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 line-clamp-2 leading-relaxed">' + escapeHtml(item.titulo) + '</h4>' +
        '  <div class="flex items-center gap-2 mt-1 text-[11px] text-slate-500 dark:text-slate-400">' +
        '    <span class="truncate font-medium">' + escapeHtml(item.subtitulo) + '</span>' +
        '    <span>•</span>' +
        '    <span class="text-[10.5px]">Finalizado: ' + fechaHum + '</span>' +
        '  </div>' +
        '</div>' +
        '<div class="pt-2 border-t border-slate-100 dark:border-slate-800/70 flex items-center justify-between gap-2 mt-0.5">' +
        '  <span class="text-[10px] text-slate-400 italic">Retirado del canvas activo</span>' +
        '  <button type="button" onclick="desarchivarElemento(\'' + item.tipo + '\', \'' + item.id + '\')" class="px-2.5 py-1 rounded-xl text-xs font-bold transition-all duration-150 flex items-center gap-1.5 shadow-2xs bg-amber-50 hover:bg-amber-500 hover:text-white text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 dark:hover:bg-amber-500 dark:hover:text-white border border-amber-200 dark:border-amber-800/70 active:scale-95 cursor-pointer ml-auto shrink-0" title="Restaurar al canvas activo (actualiza fecha y hace visible de nuevo)">' +
        '    <span class="text-sm">↩️</span><span>Restaurar</span>' +
        '  </button>' +
        '</div>' +
        '</div>';
    });

    cont.innerHTML = htmlCards;
  }
  window.renderListaDrawerArchivados = renderListaDrawerArchivados;

</script>
