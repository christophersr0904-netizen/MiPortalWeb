    if (!idNormalizado || state.selectedProjectId === idNormalizado) {
      if (typeof resetGlobalFiltrosSistema === 'function') {
        resetGlobalFiltrosSistema();
        return;
      } else if (typeof limpiarTodosLosFiltrosKanban === 'function') {
        limpiarTodosLosFiltrosKanban();
        return;
      }
    }

    state.selectedProjectId = idNormalizado;

    var p = null;
    if (state.selectedProjectId) {
      p = (state.proyectos || []).find(function (x) {
        return String(x.ID_Proyecto || '').trim().toUpperCase() === state.selectedProjectId;
      });

    var lblActivo = document.getElementById('label-proyecto-activo');

            '<svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
          '</button>';
        lblActivo.className = 'text-xs px-2.5 py-0.5 rounded-full bg-sky-600/90 text-white font-bold border border-sky-400/40 shadow-xs inline-flex items-center gap-1.5 max-w-[260px] transition-all duration-200';
      } else {

        lblActivo.className = 'text-xs px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold border border-slate-200 dark:border-slate-700 truncate max-w-[260px] inline-flex items-center gap-1.5 transition-all duration-200';
      }
    }

    actualizarBarraMetadatosProyectoKanban(p);

    // Enfoque Metodológico: Cascada / Predictivo redirige a Vista Grafo / PERT
    if (p) {

      if (met.indexOf('cascada') !== -1 || met.indexOf('predictivo') !== -1) {

        var cpi = (p.CPI !== undefined && !isNaN(p.CPI)) ? parseFloat(p.CPI) : ((ac > 0 && bac > 0) ? (ev / ac) : 1.00);
        var eac = (cpi > 0) ? (bac / cpi) : bac;

        cpiBadge.title = 'Cost Performance Index: ' + cpi.toFixed(2) + ' • ' + cpiDesc + ' | EV: ' + moneda + ' ' + ev.toFixed(2) + ' | AC: ' + moneda + ' ' + ac.toFixed(2) + ' | EAC: ' + moneda + ' ' + eac.toFixed(2);

      // Botón Rápido Check-in de Gobernanza
      var btnCheckin = document.getElementById('btn-quick-checkin');
      if (btnCheckin) {

          btnCheckin.title = 'Requiere revisión (' + (p.Frecuencia_Control || 'Semanal') + '). Días sin revisión: ' + (p.Dias_Sin_Revision || '0') + '. Registrar check-in ahora';
        } else {

  /**
   * 6.4.1. Actualiza y puebla reactivamente el selector de hitos en el Tablero Kanban
   */
  function actualizarSelectorHitosKanban(preservarValor) {
    var inputEl = document.getElementById('filter-hito-tarea');
    var btnCapsule = document.getElementById('btn-hito-capsule') || document.getElementById('btn-capsule-hito-filter');
    var lblCapsule = document.getElementById('label-hito-active-text') || document.getElementById('label-capsule-hito-filter');
    var listaEl = document.getElementById('lista-opciones-hitos-popover');
    if (!inputEl) return;

    var idProyK = state.selectedProjectId ? String(state.selectedProjectId).trim().toUpperCase() : null;
    if (idProyK === 'TODOS' || idProyK === 'ALL' || idProyK === '' || idProyK === 'GLOBAL' || idProyK === 'NULL') {
      idProyK = null;
    }

    // Regla Canónica: Por defecto o si el proyecto es 'Todos', DESHABILITAR Hitos
    if (!idProyK) {
      inputEl.value = '';
      state.filtros.hitoTarea = '';
      if (lblCapsule) lblCapsule.textContent = 'Hitos (Selecciona Proyecto)';
      if (btnCapsule) {
        btnCapsule.setAttribute('disabled', 'disabled');
        btnCapsule.disabled = true;
        btnCapsule.title = 'Selecciona un proyecto específico para activar el filtro de hitos';
        btnCapsule.classList.remove('opacity-100', 'cursor-pointer');
        btnCapsule.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
      }
      var containerEl = document.getElementById('container-filter-hito');
      if (containerEl) containerEl.classList.remove('group/filter-hito');
      if (listaEl) {
        listaEl.innerHTML = '';
      }
      if (typeof updateCapsuleVisual === 'function') updateCapsuleVisual(btnCapsule, false);
      return;
    }

    // Filtrar hitos pertenecientes ÚNICAMENTE al proyecto seleccionado
    var hitosProyK = (state.hitos || []).filter(function (h) {
      var hProy = String(h.idProyecto || h.ID_Proyecto || '').trim().toUpperCase();
      return hProy === idProyK;
    });

    // Caso B: El proyecto seleccionado no tiene hitos registrados
    if (hitosProyK.length === 0) {
      inputEl.value = '';
      state.filtros.hitoTarea = '';
      if (lblCapsule) lblCapsule.textContent = 'Sin Hitos Registrados';
      if (btnCapsule) {
        btnCapsule.setAttribute('disabled', 'disabled');
        btnCapsule.disabled = true;
        btnCapsule.title = 'El proyecto seleccionado no tiene hitos registrados';
        btnCapsule.classList.remove('opacity-100', 'cursor-pointer');
        btnCapsule.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
      }
      var containerEl = document.getElementById('container-filter-hito');
      if (containerEl) containerEl.classList.remove('group/filter-hito');
      if (listaEl) {
        listaEl.innerHTML = '';
      }
      if (typeof updateCapsuleVisual === 'function') updateCapsuleVisual(btnCapsule, false);
      return;
    }

    // Caso C: El proyecto tiene hitos -> habilitar cápsula y poblar popover
    var containerEl = document.getElementById('container-filter-hito');
    if (containerEl) containerEl.classList.add('group/filter-hito');

    if (btnCapsule) {
      btnCapsule.removeAttribute('disabled');
      btnCapsule.disabled = false;
      btnCapsule.title = 'Filtrar por hito del proyecto activo';
      btnCapsule.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
      btnCapsule.classList.add('opacity-100', 'cursor-pointer');
    }

    var hitosOrdenadosK = (typeof ordenarHitosCronologicamente === 'function')
      ? ordenarHitosCronologicamente(hitosProyK)
      : hitosProyK;

    var valorAnteriorK = (preservarValor && inputEl && inputEl.value) ? inputEl.value : '';
    var existeValorAnteriorK = false;

    var htmlK = '';
    htmlK += '<button type="button" onclick="setKanbanHitoFilter(\'\')" class="btn-opt-hito w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center justify-between transition-colors bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 cursor-pointer" data-val="" data-hito-id="" id="opt-hito-todos">';
    htmlK += '  <span class="flex items-center gap-1.5 truncate"><span>Todos los Hitos</span></span>';
    htmlK += '  <span class="text-xs text-indigo-600 dark:text-indigo-400 font-bold shrink-0 hidden check-hito-indicator">✓</span>';
    htmlK += '</button>';

    hitosOrdenadosK.forEach(function (h) {
      var idH = String(h.idHito || h.ID_Hito || '').trim();
      var nomH = String(h.nombreHito || h.Nombre_Hito || 'Hito sin nombre').trim();
      if (valorAnteriorK && idH.toUpperCase() === valorAnteriorK.toUpperCase()) {
        existeValorAnteriorK = true;
      }
      htmlK += '<button type="button" onclick="setKanbanHitoFilter(\'' + idH.replace(/'/g, "\\'") + '\')" class="btn-opt-hito w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white cursor-pointer" data-val="' + idH.replace(/"/g, '&quot;') + '" data-hito-id="' + idH.replace(/"/g, '&quot;') + '">';
      htmlK += '  <span class="flex items-center gap-1.5 truncate" title="[' + idH + '] ' + nomH + '"><span class="text-[10px] font-mono text-indigo-500 dark:text-indigo-400 font-bold shrink-0">[' + idH + ']</span><span class="truncate">' + nomH + '</span></span>';
      htmlK += '  <span class="text-xs text-indigo-600 dark:text-indigo-400 font-bold shrink-0 hidden check-hito-indicator">✓</span>';
      htmlK += '</button>';
    });

    if (listaEl) {
      listaEl.innerHTML = htmlK;
    }

    if (typeof setKanbanHitoFilter === 'function') {
      if (preservarValor && existeValorAnteriorK) {
        setKanbanHitoFilter(valorAnteriorK, true);
      } else {
        setKanbanHitoFilter('', true);
      }
    } else {
      if (inputEl) inputEl.value = (preservarValor && existeValorAnteriorK) ? valorAnteriorK : '';
      state.filtros.hitoTarea = (preservarValor && existeValorAnteriorK) ? valorAnteriorK : '';
    }

    // Fallback retrocompatible para <select> si estuviera presente
    var selectEl = document.getElementById('filter-hito-tarea');
    if (!selectEl) return;

    var idProy = state.selectedProjectId ? String(state.selectedProjectId).trim().toUpperCase() : null;
    if (idProy === 'TODOS' || idProy === 'ALL' || idProy === '' || idProy === 'GLOBAL' || idProy === 'NULL') {
      idProy = null;
    }

    if (!idProy) {
      selectEl.innerHTML = '<option value="">Hitos: Todos</option>';
      selectEl.value = '';
      selectEl.disabled = true;
      selectEl.title = 'Selecciona un proyecto para filtrar por hito';
      selectEl.classList.add('opacity-60', 'cursor-not-allowed');
      state.filtros.hitoTarea = '';
      return;
    }

    var hitosProy = (state.hitos || []).filter(function (h) {
      return String(h.ID_Proyecto || '').trim().toUpperCase() === idProy;
    });

    if (hitosProy.length === 0) {
      selectEl.innerHTML = '<option value="">Sin hitos</option>';
      selectEl.value = '';
      selectEl.disabled = true;
      selectEl.title = 'El proyecto seleccionado no tiene hitos registrados';
      selectEl.classList.add('opacity-60', 'cursor-not-allowed');
      state.filtros.hitoTarea = '';
      return;
    }

    var hitosOrdenados = (typeof ordenarHitosCronologicamente === 'function')
      ? ordenarHitosCronologicamente(hitosProy)
      : hitosProy;

    var valorAnterior = (preservarValor && selectEl.value) ? selectEl.value : '';
    var existeValorAnterior = false;

    var html = '<option value="">Todos los Hitos</option>';
    hitosOrdenados.forEach(function (h) {
      var idH = String(h.ID_Hito || '').trim();
      var nomH = String(h.Nombre_Hito || 'Hito sin nombre').trim();
      if (valorAnterior && idH.toUpperCase() === valorAnterior.toUpperCase()) {
        existeValorAnterior = true;
      }
      html += '<option value="' + idH + '">[' + idH + '] ' + nomH + '</option>';
    });

    selectEl.innerHTML = html;
    selectEl.disabled = false;
    selectEl.classList.remove('opacity-60', 'cursor-not-allowed');

    if (preservarValor && existeValorAnterior) {
      selectEl.value = valorAnterior;
      state.filtros.hitoTarea = valorAnterior;
    } else {
      selectEl.value = '';
      state.filtros.hitoTarea = '';
    }
  }

      if (form) form.reset();

      var elFecha = document.getElementById('gasto-fecha');
      if (elFecha) {
        elFecha.value = new Date().toISOString().split('T')[0];

      selProyecto.innerHTML = '<option value="">-- Gasto Personal (Sin Proyecto) --</option>';

      if (window.state && Array.isArray(state.proyectos)) {
        state.proyectos.forEach(function (p) {
          var idProy = p.ID_Proyecto || p.id || '';

        selProyecto.value = state.selectedProjectId;

  /**
   * 6.6.3. Filtro de Hitos y Tareas (Cascada Nivel 1)
   */
  function filtrarHitosYTareasGastoModal(idProyecto, idHitoPredefinido = '', idTareaPredefinida = '') {
    var selHito = document.getElementById('selector-idHito-gasto');
    var selTarea = document.getElementById('selector-idTarea-gasto');

    if (selHito) selHito.innerHTML = '<option value="">Seleccione Hito...</option>';
    if (selTarea) selTarea.innerHTML = '<option value="">Sin tarea específica</option>';

    // Si es gasto personal (sin proyecto), deshabilitar y limpiar cascada limpiamente
    if (!idProyecto) {
      if (selHito) {
        selHito.disabled = true;
        selHito.classList.add('opacity-50', 'cursor-not-allowed');
      }
      if (selTarea) {
        selTarea.disabled = true;
        selTarea.classList.add('opacity-50', 'cursor-not-allowed');
      }
      return;
    }

    if (selHito) {
      selHito.disabled = false;
      selHito.classList.remove('opacity-50', 'cursor-not-allowed');
    }
    if (selTarea) {
      selTarea.disabled = false;
      selTarea.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    var idProyNorm = String(idProyecto || '').trim().toUpperCase();

    if (selHito && window.state && Array.isArray(state.hitos)) {
      var hitosProy = state.hitos.filter(function (h) {
        var pId = h.ID_Proyecto || h.idProyecto || '';
        return String(pId).trim().toUpperCase() === idProyNorm;
      });

      hitosProy.forEach(function (h) {
        var hId = h.ID_Hito || h.id || h.idHito || '';

    if (window.state && Array.isArray(state.tareas)) {
      var tareasFiltradas = state.tareas.filter(function (t) {
        var pId = t.ID_Proyecto || t.idProyecto || '';
        return String(pId).trim().toUpperCase() === idProyNorm;
      });

      if (idHito) {
        tareasFiltradas = tareasFiltradas.filter(function (t) {

          return String(hId).trim().toUpperCase() === hitosNorm;

        opt.value = tId;
        opt.textContent = '[' + tId + '] ' + nomT;
        selTarea.appendChild(opt);
      });

    if (idTareaPredefinida) {
      selTarea.value = idTareaPredefinida;
    }

  function actualizarDependenciasDisponibles(idProyecto, fechaNuevaTarea) {
    var selDep = document.getElementById('tarea-idDependencia-select');
    if (!selDep) return;
    selDep.innerHTML = '<option value="">Ninguna (Sin dependencia)</option>';

    var tareasCandidatas = state.tareas;
    if (idProyecto) {
      var idNorm = String(idProyecto).trim().toUpperCase();
      tareasCandidatas = tareasCandidatas.filter(function (t) {
        return String(t.ID_Proyecto || '').trim().toUpperCase() === idNorm ||
          (String(t.ID_Hito || '').trim().toUpperCase().indexOf(idNorm) === 0);
      });
    }

    if (fechaNuevaTarea) {
      var dNueva = new Date(fechaNuevaTarea.split(' ')[0]).getTime();
      tareasCandidatas = tareasCandidatas.filter(function (t) {
        if (!t.Fecha_Programada) return true;
        var dExistente = new Date(String(t.Fecha_Programada).split(' ')[0]).getTime();
        return (dExistente <= dNueva);
      });
    }

    tareasCandidatas.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.ID_Tarea;
      var fProg = t.Fecha_Programada ? String(t.Fecha_Programada).split(' ')[0] : 'Sin fecha';
      opt.textContent = '[' + t.ID_Tarea + '] (' + fProg + ') ' + (t.Nombre_Tarea_Actividad || '').substring(0, 35);
      selDep.appendChild(opt);
    });
  }

  function cambiarTabPdf(tab) {
    state.tabPdfActivo = tab;
    document.querySelectorAll('.tab-btn-pdf').forEach(function (btn) {
      btn.className = 'tab-btn-pdf py-1.5 px-2 rounded-lg transition text-center truncate text-slate-600 hover:text-slate-900';

    var sel = document.getElementById('selector-proyecto-pdf');
    sel.innerHTML = '';

    var lista = state.proyectos;
    if (tab === 'activos') lista = state.proyectos.filter(function (p) { return String(p.Estado_Proyecto || '').indexOf('03_En_Ejecucion') !== -1; });
    else if (tab === 'planificados') lista = state.proyectos.filter(function (p) { return String(p.Estado_Proyecto || '').indexOf('02_Planificado') !== -1; });
    else if (tab === 'cerrados') lista = state.proyectos.filter(function (p) { return String(p.Estado_Proyecto || '').indexOf('06_Cerrado') !== -1 || String(p.Estado_Proyecto || '').indexOf('05_Cancelado') !== -1; });

    if (lista.length === 0) {
      sel.innerHTML = '<option value="">No hay proyectos</option>';
      return;
    }

    lista.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.ID_Proyecto;
      opt.textContent = '[' + p.ID_Proyecto + '] ' + p.Nombre_Proyecto;
      sel.appendChild(opt);
    });

    if (state.selectedProjectId && lista.some(function (p) { return p.ID_Proyecto === state.selectedProjectId; })) {
      sel.value = state.selectedProjectId;
    }
  }

  function ejecutarCompilacionPdf() {
    var sel = document.getElementById('selector-proyecto-pdf');
    var idProyecto = sel ? sel.value : '';
    if (!idProyecto) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'warning',
          title: 'Selección Requerida',
          text: 'Por favor selecciona un proyecto para generar la ficha.',
          confirmButtonColor: '#4f46e5'
        });
      }
      return;
    }

    var btn = document.getElementById('btn-compilar-pdf');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Compilando...';
    }

    callBackend('generarfichapdf', { idProyecto: idProyecto }, function (res) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Compilar FICHA RESUMEN (PDF)';
      }
      if (res && res.success && res.pdfUrl) {
        var visorUrl = res.pdfUrl.replace('/view', '/preview');
        var linkDirecto = document.getElementById('link-abrir-pdf-directo');
        var boxResultado = document.getElementById('box-resultado-pdf');
        if (linkDirecto) linkDirecto.href = visorUrl;
        if (boxResultado) boxResultado.classList.remove('hidden');
        window.open(visorUrl, '_blank');
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Error al Compilar PDF',
          text: (res && res.error) || 'Fallo en la generación de la ficha PDF.',
          confirmButtonColor: '#4f46e5'
        });
      }
    }, function (err) {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Compilar FICHA RESUMEN (PDF)';
      }
      Swal.fire({
        icon: 'error',
        title: 'Error de Red',
        text: (err && err.message) || 'No se pudo contactar con el servidor.',
        confirmButtonColor: '#4f46e5'
      });
    });

      else if (tipo.includes('Negocio') || tipo.includes('Comercial') || tipo.includes('Venta')) key = 'Negocio';
      else if (tipo.includes('Marketing') || tipo.includes('Crecimiento')) key = 'Marketing';
      else if (tipo.includes('Infraestructura') || tipo.includes('Cloud')) key = 'Infraestructura';
      else if (tipo.includes('Profesional')) key = 'Profesional';
      else if (tipo.includes('Personal')) key = 'Personal';

  /**
   * Invoca al asistente para estructurar automáticamente la propuesta WBS integral
   * Rellena automáticamente hitos, tareas y gastos para edición en vivo
   */
  function ejecutarGeneracionPropuestaIA() {
    var nom = (document.getElementById('wiz-nombreProyecto') ? document.getElementById('wiz-nombreProyecto').value : '').trim();
    if (!nom || nom.length < 3) {
      Swal.fire({
        icon: 'warning',
        title: 'Nombre de Proyecto Requerido',
        text: 'Por favor, escribe un nombre representativo para que el asistente identifique el dominio de tu iniciativa.',
        confirmButtonColor: '#4f46e5'
      });
      cambiarTabWizProyecto('datos');
      var inputNom = document.getElementById('wiz-nombreProyecto');
      if (inputNom) inputNom.focus();
      return;
    }

    var desc = (document.getElementById('wiz-descripcion') ? document.getElementById('wiz-descripcion').value : '').trim();
    var stack = (document.getElementById('wiz-stackTecnologico') ? document.getElementById('wiz-stackTecnologico').value : '').trim();
    var entregable = (document.getElementById('wiz-entregableTangible') ? document.getElementById('wiz-entregableTangible').value : '').trim();
    var restricciones = (document.getElementById('wiz-restricciones') ? document.getElementById('wiz-restricciones').value : '').trim();
    var estadoPartida = (document.getElementById('wiz-estadoPartida') ? document.getElementById('wiz-estadoPartida').value : 'Cero Absoluto (Greenfield)').trim();
    var perfilEjecutor = (document.getElementById('wiz-perfilEjecutor') ? document.getElementById('wiz-perfilEjecutor').value : 'Ejecutor Directo').trim();

    // Validación fluida sin modales secundarios redundantes:
    if (!desc && !entregable) {
      Swal.fire({
        icon: 'info',
        title: 'Descripción o Entregable Recomendado',
        text: 'Agrega una breve descripción o entregable final en el formulario para generar una estructura exacta.',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#4f46e5'
      });
      cambiarTabWizProyecto('datos');
      var inputDesc = document.getElementById('wiz-descripcion');
      if (inputDesc) inputDesc.focus();
      return;
    }

    var magVal = document.getElementById('wiz-magnitudComplejidad') ? document.getElementById('wiz-magnitudComplejidad').value : 'Medium';
    var arqVal = document.getElementById('wiz-arquetipoProyecto') ? document.getElementById('wiz-arquetipoProyecto').value : '1_Infraestructura';

    var payload = {
      nombreProyecto: nom,
      descripcion: desc,
      tipoIniciativa: document.getElementById('wiz-tipoIniciativa') ? document.getElementById('wiz-tipoIniciativa').value : 'Hogar / Construcción',
      magnitudComplejidad: magVal,
      arquetipoProyecto: arqVal,

  /**
   * Vincula explícitamente un gasto a su tarea e hito padre y actualiza las vistas reactivas
   */
  function asignarTareaAGastoWiz(gIdx, idTareaTemp) {
    if (!window.proyectoWizardState || !window.proyectoWizardState.gastos[gIdx]) return;
    var gasto = window.proyectoWizardState.gastos[gIdx];
    gasto.id_tarea_temp = idTareaTemp || '';
    gasto.id_hito_temp = '';
    gasto.tareaAsociada = '';

    if (idTareaTemp) {
      var hitos = window.proyectoWizardState.hitos || [];
      for (var hi = 0; hi < hitos.length; hi++) {
        var h = hitos[hi];
        for (var ti = 0; ti < (h.tareas || []).length; ti++) {
          var t = h.tareas[ti];
          if (t.id_temp === idTareaTemp) {
            gasto.id_hito_temp = h.id_temp;
            gasto.tareaAsociada = t.nombre;
            break;
          }
        }
        if (gasto.id_hito_temp) break;
      }
    }

    renderizarHitosWiz();
    renderizarTareasWiz();
    renderizarGastosWiz();
    actualizarTotalesWiz();
  }

    actualizarTotalesWiz();

  /**

   * @param {number} hIdx
   * @param {'PAQUETE_TRABAJO'|'HITO_MARCADOR'} nuevoTipo
   */
  function cambiarTipoElementoWbs(hIdx, nuevoTipo) {
    if (!window.proyectoWizardState || !window.proyectoWizardState.hitos[hIdx]) return;
    var hito = window.proyectoWizardState.hitos[hIdx];
    var oldTipo = hito.tipoElementoWbs || 'PAQUETE_TRABAJO';
    if (oldTipo === nuevoTipo) return;

    hito.tipoElementoWbs = nuevoTipo;
    var rawId = hito.id_temp ? hito.id_temp.replace(/^(WP-TMP-|HIT-TMP-|h_)/, '') : String(Date.now());
    hito.id_temp = (nuevoTipo === 'HITO_MARCADOR' ? 'HIT-TMP-' : 'WP-TMP-') + rawId;

    if (nuevoTipo === 'HITO_MARCADOR') {
      hito.presupuestoAsignado = 0.00;
      hito.peso_pct = 0;
      // Los hitos marcadores no admiten tareas hijas
      if (hito.tareas && hito.tareas.length > 0) {
        var idsTareasHito = {};
        hito.tareas.forEach(function (t) { if (t.id_temp) idsTareasHito[t.id_temp] = true; });
        if (window.proyectoWizardState.gastos) {
          window.proyectoWizardState.gastos.forEach(function (g) {
            if (g.id_tarea_temp && idsTareasHito[g.id_tarea_temp]) {
              g.id_tarea_temp = '';
              g.tareaAsociada = '';
            }
            if (g.id_hito_temp && g.id_hito_temp === hito.id_temp) {
              g.id_hito_temp = '';
            }
          });
        }
        hito.tareas = [];
      }
    }

    renderizarHitosWiz();
    renderizarTareasWiz();
    renderizarGastosWiz();
    actualizarTotalesWiz();
  }
  window.cambiarTipoElementoWbs = cambiarTipoElementoWbs;

    });

    var moneda = (document.getElementById('wiz-monedaBase') ? document.getElementById('wiz-monedaBase').value : 'PEN');

  /**
   * Actualiza los contadores, insignias y la barra presupuestal Bottom-Up del wizard WBS v4.1
   */
  function actualizarTotalesWiz() {
    if (!window.proyectoWizardState) return;
    var hitos = window.proyectoWizardState.hitos || [];
    var gastos = window.proyectoWizardState.gastos || [];

    // Contadores de pestañas
    var bHitos = document.getElementById('badge-wiz-hitos-count');
    if (bHitos) bHitos.textContent = hitos.length;

    var totalTareas = 0;
    var totalHoras = 0;
    var sumPesos = 0;

    hitos.forEach(function (h) {
      sumPesos += (parseFloat(h.peso_pct) || 0);
      if (h.tipoElementoWbs !== 'HITO_MARCADOR') {
        (h.tareas || []).forEach(function (t) {
          totalTareas++;
          totalHoras += (parseFloat(t.horas) || 0);
        });
      }
    });

    var bTareas = document.getElementById('badge-wiz-tareas-count');
    if (bTareas) bTareas.textContent = totalTareas;

    var bGastos = document.getElementById('badge-wiz-gastos-count');
    if (bGastos) bGastos.textContent = gastos.length;

    // Indicador de Ponderación Total de Hitos (%)
    var badgePesos = document.getElementById('wiz-sum-pesos-badge');
    if (badgePesos) {
      if (sumPesos === 100) {
        badgePesos.textContent = '100% (Balanceado)';
        badgePesos.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800';
      } else if (sumPesos < 100) {
        badgePesos.textContent = sumPesos + '% (Falta ' + (100 - sumPesos) + '%)';
        badgePesos.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300 border border-amber-300 dark:border-amber-800';
      } else {
        badgePesos.textContent = sumPesos + '% (Excede +' + (sumPesos - 100) + '%)';
        badgePesos.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 border border-rose-300 dark:border-rose-800';
      }
    }

    // Indicador de Esfuerzo Total de Tareas (Horas)
    var badgeHoras = document.getElementById('wiz-total-horas-badge');
    if (badgeHoras) {
      badgeHoras.textContent = totalHoras + ' horas (' + totalTareas + ' tareas)';
    }

    // Presupuesto Bottom-Up WBS v4.1: Sumar únicamente presupuestoAsignado de PAQUETE_TRABAJO
    var totalPresupuestoWBS = 0;
    hitos.forEach(function (h) {
      if (h.tipoElementoWbs === 'PAQUETE_TRABAJO') {
        totalPresupuestoWBS += (parseFloat(h.presupuestoAsignado) || 0);
      }
    });

    var moneda = (document.getElementById('wiz-monedaBase') ? document.getElementById('wiz-monedaBase').value : 'PEN');
    var simbolo = getSimboloMonedaWiz(moneda);
    var pTope = parseFloat(document.getElementById('wiz-presupuestoTope') ? document.getElementById('wiz-presupuestoTope').value : 0) || 0;

    var elConsumo = document.getElementById('wiz-lbl-presupuesto-consumo');
    if (elConsumo) {
      if (pTope > 0) {
        elConsumo.textContent = 'Presupuesto WBS (Bottom-Up): ' + simbolo + ' ' + totalPresupuestoWBS.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' de ' + simbolo + ' ' + pTope.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      } else {
        elConsumo.textContent = 'Presupuesto WBS (Bottom-Up): ' + simbolo + ' ' + totalPresupuestoWBS.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' (Suma de Paquetes de Trabajo)';
      }
    }

    var pct = pTope > 0 ? Math.round((totalPresupuestoWBS / pTope) * 100) : (totalPresupuestoWBS > 0 ? 100 : 0);
    var elPct = document.getElementById('wiz-lbl-presupuesto-pct');
    if (elPct) {
      if (pTope > 0) {
        elPct.textContent = pct + '%';
        if (pct > 100) {
          elPct.className = 'font-mono text-rose-600 dark:text-rose-400 font-bold';
        } else {
          elPct.className = 'font-mono text-emerald-600 dark:text-emerald-400 font-bold';
        }
      } else {
        elPct.textContent = totalPresupuestoWBS > 0 ? '✨ Bottom-Up' : '0%';
        elPct.className = 'font-mono text-indigo-600 dark:text-indigo-400 font-bold text-xs';
      }
    }

    var elBar = document.getElementById('wiz-bar-presupuesto');
    if (elBar) {
      if (pTope > 0) {
        elBar.style.width = Math.min(pct, 100) + '%';
        if (pct > 100) {
          elBar.className = 'bg-rose-500 h-full rounded-full transition-all duration-300';
        } else {
          elBar.className = 'bg-emerald-500 h-full rounded-full transition-all duration-300';
        }
      } else {
        elBar.style.width = totalPresupuestoWBS > 0 ? '100%' : '0%';
        elBar.className = 'bg-indigo-500 h-full rounded-full transition-all duration-300';
      }
    }
  }
  window.actualizarTotalesWiz = actualizarTotalesWiz;

  /**
   * Persiste atómicamente el proyecto, hitos, tareas y gastos en Google Sheets
   */
  /**
   * Recolecta y estandariza los datos de entrada del Wizard bajo la arquitectura WBS v4.1
   * @returns {Object} Payload listo para enviar al backend
   */
  function recolectarDatosWizard() {
    var nom = (document.getElementById('wiz-nombreProyecto') ? document.getElementById('wiz-nombreProyecto').value : '').trim();
    var magVal = document.getElementById('wiz-magnitudComplejidad') ? document.getElementById('wiz-magnitudComplejidad').value : 'Medium';
    var arqVal = document.getElementById('wiz-arquetipoProyecto') ? document.getElementById('wiz-arquetipoProyecto').value : '1_Infraestructura';
    var hitos = (window.proyectoWizardState && window.proyectoWizardState.hitos) || [];
    var gastos = (window.proyectoWizardState && window.proyectoWizardState.gastos) || [];

    // Presupuesto Bottom-Up WBS v4.1: Sumatoria exclusiva de Paquetes de Trabajo (WP)
    var presBottomUp = 0;
    hitos.forEach(function (h) {
      if (h.tipoElementoWbs === 'PAQUETE_TRABAJO') {
        presBottomUp += (parseFloat(h.presupuestoAsignado) || 0);
      }
    });

    var inPresVal = (document.getElementById('wiz-presupuestoTope') ? document.getElementById('wiz-presupuestoTope').value : '').trim();
    var presTopeNum = parseFloat(inPresVal) || 0;
    if (presTopeNum <= 0 && presBottomUp > 0) {
      presTopeNum = presBottomUp;
    }

    var inFechaFin = (document.getElementById('wiz-fechaFinPlan') ? document.getElementById('wiz-fechaFinPlan').value : '').trim();
    if (!inFechaFin && hitos.length > 0) {
      hitos.forEach(function (h) {
        if (h.fecha_fin && (!inFechaFin || h.fecha_fin > inFechaFin)) {
          inFechaFin = h.fecha_fin;
        }
      });
    }

    var inMetodologia = (document.getElementById('wiz-metodologiaSugerida') ? document.getElementById('wiz-metodologiaSugerida').value : '').trim() || 'Iterativo / Kanban';

    var payload = {
      proyecto: {
        nombreProyecto: nom,
        descripcion: (document.getElementById('wiz-descripcion') ? document.getElementById('wiz-descripcion').value : '').trim(),
        tipoIniciativa: document.getElementById('wiz-tipoIniciativa') ? document.getElementById('wiz-tipoIniciativa').value : 'Profesional',
        magnitudComplejidad: magVal,
        arquetipoProyecto: arqVal,
        // Aliases para compatibilidad con código legado:
        categoriaTShirt: magVal === 'Light' ? 'XS-ExtraSmall' : (magVal === 'Heavy' ? 'L-Large' : 'M-Medium'),
        criterioDominante: arqVal === '1_Infraestructura' ? 'T-Tiempo' : (arqVal === '2_Venture' ? 'K-Complejidad' : (arqVal === '3_Activo' ? 'C-Costo' : 'I-Impacto')),
        metodologiaSugerida: inMetodologia,
        estadoProyecto: '02_Planificado',
        healthStatus: '🟢 En Rango',
        fechaInicioPlan: document.getElementById('wiz-fechaInicioPlan') ? document.getElementById('wiz-fechaInicioPlan').value : '',
        fechaFinPlan: inFechaFin,
        northStarOKR: (document.getElementById('wiz-northStarOKR') ? document.getElementById('wiz-northStarOKR').value : '').trim(),
        entregableTangible: (document.getElementById('wiz-entregableTangible') ? document.getElementById('wiz-entregableTangible').value : '').trim(),
        criteriosDoD: (document.getElementById('wiz-criteriosDoD') ? document.getElementById('wiz-criteriosDoD').value : '').trim(),
        monedaBase: document.getElementById('wiz-monedaBase') ? document.getElementById('wiz-monedaBase').value : 'PEN',
        presupuestoTope: presTopeNum,
        // Dimensiones Enriquecidas de Contexto Operativo
        estadoPartida: (document.getElementById('wiz-estadoPartida') ? document.getElementById('wiz-estadoPartida').value : '').trim(),
        perfilEjecutor: (document.getElementById('wiz-perfilEjecutor') ? document.getElementById('wiz-perfilEjecutor').value : '').trim(),
        stackTecnologico: (document.getElementById('wiz-stackTecnologico') ? document.getElementById('wiz-stackTecnologico').value : '').trim(),
        restricciones: (document.getElementById('wiz-restricciones') ? document.getElementById('wiz-restricciones').value : '').trim()
      },
      hitos: hitos.map(function (h, idx) {
        var tipoEl = (h.tipoElementoWbs === 'HITO_MARCADOR') ? 'HITO_MARCADOR' : 'PAQUETE_TRABAJO';
        var costo = (tipoEl === 'HITO_MARCADOR') ? 0.00 : (parseFloat(h.presupuestoAsignado) || 0.00);
        return {
          id_temp: h.id_temp || ((tipoEl === 'HITO_MARCADOR' ? 'HIT-TMP-' : 'WP-TMP-') + Date.now() + '_' + idx),
          tipoElementoWbs: tipoEl,
          Tipo_Elemento_WBS: tipoEl,
          nombre: h.nombre || h.nombreHito || ('Elemento ' + (idx + 1)),
          nombreHito: h.nombre || h.nombreHito || ('Elemento ' + (idx + 1)),
          peso_pct: tipoEl === 'HITO_MARCADOR' ? 0 : (parseFloat(h.peso_pct) || 0),
          pesoPct: tipoEl === 'HITO_MARCADOR' ? 0 : (parseFloat(h.peso_pct) || 0),
          presupuestoAsignado: costo,
          costoAsociadoEstimado: costo,
          fecha_fin: h.fecha_fin || '',
          fechaLimite: h.fecha_fin || '',
          tareas: tipoEl === 'HITO_MARCADOR' ? [] : (h.tareas || [])
        };
      }),
      gastos: gastos
    };

    return payload;
  }
  window.recolectarDatosWizard = recolectarDatosWizard;

  /**
   * Persiste atómicamente el proyecto, hitos, tareas y gastos en Google Sheets
   */
  function guardarProyectoDesdeWizard() {
    var payload = recolectarDatosWizard();
    var nom = (payload.proyecto && payload.proyecto.nombreProyecto ? payload.proyecto.nombreProyecto : '').trim();
    if (!nom) {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('warning', 'Nombre Requerido', 'Por favor, ingresa el Nombre del Proyecto.');
      }
      cambiarTabWizProyecto('datos');
      var inNom = document.getElementById('wiz-nombreProyecto');
      if (inNom) inNom.focus();
      return;
    }

    var btnSave = document.getElementById('btn-wiz-guardar-todo');
    var hitos = payload.hitos || [];
    var gastos = payload.gastos || [];

    var totalTareas = 0;
    hitos.forEach(function (h) { totalTareas += (h.tareas || []).length; });

    // 1. OPTIMISTIC UI: Crear Proyecto, Hitos, Tareas y Gastos en memoria instantáneamente
    var tempIdProy = 'TEMP-PROY-' + Date.now();
    var nuevoProy = {
      ID_Proyecto: tempIdProy,
      Nombre_Proyecto: nom,
      Tipo_Iniciativa: payload.proyecto.tipoIniciativa,
      Magnitud_Complejidad: payload.proyecto.magnitudComplejidad,
      Arquetipo_Proyecto: payload.proyecto.arquetipoProyecto,
      Categoria_TShirt: payload.proyecto.categoriaTShirt,
      Criterio_Dominante: payload.proyecto.criterioDominante,
      Metodologia_Sugerida: payload.proyecto.metodologiaSugerida,
      Estado_Proyecto: payload.proyecto.estadoProyecto || '02_Planificado',
      Health_Status: '🟢 Saludable',
      Fase_Actual: 'Planificacion',
      Frecuencia_Control: 'Semanal',
      Entregable_Tangible: payload.proyecto.entregableTangible || '',
      North_Star_OKR: payload.proyecto.northStarOKR || '',
      Criterios_DoD: payload.proyecto.criteriosDoD || '',
      Fecha_Inicio_Plan: payload.proyecto.fechaInicioPlan || '',
      Fecha_Fin_Plan: payload.proyecto.fechaFinPlan || '',
      Moneda_Base: payload.proyecto.monedaBase || 'PEN',
      Presupuesto_Tope: payload.proyecto.presupuestoTope || 0,
      Gasto_Real_Total_PEN: 0,
      Avance_Fisico_Ponderado_Pct: 0,
      _isOptimistic: true
    };

    var hitosLocales = [];
    var tareasLocales = [];
    hitos.forEach(function (h, hIdx) {
      var tipoEl = h.tipoElementoWbs || 'PAQUETE_TRABAJO';
      var tempHitoId = (tipoEl === 'HITO_MARCADOR' ? 'TEMP-HIT-' : 'TEMP-WP-') + Date.now() + '-' + (hIdx + 1);
      var pesoNum = (parseFloat(h.peso_pct) || 0) / 100;
      if (!pesoNum && hitos.length > 0 && tipoEl !== 'HITO_MARCADOR') pesoNum = 1 / hitos.length;
      var hitoObj = {
        ID_Hito: tempHitoId,
        ID_Elemento_WBS: tempHitoId,
        Tipo_Elemento_WBS: tipoEl,
        ID_Proyecto: tempIdProy,
        Nombre_Hito: h.nombre || h.nombreHito || ('Elemento ' + (hIdx + 1)),
        Peso_Porcentual: pesoNum,
        Presupuesto_Asignado: tipoEl === 'HITO_MARCADOR' ? 0.00 : (parseFloat(h.presupuestoAsignado) || 0.00),
        Fecha_Limite: h.fecha_fin || h.fechaLimite || '',
        Estado_Hito: '01_Pendiente',
        _isOptimistic: true
      };
      hitosLocales.push(hitoObj);

      (h.tareas || []).forEach(function (t, tIdx) {
        var tempTarId = 'TEMP-TAR-' + Date.now() + '-' + (hIdx + 1) + '-' + (tIdx + 1);
        var tarObj = {
          ID_Tarea: tempTarId,
          ID_Proyecto: tempIdProy,
          ID_Hito: tempHitoId,
          Nombre_Tarea_Actividad: t.nombre || t.nombreTarea || ('Tarea ' + (tIdx + 1)),
          Prioridad_Eisenhower: t.prioridad || '02_P2_Media',
          Estado_Tarea: '02_Por_Hacer',
          Nivel_Energia_Requerido: t.energia || 'Medio',
          Fecha_Programada: t.fecha_inicio || h.fecha_inicio || '',
          Hora_Inicio: '09:00',
          Horas_Estimadas: parseFloat(t.horas_estimadas || t.horas) || 2.0,
          Horas_Reales: 0,
          Responsable_Ejecutor: 'Christopher',
          _isOptimistic: true
        };
        tareasLocales.push(tarObj);
      });
    });

    var gastosLocales = [];
    gastos.forEach(function (g, gIdx) {
      var tempGasId = 'TEMP-GAS-' + Date.now() + '-' + (gIdx + 1);
      var mOrig = parseFloat(g.montoEstimado || g.monto) || 0;
      var mon = g.moneda || payload.proyecto.monedaBase || 'PEN';
      var tc = (mon === 'USD') ? 3.75 : 1.0;
      var gasObj = {
        ID_Gasto: tempGasId,
        ID_Proyecto: tempIdProy,
        Fecha_Gasto: g.fechaGasto || new Date().toISOString().split('T')[0],
        Descripcion_Gasto: g.descripcionGasto || g.concepto || 'Gasto Proyectado WBS',
        Categoria_Gasto: g.categoriaGasto || g.categoria || 'Servicios_Terceros',
        Moneda_Original: mon,
        Monto_Original: mOrig,
        Tipo_Cambio: tc,
        Monto_PEN: (mon === 'USD') ? (mOrig * tc) : mOrig,
        Monto_USD: (mon === 'USD') ? mOrig : (tc > 0 ? mOrig / tc : 0),
        Metodo_Pago: 'Transferencia Bancaria',
        Estado_Pago: 'Presupuestado',
        _isOptimistic: true
      };
      gastosLocales.push(gasObj);
    });

    if (!state.proyectos) state.proyectos = [];
    state.proyectos.unshift(nuevoProy);
    if (hitosLocales.length > 0) state.hitos = (state.hitos || []).concat(hitosLocales);
    if (tareasLocales.length > 0) state.tareas = (state.tareas || []).concat(tareasLocales);
    if (gastosLocales.length > 0) state.gastos = (state.gastos || []).concat(gastosLocales);

    // 2. CERRAR MODAL Y REINICIAR WIZARD AL INSTANTE (0ms)
    closeModal('modal-proyecto-wizard');
    var f = document.getElementById('form-wizard-proyecto');
    if (f) f.reset();
    window.proyectoWizardState = { hitos: [], gastos: [] };
    if (btnSave) {
      btnSave.disabled = false;
      btnSave.classList.remove('opacity-60', 'cursor-not-allowed');
    }

    // 3. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
    if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
    if (typeof renderGridProyectos === 'function') renderGridProyectos();
    if (typeof renderPortafolioProyectos === 'function') renderPortafolioProyectos();
    if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
    if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
    if (typeof actualizarMetricasDashboard === 'function') actualizarMetricasDashboard();

    // 4. TOAST ESQUINERO OPERATIVO (Discreto, no bloqueante)
    var msgDetalle = hitos.length > 0
      ? (nom + ' (' + hitos.length + ' hitos, ' + totalTareas + ' tareas)')
      : nom;
    if (typeof notificarCreacion === 'function') {
      notificarCreacion('Proyecto', msgDetalle, 'm');
    } else if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', 'Proyecto creado correctamente', msgDetalle);
    }

    // 5. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
    callBackend('guardarEstructuraProyectoCompleta', payload, function (res) {
      if (res && res.success && res.idProyecto) {
        var realIdProy = res.idProyecto;
        nuevoProy.ID_Proyecto = realIdProy;
        nuevoProy._isOptimistic = false;

        if (typeof notificarEntidadCreadaDesdeIdea === 'function') {
          notificarEntidadCreadaDesdeIdea('PROYECTO', realIdProy);
        }

        // Reconciliar ID_Proyecto en hitos, tareas y gastos locales optimistas
        (state.hitos || []).forEach(function (h) {
          if (h.ID_Proyecto === tempIdProy) h.ID_Proyecto = realIdProy;
        });
        (state.tareas || []).forEach(function (t) {
          if (t.ID_Proyecto === tempIdProy) t.ID_Proyecto = realIdProy;
        });
        (state.gastos || []).forEach(function (g) {
          if (g.ID_Proyecto === tempIdProy) g.ID_Proyecto = realIdProy;
        });

        if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
      } else {
        // Rollback
        state.proyectos = (state.proyectos || []).filter(function (p) { return p.ID_Proyecto !== tempIdProy; });
        state.hitos = (state.hitos || []).filter(function (h) { return h.ID_Proyecto !== tempIdProy; });
        state.tareas = (state.tareas || []).filter(function (t) { return t.ID_Proyecto !== tempIdProy; });
        state.gastos = (state.gastos || []).filter(function (g) { return g.ID_Proyecto !== tempIdProy; });

        if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
        if (typeof renderGridProyectos === 'function') renderGridProyectos();
        if (typeof renderPortafolioProyectos === 'function') renderPortafolioProyectos();
        if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
        if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();

        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('error', 'Error al Guardar Proyecto', (res && res.error) || 'No se pudo sincronizar.');
        }
      }
    }, function (err) {
      state.proyectos = (state.proyectos || []).filter(function (p) { return p.ID_Proyecto !== tempIdProy; });
      state.hitos = (state.hitos || []).filter(function (h) { return h.ID_Proyecto !== tempIdProy; });
      state.tareas = (state.tareas || []).filter(function (t) { return t.ID_Proyecto !== tempIdProy; });
      state.gastos = (state.gastos || []).filter(function (g) { return g.ID_Proyecto !== tempIdProy; });

      if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
      if (typeof renderGridProyectos === 'function') renderGridProyectos();
      if (typeof renderPortafolioProyectos === 'function') renderPortafolioProyectos();
      if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
      if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();

      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
      }
    }, { silent: true });
  }
  window.guardarProyectoDesdeWizard = guardarProyectoDesdeWizard;

  /* ===================================================================== */
  /* CONTROLADORES BOTTOM NAVIGATION Y ACCIÓN RÁPIDA MÓVIL (< 768px)       */
  /* ESTÁNDAR: COBALT AERODYNAMIC A.2.2                                    */
  /* ===================================================================== */
  function actualizarBottomNavActivo(vista) {
    var vNorm = String(vista || '').toLowerCase();
    var navMap = {
      'kanban': 'btn-bnav-kanban',
      'habitos': 'btn-bnav-habitos',
      'notas': 'btn-bnav-notas',
      'portafolio': 'btn-bnav-mas',
      'detalle': 'btn-bnav-mas',
      'financiero': 'btn-bnav-mas',
      'finanzas': 'btn-bnav-mas',
      'financiera': 'btn-bnav-mas'
    };

    var btnIds = ['btn-bnav-kanban', 'btn-bnav-habitos', 'btn-bnav-notas', 'btn-bnav-mas'];
    var activeBtnId = navMap[vNorm] || '';

    btnIds.forEach(function (id) {
      var btn = document.getElementById(id);
      if (!btn) return;
      if (id === activeBtnId) {
        btn.classList.add('text-indigo-600', 'dark:text-indigo-400');
        btn.classList.remove('text-slate-400', 'dark:text-slate-500');
      } else {
        btn.classList.remove('text-indigo-600', 'dark:text-indigo-400');
        btn.classList.add('text-slate-400', 'dark:text-slate-500');
      }
    });
  }

  window.abrirBottomSheetAccionRapida = function () {
    var backdrop = document.getElementById('bottom-sheet-backdrop');
    var sheet = document.getElementById('bottom-sheet-accion-rapida');
    var sheetMas = document.getElementById('bottom-sheet-mas');
    if (sheetMas) {
      sheetMas.classList.add('hidden');
      sheetMas.classList.remove('flex');
    }
    if (backdrop) {
      backdrop.classList.remove('hidden');
      backdrop.classList.add('block');
    }
    if (sheet) {
      sheet.classList.remove('hidden');
      sheet.classList.add('flex');
    }
  };

  window.cerrarBottomSheetAccionRapida = function () {
    var backdrop = document.getElementById('bottom-sheet-backdrop');
    var sheet = document.getElementById('bottom-sheet-accion-rapida');
    if (sheet) {
      sheet.classList.add('hidden');
      sheet.classList.remove('flex');
    }
    var sheetMas = document.getElementById('bottom-sheet-mas');
    var masVisible = sheetMas && !sheetMas.classList.contains('hidden');
    if (!masVisible && backdrop) {
      backdrop.classList.add('hidden');
      backdrop.classList.remove('block');
    }
  };

  window.toggleBottomSheetMas = function () {
    var sheet = document.getElementById('bottom-sheet-mas');
    if (!sheet) return;
    if (sheet.classList.contains('hidden')) {
      window.abrirBottomSheetMas();
    } else {
      window.cerrarBottomSheetMas();
    }
  };

  window.abrirBottomSheetMas = function () {
    var backdrop = document.getElementById('bottom-sheet-backdrop');
    var sheet = document.getElementById('bottom-sheet-mas');
    var sheetAcc = document.getElementById('bottom-sheet-accion-rapida');
    if (sheetAcc) {
      sheetAcc.classList.add('hidden');
      sheetAcc.classList.remove('flex');
    }
    if (backdrop) {
      backdrop.classList.remove('hidden');
      backdrop.classList.add('block');
    }
    if (sheet) {
      sheet.classList.remove('hidden');
      sheet.classList.add('flex');
    }
  };

  window.cerrarBottomSheetMas = function () {
    var backdrop = document.getElementById('bottom-sheet-backdrop');
    var sheet = document.getElementById('bottom-sheet-mas');
    if (sheet) {
      sheet.classList.add('hidden');
      sheet.classList.remove('flex');
    }
    var sheetAcc = document.getElementById('bottom-sheet-accion-rapida');
    var accVisible = sheetAcc && !sheetAcc.classList.contains('hidden');
    if (!accVisible && backdrop) {
      backdrop.classList.add('hidden');
      backdrop.classList.remove('block');
    }
  };

  window.cerrarTodosBottomSheets = function () {
    window.cerrarBottomSheetAccionRapida();
    window.cerrarBottomSheetMas();
    var backdrop = document.getElementById('bottom-sheet-backdrop');
    if (backdrop) {
      backdrop.classList.add('hidden');
      backdrop.classList.remove('block');
    }
  };

  function abrirModalCrearActividadFlow() {
    window.cerrarTodosBottomSheets();
    if (typeof abrirModalCrearActividadPersonalPorCategoria === 'function') {
      abrirModalCrearActividadPersonalPorCategoria('SALUD_DEPORTE');
    } else if (typeof abrirModalCrearActividadPersonal === 'function') {
      abrirModalCrearActividadPersonal();
    }
  }

  function abrirModalCrearNota() {
    window.cerrarTodosBottomSheets();
    if (typeof abrirModalNuevaNota === 'function') {
      abrirModalNuevaNota();
    } else if (typeof abrirModalCrearNotaDirecta === 'function') {
      abrirModalCrearNotaDirecta();
    }
  }

  function abrirModalGasto() {
    window.cerrarTodosBottomSheets();
    if (typeof abrirModalCrearGasto === 'function') {
      abrirModalCrearGasto('', '', '');
    }
  }

  window.actualizarBottomNavActivo = actualizarBottomNavActivo;
  window.abrirModalCrearActividadFlow = abrirModalCrearActividadFlow;
  window.abrirModalCrearNota = abrirModalCrearNota;
  window.abrirModalGasto = abrirModalGasto;
</script>
