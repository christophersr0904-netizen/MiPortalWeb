<script>
  // ============================================================================
  // SECCIÓN 5: CONTROLADORES DE EVENTOS Y FORMULARIOS
  // ============================================================================

  /**
   * 5.1. Inicialización y Bind de Formularios
   */
  function inicializarFormularios() {

    // FORMULARIO: CREAR GASTO CON OPTIMISTIC UI 60FPS
    var fGasto = document.getElementById('form-create-gasto');
    if (fGasto) {
      fGasto.addEventListener('submit', function (e) {
        e.preventDefault();
        var form = e.target;
        var btn = document.getElementById('btn-submit-gasto');

        var selProy = document.getElementById('selector-idProyecto-gasto');
        var selHito = document.getElementById('selector-idHito-gasto');
        var selTarea = document.getElementById('selector-idTarea-gasto');
        var elFecha = document.getElementById('gasto-fecha');
        var elDesc = document.getElementById('gasto-descripcion');
        var elMonto = document.getElementById('gasto-monto');
        var elTc = document.getElementById('gasto-tc');
        var elMoneda = document.getElementById('gasto-moneda');
        var elCat = document.getElementById('gasto-categoria');
        var elMetodo = document.getElementById('gasto-metodoPago') || document.getElementById('gasto-metodo');

        var mOrig = elMonto ? parseFloat(elMonto.value) || 0 : 0;
        var tc = elTc ? parseFloat(elTc.value) || 1.0 : 1.0;
        var cat = elCat ? elCat.value : 'Materiales';
        var mon = elMoneda ? elMoneda.value : 'PEN';
        var idTarVal = selTarea ? selTarea.value : '';
        var fGastoVal = elFecha ? elFecha.value : new Date().toISOString().split('T')[0];
        var descVal = elDesc ? elDesc.value.trim() : 'Gasto sin detalle';
        var metodoVal = elMetodo ? elMetodo.value : 'Transferencia Bancaria';
        var idProyVal = selProy ? selProy.value : '';
        var idHitoVal = selHito ? selHito.value : '';

        var mPEN = (mon === 'USD' || mon === 'EUR') ? (mOrig * tc) : mOrig;
        var mUSD = mon === 'USD' ? mOrig : (tc > 0 ? mOrig / tc : 0);

        var elEsProg = document.getElementById('gasto-es-programado');
        var esProgramado = elEsProg ? (elEsProg.value === 'true') : false;
        var elAgendar = document.getElementById('gasto-agendar-calendar');
        var agendarCalendar = elAgendar ? elAgendar.checked : true;
        var elHora = document.getElementById('gasto-hora');
        var horaProgramada = elHora ? elHora.value : '09:00';
        var elFrec = document.getElementById('gasto-frecuencia');
        var frecuencia = elFrec ? elFrec.value : 'UNICA';
        var estadoPagoVal = esProgramado ? 'Programado' : 'Pagado';

        var elTipoGasto = document.getElementById('gasto-tipo-origen');
        var tipoGastoVal = elTipoGasto ? elTipoGasto.value : '';
        if (!tipoGastoVal) {
          tipoGastoVal = ((idProyVal && idProyVal !== 'PERSONAL') || (idTarVal && idTarVal.startsWith('TAR-')) || idHitoVal)
            ? 'Tarea Proyecto'
            : 'Actividad Personal';
        }

        var payload = {
          idProyecto: idProyVal,
          idHito: idHitoVal,
          idTarea: idTarVal,
          tipoGasto: tipoGastoVal,
          fechaGasto: fGastoVal,
          descripcionGasto: descVal,
          categoriaGasto: cat,
          monedaOriginal: mon,
          montoOriginal: mOrig,
          tipoCambio: tc,
          metodoPago: metodoVal,
          estadoPago: estadoPagoVal,
          esProgramado: esProgramado,
          agendarCalendar: agendarCalendar,
          horaProgramada: horaProgramada,
          frecuencia: frecuencia
        };

        // 1. OPTIMISTIC UI: Crear registro temporal e insertar al instante
        var tempId = 'GAS-TMP-' + Date.now();
        var tempGasto = {
          ID_Gasto: tempId,
          ID_Proyecto: idProyVal,
          ID_Hito: idHitoVal,
          ID_Tarea: idTarVal,
          Tipo_Gasto: tipoGastoVal,
          tipoGasto: tipoGastoVal,
          Fecha_Gasto: fGastoVal,
          Descripcion_Gasto: descVal,
          Categoria_Gasto: cat,
          Moneda_Original: mon,
          Monto_Original: mOrig,
          Tipo_Cambio: tc,
          Monto_PEN: mPEN,
          Monto_USD: mUSD,
          Metodo_Pago: metodoVal,
          Comprobante_URL: '',
          Estado_Pago: estadoPagoVal,
          Conciliado: !esProgramado,
          esProgramado: esProgramado,
          _isOptimistic: true
        };

        if (window.state && Array.isArray(state.gastos)) {
          state.gastos.unshift(tempGasto);
        }

        // 2. CERRAR MODAL AL INSTANTE (0ms)
        form.reset();
        closeModal('modal-gasto');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Registrar Gasto';
        }

        // 3. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
        if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
        if (state.proyectoDetalleActivo) {
          var idProyAct = String(state.proyectoDetalleActivo.ID_Proyecto || '').trim();
          if (typeof renderCascadaHitos === 'function') renderCascadaHitos(idProyAct);
          if (typeof actualizarBentoKPIsProyecto === 'function') {
            actualizarBentoKPIsProyecto(state.proyectoDetalleActivo);
          }
        }

        // 4. TOAST ESQUINERO OPERATIVO (Discreto, no bloqueante)
        var msgDetalle = descVal + ' (' + mon + ' ' + mOrig.toFixed(2) + (esProgramado ? ' - Vence: ' + fGastoVal : '') + ')';
        var tipoToast = esProgramado ? 'Gasto Programado' : 'Gasto';
        if (typeof notificarCreacion === 'function') {
          notificarCreacion(tipoToast, msgDetalle, 'm');
        } else if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('success', esProgramado ? '🗓️ Gasto Programado Registrado' : '⚡ Gasto Registrado Correctamente', msgDetalle);
        }

        // 5. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
        callBackend('createGasto', payload, function (res) {
          if (res && res.success) {
            if (res.idGasto) {
              tempGasto.ID_Gasto = res.idGasto;
            }
            tempGasto._isOptimistic = false;
            if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
          } else {
            if (window.state && Array.isArray(state.gastos)) {
              state.gastos = state.gastos.filter(function (g) { return g.ID_Gasto !== tempId; });
            }
            if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
            if (state.proyectoDetalleActivo && typeof renderCascadaHitos === 'function') {
              renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
            }
            if (typeof mostrarToastOperativo === 'function') {
              mostrarToastOperativo('error', 'Error al Registrar Gasto', (res && res.error) || 'No se pudo sincronizar.');
            }
          }
        }, function (err) {
          if (window.state && Array.isArray(state.gastos)) {
            state.gastos = state.gastos.filter(function (g) { return g.ID_Gasto !== tempId; });
          }
          if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
          if (state.proyectoDetalleActivo && typeof renderCascadaHitos === 'function') {
            renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
          }
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
          }
        }, { silent: true });
      });
    }

    // EDITAR GASTO - CRUD INSTANTÁNEO 60FPS
    var fEditGasto = document.getElementById('form-editar-gasto');
    if (fEditGasto) {
      fEditGasto.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-submit-edit-gasto');

        var elId = document.getElementById('edit-gasto-id');
        var elMonto = document.getElementById('edit-gasto-monto');
        var elTc = document.getElementById('edit-gasto-tc');
        var elCat = document.getElementById('edit-gasto-categoria');
        var elDesc = document.getElementById('edit-gasto-desc');
        var elTarea = document.getElementById('edit-gasto-tarea');
        var elEditTipo = document.getElementById('edit-gasto-tipo');

        var idGasto = elId ? elId.value : '';
        var mOrig = elMonto ? parseFloat(elMonto.value) || 0 : 0;
        var tc = elTc ? parseFloat(elTc.value) || 1.0 : 1.0;
        var cat = elCat ? elCat.value : 'Materiales';
        var desc = elDesc ? elDesc.value.trim() : '';
        var idTarea = elTarea ? elTarea.value : '';
        var editTipoVal = elEditTipo ? elEditTipo.value : '';

        var payload = {
          idGasto: idGasto,
          descripcionGasto: desc,
          categoriaGasto: cat,
          montoOriginal: mOrig,
          tipoCambio: tc,
          idTarea: idTarea,
          tipoGasto: editTipoVal
        };

        // 1. OPTIMISTIC UI: Mutación directa con backup
        var gLocal = null;
        var backupGasto = null;
        if (window.state && Array.isArray(state.gastos)) {
          gLocal = state.gastos.find(function (x) {
            var xId = x.ID_Gasto || x.id || '';
            return String(xId).trim() === String(idGasto).trim();
          });

          if (gLocal) {
            backupGasto = Object.assign({}, gLocal);
            gLocal.Descripcion_Gasto = desc;
            gLocal.Categoria_Gasto = cat;
            gLocal.Monto_Original = mOrig;
            gLocal.Tipo_Cambio = tc;
            gLocal.Monto_PEN = mOrig * tc;
            gLocal.ID_Tarea = idTarea;
            if (editTipoVal) {
              gLocal.Tipo_Gasto = editTipoVal;
              gLocal.tipoGasto = editTipoVal;
            }
          }
        }

        // 2. CERRAR MODAL AL INSTANTE (0ms)
        closeModal('modal-editar-gasto');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Guardar Cambios';
        }

        // 3. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
        if (typeof recalcularGastoVisible === 'function') recalcularGastoVisible();
        if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
        if (state.proyectoDetalleActivo) {
          var idProyAct = String(state.proyectoDetalleActivo.ID_Proyecto || '').trim();
          if (typeof renderCascadaHitos === 'function') renderCascadaHitos(idProyAct);
          if (typeof actualizarBentoKPIsProyecto === 'function') {
            actualizarBentoKPIsProyecto(state.proyectoDetalleActivo);
          }
        }

        // 4. TOAST ESQUINERO OPERATIVO
        if (typeof notificarModificacion === 'function') {
          notificarModificacion('Gasto', desc + ' (' + mOrig.toFixed(2) + ')', 'm');
        } else if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('info', 'Gasto actualizado correctamente', desc + ' (' + mOrig.toFixed(2) + ')');
        }

        // 5. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
        callBackend('updateGasto', payload, function (res) {
          if (!res || !res.success) {
            if (gLocal && backupGasto) Object.assign(gLocal, backupGasto);
            if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
            if (typeof mostrarToastOperativo === 'function') {
              mostrarToastOperativo('error', 'Error al Actualizar', (res && res.error) || 'No se guardaron los cambios.');
            }
          }
        }, function (err) {
          if (gLocal && backupGasto) Object.assign(gLocal, backupGasto);
          if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
          }
        }, { silent: true });
      });
    }

    // FORMULARIO: CREAR INGRESO CON OPTIMISTIC UI 60FPS
    var formIngreso = document.getElementById('form-create-ingreso');
    if (formIngreso) {
      formIngreso.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-submit-ingreso');

        var formData = new FormData(formIngreso);
        var payload = Object.fromEntries(formData.entries());

        var elEsProg = document.getElementById('ingreso-es-programado');
        var esProgramado = elEsProg ? (elEsProg.value === 'true') : false;
        var elAgendar = document.getElementById('ingreso-agendar-calendar');
        var agendarCalendar = elAgendar ? elAgendar.checked : true;
        var elHora = document.getElementById('ingreso-hora');
        var horaProgramada = elHora ? elHora.value : '09:00';
        var elFrec = document.getElementById('ingreso-frecuencia');
        var frecuencia = elFrec ? elFrec.value : 'UNICA';
        var estadoCobroVal = esProgramado ? 'Programado' : 'Cobrado';

        payload.esProgramado = esProgramado;
        payload.agendarCalendar = agendarCalendar;
        payload.horaProgramada = horaProgramada;
        payload.frecuencia = frecuencia;
        payload.estadoCobro = estadoCobroVal;

        var mOrig = parseFloat(payload.montoOriginal) || 0;
        var tc = parseFloat(payload.tipoCambio) || 1.0;
        var mon = payload.monedaOriginal || 'PEN';
        var mPEN = (mon === 'USD' || mon === 'EUR') ? (mOrig * tc) : mOrig;

        // 1. OPTIMISTIC UI: Crear ingreso temporal en state con los 12 campos canónicos
        var tempId = 'ING-TMP-' + Date.now();
        var idProyVal = payload.idProyectoAsociado || 'PERSONAL';
        var tipoOrigenVal = (idProyVal && idProyVal.toUpperCase() !== 'PERSONAL' && idProyVal.toUpperCase() !== 'NINGUNO') ? 'PROYECTO' : 'LIBRE_CORRIENTE';
        var idOrigenVincVal = (tipoOrigenVal === 'PROYECTO') ? idProyVal : 'NINGUNO';
        var metCobroVal = payload.cuentaDestino || 'BCP';
        var catIngVal = payload.origenFuente || 'Otros';
        var descIngVal = payload.descripcion || 'Ingreso';

        var tempIngreso = {
          ID_Ingreso: tempId,
          idIngreso: tempId,
          ID_Transaccion: tempId,
          Tipo_Origen: tipoOrigenVal,
          tipoOrigen: tipoOrigenVal,
          Clasificacion_Origen: tipoOrigenVal,
          ID_Origen_Vinculado: idOrigenVincVal,
          idOrigenVinculado: idOrigenVincVal,
          ID_Proyecto_Asociado: idProyVal,
          ID_Proyecto: idProyVal,
          Fecha_Ingreso: payload.fechaIngreso || new Date().toISOString().split('T')[0],
          fechaIngreso: payload.fechaIngreso || new Date().toISOString().split('T')[0],
          Descripcion_Ingreso: descIngVal,
          descripcionIngreso: descIngVal,
          Descripcion: descIngVal,
          descripcion: descIngVal,
          Concepto: descIngVal,
          Categoria_Ingreso: catIngVal,
          categoriaIngreso: catIngVal,
          Categoria: catIngVal,
          Origen_Fuente: catIngVal,
          origenFuente: catIngVal,
          Moneda_Original: mon,
          monedaOriginal: mon,
          Monto_Original: mOrig,
          montoOriginal: mOrig,
          Tipo_Cambio: tc,
          tipoCambio: tc,
          Monto_PEN: mPEN,
          montoPEN: mPEN,
          Metodo_Cobro: metCobroVal,
          metodoCobro: metCobroVal,
          Metodo_Pago: metCobroVal,
          Cuenta_Destino: metCobroVal,
          cuentaDestino: metCobroVal,
          Estado_Cobro: estadoCobroVal,
          estadoCobro: estadoCobroVal,
          Estado: estadoCobroVal,
          Conciliado: !esProgramado,
          esProgramado: esProgramado,
          _isOptimistic: true
        };

        if (window.state && Array.isArray(state.ingresos)) {
          state.ingresos.unshift(tempIngreso);
        }

        // 2. CERRAR MODAL AL INSTANTE (0ms)
        formIngreso.reset();
        closeModal('modal-ingreso');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Registrar Ingreso';
        }

        // 3. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();

        // 4. TOAST ESQUINERO OPERATIVO (Discreto, no bloqueante)
        var msgDetalleIng = (payload.descripcion || 'Ingreso') + ' (' + mon + ' ' + mOrig.toFixed(2) + (esProgramado ? ' - Cobro: ' + (payload.fechaIngreso || '') : '') + ')';
        var tipoToastIng = esProgramado ? 'Ingreso Programado' : 'Ingreso';
        if (typeof notificarCreacion === 'function') {
          notificarCreacion(tipoToastIng, msgDetalleIng, 'm');
        } else if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('success', esProgramado ? '🗓️ Ingreso Programado Registrado' : '⚡ Ingreso Registrado Correctamente', msgDetalleIng);
        }

        // 5. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
        callBackend('createIngreso', payload, function (res) {
          if (res && res.success) {
            if (res.idIngreso) {
              tempIngreso.ID_Ingreso = res.idIngreso;
            }
            tempIngreso._isOptimistic = false;
            if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
          } else {
            if (window.state && Array.isArray(state.ingresos)) {
              state.ingresos = state.ingresos.filter(function (i) { return i.ID_Ingreso !== tempId; });
            }
            if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
            if (typeof mostrarToastOperativo === 'function') {
              mostrarToastOperativo('error', 'Error al Guardar', (res && res.error) || 'No se pudo registrar el ingreso.');
            }
          }
        }, function (err) {
          if (window.state && Array.isArray(state.ingresos)) {
            state.ingresos = state.ingresos.filter(function (i) { return i.ID_Ingreso !== tempId; });
          }
          if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
          }
        }, { silent: true });
      });
    }

    // CREAR HITO - CRUD INSTANTÁNEO 60FPS
    var fHito = document.getElementById('form-create-hito');
    if (fHito) {
      fHito.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-submit-hito');

        var idProyHito = document.getElementById('hito-idProyecto') ? document.getElementById('hito-idProyecto').value : '';
        var nomHito = document.getElementById('hito-nombre') ? document.getElementById('hito-nombre').value.trim() : '';

        if (!nomHito) {
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('warning', 'Nombre Requerido', 'Por favor ingresa un nombre para el hito.');
          }
          var inHito = document.getElementById('hito-nombre');
          if (inHito) inHito.focus();
          return;
        }

        var elTipo = document.getElementById('hito-tipoElementoWbs');
        var tipoElementoWbs = elTipo ? elTipo.value : 'PAQUETE_TRABAJO';
        var elFase = document.getElementById('hito-faseAsociada');
        var faseAsociada = (elFase && elFase.value.trim()) ? elFase.value.trim() : 'Fase 1: Entregables Principales';
        var elPres = document.getElementById('hito-presupuesto');
        var presupuestoAsignado = (tipoElementoWbs === 'PAQUETE_TRABAJO' && elPres) ? (parseFloat(elPres.value) || 0.0) : 0.0;
        var elDod = document.getElementById('hito-criterioDod');
        var criterioDod = elDod ? elDod.value.trim() : '';

        var payload = {
          idProyecto: idProyHito,
          tipoElementoWbs: tipoElementoWbs,
          nombreHito: nomHito,
          nombreElemento: nomHito,
          faseAsociada: faseAsociada,
          pesoPct: parseFloat(document.getElementById('hito-peso').value) || 0.20,
          fechaLimite: document.getElementById('hito-fechaLimite').value,
          presupuestoAsignado: presupuestoAsignado,
          criterioDod: criterioDod,
          estadoHito: '01_Pendiente'
        };

        // 1. OPTIMISTIC UI: Crear entregable temporal en memoria
        var tempPrefix = (tipoElementoWbs === 'PAQUETE_TRABAJO') ? 'TEMP-WP-' : 'TEMP-HIT-';
        var tempIdHito = tempPrefix + Date.now();
        var nuevoHitoLocal = {
          ID_Hito: tempIdHito,
          ID_Elemento_WBS: tempIdHito,
          ID_Proyecto: payload.idProyecto,
          Tipo_Elemento_WBS: tipoElementoWbs,
          Fase_Asociada: payload.faseAsociada,
          Nombre_Hito: payload.nombreHito,
          Nombre_Elemento: payload.nombreHito,
          Peso_Porcentual: payload.pesoPct,
          Peso_Ponderado_Pct: payload.pesoPct,
          Fecha_Limite: payload.fechaLimite,
          Fecha_Limite_Plan: payload.fechaLimite,
          Presupuesto_Asignado: payload.presupuestoAsignado,
          Criterio_Aceptacion_DoD: payload.criterioDod,
          Estado_Hito: '01_Pendiente',
          _isOptimistic: true
        };

        if (!state.hitos) state.hitos = [];
        state.hitos.push(nuevoHitoLocal);

        // 2. CERRAR MODAL AL INSTANTE (0ms)
        var formHitoEl = document.getElementById('form-create-hito');
        if (formHitoEl) formHitoEl.reset();
        closeModal('modal-hito');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Guardar Hito en BBDD';
        }

        // 3. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
        if (typeof renderCascadaHitos === 'function') {
          renderCascadaHitos(payload.idProyecto);
        }
        if (typeof centrarGrafoRed === 'function') {
          centrarGrafoRed();
        }
        if (typeof actualizarBentoKPIsProyecto === 'function') {
          actualizarBentoKPIsProyecto(payload.idProyecto);
        }
        if (typeof actualizarSelectorHitosKanban === 'function') {
          actualizarSelectorHitosKanban();
        }
        if (typeof aplicarFiltrosCruzados === 'function') {
          aplicarFiltrosCruzados();
        }

        // 4. TOAST ESQUINERO OPERATIVO (Discreto, no bloqueante)
        if (typeof notificarCreacion === 'function') {
          notificarCreacion('Hito', payload.nombreHito, 'm');
        } else if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('success', 'Hito creado correctamente', payload.nombreHito);
        }

        // 5. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
        callBackend('createHito', payload, function (res) {
          if (res && res.success) {
            var realHito = res.data || {};
            var realId = realHito.ID_Hito || res.idHito;
            if (realId) {
              nuevoHitoLocal.ID_Hito = realId;
              nuevoHitoLocal._isOptimistic = false;
              if (realHito.ID_Proyecto) nuevoHitoLocal.ID_Proyecto = realHito.ID_Proyecto;

  /**
   * Cierra todos los modales y el drawer lateral activos, reseteando formularios
   * y desbloqueando el scroll.
   * @returns {boolean} true si se cerró al menos un modal o drawer.
   */
  function cerrarTodosLosModalesActivos() {
    var modalIds = [
      'modal-tarea-flow',
      'modal-actividad-flow',
      'modal-gasto',
      'modal-editar-gasto',
      'modal-ingreso',
      'modal-plan-cuotas',
      'modal-conciliar-transaccion',
      'modal-editar-proyecto',
      'modal-hito',
      'modal-exportar-pdf',
      'modal-proyecto-wizard',
      'modal-editar-nota',
      'modal-vincular-entidad-nota',
      'modal-desglose-inversion-bienestar',
      'modal-atajos-teclado'
    ];
    var cerroAlguno = false;

    // 1. Cerrar Drawer lateral de finanzas si está desplegado
    var drawer = document.getElementById('drawer-detalle-transaccion');
    if (drawer && !drawer.classList.contains('translate-x-full')) {
      if (typeof window.cerrarDrawerDetalleTransaccion === 'function') {
        window.cerrarDrawerDetalleTransaccion();
        cerroAlguno = true;
      }
    }

    // 2. Cerrar modal de notas si estuviese abierto
    var modalNota = document.getElementById('modal-editar-nota');
    if (modalNota && !modalNota.classList.contains('hidden') && modalNota.style.display !== 'none') {
      if (typeof window.cerrarModalEditarNota === 'function') {
        window.cerrarModalEditarNota();
      } else {
        modalNota.classList.add('hidden');
      }
      cerroAlguno = true;
    }

    // 3. Cerrar cada modal abierto y resetear sus formularios internos
    modalIds.forEach(function (mId) {
      if (mId === 'modal-editar-nota') return;
      var m = document.getElementById(mId);
      if (m && !m.classList.contains('hidden') && m.style.display !== 'none') {
        closeModal(mId);
        cerroAlguno = true;
        try {
          var forms = m.querySelectorAll('form');
          forms.forEach(function (f) { f.reset(); });
        } catch (e) {
          console.warn('[ESC] Error reseteando formulario en ' + mId, e);
        }
      }
    });

    // 4. Cerrar modal de atajos de teclado si estuviese abierto
    var modalAtajos = document.getElementById('modal-atajos-teclado');
    if (modalAtajos && !modalAtajos.classList.contains('hidden')) {
      if (typeof cerrarModalAtajosTeclado === 'function') {
        cerrarModalAtajosTeclado();
        cerroAlguno = true;
      }
    }

    // 5. Remover bloqueos residuales de scroll
    document.body.classList.remove('overflow-hidden');

    return cerroAlguno;
  }

  /**
   * Disparador transversal de eliminación directa sin modales bloqueantes
   */
  function eliminarEntidadDirectoConDeshacer(tipo, idEntidad) {
    var tipoKey = String(tipo || '').toLowerCase().trim();
    var config = CONFIG_ENTIDADES_ELIMINACION[tipoKey];
    if (!config) {
      console.warn('[eliminarEntidadDirectoConDeshacer] Tipo no soportado:', tipo);
      return;
    }

    var idNorm = String(idEntidad || '').trim();
    if (!idNorm) return;

    var item = config.buscar(idNorm);
    if (!item) {
      console.warn('[eliminarEntidadDirectoConDeshacer] Elemento no encontrado en memoria previa, generando fallback:', tipoKey, idNorm);
      item = { ID_Tarea: idNorm, ID_Actividad: idNorm, ID_Proyecto: idNorm, ID_Hito: idNorm, ID_Gasto: idNorm, ID_Ingreso: idNorm, ID_Nota: idNorm };
    }

    var nombreItem = config.obtenerNombre(item, idNorm);
    var token = tipoKey + '_' + idNorm;

    // 1. Cerrar formularios o modales abiertos inmediatamente sin alert bloqueante
    config.cerrarModales(idNorm);

    // 2. Micro-animación de salida instantánea en el DOM (60 fps)
    config.animarDOM(idNorm);

    // 3. Capturar snapshot profundo para restauración
    var snapshot = config.capturarSnapshot(item, idNorm);

    // 4. Actualizar estado optimista en memoria al instante
    config.eliminarMemoria(idNorm, snapshot);

    // 4.1. Sincronizar inmediatamente en localStorage para prevenir efecto fantasma al recargar (F5)
    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    }

    // 5. Re-renderizar vistas y contadores al milisegundo
    config.reRender();

    // 6. Si ya existía una eliminación pendiente previa para este token, consolidarla de inmediato
    if (pendingDeletionsGlobal[token]) {
      clearTimeout(pendingDeletionsGlobal[token].timer);
      ejecutarConsolidacionGlobal(token);
    }

    // 7. Configurar ventana estricta de 4.5 segundos para Deshacer
    var timer = setTimeout(function () {
      ejecutarConsolidacionGlobal(token);
    }, 4500);

    pendingDeletionsGlobal[token] = {
      token: token,
      tipo: tipoKey,
      id: idNorm,
      nombre: nombreItem,
      timer: timer,
      snapshot: snapshot,
      config: config
    };

    // 8. Mostrar Toast flotante esquinero con botón Deshacer (Undo 4.5s)
    mostrarToastDeshacerGlobal(token, tipoKey, nombreItem);
  }

  /**
   * Renderiza el Toast flotante esquinero discreto con acción Deshacer (4.5s)
   */
  function mostrarToastDeshacerGlobal(token, tipoKey, nombreItem) {
    var config = CONFIG_ENTIDADES_ELIMINACION[tipoKey];
    if (!config) return;

    // 1. Obtener o crear Contenedor Maestro Fijo montado directamente en document.body
    var cont = document.getElementById('undo-toast-container');
    if (!cont) {
      cont = document.getElementById('toast-undo-global-container') ||
        document.getElementById('toast-undo-habito-container');
    }
    if (!cont || !cont.parentElement) {
      cont = document.createElement('div');
      cont.id = 'undo-toast-container';
      cont.className = 'fixed bottom-5 right-5 z-[99999] flex flex-col gap-2.5 pointer-events-auto max-w-sm w-full px-4 sm:px-0';
      cont.style.cssText = 'position: fixed !important; bottom: 20px !important; right: 20px !important; z-index: 99999 !important; pointer-events: auto !important;';
      document.body.appendChild(cont);
    } else if (cont.parentElement !== document.body) {
      document.body.appendChild(cont);
    }

    // 2. Si ya existía un toast para este token, removerlo limpiamente
    var oldToast = document.getElementById('toast-undo-' + token);
    if (oldToast) oldToast.remove();

    var esFemenino = config.genero === 'f';
    var tituloAccion = config.singular + (esFemenino ? ' eliminada' : ' eliminado');
    var nombreSeguro = safeEscapeHtml(nombreItem);

    // 3. Crear nodo de Toast garantizando visibilidad inmediata (sin opacity-0 ni transiciones bloqueantes)
    var toast = document.createElement('div');
    toast.id = 'toast-undo-' + token;
    toast.className = 'toast-undo-item pointer-events-auto relative overflow-hidden bg-slate-900/95 dark:bg-slate-800/95 text-white shadow-2xl rounded-2xl border border-slate-700/70 p-3.5 flex items-center justify-between gap-3 backdrop-blur-md select-none';
    toast.style.cssText = 'display: flex !important; opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;';

    toast.innerHTML =
      '<div class="flex items-center gap-2.5 min-w-0">' +
      '<div class="w-8 h-8 rounded-xl ' + config.colorBadge + ' flex items-center justify-center shrink-0">' +
      config.iconoSvg +
      '</div>' +
      '<div class="flex flex-col min-w-0">' +
      '<span class="text-xs font-bold text-white tracking-tight leading-tight">' + tituloAccion + '</span>' +
      '<span class="text-[11px] text-slate-300 truncate max-w-[150px] sm:max-w-[190px]" title="' + nombreSeguro + '">' + nombreSeguro + '</span>' +
      '</div>' +
      '</div>' +
      '<div class="flex items-center gap-1.5 shrink-0">' +
      '<button type="button" onclick="deshacerEliminacionGlobal(\'' + token + '\')"' +

  /**

   */
  function cerrarToastDeshacerGlobal(token) {

    if (!toast) return;

  /**
   * Deshacer eliminación: restaura al instante en memoria y DOM
   */
  function deshacerEliminacionGlobal(token) {
    var pending = pendingDeletionsGlobal[token];
    if (!pending) return;

    clearTimeout(pending.timer);
    delete pendingDeletionsGlobal[token];
    cerrarToastDeshacerGlobal(token);

    var config = pending.config;
    config.restaurarMemoria(pending.snapshot);
    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    }
    config.reRender();

    var esFemenino = config.genero === 'f';
    if (typeof notificarRestauracion === 'function') {
      notificarRestauracion(config.singular, pending.nombre || '', config.genero);
    } else if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo('↺ ' + config.singular + (esFemenino ? ' restaurada' : ' restaurado'));
    }
  }

  /**
   * Consolidar borrado remoto silencioso tras el vencimiento de la ventana de 'Deshacer'
   */
  function ejecutarConsolidacionGlobal(token) {
    var pending = pendingDeletionsGlobal[token];
    if (!pending) return;

    clearTimeout(pending.timer);
    delete pendingDeletionsGlobal[token];
    cerrarToastDeshacerGlobal(token);

    var config = pending.config;
    config.ejecutarBackend(pending.id, function (res) {
      if (res && (res.success === true || res.success === 'true')) {
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        }
      } else {
        var motivo = (res && res.error) ? res.error : 'Error del sistema';
        console.warn('[Fallo en eliminación remota]:', pending.tipo, pending.id, res);
        config.restaurarMemoria(pending.snapshot);
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        }
        config.reRender();
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'No se pudo eliminar ' + config.singular.toLowerCase(),
            text: 'El servidor reportó un error: ' + motivo + '. El elemento ha sido restaurado.',
            confirmButtonColor: '#4f46e5'
          });
        }
      }
    }, function (err) {
      var motivoNet = (err && err.message) ? err.message : String(err || 'Fallo de conexión');
      console.warn('[Fallo de red en eliminación remota]:', err);
      config.restaurarMemoria(pending.snapshot);
      if (typeof window.sincronizarCacheLocalState === 'function') {
        window.sincronizarCacheLocalState();
      }
      config.reRender();
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'error',
          title: 'Error de comunicación',
          text: 'No se pudo contactar al servidor: ' + motivoNet + '. Se ha restaurado ' + config.singular.toLowerCase() + '.',
          confirmButtonColor: '#4f46e5'
        });
      }
    });
  }

  function openModal(id) {
    var el = document.getElementById(id);
    if (!el) return;

    if (el.parentElement !== document.body) {
      document.body.appendChild(el);

    el.classList.remove('hidden');
    el.classList.add('flex');
    el.style.display = 'flex';
    el.style.zIndex = '9999';
    el.style.position = 'fixed';
    el.style.inset = '0';

    // Animación fluida de escala y opacidad en el contenedor interno del modal
    var modalBox = el.querySelector(':scope > div');
    if (modalBox) {
      modalBox.classList.remove('modal-animate-enter');
      void modalBox.offsetWidth; // Forzar reflujo para reiniciar la animación
      modalBox.classList.add('modal-animate-enter');
    }
  }

      // 1. Badge Kanban: cantidad de tareas/actividades pendientes con fecha de Hoy o en curso
      if (badgeKanban) {
        var now = new Date();
        var y = now.getFullYear();
        var m = (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);

          var col = normalizarEstadoTarea(t.Estado_Tarea);
          if (col === '04_Completado') return false;
          var f = t.Fecha_Programada ? String(t.Fecha_Programada).split('T')[0].split(' ')[0] : '';
          return f === hoyStr || col === '03_En_Proceso';
        }).length;

        var actHoy = (currState.actividadesPersonales || []).filter(function (a) {
          var col = normalizarEstadoTarea(a.Estado || a.Estado_Tarea);
          if (col === '04_Completado') return false;

          var esDiaria = (String(a.Tipo_Compromiso || '').toUpperCase() === 'HABITUAL' && (String(a.Frecuencia_Ciclo || '').toUpperCase() === 'DIARIA' || !a.Frecuencia_Ciclo));
          return f === hoyStr || esDiaria || col === '03_En_Proceso';
        }).length;

        var totalHoy = tareasHoy + actHoy;
        if (totalHoy > 0) {
          badgeKanban.textContent = totalHoy;
          badgeKanban.classList.remove('hidden');
        } else {
          badgeKanban.classList.add('hidden');

      // 2. Badge Portafolio: indicador discreto si existen proyectos con Health Status crítico
      if (badgePortafolio) {
        var proyCriticos = (currState.proyectos || []).filter(function (p) {
          var h = String(p.Health_Status || '').toLowerCase();
          return h.indexOf('🔴') !== -1 || h.indexOf('bloqueado') !== -1 || h.indexOf('crítico') !== -1 || h.indexOf('critico') !== -1 || h.indexOf('riesgo') !== -1;
        }).length;

        if (proyCriticos > 0) {
          badgePortafolio.textContent = proyCriticos;
          badgePortafolio.classList.remove('hidden');
        } else {
          badgePortafolio.classList.add('hidden');
        }
      }

      // 3. Badge Notas: total de notas registradas
      var badgeNotas = document.getElementById('badge-header-notas') || document.getElementById('badge-count-notas');
      if (badgeNotas) {
        var numNotas = Array.isArray(currState.notas) ? currState.notas.length : 0;
        badgeNotas.textContent = numNotas;
        badgeNotas.classList.toggle('hidden', numNotas === 0);
      }
    }

  /**
   * Identifica el ámbito contextual activo según el DOM y el estado de la app
   * @returns {'global'|'kanban'|'portafolio'|'habitos'|'finanzas'|'notas'}
   */
  function getActiveScope() {
    var v = (window.state && state.vistaActual) ? String(state.vistaActual).toLowerCase() : '';
    if (v === 'portafolio' || v === 'detalle') return 'portafolio';
    if (v === 'habitos' || v === 'vida') return 'habitos';
    if (v === 'financiero' || v === 'finanzas' || v === 'financiera') return 'finanzas';
    if (v === 'notas') return 'notas';
    return 'kanban';
  }
  window.getActiveScope = getActiveScope;

  /**
   * Inicializa y carga la configuración de atajos desde localStorage (V3 con fallback a defaults)
   */
  function initShortcuts() {
    try {
      var savedEnabled = localStorage.getItem('pmo_shortcuts_enabled');
      stateShortcuts.enabled = (savedEnabled !== 'false');

      var chk = document.getElementById('chk-shortcuts-toggle');
      if (chk) chk.checked = stateShortcuts.enabled;

      // Cargar esquema V4 estructurado con navegación canónica 1-5 restaurada
      var rawV4 = localStorage.getItem('SISTEMA_ATAJOS_MAP_V4');
      var parsedV4 = null;
      if (rawV4) {
        try {
          parsedV4 = JSON.parse(rawV4);
        } catch (e) {
          parsedV4 = null;
        }
      }

      stateShortcuts.shortcuts = {};

      if (parsedV4 && typeof parsedV4 === 'object' && parsedV4.shortcuts) {
        if (parsedV4.modalActiveTab) {
          stateShortcuts.modalActiveTab = parsedV4.modalActiveTab;
        }
        Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
          var val = parsedV4.shortcuts[actId];
          stateShortcuts.shortcuts[actId] = (typeof val === 'string' && val.trim() !== '')
            ? val
            : DEFAULT_SCOPED_SHORTCUTS[actId].key;
        });
      } else {
        // Cargar esquema canónico inicial con navegación 1-5 restaurada
        Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
          stateShortcuts.shortcuts[actId] = DEFAULT_SCOPED_SHORTCUTS[actId].key;
        });
        saveKeyboardShortcuts();
      }
    } catch (err) {
      console.error('[Shortcuts init err]:', err);
    }
  }

  /**
   * Persiste la configuración actual de atajos en localStorage bajo SISTEMA_ATAJOS_MAP_V4
   */
  function saveKeyboardShortcuts() {
    try {
      var payload = {
        version: 4,
        enabled: stateShortcuts.enabled,
        modalActiveTab: stateShortcuts.modalActiveTab || 'global',
        shortcuts: stateShortcuts.shortcuts
      };
      localStorage.setItem('SISTEMA_ATAJOS_MAP_V4', JSON.stringify(payload));
      localStorage.setItem('pmo_shortcuts_enabled', stateShortcuts.enabled ? 'true' : 'false');
    } catch (e) {
      console.warn('[saveKeyboardShortcuts warn]:', e);
    }
  }

  function toggleShortcutsMaster(activo) {
    stateShortcuts.enabled = !!activo;
    saveKeyboardShortcuts();
    mostrarToastAtajo(stateShortcuts.enabled ? '⌨️ Atajos activados' : '⏸️ Atajos desactivados');
  }

  function formatKeyDisplay(k) {
    if (!k && k !== 0) return '—';
    var str = String(k);
    if (str === ' ') return 'Espacio';
    if (str === 'Escape') return 'Esc';
    if (str === 'ArrowUp') return '↑';
    if (str === 'ArrowDown') return '↓';
    if (str === 'ArrowLeft') return '←';
    if (str === 'ArrowRight') return '→';
    return str.toUpperCase();
  }

  function isTypingTarget(target) {
    if (!target) return false;
    var tag = target.tagName ? target.tagName.toUpperCase() : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (target.isContentEditable) return true;
    return false;
  }

  var timerToastAtajo = null;
  function mostrarToastAtajo(msg) {
    var toast = document.getElementById('toast-atajo-feedback');
    var txt = document.getElementById('toast-atajo-msg');
    if (!toast || !txt) return;

    txt.textContent = msg;
    toast.classList.remove('hidden');
    toast.classList.remove('translate-y-2', 'opacity-0');
    toast.classList.add('flex', 'translate-y-0', 'opacity-100');

    if (timerToastAtajo) clearTimeout(timerToastAtajo);
    timerToastAtajo = setTimeout(function () {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-2', 'opacity-0');
      setTimeout(function () {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 300);
    }, 1400);
  }

  /**
   * Ejecuta la acción primaria de confirmación (Guardar, Aceptar, Continuar)
   * en el modal, wizard o diálogo actualmente visible en pantalla (Atajo 'Enter').
   * @param {KeyboardEvent} [e]
   * @returns {boolean} true si se ejecutó alguna acción primaria.
   */
  function ejecutarAccionPrimariaModal(e) {
    try {
      // 1. Prioridad: Diálogo interactivo SweetAlert2
      if (typeof Swal !== 'undefined' && typeof Swal.isVisible === 'function' && Swal.isVisible()) {
        var btnConfirmSwal = Swal.getConfirmButton();
        if (btnConfirmSwal && !btnConfirmSwal.disabled && btnConfirmSwal.offsetParent !== null) {
          btnConfirmSwal.click();
          mostrarToastAtajo('↵ Confirmado');
          return true;
        }
      }

      // 2. Modales de Tarea y Actividad Flow (Prioridad Operativa)
      var modalTarFlow = document.getElementById('modal-tarea-flow');
      if (modalTarFlow && !modalTarFlow.classList.contains('hidden') && modalTarFlow.style.display !== 'none') {
        var btnSubmitTar = document.getElementById('task-flow-btn-submit');
        if (btnSubmitTar && !btnSubmitTar.disabled) {
          btnSubmitTar.click();
          mostrarToastAtajo('↵ Guardando Tarea...');
          return true;
        }
      }

      var modalActFlow = document.getElementById('modal-actividad-flow');
      if (modalActFlow && !modalActFlow.classList.contains('hidden') && modalActFlow.style.display !== 'none') {
        var btnSubmitAct = document.getElementById('btn-submit-flow-actividad');
        if (btnSubmitAct && !btnSubmitAct.disabled) {
          btnSubmitAct.click();
          mostrarToastAtajo('↵ Guardando Actividad...');
          return true;
        }
      }

      // 3. Modales de Finanzas (Gasto, Ingreso, Edición, Cuotas, Conciliación)
      var modalGasto = document.getElementById('modal-gasto');
      if (modalGasto && !modalGasto.classList.contains('hidden') && modalGasto.style.display !== 'none') {
        var btnGasto = document.getElementById('btn-submit-gasto');
        if (btnGasto && !btnGasto.disabled) {
          btnGasto.click();
          mostrarToastAtajo('↵ Registrando Gasto...');
          return true;
        }
      }

      var modalIngreso = document.getElementById('modal-ingreso');
      if (modalIngreso && !modalIngreso.classList.contains('hidden') && modalIngreso.style.display !== 'none') {
        var btnIngreso = document.getElementById('btn-submit-ingreso');
        if (btnIngreso && !btnIngreso.disabled) {
          btnIngreso.click();
          mostrarToastAtajo('↵ Registrando Ingreso...');
          return true;
        }
      }

      var modalEditGasto = document.getElementById('modal-editar-gasto');
      if (modalEditGasto && !modalEditGasto.classList.contains('hidden') && modalEditGasto.style.display !== 'none') {
        var btnEditG = document.getElementById('btn-submit-edit-gasto');
        if (btnEditG && !btnEditG.disabled) {
          btnEditG.click();
          mostrarToastAtajo('↵ Actualizando Gasto...');
          return true;
        }
      }

      var modalCuotas = document.getElementById('modal-plan-cuotas');
      if (modalCuotas && !modalCuotas.classList.contains('hidden') && modalCuotas.style.display !== 'none') {
        var btnCuotas = document.getElementById('btn-submit-plan-cuotas');
        if (btnCuotas && !btnCuotas.disabled) {
          btnCuotas.click();
          mostrarToastAtajo('↵ Guardando Cuotas...');
          return true;
        }
      }

      var modalConcil = document.getElementById('modal-conciliar-transaccion');
      if (modalConcil && !modalConcil.classList.contains('hidden') && modalConcil.style.display !== 'none') {
        var btnConcil = document.getElementById('btn-submit-conciliacion');
        if (btnConcil && !btnConcil.disabled) {
          btnConcil.click();
          mostrarToastAtajo('↵ Conciliando...');
          return true;
        }
      }

      // 5. Modal de Creación / Wizard de Proyectos con IA
      var modalWizProy = document.getElementById('modal-proyecto-wizard');
      if (modalWizProy && !modalWizProy.classList.contains('hidden') && modalWizProy.style.display !== 'none') {
        var btnWizGuardar = document.getElementById('btn-wiz-guardar-todo');
        if (btnWizGuardar && !btnWizGuardar.disabled) {
          btnWizGuardar.click();
          mostrarToastAtajo('↵ Guardando Proyecto...');
          return true;
        }
      }

      // 6. Modal de Edición de Proyecto / Hito
      var modalEditProy = document.getElementById('modal-editar-proyecto');
      if (modalEditProy && !modalEditProy.classList.contains('hidden') && modalEditProy.style.display !== 'none') {
        var btnEditP = document.getElementById('btn-submit-edit-proy');
        if (btnEditP && !btnEditP.disabled) {
          btnEditP.click();
          mostrarToastAtajo('↵ Guardando Proyecto...');
          return true;
        }
      }

      var modalHito = document.getElementById('modal-hito');
      if (modalHito && !modalHito.classList.contains('hidden') && modalHito.style.display !== 'none') {
        var btnHito = document.getElementById('btn-submit-hito');
        if (btnHito && !btnHito.disabled) {
          btnHito.click();
          mostrarToastAtajo('↵ Guardando Hito...');
          return true;
        }
      }

      // 7. Modal de Notas Inteligentes
      var modalNota = document.getElementById('modal-editar-nota');
      if (modalNota && !modalNota.classList.contains('hidden') && modalNota.style.display !== 'none') {
        if (typeof window.guardarNotaDesdeModal === 'function') {
          window.guardarNotaDesdeModal();
          mostrarToastAtajo('↵ Guardando Nota...');
          return true;
        }
      }

      // 8. Búsqueda genérica en cualquier modal activo
      var modalesActivos = document.querySelectorAll('.fixed.inset-0:not(.hidden), [role="dialog"]:not(.hidden)');
      for (var i = modalesActivos.length - 1; i >= 0; i--) {
        var mActivo = modalesActivos[i];
        if (mActivo.style.display === 'none') continue;
        if (mActivo.id === 'modal-atajos-teclado') continue;

        var btnPrimario = mActivo.querySelector('button[type="submit"]:not([disabled]), button.btn-primary:not([disabled]), button[id*="btn-submit"]:not([disabled]), button[id*="guardar"]:not([disabled])');
        if (btnPrimario && btnPrimario.offsetParent !== null) {
          btnPrimario.click();
          mostrarToastAtajo('↵ Acción Confirmada');
          return true;
        }
      }

      return false;
    } catch (errPrimario) {
      console.warn('[ejecutarAccionPrimariaModal] Error:', errPrimario);
      return false;
    }
  }
  window.ejecutarAccionPrimariaModal = ejecutarAccionPrimariaModal;

  /**
   * Despachador de ejecución de acciones asociadas a atajos
   */
  function ejecutarAccionAtajo(actionId, e) {
    switch (actionId) {
      // ----------------------------------------------------------------------
      // GLOBALES (NÚCLEO ESC, C, X, ENTER + AUXILIARES)
      // ----------------------------------------------------------------------
      case 'global_escape':
        // Manejado prioritariamente en keydown
        break;

      case 'global_calendar':
        if (document.getElementById('btn-header-calendar')) {
          document.getElementById('btn-header-calendar').click();
        } else {
          window.open('https://calendar.google.com/calendar/r', '_blank');
        }
        mostrarToastAtajo('📅 Abriendo Google Calendar...');
        break;

      case 'global_limpiar':
        limpiarFiltrosVistaActiva();
        break;

      case 'global_enter':
        ejecutarAccionPrimariaModal(e);
        break;

      case 'global_sync':
        refreshData();
        mostrarToastAtajo('🔄 Sincronizando datos...');
        break;

      case 'global_ayuda':
        if (e) e.preventDefault();
        abrirModalAtajosTeclado();
        break;

      case 'global_nav_kanban':
        cambiarVistaGlobal('kanban');
        mostrarToastAtajo('📊 Tablero Kanban');
        break;

      case 'global_nav_portafolio':
        cambiarVistaGlobal('portafolio');
        mostrarToastAtajo('📁 Portafolio');
        break;

      case 'global_nav_habitos':
        cambiarVistaGlobal('habitos');
        mostrarToastAtajo('🌱 Hábitos & Vida');
        break;

      case 'global_nav_finanzas':
        cambiarVistaGlobal('financiero');
        if (typeof window.renderTableroFinanciero === 'function') window.renderTableroFinanciero();
        mostrarToastAtajo('💰 Finanzas');
        break;

      case 'global_nav_notas':
        cambiarVistaGlobal('notas');
        if (typeof window.renderVistaNotas === 'function') window.renderVistaNotas();
        mostrarToastAtajo('📝 Notas Inteligentes');
        break;

      case 'global_tema':
        toggleTheme();
        mostrarToastAtajo('🌓 Tema cambiado');
        break;

      case 'global_buscar':
        if (e) e.preventDefault();
        enfocarBuscadorContextual();
        break;

      // ----------------------------------------------------------------------
      // TABLERO KANBAN
      // ----------------------------------------------------------------------
      case 'kanban_nueva_tarea':
        abrirModalCrearTareaKanban('02_Por_Hacer');
        break;

      case 'kanban_time_hoy':
        setKanbanTimeFilter('HOY');
        mostrarToastAtajo('⚡ Filtro: Hoy');
        break;

      case 'kanban_time_semana':
        setKanbanTimeFilter('SEMANA');
        mostrarToastAtajo('🗓️ Filtro: Esta Semana');
        break;

      case 'kanban_time_mes':
        setKanbanTimeFilter('MES');
        mostrarToastAtajo('📆 Filtro: Este Mes');
        break;

      case 'kanban_time_todo':
        setKanbanTimeFilter('TODO');
        mostrarToastAtajo('♾️ Filtro: Todo el Tiempo');
        break;

      case 'kanban_ctx_todos':
        setKanbanContextFilter('TODOS');
        mostrarToastAtajo('👥 Contexto: Todos');
        break;

      case 'kanban_ctx_proy':
        setKanbanContextFilter('PROYECTOS');
        mostrarToastAtajo('💼 Contexto: Proyectos');
        break;

      case 'kanban_ctx_pers':
        setKanbanContextFilter('PERSONAL');
        mostrarToastAtajo('👤 Contexto: Personal');
        break;

      case 'kanban_vencidas':
        var elP = document.getElementById('filter-plazo-tarea');
        if (elP) {
          elP.value = (elP.value === 'vencidas') ? '' : 'vencidas';
          if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
          mostrarToastAtajo(elP.value === 'vencidas' ? '🚨 Vencidas' : '📅 Plazo: Todos');
        }
        break;

      case 'kanban_buscar':
        if (e) e.preventDefault();
        if (state.vistaActual !== 'kanban') cambiarVistaGlobal('kanban');
        setTimeout(function () {
          var elB = document.getElementById('filter-buscar-tarea');
          if (elB) {
            elB.focus();
            elB.select();
            mostrarToastAtajo('🔍 Buscar Tareas');
          }
        }, 50);
        break;

      // ----------------------------------------------------------------------
      // PORTAFOLIO
      // ----------------------------------------------------------------------
      case 'portafolio_nuevo_proy':
        if (typeof abrirWizardProyecto === 'function') {
          abrirWizardProyecto();
        } else if (typeof openModal === 'function') {
          openModal('modal-proyecto-wizard');
        }
        break;

      case 'portafolio_abrir_360':
        var pId = (state.proyectoDetalleActivo && state.proyectoDetalleActivo.ID_Proyecto)
          ? state.proyectoDetalleActivo.ID_Proyecto
          : (state.selectedProjectId || (state.proyectos && state.proyectos[0] ? state.proyectos[0].ID_Proyecto : null));
        if (pId && typeof abrirDetalle360 === 'function') {
          abrirDetalle360(pId);
          mostrarToastAtajo('🎯 Vista 360° (' + pId + ')');
        } else {
          mostrarToastAtajo('ℹ️ Selecciona un proyecto para abrir 360°');
        }
        break;

      case 'portafolio_alternar_vista':
        var vActual = state.portfolioView || 'grid';
        var vNueva = (vActual === 'grid') ? 'table' : 'grid';
        if (typeof cambiarVistaPortafolio === 'function') {
          cambiarVistaPortafolio(vNueva);
          mostrarToastAtajo(vNueva === 'table' ? '📊 Vista Tabla' : '🔲 Vista Tarjetas');
        }
        break;

      case 'portafolio_colapsar_hitos':
        if (typeof toggleTodosLosHitos === 'function') {
          toggleTodosLosHitos();
          mostrarToastAtajo('📂 Hitos expandidos/colapsados');
        } else {
          mostrarToastAtajo('ℹ️ Disponible en Vista 360°');
        }
        break;

      case 'portafolio_buscar':
        if (e) e.preventDefault();
        var elSearch = document.getElementById('portafolio-search') || document.getElementById('sidebar-search-proyectos');
        if (elSearch) {
          elSearch.focus();
          elSearch.select();
          mostrarToastAtajo('🔍 Buscar Proyecto');
        }
        break;

      // ----------------------------------------------------------------------
      // HÁBITOS & VIDA
      // ----------------------------------------------------------------------
      case 'habitos_nueva_actividad':
        if (typeof abrirModalCrearActividadPersonalPorCategoria === 'function') {
          abrirModalCrearActividadPersonalPorCategoria('SALUD_DEPORTE');
        }
        break;

      case 'habitos_alternar_frecuencia':
        var frecs = ['TODOS', 'HABITUAL', 'UNICO', 'RACHA'];
        var actFrec = state.filtroTipoHabito || 'TODOS';
        var nextFrec = frecs[(frecs.indexOf(actFrec) + 1) % frecs.length];
        if (typeof filtrarTipoActividadPersonal === 'function') {
          filtrarTipoActividadPersonal(nextFrec);
          var labels = { 'TODOS': '✨ Todos', 'HABITUAL': '🔁 Recurrentes', 'UNICO': '⚡ Metas Únicas', 'RACHA': '🔥 En Racha' };
          mostrarToastAtajo('🌱 Hábitos: ' + (labels[nextFrec] || nextFrec));
        }
        break;

      case 'habitos_desglose':
        if (typeof abrirModalDesgloseInversionBienestar === 'function') {
          abrirModalDesgloseInversionBienestar();
          mostrarToastAtajo('🧘 Desglose Inversión en Bienestar');
        }
        break;

      case 'habitos_marcar_racha':
        if (typeof filtrarTipoActividadPersonal === 'function') {
          var actF = state.filtroTipoHabito || 'TODOS';
          var nF = (actF === 'RACHA') ? 'TODOS' : 'RACHA';
          filtrarTipoActividadPersonal(nF);
          mostrarToastAtajo(nF === 'RACHA' ? '🔥 Solo en Racha' : '✨ Todos los hábitos');
        }
        break;

      case 'habitos_buscar':
        if (e) e.preventDefault();
        var elHSearch = document.getElementById('filtro-buscar-habito');
        if (elHSearch) {
          elHSearch.focus();
          elHSearch.select();
          mostrarToastAtajo('🔍 Buscar Hábito');
        }
        break;

      // ----------------------------------------------------------------------
      // FINANZAS
      // ----------------------------------------------------------------------
      case 'finanzas_nuevo_gasto':
        if (typeof abrirModalCrearGasto === 'function') {
          abrirModalCrearGasto();
        }
        break;

      case 'finanzas_nuevo_ingreso':
        if (typeof abrirModalCrearIngreso === 'function') {
          abrirModalCrearIngreso();
        }
        break;

      case 'finanzas_seg_todos':
        if (typeof filtrarSegmentoFinanzas === 'function') {
          filtrarSegmentoFinanzas('TODOS');
          mostrarToastAtajo('🌐 Finanzas: Segmento Todos');
        }
        break;

      case 'finanzas_seg_proy':
        if (typeof filtrarSegmentoFinanzas === 'function') {
          filtrarSegmentoFinanzas('PROYECTOS');
          mostrarToastAtajo('📁 Finanzas: Solo Proyectos');
        }
        break;

      case 'finanzas_seg_pers':
        if (typeof filtrarSegmentoFinanzas === 'function') {
          filtrarSegmentoFinanzas('PERSONAL');
          mostrarToastAtajo('👤 Finanzas: Solo Personal');
        }
        break;

      case 'finanzas_alternar_tab':
        var fTabs = ['general', 'ingresos', 'gastos', 'presupuesto'];
        var cTab = state.activeFinTab || 'general';
        var nTab = fTabs[(fTabs.indexOf(cTab) + 1) % fTabs.length];
        if (typeof cambiarTabFinanzas === 'function') {
          cambiarTabFinanzas(nTab);
          state.activeFinTab = nTab;
          mostrarToastAtajo('💰 Finanzas: ' + nTab.toUpperCase());
        }
        break;

      case 'finanzas_alternar_periodo':
        var elMes = document.getElementById('filtro-mes-finanzas');
        if (elMes) {
          var periodos = ['MES_ACTUAL', 'MES_ANTERIOR', 'TODOS'];
          var pIdx = periodos.indexOf(elMes.value);
          var nextP = periodos[(pIdx + 1) % periodos.length];
          elMes.value = nextP;
          if (typeof cambiarFiltroMesFinanzas === 'function') {
            cambiarFiltroMesFinanzas(nextP);
          }
          var labelsP = { 'MES_ACTUAL': 'Mes Actual', 'MES_ANTERIOR': 'Mes Anterior', 'TODOS': 'Todos los Periodos' };
          mostrarToastAtajo('📆 Finanzas: ' + (labelsP[nextP] || nextP));
        }
        break;

      case 'finanzas_buscar':
        if (e) e.preventDefault();
        var elFSearch = document.getElementById('input-busqueda-finanzas');
        if (elFSearch) {
          elFSearch.focus();
          elFSearch.select();
          mostrarToastAtajo('🔍 Buscar en Finanzas');
        }
        break;

      // ----------------------------------------------------------------------
      // NOTAS INTELIGENTES
      // ----------------------------------------------------------------------
      case 'notas_nueva_nota':
        if (typeof abrirModalNuevaNota === 'function') {
          abrirModalNuevaNota();
        }
        break;

      case 'notas_filtro_fijadas':
        var nuevoF = (state.filtroRapidoNotas === 'FIJADAS') ? 'TODAS' : 'FIJADAS';
        if (typeof setFiltroRapidoNotas === 'function') {
          setFiltroRapidoNotas(nuevoF);
          mostrarToastAtajo(nuevoF === 'FIJADAS' ? '📌 Solo Notas Fijadas' : '✨ Todas las Notas');
        }
        break;

      case 'notas_filtro_checklists':
        var nuevoC = (state.filtroRapidoNotas === 'CHECKLIST') ? 'TODAS' : 'CHECKLIST';
        if (typeof setFiltroRapidoNotas === 'function') {
          setFiltroRapidoNotas(nuevoC);
          mostrarToastAtajo(nuevoC === 'CHECKLIST' ? '📋 Solo Checklists' : '✨ Todas las Notas');
        }
        break;

      case 'notas_alternar_modo':
        var nuevoM = (state.modoVistaNotas === 'masonry') ? 'list' : 'masonry';
        if (typeof setModoVistaNotas === 'function') {
          setModoVistaNotas(nuevoM);
          mostrarToastAtajo(nuevoM === 'masonry' ? '🔲 Vista Mosaico' : '📄 Vista Lista');
        }
        break;

      case 'notas_buscar':
        if (e) e.preventDefault();
        var elNSearch = document.getElementById('input-busqueda-notas');
        if (elNSearch) {
          elNSearch.focus();
          elNSearch.select();
          mostrarToastAtajo('🔍 Buscar Notas');
        }
        break;
    }
  }

  /**
   * Abre el modal de configuración de atajos y sincroniza con el scope de la vista activa
   */
  function abrirModalAtajosTeclado() {
    var scopeActual = getActiveScope();
    stateShortcuts.modalActiveTab = scopeActual || 'global';
    cambiarTabModalAtajos(stateShortcuts.modalActiveTab);
    openModal('modal-atajos-teclado');
  }

  function cerrarModalAtajosTeclado() {
    cancelarGrabacionAtajo();
    closeModal('modal-atajos-teclado');
  }

  /**
   * Cambia la pestaña activa del configurador de atajos
   */
  function cambiarTabModalAtajos(scopeId) {
    if (!scopeId) scopeId = 'global';
    stateShortcuts.modalActiveTab = scopeId;
    cancelarGrabacionAtajo();

    // Actualizar estilos visuales de botones de pestañas
    SCOPES_ATAJOS.forEach(function (sc) {
      var btn = document.getElementById('tab-btn-atajos-' + sc.id);
      if (btn) {
        if (sc.id === scopeId) {
          btn.className = 'tab-atajo-btn px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 transition-all bg-indigo-600 text-white shadow-xs';
        } else {
          btn.className = 'tab-atajo-btn px-3 py-1.5 rounded-xl font-semibold text-xs flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800';
        }
      }
    });

    // Actualizar texto del botón de restablecer en el footer
    var lblPestana = document.getElementById('lbl-restablecer-pestana');
    if (lblPestana) {
      var infoScope = SCOPES_ATAJOS.find(function (s) { return s.id === scopeId; });
      lblPestana.textContent = 'Restablecer ' + (infoScope ? infoScope.label : 'pestaña');
    }

    renderListaAtajos();
    saveKeyboardShortcuts();
  }

  /**
   * Renderiza el listado interactivo de atajos filtrado por la pestaña seleccionada
   */
  function renderListaAtajos() {
    var contenedor = document.getElementById('contenedor-lista-atajos');
    if (!contenedor) return;

    var scopeActivo = stateShortcuts.modalActiveTab || 'global';

    // Contadores por scope para actualizar badges en la barra de pestañas
    var conteos = {};
    SCOPES_ATAJOS.forEach(function (s) { conteos[s.id] = 0; });

    Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
      var meta = DEFAULT_SCOPED_SHORTCUTS[actId];
      if (conteos[meta.scope] !== undefined) {
        conteos[meta.scope]++;
      }
    });

    SCOPES_ATAJOS.forEach(function (s) {
      var badge = document.getElementById('badge-count-atajos-' + s.id);
      if (badge) {
        badge.textContent = conteos[s.id] || 0;
        if (s.id === scopeActivo) {
          badge.className = 'badge-tab-atajos px-1.5 py-0.2 rounded-full text-[10px] font-mono font-bold bg-white/20 text-white';
        } else {
          badge.className = 'badge-tab-atajos px-1.5 py-0.2 rounded-full text-[10px] font-mono font-bold bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
        }
      }
    });

    // Filtrar acciones correspondientes a la pestaña activa
    var itemsPestana = [];
    Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
      var meta = DEFAULT_SCOPED_SHORTCUTS[actId];
      if (meta.scope === scopeActivo) {
        itemsPestana.push({
          id: actId,
          meta: meta,
          currentKey: stateShortcuts.shortcuts[actId] || meta.key,
          defaultKey: meta.key
        });
      }
    });

    var scopeInfo = SCOPES_ATAJOS.find(function (s) { return s.id === scopeActivo; }) || { label: scopeActivo, desc: '', icon: '⚡' };

    var html = '';
    html += '<div class="space-y-3">';

    // Cabecera descriptiva de la pestaña
    html += '  <div class="flex items-center justify-between px-1">';
    html += '    <div class="flex items-center gap-2">';
    html += '      <span class="text-base">' + scopeInfo.icon + '</span>';
    html += '      <div>';
    html += '        <h4 class="font-bold text-xs text-slate-800 dark:text-slate-100 uppercase tracking-wider">Atajos de ' + scopeInfo.label + '</h4>';
    html += '        <p class="text-[11px] text-slate-500 dark:text-slate-400">' + scopeInfo.desc + '</p>';
    html += '      </div>';
    html += '    </div>';
    html += '    <span class="text-[11px] font-mono font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-700">' + itemsPestana.length + ' acciones</span>';
    html += '  </div>';

    // Grid de atajos
    html += '  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">';

    itemsPestana.forEach(function (it) {
      var isRecording = (stateShortcuts.recordingActionId === it.id);
      var isModified = (it.currentKey !== it.defaultKey);

      var cardBorder = isRecording
        ? 'border-indigo-500 ring-2 ring-indigo-500/30 bg-indigo-50/40 dark:bg-indigo-950/40'
        : 'border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-800/90 hover:border-indigo-300 dark:hover:border-indigo-500/50';

      html += '    <div class="flex items-center justify-between p-2.5 rounded-xl border ' + cardBorder + ' shadow-2xs transition-all gap-2.5 group">';
      html += '      <div class="flex items-center gap-2.5 min-w-0 flex-1">';
      html += '        <span class="text-base shrink-0 p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700/60 border border-slate-200/60 dark:border-slate-600/40">' + it.meta.icon + '</span>';
      html += '        <div class="min-w-0 flex-1">';
      html += '          <p class="font-bold text-slate-800 dark:text-slate-100 text-xs truncate leading-snug">' + it.meta.label + '</p>';
      html += '          <p class="text-[10px] text-slate-400 dark:text-slate-500 truncate leading-snug mt-0.5">' + it.meta.desc + '</p>';
      html += '        </div>';
      html += '      </div>';

      html += '      <div class="flex items-center gap-1.5 shrink-0">';
      if (isRecording) {
        html += '        <button type="button" onclick="cancelarGrabacionAtajo()" class="animate-pulse px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold text-[10px] shadow-xs flex items-center gap-1" title="Haz clic para cancelar">';
        html += '          <span>● Grabando...</span>';
        html += '        </button>';
      } else {
        html += '        <button type="button" onclick="iniciarGrabacionAtajo(\'' + it.id + '\')" class="group/k flex items-center gap-1 p-0.5 rounded-lg hover:scale-105 active:scale-95 transition-transform" title="Haz clic para reasignar tecla">';
        html += '          <kbd class="min-w-[28px] h-7 px-2 inline-flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-700/90 border border-slate-300 dark:border-slate-600 shadow-2xs font-mono font-black text-xs text-slate-800 dark:text-slate-100 group-hover/k:border-indigo-500 group-hover/k:text-indigo-600 dark:group-hover/k:text-indigo-400 transition-colors">' + formatKeyDisplay(it.currentKey) + '</kbd>';
        html += '        </button>';
      }

      if (isModified && !isRecording) {
        html += '        <button type="button" onclick="restablecerAtajoIndividual(\'' + it.id + '\')" title="Restablecer a tecla por defecto: ' + formatKeyDisplay(it.defaultKey) + '" class="p-1 rounded-md text-amber-500 hover:text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/50 font-bold transition text-xs leading-none">↺</button>';
      }
      html += '      </div>';
      html += '    </div>';
    });

    html += '  </div>';
    html += '</div>';

    contenedor.innerHTML = html;
  }

  // ============================================================================
  // LISTENER MAESTRO CONTEXTUAL DE EVENTOS DE TECLADO (SCOPED KEYDOWN DISPATCHER)
  // ============================================================================
  document.addEventListener('keydown', function (e) {
    // ------------------------------------------------------------------------
    // 1. MODO GRABACIÓN INTERACTIVA DE TECLA (CONFIGURADOR)
    // ------------------------------------------------------------------------
    if (stateShortcuts.recordingActionId) {
      if (e.key === 'Escape') {
        cancelarGrabacionAtajo();
        return;
      }

      // Ignorar teclas modificadoras solitarias
      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].indexOf(e.key) !== -1) {
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      var nuevaTecla = (e.key.length === 1) ? e.key.toLowerCase() : e.key;

      var actActual = stateShortcuts.recordingActionId;
      var metaActual = DEFAULT_SCOPED_SHORTCUTS[actActual];
      if (!metaActual) {
        cancelarGrabacionAtajo();
        return;
      }
      var scopeActual = metaActual.scope;

      // REGLA 1: COLISIÓN CON ATAJOS GLOBALES
      // Si la acción actual no es global, no puede usar teclas reservadas por el grupo Global.
      var conflictoGlobal = null;
      if (scopeActual !== 'global') {
        Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (gId) {
          if (DEFAULT_SCOPED_SHORTCUTS[gId].scope === 'global') {
            var asig = stateShortcuts.shortcuts[gId] || DEFAULT_SCOPED_SHORTCUTS[gId].key;
            if (asig.toLowerCase() === nuevaTecla.toLowerCase()) {
              conflictoGlobal = gId;
            }
          }
        });
      }

      if (conflictoGlobal) {
        var gMeta = DEFAULT_SCOPED_SHORTCUTS[conflictoGlobal];
        mostrarToastAtajo('⚠️ La tecla ' + formatKeyDisplay(nuevaTecla) + ' está reservada para [' + (gMeta ? gMeta.label : conflictoGlobal) + ']');
        return;
      }

      // REGLA 2: COLISIÓN DENTRO DE LA MISMA PESTAÑA (MISMO SCOPE)
      // Si la tecla ya está asignada a otra acción en la MISMA pestaña, se realiza un intercambio inteligente.
      var conflictoMismoScope = null;
      Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (kId) {
        if (kId !== actActual && DEFAULT_SCOPED_SHORTCUTS[kId].scope === scopeActual) {
          var asig = stateShortcuts.shortcuts[kId] || DEFAULT_SCOPED_SHORTCUTS[kId].key;
          if (asig.toLowerCase() === nuevaTecla.toLowerCase()) {
            conflictoMismoScope = kId;
          }
        }
      });

      if (conflictoMismoScope) {
        var nombreDup = DEFAULT_SCOPED_SHORTCUTS[conflictoMismoScope] ? DEFAULT_SCOPED_SHORTCUTS[conflictoMismoScope].label : conflictoMismoScope;
        stateShortcuts.shortcuts[conflictoMismoScope] = stateShortcuts.shortcuts[actActual] || metaActual.key;
        stateShortcuts.shortcuts[actActual] = nuevaTecla;
        mostrarToastAtajo('⚠️ Reasignada (intercambiada con ' + nombreDup + ')');
      } else {
        stateShortcuts.shortcuts[actActual] = nuevaTecla;
        mostrarToastAtajo('✅ Asignada tecla ' + formatKeyDisplay(nuevaTecla) + ' a ' + metaActual.label);
      }

      saveKeyboardShortcuts();
      cancelarGrabacionAtajo();
      return;
    }

    // Validar siempre al inicio de keydown si el foco está en un campo de texto / editable
    const esInput = (e.target && e.target.tagName && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(e.target.tagName.toUpperCase()) !== -1) || (e.target && !!e.target.isContentEditable);

    // ------------------------------------------------------------------------
    // 2. CONTROL UNIVERSAL DE ESCAPE (CANCELACIÓN Y CIERRE EN PILA LIFO)
    // ------------------------------------------------------------------------
    if (e.key === 'Escape' || e.keyCode === 27) {
      // Prioridad 1: Cerrar datepickers flotantes, submodales, popovers y selectores si están abiertos
      var popoverAct = document.getElementById('flow-datepicker-popover');
      var popoverTar = document.getElementById('task-flow-datepicker-popover');
      var popoverDep = document.getElementById('task-flow-dep-picker');
      var catDropAct = document.getElementById('flow-cat-dropdown');
      var modalVincNota = document.getElementById('modal-vincular-entidad-nota');
      var cerroFlotante = false;

      if (modalVincNota && !modalVincNota.classList.contains('hidden') && modalVincNota.style.display !== 'none') {
        if (typeof window.cerrarModalVincularEntidadNota === 'function') {
          window.cerrarModalVincularEntidadNota();
        } else {
          modalVincNota.classList.add('hidden');
        }
        cerroFlotante = true;
      }
      if (popoverAct && !popoverAct.classList.contains('hidden')) {
        if (typeof cerrarDatePickerFlow === 'function') {
          cerrarDatePickerFlow();
        } else {
          popoverAct.classList.add('hidden');
        }
        cerroFlotante = true;
      }
      if (catDropAct && !catDropAct.classList.contains('hidden')) {
        catDropAct.classList.add('hidden');
        cerroFlotante = true;
      }
      if (popoverTar && !popoverTar.classList.contains('hidden')) {
        popoverTar.classList.add('hidden');
        cerroFlotante = true;
      }
      if (popoverDep && !popoverDep.classList.contains('hidden')) {
        popoverDep.classList.add('hidden');
        cerroFlotante = true;
      }
      if (typeof cerrarTodosDropdownsTaskFlow === 'function') {
        cerrarTodosDropdownsTaskFlow();
      }
      if (typeof closeMenuNuevo === 'function') {
        closeMenuNuevo();
      }

      if (cerroFlotante) {
        e.preventDefault();
        return;
      }

      // Prioridad 2: Si hay una edición rápida de fecha/hora activa en tarjeta, cancelarla
      var edicionRapidaActiva = document.querySelector('.input-edicion-activa');
      if (edicionRapidaActiva) {
        e.preventDefault();
        if (typeof renderTableroActividadesPersonales === 'function') {
          renderTableroActividadesPersonales();
        }
        return;
      }

      // Prioridad 3: Si hay alerta/modal SweetAlert2 visible, cerrarla
      if (typeof Swal !== 'undefined' && typeof Swal.isVisible === 'function' && Swal.isVisible()) {
        e.preventDefault();
        Swal.close();
        return;
      }

      // Prioridad 4: Modales o Drawer abiertos (LIFO)
      if (typeof cerrarTodosLosModalesActivos === 'function') {
        var modalesCerrados = cerrarTodosLosModalesActivos();
        if (modalesCerrados) {
          e.preventDefault();
          return;
        }
      }

      // Prioridad 5: Si no hay modales pero hay un input con foco activo: desenfocar el elemento (blur)
      if (document.activeElement && (['INPUT', 'TEXTAREA', 'SELECT'].indexOf(document.activeElement.tagName) !== -1 || document.activeElement.isContentEditable)) {
        document.activeElement.blur();
        e.preventDefault();
        return;
      }

      return;
    }

    // ------------------------------------------------------------------------
    // 3. CONFIRMACIÓN PRIMARIA OMNICANAL CON ENTER
    // ------------------------------------------------------------------------
    if (e.key === 'Enter' || e.keyCode === 13) {
      // Excepción: Dentro de un <textarea> multilínea o contentEditable conserva el salto de línea normal
      if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
        return;
      }

      var ejecutado = ejecutarAccionPrimariaModal(e);
      if (ejecutado) {
        e.preventDefault();
        return;
      }

      // Si está en un input y no hay modal que confirmar, desenfocar suavemente
      if (esInput) {
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        return;
      }
    }

    // ------------------------------------------------------------------------
    // 4. BLINDAJE ESTRICTO CONTRA INPUTS:
    // Si esInput === true, abortar la ejecución de 'C', 'X', números y cualquier
    // tecla alfanumérica para permitir redacción de texto libre sin colisiones.
    // ------------------------------------------------------------------------
    if (esInput) {
      return;
    }

    // ------------------------------------------------------------------------
    // 4. VERIFICACIÓN DE ESTADO MAESTRO DE ATAJOS
    // ------------------------------------------------------------------------
    if (!stateShortcuts.enabled) return;

    // ------------------------------------------------------------------------
    // 5. ATAJO UNIVERSAL DE BÚSQUEDA CON CTRL+K
    // ------------------------------------------------------------------------
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      enfocarBuscadorContextual();
      return;
    }

    // Si tiene Ctrl, Alt o Meta presionados y no es una combinación especial, ignorar
    if (e.ctrlKey || e.metaKey || e.altKey) {
      return;
    }

    var keyNormal = (e.key.length === 1) ? e.key.toLowerCase() : e.key;

    // Atajo prioritario Tecla 'C' / 'c': Ejecutar click en botón Calendar para abrir la app o web
    if (keyNormal === 'c') {
      e.preventDefault();
      document.getElementById('btn-header-calendar')?.click();
      mostrarToastAtajo('📅 Abriendo Google Calendar...');
      return;
    }

    // ------------------------------------------------------------------------
    // 6. PRIORIDAD 1: EVALUAR ATAJOS GLOBALES (ACTÚAN EN TODO EL SISTEMA)
    // ------------------------------------------------------------------------
    var accionGlobalEncontrada = null;
    Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
      if (DEFAULT_SCOPED_SHORTCUTS[actId].scope === 'global') {
        var asignada = stateShortcuts.shortcuts[actId] || DEFAULT_SCOPED_SHORTCUTS[actId].key;
        if (asignada === e.key || asignada.toLowerCase() === keyNormal.toLowerCase()) {
          accionGlobalEncontrada = actId;
        }
      }
    });

    if (accionGlobalEncontrada) {
      e.preventDefault();
      ejecutarAccionAtajo(accionGlobalEncontrada, e);
      return;
    }

    // ------------------------------------------------------------------------
    // 7. PRIORIDAD 2: EVALUAR ATAJOS CONTEXTUALES SEGÚN LA PESTAÑA ACTIVA
    // ------------------------------------------------------------------------
    var activeScope = getActiveScope();
    var accionContextualEncontrada = null;

    Object.keys(DEFAULT_SCOPED_SHORTCUTS).forEach(function (actId) {
      if (DEFAULT_SCOPED_SHORTCUTS[actId].scope === activeScope) {
        var asignada = stateShortcuts.shortcuts[actId] || DEFAULT_SCOPED_SHORTCUTS[actId].key;
        if (asignada === e.key || asignada.toLowerCase() === keyNormal.toLowerCase()) {
          accionContextualEncontrada = actId;
        }
      }
    });

    if (accionContextualEncontrada) {
      e.preventDefault();
      ejecutarAccionAtajo(accionContextualEncontrada, e);
      return;
    }
  });

  /**

  function seleccionarProyecto(idProyecto) {
    var idNormalizado = idProyecto ? String(idProyecto).trim().toUpperCase() : null;
