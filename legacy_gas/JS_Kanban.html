<script>
  // ============================================================================
  // SECCIÓN 4: MANIPULACIÓN DEL DOM Y RENDERIZADO (Kanban y Vista 360°)
  // ============================================================================

  /**
   * 4.0.0. Normalizador robusto de Estado_Tarea para sincronización con el tablero Kanban.
   * Contempla códigos numéricos, slugs, textos con espacios y variaciones tipográficas.
   */
  function normalizarEstadoTarea(rawState) {
    if (!rawState || String(rawState).trim() === '') return '01_Backlog';
    var st = String(rawState).trim().toLowerCase();

    // 05 o Archivado / Cancelado / Descartado -> Excluido del tablero activo
    if (st === '05' || st === '05_archivado' || st.indexOf('archiva') !== -1 || st.indexOf('cancel') !== -1 || st.indexOf('descart') !== -1) {
      return null;
    }

    // 04_Completado: '04_Completado', 'Completado', 'Completada', 'Done', 'Finalizado', '04', 'terminado', 'terminada', 'hecho'
    if (st === '04' || st === '04_completado' || st.indexOf('complet') !== -1 || st.indexOf('finaliz') !== -1 || st.indexOf('done') !== -1 || st.indexOf('termin') !== -1 || st.indexOf('hecho') !== -1) {
      return '04_Completado';
    }

    // 03_En_Proceso: '03_En_Proceso', 'En Proceso', 'En_Proceso', 'In Progress', '03', 'curso', 'haciendo'
    if (st === '03' || st === '03_en_proceso' || st.indexOf('proceso') !== -1 || st.indexOf('progress') !== -1 || st.indexOf('curso') !== -1 || st.indexOf('haciendo') !== -1) {
      return '03_En_Proceso';
    }

    // 02_Por_Hacer: '02_Por_Hacer', 'Por Hacer', 'Por_Hacer', 'To Do', '02', 'todo'
    if (st === '02' || st === '02_por_hacer' || st.indexOf('hacer') !== -1 || st.indexOf('to do') !== -1 || st === 'todo') {
      return '02_Por_Hacer';
    }

    // 01_Backlog: '01_Backlog', 'Backlog', '01', 'Pendiente', 'iniciar'
    if (st === '01' || st === '01_backlog' || st.indexOf('backlog') !== -1 || st.indexOf('pendiente') !== -1 || st.indexOf('iniciar') !== -1) {
      return '01_Backlog';
    }

    // Fallback de seguridad: cualquier estado no reconocido se coloca en '01_Backlog' en lugar de descartarlo
    return '01_Backlog';
  }

  /**
   * 4.0.0b. Inyección condicional de esqueletos de carga visual tipo shimmer
   * Si las columnas de tareas no tienen hijos o no hay caché previa,
   * inyecta 2 tarjetas skeleton por columna con siluetas de título, badge y fecha usando '.skeleton-box'.
   */
  function renderKanbanSkeletons() {
    var cols = ['col-backlog', 'col-por-hacer', 'col-en-proceso', 'col-completado'];
    var skeletonCard =
      '<div class="kanban-skeleton-card kanban-card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-3.5 pl-4 shadow-xs space-y-2.5 pointer-events-none select-none">' +
      '  <div class="flex items-center justify-between gap-2">' +
      '    <div class="skeleton-box h-4 w-16 rounded-md"></div>' +
      '    <div class="skeleton-box h-4 w-12 rounded-md"></div>' +
      '  </div>' +
      '  <div class="space-y-1.5 py-1">' +
      '    <div class="skeleton-box h-3.5 w-4/5 rounded"></div>' +
      '    <div class="skeleton-box h-3 w-1/2 rounded"></div>' +
      '  </div>' +
      '  <div class="pt-2 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between">' +
      '    <div class="skeleton-box h-3.5 w-20 rounded-md"></div>' +
      '    <div class="skeleton-box h-3.5 w-8 rounded-md"></div>' +
      '  </div>' +
      '</div>';

    cols.forEach(function (colId) {
      var col = document.getElementById(colId);
      if (!col) return;
      var tarjetasReales = col.querySelectorAll('.kanban-card:not(.kanban-skeleton-card)');
      if (tarjetasReales.length === 0) {
        col.innerHTML = skeletonCard + skeletonCard;
      }
    });
  }
  window.renderKanbanSkeletons = renderKanbanSkeletons;

  /**
   * 4.0.0c. Renderizador central de columnas Kanban con datos reales
   * Limpia los contenedores (innerHTML = '') automáticamente a través de kanban.render.
   */
  function renderKanbanColumns(tareas) {
    if (typeof kanban !== 'undefined' && kanban && typeof kanban.render === 'function') {
      kanban.render(tareas || state.tareas || []);
    }
  }
  window.renderKanbanColumns = renderKanbanColumns;

  /**
   * 4.0.1. Verifica si un elemento DOM es una tarjeta Kanban actualmente montada y visible
   */
  function esTarjetaVisibleEnKanban(el) {
    if (!el || !el.isConnected) return false;
    if (el.classList.contains('kanban-skeleton-card')) return false;
    var colContenedora = el.closest('#col-backlog, #col-por-hacer, #col-en-proceso, #col-completado');
    if (!colContenedora) return false;
    if (el.classList.contains('hidden') || el.style.display === 'none' || el.style.visibility === 'hidden') {
      return false;
    }
    return true;
  }

  /**
   * 4.0.2. Busca de forma segura una tarjeta Kanban por ID en el DOM visible de las 4 columnas
   */
  function buscarTarjetaVisibleKanban(idTarea) {
    if (!idTarea) return null;
    var idNorm = String(idTarea).trim().toUpperCase();
    var selector = '#col-backlog [data-id-tarea="' + idNorm + '"], ' +
      '#col-por-hacer [data-id-tarea="' + idNorm + '"], ' +
      '#col-en-proceso [data-id-tarea="' + idNorm + '"], ' +
      '#col-completado [data-id-tarea="' + idNorm + '"]';
    var el = document.querySelector(selector);
    if (el && esTarjetaVisibleEnKanban(el)) {
      return el;
    }
    var fallback = document.getElementById('kanban-card-' + idNorm);
    if (fallback && esTarjetaVisibleEnKanban(fallback)) {
      return fallback;
    }
    return null;
  }

  /**
   * 4.0.3. Obtiene todas las tarjetas Kanban actualmente montadas y visibles en las columnas
   */
  function obtenerTarjetasVisiblesKanban() {
    var columnas = ['col-backlog', 'col-por-hacer', 'col-en-proceso', 'col-completado'];
    var tarjetas = [];
    columnas.forEach(function (colId) {
      var col = document.getElementById(colId);
      if (col) {
        var cards = col.querySelectorAll('.kanban-card');
        for (var i = 0; i < cards.length; i++) {
          if (esTarjetaVisibleEnKanban(cards[i])) {
            tarjetas.push(cards[i]);
          }
        }
      }
    });
    return tarjetas;
  }

  /**
   * 4.0.4. Obtiene de forma recursiva todos los IDs de las tareas predecesoras (hacia atrás)
   */
  function obtenerCadenaPredecesoras(idTarea, visitados) {
    visitados = visitados || new Set();
    if (!idTarea) return visitados;
    var idNorm = String(idTarea || '').trim().toUpperCase();
    var t = (state.tareas || []).find(function (x) {
      return String(x && x.ID_Tarea || '').trim().toUpperCase() === idNorm;
    });

    if (!t || !t.ID_Dependencia) return visitados;

    var rawDep = String(t.ID_Dependencia || '').trim().toUpperCase();
    if (!rawDep || rawDep === '' || rawDep.indexOf('@GOOGLE.COM') !== -1) return visitados;

    var deps = rawDep.split(/[,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (deps.length === 0) return visitados;

    deps.forEach(function (depId) {
      if (depId && depId.indexOf('@GOOGLE.COM') === -1 && !visitados.has(depId)) {
        visitados.add(depId);
        obtenerCadenaPredecesoras(depId, visitados);
      }
    });
    return visitados;
  }
  var obtenerAncestrosTarea = obtenerCadenaPredecesoras;

  /**
   * 4.0.5. Obtiene de forma recursiva todos los IDs de las tareas sucesoras (hacia adelante)
   */
  function obtenerCadenaSucesoras(idTarea, visitados) {
    visitados = visitados || new Set();
    if (!idTarea) return visitados;
    var idNorm = String(idTarea || '').trim().toUpperCase();

    (state.tareas || []).forEach(function (t) {
      if (!t || !t.ID_Dependencia) return;
      var rawDep = String(t.ID_Dependencia || '').trim().toUpperCase();
      if (!rawDep || rawDep === '' || rawDep.indexOf('@GOOGLE.COM') !== -1) return;

      var deps = rawDep.split(/[,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      var tId = String(t.ID_Tarea || '').trim().toUpperCase();
      if (deps.indexOf(idNorm) !== -1 && !visitados.has(tId)) {
        visitados.add(tId);
        obtenerCadenaSucesoras(tId, visitados);
      }
    });
    return visitados;
  }
  var obtenerDescendientesTarea = obtenerCadenaSucesoras;

  /**
   * 4.0.6. Limpia todas las clases de trazabilidad y restablece la vista Kanban normal
   */
  function limpiarTrazabilidadKanban() {
    var todas = document.querySelectorAll('.kanban-card-item, .kanban-card');
    for (var i = 0; i < todas.length; i++) {
      todas[i].classList.remove(
        'kanban-card-foco',
        'kanban-card-predecesora',
        'kanban-card-sucesora',
        'kanban-card-atenuada',
        'opacity-30',
        'ring-2', 'ring-indigo-500', 'ring-amber-500', 'ring-emerald-500'
      );
    }

    var badges = document.querySelectorAll('.kanban-etiqueta-relacion, .kanban-dep-floating-info');
    for (var b = 0; b < badges.length; b++) {
      badges[b].remove();
    }
  }

  /**
   * 4.0.7. Motor de trazabilidad visual blindado de dependencias (Sin tarjetas fantasma)
   */
  function activarResaltadoDependencias(idTarea) {
    limpiarTrazabilidadKanban();

    var idNorm = String(idTarea || '').trim().toUpperCase();
    if (!idNorm) return;

    var cardPrincipal = document.getElementById('kanban-card-' + idNorm);
    if (!cardPrincipal || !cardPrincipal.isConnected) {
      cardPrincipal = buscarTarjetaVisibleKanban(idNorm);
    }
    if (!cardPrincipal) return;

    var todasVisibles = obtenerTarjetasVisiblesKanban();
    var ancestrosSet = obtenerCadenaPredecesoras(idNorm);
    var descendientesSet = obtenerCadenaSucesoras(idNorm);

    var tarjetasResaltadas = new Set([cardPrincipal]);
    var predecesorasVisibles = [];
    var predecesorasOcultas = [];
    var sucesorasVisibles = [];
    var sucesorasOcultas = [];

    // Clasificar predecesoras
    ancestrosSet.forEach(function (idAnc) {
      var idTarget = String(idAnc || '').trim().toUpperCase();
      var elAnc = document.getElementById('kanban-card-' + idTarget);
      if (elAnc && esTarjetaVisibleEnKanban(elAnc)) {
        predecesorasVisibles.push({ id: idTarget, el: elAnc });
        tarjetasResaltadas.add(elAnc);
      } else {
        predecesorasOcultas.push(idTarget);
      }
    });

    // Clasificar sucesoras
    descendientesSet.forEach(function (idDes) {
      var idTarget = String(idDes || '').trim().toUpperCase();
      var elDes = document.getElementById('kanban-card-' + idTarget);
      if (elDes && esTarjetaVisibleEnKanban(elDes)) {
        sucesorasVisibles.push({ id: idTarget, el: elDes });
        tarjetasResaltadas.add(elDes);
      } else {
        sucesorasOcultas.push(idTarget);
      }
    });

    // 1. Atenuación estricta y segura: solo a tarjetas que existan en el DOM y sean hermanas visibles
    todasVisibles.forEach(function (card) {
      if (!tarjetasResaltadas.has(card)) {
        card.classList.add('kanban-card-atenuada');
      }
    });

    // 2. Resaltar la tarjeta activa con foco y elevación Z moderna
    cardPrincipal.classList.remove('kanban-card-atenuada');
    cardPrincipal.classList.add('kanban-card-foco');

    // 3. Resaltar Predecesoras Visibles (Borde Ámbar + banner integrado superior)
    predecesorasVisibles.forEach(function (item) {
      var el = item.el;
      if (!el) return;
      el.classList.remove('kanban-card-atenuada');
      el.classList.add('kanban-card-predecesora');
      var badge = document.createElement('div');
      badge.className = 'kanban-etiqueta-relacion flex items-center justify-between text-[10px] font-bold px-2 py-0.5 rounded-md mb-1 bg-amber-500 text-white shadow-xs pointer-events-none transition-all duration-200';
      badge.innerHTML = '<span>⚡ Predecesora</span><span class="text-[9px] opacity-90 uppercase tracking-wider font-mono">' + item.id + '</span>';
      el.insertBefore(badge, el.firstChild);
    });

    // 4. Resaltar Sucesoras Visibles (Borde Esmeralda + banner integrado superior)
    sucesorasVisibles.forEach(function (item) {
      var el = item.el;
      if (!el) return;
      el.classList.remove('kanban-card-atenuada');
      el.classList.add('kanban-card-sucesora');
      var badge = document.createElement('div');
      badge.className = 'kanban-etiqueta-relacion flex items-center justify-between text-[10px] font-bold px-2 py-0.5 rounded-md mb-1 bg-emerald-600 text-white shadow-xs pointer-events-none transition-all duration-200';
      badge.innerHTML = '<span class="inline-flex items-center gap-1"><svg class="w-2.5 h-2.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg><span>Sucesora</span></span><span class="text-[9px] opacity-90 uppercase tracking-wider font-mono">' + item.id + '</span>';
      el.insertBefore(badge, el.firstChild);
    });

    // 5. Dependencias ocultas por filtros cruzados: renderizar micro-badge informativo exclusivamente dentro de la tarjeta activa
    if (predecesorasOcultas.length > 0 || sucesorasOcultas.length > 0) {
      var floatingInfo = document.createElement('div');
      floatingInfo.className = 'kanban-dep-floating-info pointer-events-none mt-2 pt-2 border-t border-indigo-200/60 dark:border-indigo-800/60 flex flex-col gap-1 transition-all duration-200';

      predecesorasOcultas.forEach(function (idDep) {
        var item = document.createElement('div');
        item.className = 'inline-flex items-center gap-1.5 text-[10px] text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/70 px-2 py-0.5 rounded border border-amber-200 dark:border-amber-800/80 font-medium shadow-2xs';
        item.innerHTML = '<svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg><span>Predecesora <b class="font-mono">' + idDep + '</b> (oculta por filtros)</span>';
        floatingInfo.appendChild(item);
      });

      sucesorasOcultas.forEach(function (idDep) {
        var item = document.createElement('div');
        item.className = 'inline-flex items-center gap-1.5 text-[10px] text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/70 px-2 py-0.5 rounded border border-emerald-200 dark:border-emerald-800/80 font-medium shadow-2xs';
        item.innerHTML = '<svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg><span>Sucesora <b class="font-mono">' + idDep + '</b> (oculta por filtros)</span>';
        floatingInfo.appendChild(item);
      });

      cardPrincipal.appendChild(floatingInfo);
    }
  }
  var destacarRelacionesTarea = activarResaltadoDependencias;


  /**
   * 4.0.4. Actualiza los contadores numéricos de cada columna Kanban
   */
  /**
   * 4.0.4. Actualiza los contadores numéricos de las columnas Kanban
   * Admite opcionalmente un array con los IDs o estados de las columnas afectadas
   */
  function actualizarContadoresKanban(colIds) {
    var colMap = {
      '01_Backlog': 'col-backlog',
      '02_Por_Hacer': 'col-por-hacer',
      '03_En_Proceso': 'col-en-proceso',
      '04_Completado': 'col-completado'
    };
    var keys = Object.keys(colMap);
    if (Array.isArray(colIds) && colIds.length > 0) {
      keys = keys.filter(function (k) {
        return colIds.indexOf(k) !== -1 || colIds.indexOf(colMap[k]) !== -1;
      });
    }
    keys.forEach(function (k) {
      var colEl = document.getElementById(colMap[k]);
      var badge = document.getElementById('count-' + k);
      var tabBadge = document.getElementById('badge-tab-' + k);
      if (colEl && badge) {
        var cards = colEl.querySelectorAll('.kanban-card:not(.kanban-skeleton-card)');
        var count = 0;
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          c.classList.remove('hidden', 'opacity-0');
          if (c.style.display === 'none') c.style.display = '';
          if (c.style.visibility === 'hidden') c.style.visibility = '';
          count++;
        }
        badge.textContent = count;
        if (tabBadge) tabBadge.textContent = count;
      }
    });
  }

  /**
   * 4.0.5. Muestra u oculta placeholders en columnas vacías
   * Admite opcionalmente un array con los IDs o estados de las columnas afectadas
   */
  function actualizarEstadosVaciosKanban(colIds) {
    var colMap = {
      '01_Backlog': {
        id: 'col-backlog',
        label: 'Sin tareas en Backlog',
        iconSvg: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'
      },
      '02_Por_Hacer': {
        id: 'col-por-hacer',
        label: 'Nada pendiente por hacer',
        iconSvg: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>'
      },
      '03_En_Proceso': {
        id: 'col-en-proceso',
        label: 'Sin tareas en curso',
        iconSvg: '<svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'
      },
      '04_Completado': {
        id: 'col-completado',
        label: 'Aún no hay completadas',
        iconSvg: '<svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>'
      }
    };
    var keys = Object.keys(colMap);
    if (Array.isArray(colIds) && colIds.length > 0) {
      keys = keys.filter(function (k) {
        return colIds.indexOf(k) !== -1 || colIds.indexOf(colMap[k].id) !== -1;
      });
    }
    keys.forEach(function (k) {
      var info = colMap[k];
      var colEl = document.getElementById(info.id);
      if (!colEl) return;
      if (colEl.querySelector('.kanban-skeleton-card')) return;
      var cards = colEl.querySelectorAll('.kanban-card:not(.kanban-skeleton-card)');
      var emptyEl = colEl.querySelector('.kanban-empty-placeholder');
      if (cards.length === 0) {
        if (!emptyEl) {
          emptyEl = document.createElement('div');
          emptyEl.className = 'kanban-empty-placeholder py-8 px-4 flex flex-col items-center justify-center text-center border border-dashed border-slate-200/80 dark:border-slate-800 rounded-xl my-2 pointer-events-none select-none';
          emptyEl.innerHTML =
            '<div class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center mx-auto mb-2 text-slate-400 dark:text-slate-500 border border-slate-200/60 dark:border-slate-700/60">' +
            info.iconSvg +
            '</div>' +
            '<span class="text-xs font-medium text-slate-600 dark:text-slate-400">' + info.label + '</span>';
          colEl.appendChild(emptyEl);
        }
      } else {
        if (emptyEl && emptyEl.parentNode) {
          emptyEl.parentNode.removeChild(emptyEl);
        }
      }
    });
  }

  /**
   * 4.1. Motor reactivo del Tablero Kanban
   */
  /**
   * Generador defensivo estricto de tarjeta Kanban (crearTarjetaKanbanHTML).
   * Utiliza (state.tareas || []) y valida gastos con Array.isArray(state.gastos) && state.gastos.some(...).
   * Ningún fallo en la lectura de gastos interrumpe el renderizado de título, prioridad, horas y subtareas.
   */
  function crearTarjetaKanbanHTML(tarea) {
    if (!tarea) return null;
    var card = document.createElement("div");
    var idTareaActual = String(tarea.ID_Tarea || tarea.idTarea || "").trim();
    card.id = "kanban-card-" + idTareaActual;
    card.draggable = true;
    card.className = "kanban-card group relative p-3 rounded-xl border border-slate-800/80 bg-slate-900/90 select-none cursor-grab active:cursor-grabbing text-xs space-y-2.5 transition-all duration-150 ease-out hover:-translate-y-0.5 hover:shadow-md animate-fadeIn overflow-hidden";
    card.dataset.taskId = idTareaActual;
    card.dataset.depId = String(tarea.ID_Dependencia || "").trim();
    card.setAttribute("data-id-tarea", idTareaActual);

    // Indicador visual de elemento archivado (>10 días completado)
    if (typeof esElementoArchivado === "function" && esElementoArchivado(tarea)) {
      card.classList.add("opacity-60", "border-dashed");
    }

    // Conexión de eventos de hover para trazabilidad visual de precedencias
    card.onmouseenter = function () {
      if (typeof activarResaltadoDependencias === "function") {
        activarResaltadoDependencias(idTareaActual);
      }
    };

    card.onmouseleave = function () {
      if (typeof limpiarTrazabilidadKanban === "function") {
        limpiarTrazabilidadKanban();
      }
    };

    card.addEventListener("dragstart", function (e) {
      draggedTaskId = idTareaActual;
      if (e.dataTransfer) {
        e.dataTransfer.setData("text/plain", draggedTaskId);
        e.dataTransfer.effectAllowed = "move";
      }
      card.classList.add("card-dragging", "opacity-60", "transition-shadow", "shadow-lg");
    });

    card.addEventListener("dragend", function () {
      card.classList.remove("card-dragging", "opacity-60", "transition-shadow", "shadow-lg", "opacity-40", "scale-95", "rotate-1", "shadow-2xl", "border-indigo-500", "ring-2", "ring-indigo-400");
      draggedTaskId = null;
      if (typeof limpiarEstilosDropzone === "function") limpiarEstilosDropzone();

  function validarDoDSubtareasCompletas(idTarea) {
    if (!idTarea) return { valido: true, total: 0, completadas: 0, pendientes: 0 };
    var idNorm = String(idTarea).trim().toUpperCase();
    var subtareas = (state.subtareas || []).filter(function (s) {
      var idP = String(s.ID_Padre_Vinculado || s.ID_Padre || s.idPadre || s.ID_Tarea_Padre || '').trim().toUpperCase();
      return idP === idNorm;
    });
    if (subtareas.length === 0) return { valido: true, total: 0, completadas: 0, pendientes: 0 };
    var completadas = subtareas.filter(function (s) {
      return s.Completado === true || s.completado === true || String(s.Completado).toLowerCase() === 'true' || String(s.Completado) === '1' || String(s.Completado) === 'Sí';
    }).length;
    var pendientes = subtareas.length - completadas;
    return {
      valido: pendientes === 0,
      total: subtareas.length,
      completadas: completadas,
      pendientes: pendientes
    };
  }
  window.validarDoDSubtareasCompletas = validarDoDSubtareasCompletas;

  /**
   * 5.1. Transición rápida de estado en tarjeta (Quick Action) con Toast SweetAlert2
   */
  function transicionarEstadoTareaRapido(idTarea, nuevoEstado, ev) {
    if (ev) {
      ev.stopPropagation();
      ev.preventDefault();
    }
    var idNorm = String(idTarea || '').trim();
    var isActivity = idNorm.startsWith('ACT-');
    var item = isActivity
      ? (state.actividadesPersonales || []).find(function (a) { return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idNorm; })
      : (state.tareas || []).find(function (t) { return String(t.ID_Tarea || '').trim() === idNorm; });

    if (!item) return;
    var estadoActual = isActivity ? (item.Estado || item.Estado_Tarea) : item.Estado_Tarea;
    if (String(estadoActual || '').trim() === String(nuevoEstado || '').trim()) return;

    // Poka-Yoke Estricto DoD: Bloqueo si hay subtareas incompletas al transicionar a 04_Completado
    if (!isActivity && nuevoEstado === '04_Completado') {
      var checkDoD = validarDoDSubtareasCompletas(idNorm);
      if (!checkDoD.valido) {
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'warning',
            title: 'DoD Incompleto (Poka-Yoke)',
            html: '<div class="text-xs text-slate-600 dark:text-slate-300 space-y-2 text-left">' +
              '<p>Esta tarea tiene <b>' + checkDoD.pendientes + ' de ' + checkDoD.total + '</b> subtareas o pasos pendientes en su checklist.</p>' +
              '<p class="text-indigo-600 dark:text-indigo-400 font-semibold">Por gobernanza PMO, debes verificar el 100% de los pasos antes de marcarla como completada.</p>' +
              '</div>',
            confirmButtonColor: '#4f46e5'
          });
        }
        return;
      }
    }

    var nombre = isActivity ? (item.Nombre_Actividad || item.Nombre_Tarea_Actividad || idNorm) : (item.Nombre_Tarea_Actividad || idNorm);
    var labelsEstado = {
      '01_Backlog': 'Backlog',
      '02_Por_Hacer': 'Por Hacer',
      '03_En_Proceso': 'En Proceso',
      '04_Completado': 'Completado'
    };
    var labelNuevo = labelsEstado[nuevoEstado] || nuevoEstado;

    // Actualización reactiva y optimista unificada
    persistirEstadoTareaKanban(idNorm, nuevoEstado);

    // Toast minimalista de SweetAlert2
    if (typeof Swal !== 'undefined') {
      var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
        didOpen: function (toast) {
          toast.onmouseenter = Swal.stopTimer;
          toast.onmouseleave = Swal.resumeTimer;
        }
      });

      var toastIcon = (nuevoEstado === '04_Completado') ? 'success' : 'info';
      Toast.fire({
        icon: toastIcon,
        title: 'Estado actualizado',
        text: '"' + (nombre.length > 28 ? nombre.substring(0, 25) + '...' : nombre) + '" → ' + labelNuevo
      });
    }
  }

  /**
   * 5.1.1. Mueve o actualiza una tarjeta en el DOM a 60 fps sin reconstruir todo el tablero
   */
  function moverTarjetaDOM(item, estadoPrevio, targetState) {
    if (!item) return;
    var idItem = String(item.ID_Tarea || item.ID_Actividad || '').trim();
    var cardExistente = document.getElementById('kanban-card-' + idItem) ||
      document.querySelector('[data-id-tarea="' + idItem + '"]') ||
      document.querySelector('[data-task-id="' + idItem + '"]');

    var targetNorm = normalizarEstadoTarea(targetState);
    if (!targetNorm) {
      if (cardExistente && cardExistente.parentNode) {
        cardExistente.classList.add('transition-all', 'duration-200', 'opacity-0', 'scale-90');
        setTimeout(function () {
          if (cardExistente.parentNode) cardExistente.parentNode.removeChild(cardExistente);
          var cols = [normalizarEstadoTarea(estadoPrevio)].filter(Boolean);
          actualizarContadoresKanban(cols);
          actualizarEstadosVaciosKanban(cols);
        }, 200);
      }
      return;
    }

    var colMap = {
      '01_Backlog': 'col-backlog',
      '02_Por_Hacer': 'col-por-hacer',
      '03_En_Proceso': 'col-en-proceso',
      '04_Completado': 'col-completado'
    };

    var colDestinoId = colMap[targetNorm];
    var colDestino = colDestinoId ? document.getElementById(colDestinoId) : null;
    if (!colDestino) return;

    // Crear la tarjeta con su nuevo estado y controles de transición actualizados
    var nuevaCard = kanban.createCardElement(item);
    if (!nuevaCard) return;
    nuevaCard.classList.add('transition-all', 'duration-300');

    if (cardExistente && cardExistente.parentNode) {
      if (cardExistente.parentNode === colDestino) {
        // La tarjeta ya fue reubicada optimísticamente en la columna destino
        cardExistente.parentNode.replaceChild(nuevaCard, cardExistente);
      } else {
        cardExistente.parentNode.removeChild(cardExistente);
        colDestino.appendChild(nuevaCard);
      }
    } else {
      colDestino.appendChild(nuevaCard);
    }

    // Actualizar únicamente los contadores y placeholders de las columnas afectadas
    var colAfectadas = [normalizarEstadoTarea(estadoPrevio), targetNorm].filter(Boolean);
    actualizarContadoresKanban(colAfectadas);
    actualizarEstadosVaciosKanban(colAfectadas);

    if (typeof AOS !== 'undefined') {
      AOS.refreshHard();
    }
  }

  /**
   * 5.2. Persistencia Inmediata de Estado en Kanban (Drag & Drop, Quick Actions y Checks)
   */
  function persistirEstadoTareaKanban(idTarea, targetState) {
    var idBuscado = String(idTarea || '').trim();
    var isActivity = idBuscado.startsWith('ACT-');

    if (isActivity) {
      var act = (state.actividadesPersonales || []).find(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idBuscado;
      });
      if (!act) return;
      var estadoPrevioAct = act.Estado || act.Estado_Tarea || '02_Por_Hacer';
      if (String(estadoPrevioAct).trim() === String(targetState).trim()) return;

      act.Estado = targetState;
      act.Estado_Tarea = targetState;

      // Actualización optimista inmediata en el DOM
      moverTarjetaDOM(act, estadoPrevioAct, targetState);

      function revertirActividadLocal() {
        act.Estado = estadoPrevioAct;
        act.Estado_Tarea = estadoPrevioAct;
        try {
          moverTarjetaDOM(act, targetState, estadoPrevioAct);
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'error',
              title: 'Error de sincronización',
              text: 'No se pudo guardar el estado de la actividad en el servidor.',
              confirmButtonColor: '#4f46e5'
            });
          }
        } catch (errRollback) {
          console.error('[Rollback actividad err]:', errRollback);
        }
      }

      callBackend(
        'updateestadoactividadpersonal',
        {
          idActividad: idBuscado,
          // Indica si la actividad debe incrementar su racha al completarse
          incrementarRacha: targetState === '04_Completado',
          id: idBuscado,
          nuevoEstado: targetState
        },
        function (res) {
          if (!res || (res.success !== true && res.success !== 'true')) {
            console.error('[Kanban act persist err]:', res && res.error);
            revertirActividadLocal();
          } else if (res.repetida) {
            // Hábito cíclico: actualizar racha, nueva fecha y reubicar en Por Hacer
            act.Racha_Actual = res.racha || (act.Racha_Actual + 1);
            act.Fecha_Programada = res.nuevaFecha || act.Fecha_Programada;
            act.Estado = res.nuevoEstado || '02_Por_Hacer';
            act.Estado_Tarea = act.Estado;
            moverTarjetaDOM(act, targetState, act.Estado);
            if (typeof Swal !== 'undefined') {
              var Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2500,
                timerProgressBar: true
              });
              Toast.fire({
                icon: 'success',
                title: '¡Hábito registrado!',
                text: 'Racha: ' + act.Racha_Actual + ' días. Siguiente fecha: ' + act.Fecha_Programada
              });
            }
          }
        },
        function (err) {
          console.error('[Kanban act red fallback]:', err);
          revertirActividadLocal();
        },
        { silent: true }
      );
      return;
    }

    var tarea = (state.tareas || []).find(function (t) {
      return String(t.ID_Tarea || '').trim() === idBuscado;
    });
    if (!tarea) return;
    if (String(tarea.Estado_Tarea || '').trim() === String(targetState || '').trim()) return;

    var estadoPrevio = tarea.Estado_Tarea;
    tarea.Estado_Tarea = targetState;

    // Actualización inmediata del DOM a 60 fps sin destruir las demás tarjetas
    moverTarjetaDOM(tarea, estadoPrevio, targetState);

    // Propagar avance en cascada (Pasos -> Tarea -> Hito -> Proyecto)
    try {
      if (typeof recalcularAvanceCascada === 'function') {
        recalcularAvanceCascada(idBuscado, tarea.ID_Hito, tarea.ID_Proyecto);
      }
    } catch (errCascada) {
      console.error('[Kanban cascada sync]:', errCascada);
    }

    // Actualizar sidebar de proyectos e información financiera sin re-renderizar todo el kanban
    try {
      renderSidebarProyectos();
      if (state.proyectoDetalleActivo) {
        renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
      }
      recalcularGastoVisible();
    } catch (errRender) {
      console.error('[Kanban sync lateral]:', errRender);
    }

    function revertirEstadoLocal() {
      tarea.Estado_Tarea = estadoPrevio;
      try {
        moverTarjetaDOM(tarea, targetState, estadoPrevio);
        if (typeof recalcularAvanceCascada === 'function') {
          recalcularAvanceCascada(idBuscado, tarea.ID_Hito, tarea.ID_Proyecto);
        }
        renderSidebarProyectos();
        if (state.proyectoDetalleActivo) {
          renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
        }
        recalcularGastoVisible();
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'Error de sincronización',
            text: 'No se pudo guardar el nuevo estado en el servidor. Se restauró a su estado original.',
            confirmButtonColor: '#4f46e5'
          });
        }
      } catch (errRevert) {
        console.error('[Kanban rollback]:', errRevert);
      }
    }

    var payloadUpdate = {
      idTarea: idBuscado,
      ID_Tarea: idBuscado,
      id: idBuscado,
      datos: {
        Estado_Tarea: targetState
      },
      Estado_Tarea: targetState,
      nuevoEstado: targetState
    };

    callBackend(
      'updateTarea',
      payloadUpdate,
      function (res) {
        if (!res || (res.success !== true && res.success !== 'true')) {
          console.error('[Kanban persistencia backend]:', res && res.error);
          revertirEstadoLocal();
        }
      },
      function (err) {
        console.error('[Kanban red fallback]:', err);
        revertirEstadoLocal();
      },
      { silent: true }
    );
  }
  var persistirEstadoKanbanUnificado = persistirEstadoTareaKanban;

  var dropPlaceholderEl = null;

  function obtenerOCrearPlaceholder() {
    if (!dropPlaceholderEl) {
      dropPlaceholderEl = document.createElement('div');
      dropPlaceholderEl.id = 'kanban-drop-placeholder';
      dropPlaceholderEl.className = 'kanban-drop-placeholder border-2 border-dashed border-indigo-400/80 bg-indigo-50/40 dark:bg-indigo-950/30 rounded-xl h-14 my-2 transition-all pointer-events-none flex items-center justify-center text-xs font-semibold text-indigo-500';
      dropPlaceholderEl.innerHTML = '<span class="flex items-center gap-1.5"><span class="animate-bounce">↓</span> Soltar aquí</span>';
    }
    return dropPlaceholderEl;
  }

  function removerDropPlaceholder() {
    if (dropPlaceholderEl && dropPlaceholderEl.parentNode) {
      dropPlaceholderEl.parentNode.removeChild(dropPlaceholderEl);
    }
  }

  function limpiarEstilosDropzone() {
    document.querySelectorAll('.kanban-col-container').forEach(function (col) {
      col.classList.remove(
        'kanban-dropzone-active',
        'bg-indigo-50/40',
        'dark:bg-slate-800/40',
        'border-2',
        'border-dashed',
        'border-indigo-400',
        'rounded-2xl'
      );
    });
  }

  function obtenerElementoTrasCursor(container, y) {
    var draggableElements = Array.prototype.slice.call(container.querySelectorAll('.kanban-card:not(.card-dragging)'));
    return draggableElements.reduce(function (closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  /**
   * 5.3. Configuración de los Listeners de Arrastre (Drag & Drop fluido a 60fps)
   */
  function setupDragAndDropKanban() {
    var containers = document.querySelectorAll('.kanban-col-container');
    containers.forEach(function (col) {
      if (col.dataset.dndReady === "true") return;
      col.dataset.dndReady = "true";
      var colBody = col.querySelector('.kanban-col-body');

      col.addEventListener('dragenter', function (e) {
        e.preventDefault();
      });

      col.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';

        // Estilo activo exacto solicitado
        col.classList.add(
          'kanban-dropzone-active',
          'bg-indigo-50/40',
          'dark:bg-slate-800/40',
          'border-2',
          'border-dashed',
          'border-indigo-400',
          'rounded-2xl'
        );

        if (colBody) {
          var placeholder = obtenerOCrearPlaceholder();
          var afterElement = obtenerElementoTrasCursor(colBody, e.clientY);
          if (!afterElement) {
            colBody.appendChild(placeholder);
          } else if (afterElement !== placeholder) {
            colBody.insertBefore(placeholder, afterElement);
          }
        }
      });

      col.addEventListener('dragleave', function (e) {
        var rect = col.getBoundingClientRect();
        if (e.clientX < rect.left || e.clientX >= rect.right || e.clientY < rect.top || e.clientY >= rect.bottom) {
          col.classList.remove(
            'kanban-dropzone-active',
            'bg-indigo-50/40',
            'dark:bg-slate-800/40',
            'border-2',
            'border-dashed',
            'border-indigo-400',
            'rounded-2xl'
          );
        }
      });

      col.addEventListener('drop', function (e) {
        e.preventDefault();
        limpiarEstilosDropzone();
        var idTarea = (e.dataTransfer ? e.dataTransfer.getData('text/plain') : null) || draggedTaskId;
        var targetState = col.getAttribute('data-state');

        // Determinar posición exacta según el placeholder antes de removerlo
        var insertBeforeTarget = null;
        if (dropPlaceholderEl && dropPlaceholderEl.parentNode) {
          insertBeforeTarget = dropPlaceholderEl.nextSibling;
        }
        removerDropPlaceholder();
        draggedTaskId = null;

        if (!idTarea || !targetState) return;

        var idNorm = String(idTarea || '').trim();
        var tarjetaArrastrada = document.getElementById('kanban-card-' + idNorm) ||
          document.querySelector('[data-id-tarea="' + idNorm + '"]') ||
          document.querySelector('[data-task-id="' + idNorm + '"]');

        if (!tarjetaArrastrada) return;

        // 1. Remover clases de arrastre y opacidad inmediatamente (0ms)
        tarjetaArrastrada.classList.remove('card-dragging', 'is-dragging', 'opacity-60', 'opacity-50', 'opacity-40', 'opacity-30', 'scale-95');
        tarjetaArrastrada.style.opacity = '';
        tarjetaArrastrada.style.transform = '';

        // Identificar columna y estado de origen
        var colMap = {
          '01_Backlog': 'col-backlog',
          '02_Por_Hacer': 'col-por-hacer',
          '03_En_Proceso': 'col-en-proceso',
          '04_Completado': 'col-completado'
        };

        var parentAnterior = tarjetaArrastrada.parentNode;
        var nextSiblingAnterior = tarjetaArrastrada.nextSibling;
        var colOrigenCont = tarjetaArrastrada.closest('.kanban-col-container, [data-state]');
        var estadoOrigenRaw = colOrigenCont ? colOrigenCont.getAttribute('data-state') : null;
        if (!estadoOrigenRaw && parentAnterior) {
          for (var k in colMap) {
            if (colMap[k] === parentAnterior.id) { estadoOrigenRaw = k; break; }
          }
        }
        var estadoOrigen = normalizarEstadoTarea(estadoOrigenRaw);
        var estadoDestino = normalizarEstadoTarea(targetState);

        // Poka-Yoke Estricto DoD: Bloqueo de arrastre a Completado si hay subtareas pendientes
        var isActivity = idNorm.startsWith('ACT-');
        if (!isActivity && estadoDestino === '04_Completado') {
          var checkDoDDrop = validarDoDSubtareasCompletas(idNorm);
          if (!checkDoDDrop.valido) {
            if (typeof Swal !== 'undefined') {
              var ToastDoD = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
              });
              ToastDoD.fire({
                icon: 'warning',
                title: 'DoD Incompleto (Poka-Yoke)',
                text: 'Faltan ' + checkDoDDrop.pendientes + ' de ' + checkDoDDrop.total + ' subtareas por completar antes de cerrar.'
              });
            }
            return;
          }
        }

        var destinoColumna = col.querySelector('.kanban-col-body') || document.getElementById(colMap[estadoDestino]) || col;

        // Si ya estaba en la misma columna y misma posición, retornar
        if (estadoOrigen === estadoDestino && tarjetaArrastrada.parentNode === destinoColumna) {
          return;
        }

        // 2. Ejecutar destinoColumna.appendChild(tarjetaArrastrada) de forma SÍNCRONA e INSTANTÁNEA
        if (insertBeforeTarget && insertBeforeTarget.parentNode === destinoColumna) {
          destinoColumna.insertBefore(tarjetaArrastrada, insertBeforeTarget);
        } else {
          destinoColumna.appendChild(tarjetaArrastrada);
        }

        // 3. Decrementar en 1 el número de la columna de origen e incrementar en 1 el de la columna destino (DOM local)
        if (estadoOrigen && estadoOrigen !== estadoDestino) {
          var badgeOri = document.getElementById('count-' + estadoOrigen);
          if (badgeOri) {
            var valOri = parseInt(badgeOri.textContent, 10) || 0;
            badgeOri.textContent = Math.max(0, valOri - 1);
          }
        }
        if (estadoDestino && estadoOrigen !== estadoDestino) {
          var badgeDest = document.getElementById('count-' + estadoDestino);
          if (badgeDest) {
            var valDest = parseInt(badgeDest.textContent, 10) || 0;
            badgeDest.textContent = valDest + 1;
          }
        }
        actualizarEstadosVaciosKanban([estadoOrigen, estadoDestino]);

        // Actualizar estado local en memoria
        var isActivity = idNorm.startsWith('ACT-');
        var item = isActivity
          ? (state.actividadesPersonales || []).find(function (a) { return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idNorm; })
          : (state.tareas || []).find(function (t) { return String(t.ID_Tarea || '').trim() === idNorm; });

        if (item) {
          if (isActivity) {
            item.Estado = estadoDestino;
            item.Estado_Tarea = estadoDestino;
          } else {
            item.Estado_Tarea = estadoDestino;
          }
        }

        // 4. Cero llamadas a renderizarKanban(), cero esperas.

        // Función de reversión a columna anterior solo si Apps Script falla
        function revertirTarjetaColumna() {
          if (parentAnterior) {
            if (nextSiblingAnterior && nextSiblingAnterior.parentNode === parentAnterior) {
              parentAnterior.insertBefore(tarjetaArrastrada, nextSiblingAnterior);
            } else {
              parentAnterior.appendChild(tarjetaArrastrada);
            }
          }
          if (item) {
            if (isActivity) {
              item.Estado = estadoOrigen;
              item.Estado_Tarea = estadoOrigen;
            } else {
              item.Estado_Tarea = estadoOrigen;
            }
          }
          if (estadoOrigen && estadoOrigen !== estadoDestino) {
            var bOri = document.getElementById('count-' + estadoOrigen);
            if (bOri) bOri.textContent = (parseInt(bOri.textContent, 10) || 0) + 1;
          }
          if (estadoDestino && estadoOrigen !== estadoDestino) {
            var bDest = document.getElementById('count-' + estadoDestino);
            if (bDest) bDest.textContent = Math.max(0, (parseInt(bDest.textContent, 10) || 0) - 1);
          }
          actualizarEstadosVaciosKanban([estadoOrigen, estadoDestino]);

          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'error',
              title: 'Error de sincronización',
              text: 'No se pudo mover la tarjeta. Se restauró a su columna anterior.',
              confirmButtonColor: '#4f46e5'
            });
          }
        }

        // 5. Disparar persistencia en segundo plano (fire-and-forget)
        if (isActivity) {
          callBackend('updateestadoactividadpersonal', {
            idActividad: idNorm,
            id: idNorm,
            incrementarRacha: estadoDestino === '04_Completado',
            nuevoEstado: estadoDestino
          }, function (res) {
            if (!res || (res.success !== true && res.success !== 'true')) {
              revertirTarjetaColumna();
            }
          }, function (err) {
            revertirTarjetaColumna();
          }, { silent: true });
        } else {
          callBackend('updateTarea', {
            idTarea: idNorm,
            ID_Tarea: idNorm,
            id: idNorm,
            datos: { Estado_Tarea: estadoDestino },
            Estado_Tarea: estadoDestino,
            nuevoEstado: estadoDestino
          }, function (res) {
            if (!res || (res.success !== true && res.success !== 'true')) {
              revertirTarjetaColumna();
            }
          }, function (err) {
            revertirTarjetaColumna();
          }, { silent: true });
        }

        // Actualizaciones accesorias en segundo plano
        try {
          if (!isActivity && item && typeof recalcularAvanceCascada === 'function') {
            recalcularAvanceCascada(idNorm, item.ID_Hito, item.ID_Proyecto);
          }
          if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
        } catch (eCasc) {}
      });
    });
  }

  /**
   * 5.4. Alternador de cumplimiento (Check redondo en tarjeta)
   */
  function toggleCumplidoTarea(idTarea, ev) {
    if (ev) ev.stopPropagation();
    var idBuscado = String(idTarea || '').trim();
    if (idBuscado.startsWith('ACT-')) {
      var act = (state.actividadesPersonales || []).find(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idBuscado;
      });
      if (!act) return;
      var estadoAct = normalizarEstadoTarea(act.Estado || act.Estado_Tarea);
      var nuevoEstadoAct = (estadoAct === '04_Completado') ? '02_Por_Hacer' : '04_Completado';
      persistirEstadoTareaKanban(idBuscado, nuevoEstadoAct);
      return;
    }
    var tarea = (state.tareas || []).find(function (t) { return String(t.ID_Tarea || '').trim() === idBuscado; });
    if (!tarea) return;
    var nuevoEstado = (normalizarEstadoTarea(tarea.Estado_Tarea) === '04_Completado') ? '02_Por_Hacer' : '04_Completado';
    persistirEstadoTareaKanban(idBuscado, nuevoEstado);
  }

  /**
   * Alterna la visibilidad de los micro-popovers de filtros Kanban (soporte tap para móviles)
   */
  function toggleFilterPopover(e, popoverId) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    var targetPopover = document.getElementById(popoverId);
    if (!targetPopover) return;

    var isAlreadyOpen = targetPopover.classList.contains('filter-popover-open');

    // Cerrar cualquier otro popover abierto
    document.querySelectorAll('.kanban-hover-popover').forEach(function (p) {
      p.classList.remove('filter-popover-open', 'time-popover-open');
    });

    // Validar si el botón asociado está deshabilitado
    var associatedBtn;
    if (e && e.currentTarget) {
      associatedBtn = e.currentTarget;
    } else if (e && e.target) {
      associatedBtn = e.target.closest('button');
    }
    if (associatedBtn && (associatedBtn.disabled || associatedBtn.hasAttribute('disabled'))) {
      return;
    }

    if (!isAlreadyOpen) {
      targetPopover.classList.add('filter-popover-open');
    }
  }

  function toggleTimeFilterDropdown(e) {

      btnCapsule.removeAttribute('disabled');

      btnCapsule.title = 'Filtrar por hito del proyecto activo';
      btnCapsule.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
      btnCapsule.classList.add('opacity-100', 'cursor-pointer');

    var hitosOrdenados = (typeof ordenarHitosCronologicamente === 'function')

      var idH = String(h.idHito || h.ID_Hito || '').trim();
      var nomH = String(h.nombreHito || h.Nombre_Hito || 'Hito sin nombre').trim();

      html += '  <span class="flex items-center gap-1.5 truncate" title="[' + idH + '] ' + nomH + '"><span class="text-[10px] font-mono text-indigo-500 dark:text-indigo-400 font-bold shrink-0">[' + idH + ']</span><span class="truncate">' + nomH + '</span></span>';
      html += '  <span class="text-xs text-indigo-600 dark:text-indigo-400 font-bold shrink-0 hidden check-hito-indicator">✓</span>';
      html += '</button>';
    });

    if (listaEl) {

      setKanbanHitoFilter(valorAnterior, true);

  // Restaurar y sincronizar filtros guardados desde localStorage
  function sincronizarFiltroTemporalDesdeStorage() {
    try {
      var saved = localStorage.getItem('pmo_kanban_time_filter');
      if (saved && ['TODO', 'HOY', 'SEMANA', 'MES'].indexOf(saved.toUpperCase()) !== -1) {
        setKanbanTimeFilter(saved.toUpperCase(), true);
      } else {
        setKanbanTimeFilter('TODO', true);
      }
      var savedSort = localStorage.getItem('pmo_kanban_sort_mode');
      if (savedSort && typeof window.setSortModeKanban === 'function') {
        window.setSortModeKanban(savedSort, true);
      }
      var savedContext = localStorage.getItem('pmo_kanban_context_filter');
      if (savedContext && ['TODOS', 'PROYECTO', 'PERSONAL'].indexOf(savedContext.toUpperCase()) !== -1) {
        setKanbanContextFilter(savedContext.toUpperCase(), true);
      }
    } catch (eStorageInit) {
      setKanbanTimeFilter('TODO', true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sincronizarFiltroTemporalDesdeStorage);
  } else {
    sincronizarFiltroTemporalDesdeStorage();
  }

  function aplicarFiltrosCruzados() {
    var elHito = document.getElementById('filter-hito-tarea');
    var elPrio = document.getElementById('filter-prioridad-tarea');
    var elEnergia = document.getElementById('filter-energia-tarea');
    var elPlazo = document.getElementById('filter-plazo-tarea');
    var elDep = document.getElementById('filter-dependencia-tarea');
    var elBuscar = document.getElementById('filter-buscar-tarea');

    if (elHito) state.filtros.hitoTarea = (elHito.value || '').trim();
    if (elPrio) state.filtros.prioridadTarea = elPrio.value;
    if (elEnergia) state.filtros.energiaTarea = elEnergia.value;
    if (elPlazo) state.filtros.plazoTarea = elPlazo.value;
    if (elDep) state.filtros.dependenciaTarea = elDep.value;
    if (elBuscar) {
      state.filtros.buscarTarea = elBuscar.value.trim().toLowerCase();
      var btnClear = document.getElementById('btn-clear-task-search');
      if (btnClear) {
        if (state.filtros.buscarTarea) btnClear.classList.remove('hidden');
        else btnClear.classList.add('hidden');
      }
    }

    var contextFilter = state.kanbanContextFilter || 'TODOS';
    var timeFilter = state.kanbanTimeFilter || 'TODO';

    // Pre-indexación en Map O(1) para resolución relacional ultrarrápida
    var hitosMap = new Map();
    (state.hitos || []).forEach(function (h) {
      var idH = String(h.idHito || h.ID_Hito || h.id || '').trim().toUpperCase();
      if (idH) {
        var idProyH = String(h.idProyecto || h.ID_Proyecto || '').trim().toUpperCase();
        var nomH = String(h.nombreHito || h.Nombre_Hito || h.nombre || '').trim();
        hitosMap.set(idH, { idProyecto: idProyH, nombre: nomH });
      }
    });

    var proysMap = new Map();
    (state.proyectos || []).forEach(function (p) {
      var idP = String(p.idProyecto || p.ID_Proyecto || p.id || '').trim().toUpperCase();
      if (idP) {
        proysMap.set(idP, p);
      }
    });

    var selProy = state.selectedProjectId ? String(state.selectedProjectId).trim().toUpperCase() : null;
    if (selProy === 'TODOS' || selProy === 'ALL' || selProy === '' || selProy === 'GLOBAL' || selProy === 'NULL') {
      selProy = null;
    }

    // 1. Barrido acumulativo único para conteos de contexto y archivados (+10 días)
    var countProyectos = 0;

    var filtroTipo = (state.filtros.tipo && state.filtros.tipo !== 'Todos' && state.filtros.tipo !== 'TODOS') ? String(state.filtros.tipo).trim() : null;

    var filtroPrio = (state.filtros.prioridadTarea && state.filtros.prioridadTarea !== 'Todas' && state.filtros.prioridadTarea !== '') ? String(state.filtros.prioridadTarea).trim() : null;

    // Fechas de referencia para filtrado temporal reactivo
    var now = new Date();

    var dHoy = (now.getDate() < 10 ? '0' : '') + now.getDate();
    var hoyStr = yHoy + '-' + mHoy + '-' + dHoy;

    var dayOfWeek = now.getDay() || 7; // Lunes = 1, Domingo = 7
    var startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
    var endOfWeek = new Date(now);
    endOfWeek.setDate(now.getDate() + (7 - dayOfWeek));

    var yWStart = startOfWeek.getFullYear();
    var mWStart = (startOfWeek.getMonth() + 1 < 10 ? '0' : '') + (startOfWeek.getMonth() + 1);
    var dWStart = (startOfWeek.getDate() < 10 ? '0' : '') + startOfWeek.getDate();
    var startOfWeekStr = yWStart + '-' + mWStart + '-' + dWStart;

    var yWEnd = endOfWeek.getFullYear();
    var mWEnd = (endOfWeek.getMonth() + 1 < 10 ? '0' : '') + (endOfWeek.getMonth() + 1);
    var dWEnd = (endOfWeek.getDate() < 10 ? '0' : '') + endOfWeek.getDate();
    var endOfWeekStr = yWEnd + '-' + mWEnd + '-' + dWEnd;

    var startOfMonthStr = hoyStr.substring(0, 7) + '-01';
    var nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    var endOfMonth = new Date(nextMonth - 1);
    var yMEnd = endOfMonth.getFullYear();
    var mMEnd = (endOfMonth.getMonth() + 1 < 10 ? '0' : '') + (endOfMonth.getMonth() + 1);
    var dMEnd = (endOfMonth.getDate() < 10 ? '0' : '') + endOfMonth.getDate();
    var endOfMonthStr = yMEnd + '-' + mMEnd + '-' + dMEnd;

    // 2. Filtrar Tareas de Proyectos (si el contexto es TODOS o PROYECTOS)
    var tareasFiltradas = [];
    if (contextFilter === 'TODOS' || contextFilter === 'PROYECTOS') {
      tareasFiltradas = (state.tareas || []).filter(function (t) {

        if (!colDestino) return false;

        // Regla estricta: todo objeto completado/conciliado con más de 10 días desaparece del canvas activo
        if (typeof esElementoArchivado === 'function' && esElementoArchivado(t)) {
          return false;
        }

        var idProyTarea = String(t.ID_Proyecto || '').trim().toUpperCase();
        var idHitoTarea = String(t.ID_Hito || '').trim().toUpperCase();

        if (!idProyTarea && idHitoTarea) {
          var hitoAsoc = hitosMap.get(idHitoTarea);
          if (hitoAsoc && hitoAsoc.idProyecto) {
            idProyTarea = hitoAsoc.idProyecto;
          } else if (idHitoTarea.indexOf('-H') !== -1) {
            idProyTarea = idHitoTarea.substring(0, idHitoTarea.lastIndexOf('-H')).trim();
          }
        }

        // Filtro por Proyecto seleccionado
        if (selProy) {
          var coincideDirecto = (idProyTarea === selProy);

          if (!coincideDirecto && idHitoTarea) {
            var hitoPadre = hitosMap.get(idHitoTarea);

          if (!coincideDirecto && !coincidePorHito) return false;
        }

        // Filtro por Hito específico
        if (filtroHito) {
          var idHitoTareaNorm = String(t.ID_Hito || '').trim().toUpperCase();
          if (idHitoTareaNorm !== filtroHito.toUpperCase()) return false;
        }

        // Filtro por Cartera / Tipo de Iniciativa
        if (filtroTipo && idProyTarea) {
          var pPadre = proysMap.get(idProyTarea);
          if (pPadre && pPadre.Tipo_Iniciativa !== filtroTipo) return false;
        }

        // Filtro de Prioridad Eisenhower
        if (filtroPrio) {
          var prioT = String(t.Prioridad_Eisenhower || '').toLowerCase();
          if (filtroPrio === '01_P1_Alta') {
            if (prioT.indexOf('01') === -1 && prioT.indexOf('p1') === -1 && prioT.indexOf('alta') === -1 && prioT.indexOf('urgente') === -1) return false;
          } else if (filtroPrio === '02_P2_Media') {

          } else if (filtroPrio === '03_P3_Baja') {
            if (prioT.indexOf('03') === -1 && prioT.indexOf('p3') === -1 && prioT.indexOf('baja') === -1) return false;
          } else if (filtroPrio === '04_P4') {
            if (prioT.indexOf('04') === -1 && prioT.indexOf('p4') === -1) return false;
          } else if (prioT.indexOf(filtroPrio.toLowerCase()) === -1) {
            return false;
          }
        }

        // Filtro de Tipo de Trabajo / Nivel de Energía (Homologación canónica)
        if (filtroEnergia) {
          var energT = String(t.Nivel_Energia_Requerido || '');
          if (filtroEnergia === 'Alta_DeepWork' && energT.indexOf('Alta') === -1 && energT.indexOf('DeepWork') === -1 && energT.indexOf('Estrategica') === -1) return false;
          if (filtroEnergia === 'Media_Operativa' && energT.indexOf('Media') === -1 && energT.indexOf('Operativa') === -1 && energT !== '') return false;
          if (filtroEnergia === 'Baja_Automatica' && energT.indexOf('Baja') === -1 && energT.indexOf('Automatica') === -1 && energT.indexOf('Admin') === -1) return false;
        }

        // Filtro de Plazo / Vencimiento
        var fechaT = t.Fecha_Programada ? String(t.Fecha_Programada).split('T')[0].split(' ')[0] : (t.Fecha_Fin_Plan ? String(t.Fecha_Fin_Plan).split('T')[0] : '');
        var estaCompletada = (colDestino === '04_Completado');

        if (filtroPlazo) {
          if (filtroPlazo === 'vencidas') {
            if (!fechaT || fechaT >= hoyStr || estaCompletada) return false;
          } else if (filtroPlazo === 'hoy') {
            if (fechaT !== hoyStr) return false;
          } else if (filtroPlazo === '7dias') {
            if (!fechaT) return false;
            var dHoyDate = new Date(hoyStr);
            var dFechaDate = new Date(fechaT);
            var diffDays = Math.ceil((dFechaDate - dHoyDate) / (1000 * 60 * 60 * 24));
            if (diffDays < 0 || diffDays > 7) return false;
          } else if (filtroPlazo === 'sin_fecha') {
            if (fechaT) return false;
          }
        }

        // Filtro de Dependencias
        if (filtroDep) {
          var depId = String(t.ID_Dependencia || '').trim();
          var tieneDep = depId !== '' && !depId.includes('@google.com');
          if (filtroDep === 'con_dep' && !tieneDep) return false;
          if (filtroDep === 'sin_dep' && tieneDep) return false;
        }

        // Buscador de Tareas
        if (filtroBuscar) {
          var idTarMatch = String(t.ID_Tarea || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var nomTarMatch = String(t.Nombre_Tarea_Actividad || t.Nombre_Tarea || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var descMatch = String(t.Descripcion_Entregable || t.Notas_Impedimentos || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var respMatch = String(t.Responsable || t.Responsable_Ejecutor || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          if (!idTarMatch && !nomTarMatch && !descMatch && !respMatch) return false;
        }

        // Filtro Temporal Reactivo (Todo | Hoy | Esta Semana | Este Mes)
        if (timeFilter === 'HOY') {
          var esHoy = (fechaT === hoyStr);
          var esEnProceso = (colDestino === '03_En_Proceso');
          var esPorHacerHoyOVencida = (colDestino === '02_Por_Hacer' && (!fechaT || fechaT <= hoyStr));
          if (!esHoy && !esEnProceso && !esPorHacerHoyOVencida) return false;
        } else if (timeFilter === 'SEMANA') {
          var enSemana = (fechaT >= startOfWeekStr && fechaT <= endOfWeekStr);
          var pendienteAtrasada = (fechaT && fechaT < startOfWeekStr && !estaCompletada);
          var enCurso = (colDestino === '03_En_Proceso');
          if (!enSemana && !pendienteAtrasada && !enCurso) return false;
        } else if (timeFilter === 'MES') {
          var enMes = (fechaT >= startOfMonthStr && fechaT <= endOfMonthStr);
          var pendienteAtrasadaMes = (fechaT && fechaT < startOfMonthStr && !estaCompletada);
          var enCursoMes = (colDestino === '03_En_Proceso');
          if (!enMes && !pendienteAtrasadaMes && !enCursoMes) return false;
        }

        return true;
      });
    }

    // 3. Filtrar Actividades Personales (si el contexto es TODOS o PERSONAL, y no hay filtro restrictivo de proyecto o hito)
    var actividadesFiltradas = [];
    if ((contextFilter === 'TODOS' || contextFilter === 'PERSONAL') && !selProy && !filtroTipo && !filtroDep && !filtroHito) {
      actividadesFiltradas = (state.actividadesPersonales || []).filter(function (a) {
        var colDestino = normalizarEstadoTarea(a.Estado || a.Estado_Tarea);
        if (!colDestino) return false;

        // Regla estricta: todo objeto completado/conciliado con más de 10 días desaparece del canvas activo
        if (typeof esElementoArchivado === 'function' && esElementoArchivado(a)) {
          return false;
        }

        // Filtro de Prioridad Eisenhower
        if (filtroPrio) {
          var prioA = String(a.Prioridad_Eisenhower || '').toLowerCase();
          if (filtroPrio === '01_P1_Alta') {
            if (prioA.indexOf('01') === -1 && prioA.indexOf('p1') === -1 && prioA.indexOf('alta') === -1 && prioA.indexOf('urgente') === -1) return false;
          } else if (filtroPrio === '02_P2_Media') {
            if (prioA.indexOf('02') === -1 && prioA.indexOf('p2') === -1 && prioA.indexOf('media') === -1) return false;
          } else if (filtroPrio === '03_P3_Baja') {
            if (prioA.indexOf('03') === -1 && prioA.indexOf('p3') === -1 && prioA.indexOf('baja') === -1) return false;
          } else if (filtroPrio === '04_P4') {
            if (prioA.indexOf('04') === -1 && prioA.indexOf('p4') === -1) return false;
          } else if (prioA.indexOf(filtroPrio.toLowerCase()) === -1) {
            return false;
          }
        }

        // Filtro de Plazo / Vencimiento
        var fechaA = a.Fecha_Programada ? String(a.Fecha_Programada).split('T')[0].split(' ')[0] : '';
        var estaCompletada = (colDestino === '04_Completado');

        if (filtroPlazo) {
          if (filtroPlazo === 'vencidas') {
            if (!fechaA || fechaA >= hoyStr || estaCompletada) return false;
          } else if (filtroPlazo === 'hoy') {
            if (fechaA !== hoyStr) return false;
          } else if (filtroPlazo === '7dias') {
            if (!fechaA) return false;
            var dHoyD = new Date(hoyStr);
            var dFechaD = new Date(fechaA);
            var diffDaysA = Math.ceil((dFechaD - dHoyD) / (1000 * 60 * 60 * 24));
            if (diffDaysA < 0 || diffDaysA > 7) return false;
          } else if (filtroPlazo === 'sin_fecha') {
            if (fechaA) return false;

        }

        // Buscador de Tareas/Actividades
        if (filtroBuscar) {
          var idActMatch = String(a.ID_Actividad || a.ID_Tarea || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var nomActMatch = String(a.Nombre_Actividad || a.Nombre_Tarea_Actividad || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var catMatch = String(a.Categoria_Vida || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          var notasMatch = String(a.Notas_Checklist || '').toLowerCase().indexOf(filtroBuscar) !== -1;
          if (!idActMatch && !nomActMatch && !catMatch && !notasMatch) return false;
        }

        // Filtro Temporal Reactivo (Todo | Hoy | Esta Semana | Este Mes)
        var esHabitualDiario = (String(a.Tipo_Compromiso || '').toUpperCase() === 'HABITUAL' && (String(a.Frecuencia_Ciclo || '').toUpperCase() === 'DIARIA' || !a.Frecuencia_Ciclo));
        var esHabitualSemanal = (String(a.Tipo_Compromiso || '').toUpperCase() === 'HABITUAL' && String(a.Frecuencia_Ciclo || '').toUpperCase() === 'SEMANAL');

        if (timeFilter === 'HOY') {
          var esHoy = (fechaA === hoyStr);
          var esEnProceso = (colDestino === '03_En_Proceso');
          var esPorHacerHoy = (colDestino === '02_Por_Hacer' && (!fechaA || fechaA <= hoyStr));
          if (!esHoy && !esHabitualDiario && !esEnProceso && !esPorHacerHoy) return false;
        } else if (timeFilter === 'SEMANA') {
          var enSemana = (fechaA >= startOfWeekStr && fechaA <= endOfWeekStr);
          var esHabitual = (esHabitualDiario || esHabitualSemanal);
          var pendienteAtrasada = (fechaA && fechaA < startOfWeekStr && !estaCompletada);
          var enCurso = (colDestino === '03_En_Proceso');
          if (!enSemana && !esHabitual && !pendienteAtrasada && !enCurso) return false;
        } else if (timeFilter === 'MES') {
          var enMes = (fechaA >= startOfMonthStr && fechaA <= endOfMonthStr);
          var esHabitoMes = (String(a.Tipo_Compromiso || '').toUpperCase() === 'HABITUAL');
          var pendienteAtrasadaMes = (fechaA && fechaA < startOfMonthStr && !estaCompletada);
          var enCursoMes = (colDestino === '03_En_Proceso');

    // 4. Unificación de tarjetas para renderizado Kanban
    var itemsCombinados = tareasFiltradas.concat(actividadesFiltradas);

        return nA.localeCompare(nB);
      } else { // PRIORITY
        var pA = String(a.Prioridad_Eisenhower || a.Prioridad || '04_P4').toLowerCase();
        var pB = String(b.Prioridad_Eisenhower || b.Prioridad || '04_P4').toLowerCase();
        return pA.localeCompare(pB);
      }
    });
    var totalConsolidado = countTodos;

    var hayFiltrosActivos = !!(selProy || filtroTipo || filtroHito || filtroPrio || filtroEnergia || filtroPlazo || filtroDep || filtroBuscar || contextFilter !== 'TODOS' || timeFilter !== 'TODO');
    actualizarBannerFiltrosKanban(itemsCombinados.length, totalConsolidado, hayFiltrosActivos, filtroHito);

    try {
      kanban.render(itemsCombinados);
    } catch (errKanban) {
      console.error('[Kanban render err]:', errKanban);
    }

    try {
      recalcularGastoVisible();
    } catch (errGasto) {
      console.error('[Gasto contextual err]:', errGasto);
    }
  }

  function recalcularGastoVisible() {

    if (!lblGasto) return;

    if (state.selectedProjectId) {

        return String(x.ID_Proyecto || '').trim().toUpperCase() === state.selectedProjectId;
      });
      var gasto = p ? (parseFloat(p.Costo_Ejecutado_Real_PEN) || 0) : 0;
      if (lblTitulo) lblTitulo.textContent = 'Gasto Proy:';
      lblGasto.textContent = 'PEN ' + gasto.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } else {
      var total = (state.proyectos || []).reduce(function (acc, cur) {
        return acc + (parseFloat(cur.Costo_Ejecutado_Real_PEN) || 0);
      }, 0);
      if (lblTitulo) lblTitulo.textContent = 'Gasto Global:';
      lblGasto.textContent = 'PEN ' + total.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  }

    if (btnLimpiar) {
      btnLimpiar.classList.add('hidden');
      btnLimpiar.classList.remove('inline-flex', 'flex');
    }

    if (typeof actualizarBarraMetadatosProyectoKanban === 'function') {
      actualizarBarraMetadatosProyectoKanban(null);
    }

    if (typeof actualizarSelectorHitosKanban === 'function') {
      actualizarSelectorHitosKanban(false);
    }

    if (typeof renderSidebarProyectos === 'function') {
      renderSidebarProyectos();
    }
    if (typeof aplicarFiltrosCruzados === 'function') {
      aplicarFiltrosCruzados();
    }
  }
  window.limpiarTodosLosFiltrosKanban = limpiarTodosLosFiltrosKanban;
  window.limpiarFiltrosKanban = limpiarTodosLosFiltrosKanban;

  function limpiarBusquedaTareas() {
    state.filtros.buscarTarea = '';
    var elBuscar = document.getElementById('filter-buscar-tarea');
    if (elBuscar) elBuscar.value = '';
    var btnClearTask = document.getElementById('btn-clear-task-search');
    if (btnClearTask) btnClearTask.classList.add('hidden');
    aplicarFiltrosCruzados();
  }

  /**
   * Actualiza el modo de ordenamiento de Kanban y persiste en localStorage
   */
  window.setSortModeKanban = function (mode, skipApply) {
    if (!mode) return;
    localStorage.setItem('pmo_kanban_sort_mode', mode);
    var iconMap = {
      'PRIORITY': '<svg class="w-4 h-4 shrink-0 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
      'DATE': '<svg class="w-4 h-4 shrink-0 text-indigo-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>',
      'ENERGY': '<svg class="w-4 h-4 shrink-0 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
      'HOURS': '<svg class="w-4 h-4 shrink-0 text-teal-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      'ALPHA': '<svg class="w-4 h-4 shrink-0 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M20 8h-5"/><path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10"/><path d="M15 14h5l-5 6h5"/></svg>'
    };
    var btnMain = document.getElementById('label-sort-kanban-icon');
    if (btnMain) btnMain.innerHTML = iconMap[mode] || iconMap['PRIORITY'];

    document.querySelectorAll('.btn-sort-kanban-opt').forEach(function (btn) {
      if (btn.dataset.val === mode) {
        btn.className = 'btn-sort-kanban-opt h-8 w-8 rounded-lg flex items-center justify-center text-sm transition-all bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 ring-1 ring-indigo-500';
      } else {
        btn.className = 'btn-sort-kanban-opt h-8 w-8 rounded-lg flex items-center justify-center text-sm transition-all hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500';
      }
    });

    // Cerrar popover si está abierto
    document.querySelectorAll('.kanban-hover-popover').forEach(function (p) {
      p.classList.remove('filter-popover-open', 'time-popover-open');
    });

    if (!skipApply) {
      aplicarFiltrosCruzados();
    }
  };

  function limpiarFiltrosSecundarios() {
    if (typeof window.limpiarFiltrosKanban === 'function') {
      window.limpiarFiltrosKanban();
    } else {
      limpiarTodosLosFiltrosKanban();
    }
  }

  window.limpiarTodosLosFiltrosKanban = limpiarTodosLosFiltrosKanban;
  window.limpiarFiltrosSecundarios = limpiarFiltrosSecundarios;
  window.limpiarBusquedaTareas = limpiarBusquedaTareas;
  window.aplicarFiltrosCruzados = aplicarFiltrosCruzados;
  window.renderKanban = aplicarFiltrosCruzados;
  window.crearTarjetaKanbanHTML = crearTarjetaKanbanHTML;
  window.setKanbanTimeFilter = setKanbanTimeFilter;
  window.toggleTimeFilterDropdown = toggleTimeFilterDropdown;
  window.toggleFilterPopover = toggleFilterPopover;
  window.setKanbanPrioridadFilter = setKanbanPrioridadFilter;
  window.setKanbanEnergiaFilter = setKanbanEnergiaFilter;
  window.setKanbanPlazoFilter = setKanbanPlazoFilter;
  window.setKanbanDependenciaFilter = setKanbanDependenciaFilter;
  window.setKanbanHitoFilter = setKanbanHitoFilter;
  window.actualizarSelectorHitosKanban = actualizarSelectorHitosKanban;
  window.setKanbanContextFilter = setKanbanContextFilter;
  window.filtrarPorPildoraTipo = filtrarPorPildoraTipo;

  function filtrarPorPildoraTipo(tipo) {
    state.filtros.tipo = tipo;
    document.querySelectorAll('.pill-tipo').forEach(function (btn) {
      btn.className = (btn.dataset.tipo === tipo)
        ? 'pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-indigo-600 text-white'
        : 'pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-400 hover:text-white';
    });
    if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
    aplicarFiltrosCruzados();
  }

  if (typeof window.limpiarBusquedaSidebar !== 'function') {
    window.limpiarBusquedaSidebar = function () {
      if (state && state.filtros) state.filtros.busquedaSidebar = '';
      var input = document.getElementById('sidebar-search-proyectos');
      if (input) input.value = '';
      var clearBtn = document.getElementById('btn-clear-search-sidebar');
      if (clearBtn) clearBtn.classList.add('hidden');
      if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
    };
  }

  // Disparo inicial si las columnas existen en el DOM y no tienen tarjetas reales
  if (typeof renderKanbanSkeletons === 'function') {
    var _colTest = document.getElementById('col-backlog');
    if (_colTest && _colTest.querySelectorAll('.kanban-card:not(.kanban-skeleton-card)').length === 0) {
      renderKanbanSkeletons();
    }
  }

  /* ===================================================================== */
  /* CONTROLADORES RESPONSIVOS KANBAN MÓVIL (< 768px)                       */
  /* ESTÁNDAR: COBALT AERODYNAMIC A.2.2                                    */
  /* ===================================================================== */
  function seleccionarColumnaKanbanMovil(colId) {
    if (!colId) return;
    // 1. Alternar visibilidad de las columnas
    var cols = document.querySelectorAll('.kanban-col-container');
    cols.forEach(function (col) {
      if (col.getAttribute('data-state') === colId) {
        col.classList.add('kanban-col-mobile-active');
      } else {
        col.classList.remove('kanban-col-mobile-active');
      }
    });

    // 2. Alternar clases activas de las pestañas táctiles
    var tabs = document.querySelectorAll('.kanban-tab-btn');
    tabs.forEach(function (btn) {
      var id = btn.id || '';
      if (id === 'tab-col-' + colId) {
        btn.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-xs');
        btn.classList.remove('text-slate-600', 'dark:text-slate-400');
        if (colId === '01_Backlog') btn.classList.add('text-slate-700', 'dark:text-slate-200');
        else if (colId === '02_Por_Hacer') btn.classList.add('text-blue-600', 'dark:text-blue-400');
        else if (colId === '03_En_Proceso') btn.classList.add('text-amber-600', 'dark:text-amber-400');
        else if (colId === '04_Completado') btn.classList.add('text-emerald-600', 'dark:text-emerald-400');
      } else {
        btn.classList.remove(
          'bg-white', 'dark:bg-slate-800', 'shadow-xs',
          'text-slate-700', 'dark:text-slate-200',
          'text-blue-600', 'dark:text-blue-400',
          'text-amber-600', 'dark:text-amber-400',
          'text-emerald-600', 'dark:text-emerald-400'
        );
        btn.classList.add('text-slate-600', 'dark:text-slate-400');
      }
    });
  }

  function abrirModalFiltrosKanbanMovil() {
    var modal = document.getElementById('modal-filtros-kanban-movil');
    if (!modal) return;
    actualizarPillsFiltrosMovil();
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function cerrarModalFiltrosKanbanMovil() {
    var modal = document.getElementById('modal-filtros-kanban-movil');
    if (!modal) return;
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function actualizarPillsFiltrosMovil() {
    var prio = (document.getElementById('filter-prioridad-tarea') || {}).value || '';
    var energia = (document.getElementById('filter-energia-tarea') || {}).value || '';
    var plazo = (document.getElementById('filter-plazo-tarea') || {}).value || '';
    var dep = (document.getElementById('filter-dependencia-tarea') || {}).value || '';

    // Actualizar estilo activo en pills de prioridad
    document.querySelectorAll('.pill-filtro-movil-prio').forEach(function(b) {
      if ((b.getAttribute('data-val') || '') === prio) {
        b.classList.add('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.remove('border-slate-200', 'dark:border-slate-700');
      } else {
        b.classList.remove('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.add('border-slate-200', 'dark:border-slate-700');
      }
    });

    // Actualizar estilo activo en pills de energía
    document.querySelectorAll('.pill-filtro-movil-energia').forEach(function(b) {
      if ((b.getAttribute('data-val') || '') === energia) {
        b.classList.add('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.remove('border-slate-200', 'dark:border-slate-700');
      } else {
        b.classList.remove('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.add('border-slate-200', 'dark:border-slate-700');
      }
    });

    // Actualizar estilo activo en pills de plazo
    document.querySelectorAll('.pill-filtro-movil-plazo').forEach(function(b) {
      if ((b.getAttribute('data-val') || '') === plazo) {
        b.classList.add('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.remove('border-slate-200', 'dark:border-slate-700');
      } else {
        b.classList.remove('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.add('border-slate-200', 'dark:border-slate-700');
      }
    });

    // Actualizar estilo activo en pills de dependencia
    document.querySelectorAll('.pill-filtro-movil-dep').forEach(function(b) {
      if ((b.getAttribute('data-val') || '') === dep) {
        b.classList.add('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.remove('border-slate-200', 'dark:border-slate-700');
      } else {
        b.classList.remove('bg-indigo-50', 'dark:bg-indigo-950/60', 'text-indigo-600', 'dark:text-indigo-400', 'border-indigo-400');
        b.classList.add('border-slate-200', 'dark:border-slate-700');
      }
    });

    // Actualizar badge contador en botón móvil de filtros
    var activeCount = (prio ? 1 : 0) + (energia ? 1 : 0) + (plazo ? 1 : 0) + (dep ? 1 : 0);
    var badgeFiltros = document.getElementById('badge-count-filtros-movil');
    if (badgeFiltros) {
      if (activeCount > 0) {
        badgeFiltros.textContent = activeCount;
        badgeFiltros.classList.remove('hidden');
      } else {
        badgeFiltros.classList.add('hidden');
      }
    }
  }

  window.seleccionarColumnaKanbanMovil = seleccionarColumnaKanbanMovil;
  window.abrirModalFiltrosKanbanMovil = abrirModalFiltrosKanbanMovil;
  window.cerrarModalFiltrosKanbanMovil = cerrarModalFiltrosKanbanMovil;
  window.actualizarPillsFiltrosMovil = actualizarPillsFiltrosMovil;
</script>
