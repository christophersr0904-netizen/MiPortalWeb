    'SOCIAL_FAMILIA': {
      clave: 'SOCIAL_FAMILIA',

    }
  };
  var CATEGORIAS_VIDA_CONFIG = window.CATEGORIAS_VIDA_CONFIG;

  function normalizarCategoriaVida(catRaw) {
    var raw = String(catRaw || '').trim().toUpperCase().replace(/[\s-]/g, '_');
    if (raw === 'SALUD_DEPORTE' || raw === 'SALUD' || raw === 'DEPORTE') return 'SALUD_DEPORTE';
    if (raw === 'DESARROLLO_PERSONAL' || raw === 'DESARROLLO_ESTUDIO' || raw === 'ESTUDIO' || raw === 'DESARROLLO') return 'DESARROLLO_ESTUDIO';
    if (raw === 'TRABAJO_CARRERA' || raw === 'LABORAL_HONORARIO' || raw === 'TRABAJO' || raw === 'LABORAL' || raw === 'CARRERA') return 'LABORAL_HONORARIO';
    if (raw === 'FINANZAS_ADMIN' || raw === 'FINANZAS_TRAMITES' || raw === 'FINANZAS' || raw === 'ADMIN') return 'FINANZAS_TRAMITES';
    if (raw === 'HOGAR_FAMILIA' || raw === 'SOCIAL_FAMILIA' || raw === 'HOGAR' || raw === 'FAMILIA' || raw === 'SOCIAL') return 'SOCIAL_FAMILIA';
    if (raw === 'OCIO_SOCIAL' || raw === 'PERSONAL_DESCANSO' || raw === 'OCIO' || raw === 'DESCANSO' || raw === 'PERSONAL') return 'PERSONAL_DESCANSO';
    return 'SALUD_DEPORTE';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function lanzarCelebracionConfetti(racha) {
    try {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: (racha >= 5) ? 60 : 30,
          spread: 55,
          origin: { y: 0.75 },
          colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'],
          ticks: 200,
          zIndex: 99999
        });
      }
    } catch (eConf) { }
  }

  function parsearChecklistActividad(notas) {
    if (!notas || typeof notas !== 'string') return null;
    var lineas = notas.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    if (lineas.length === 0) return null;

    var checks = lineas.filter(function (l) { return /^-\s*\[([ xX])\]/.test(l); });
    if (checks.length > 0) {
      var completados = checks.filter(function (l) { return /^-\s*\[([xX])\]/.test(l); }).length;
      var total = checks.length;
      var pct = Math.round((completados / total) * 100);
      return {
        esChecklist: true,
        total: total,
        completados: completados,
        pct: pct,
        label: completados + '/' + total + ' items (' + pct + '%)'
      };
    }

    return {
      esChecklist: false,
      texto: lineas[0] + (lineas.length > 1 ? ' (+' + (lineas.length - 1) + ' más)' : '')
    };
  }

  function formatearDuracionMinutos(durHoras) {
    var h = parseFloat(durHoras);
    if (isNaN(h)) return '1h';
    if (h === 0) return '0m (Puntual)';
    if (h < 1) return Math.round(h * 60) + 'm';
    if (h === 1) return '1h';
    var restoMin = Math.round((h % 1) * 60);
    if (restoMin === 0) return Math.floor(h) + 'h';
    return Math.floor(h) + 'h ' + restoMin + 'm';
  }

  var CATEGORIAS_HABITOS_CANONICAS = [
    'SALUD_DEPORTE',
    'DESARROLLO_ESTUDIO',
    'LABORAL_HONORARIO',
    'FINANZAS_TRAMITES',
    'SOCIAL_FAMILIA',
    'PERSONAL_DESCANSO'
  ];

  /**
   * Registro en memoria de eliminaciones pendientes con opción 'Deshacer'
   */
  var pendingDeletionsHabitos = {};

  /**
   * Vinculación individual de Drag & Drop para una tarjeta (Google Tasks style)
   */
  function vincularDragCard(card) {
    if (!card || !card.getAttribute || !card.hasAttribute('draggable')) return;
    if (card.dataset.dragReady === 'true') return;
    card.dataset.dragReady = 'true';

    card.addEventListener('dragstart', function (e) {
      e.stopPropagation();
      var idAct = card.dataset.idActividad;
      e.dataTransfer.setData('text/plain', idAct);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('opacity-40', 'scale-95', 'rotate-1', 'shadow-2xl', 'border-indigo-500');
    });

    card.addEventListener('dragend', function () {
      card.classList.remove('opacity-40', 'scale-95', 'rotate-1', 'shadow-2xl', 'border-indigo-500');
      document.querySelectorAll('#vista-habitos-wrapper .kanban-col-body').forEach(function (body) {
        body.classList.remove('kanban-dropzone-active', 'bg-indigo-50/40', 'dark:bg-slate-800/40', 'border-2', 'border-dashed', 'border-indigo-400', 'rounded-2xl');
      });
    });
  }

  /**
   * Cálculo acumulativo lineal O(N) de métricas Bento y filtros para Hábitos & Vida
   */
  function calcularKPIsHabitosEnUnSoloPase() {
    var actividades = state.actividadesPersonales || [];
    var hoyStr = new Date().toISOString().split('T')[0];
    var kpis = {
      total: actividades.length,
      countHabitual: 0,
      countUnico: 0,
      countRacha: 0,
      maxRacha: 0,
      habConRachaCount: 0,
      sumaRachas: 0,
      completadosHoy: 0,
      horasInvertidasGlobal: 0,
      controlTotal: 0,
      controlCumplidos: 0,
      maxRachaControl: 0,
      pilarCounts: {
        'SALUD_DEPORTE': 0,
        'DESARROLLO_ESTUDIO': 0,
        'LABORAL_HONORARIO': 0,
        'FINANZAS_TRAMITES': 0,
        'SOCIAL_FAMILIA': 0,
        'PERSONAL_DESCANSO': 0
      }
    };
    var regexControl = /(dejar|evitar|reducir|limitar|no\s+|cero|sin\s+|fumar|alcohol|azucar|chatarra|procrastinar|redes|pantalla|gasto|eliminar|erradicar)/i;

    actividades.forEach(function (a) {
      var racha = parseInt(a.Racha_Actual, 10) || 0;
      var esHabitual = (a.Tipo_Compromiso === 'HABITUAL');
      var catNorm = normalizarCategoriaVida(a.Categoria_Vida);
      var durHoras = parseFloat(a.Duracion_Horas || 0);

      if (esHabitual) kpis.countHabitual++;
      else kpis.countUnico++;
      if (racha > 0) kpis.countRacha++;

      if (racha > kpis.maxRacha) kpis.maxRacha = racha;
      if (esHabitual && racha > 0) {
        kpis.habConRachaCount++;
        kpis.sumaRachas += racha;
      }

      var esComp = (a.Estado === '04_Completado');
      if (esHabitual && a.Fecha_Programada > hoyStr && racha > 0) {
        esComp = true;
      }
      if (esComp) {
        kpis.completadosHoy++;
        kpis.horasInvertidasGlobal += durHoras;
      }

      if (kpis.pilarCounts[catNorm] !== undefined) {
        kpis.pilarCounts[catNorm]++;
      }

      var esControl = regexControl.test(a.Nombre_Actividad || '') || regexControl.test(a.Notas_Checklist || '');
      if (esControl) {
        kpis.controlTotal++;
        if (a.Estado === '04_Completado') kpis.controlCumplidos++;
        if (racha > kpis.maxRachaControl) kpis.maxRachaControl = racha;
      }
    });

    return kpis;
  }

  /**
   * Actualización instantánea de los KPIs Bento globales de Hábitos y Vida (0ms)
   */
  function actualizarKPIsGlobalesHabitos(kpisInput) {
    var kpis = kpisInput || calcularKPIsHabitosEnUnSoloPase();

    // Conteo para Píldoras de Filtro
    var bTodos = document.getElementById('badge-filtro-TODOS');
    if (bTodos) bTodos.textContent = kpis.total;
    var bHab = document.getElementById('badge-filtro-HABITUAL');
    if (bHab) bHab.textContent = kpis.countHabitual;
    var bUni = document.getElementById('badge-filtro-UNICO');
    if (bUni) bUni.textContent = kpis.countUnico;
    var bRacha = document.getElementById('badge-filtro-RACHA');
    if (bRacha) bRacha.textContent = kpis.countRacha;

    // Resaltar píldora activa
    var chips = ['TODOS', 'HABITUAL', 'UNICO', 'RACHA'];
    chips.forEach(function (tipo) {
      var btnChip = document.getElementById('filtro-habito-' + tipo);
      if (btnChip) {
        if (state.filtroTipoHabito === tipo) {
          btnChip.className = 'chip-filtro-habito btn-portal-primary text-xs shadow-xs active:scale-95';
          var bd = btnChip.querySelector('span:last-child');
          if (bd) bd.className = 'text-[10px] px-1.5 py-0.2 rounded-full bg-white/20 font-black tabular-nums';
        } else {
          btnChip.className = 'chip-filtro-habito btn-portal-secondary text-xs active:scale-95';
          var bd = btnChip.querySelector('span:last-child');
          if (bd) bd.className = 'text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-800 font-bold tabular-nums';
        }
      }
    });

    // 1. KPI BENTO 1: RACHAS & CONSISTENCIA (STREAKS)
    var promRacha = kpis.habConRachaCount > 0 ? (kpis.sumaRachas / kpis.habConRachaCount).toFixed(1) : '0';
    var elRacha = document.getElementById('kpi-mayor-racha');
    if (elRacha) elRacha.textContent = kpis.maxRacha + (kpis.maxRacha === 1 ? ' día' : ' días');
    var elRachaSub = document.getElementById('kpi-racha-subtexto');
    if (elRachaSub) elRachaSub.textContent = kpis.habConRachaCount + ' en racha · Prom. ' + promRacha + 'd';

    // 2. KPI BENTO 2: TASA DE CUMPLIMIENTO DIARIO
    var pctGlobal = kpis.total > 0 ? Math.round((kpis.completadosHoy / kpis.total) * 100) : 0;
    var elHoyRatio = document.getElementById('kpi-habitos-hoy-ratio');
    if (elHoyRatio) elHoyRatio.textContent = kpis.completadosHoy + ' / ' + kpis.total;
    var kpiCumplimiento = document.getElementById('kpi-habitos-global-cumplimiento');
    if (kpiCumplimiento) kpiCumplimiento.textContent = pctGlobal + '%';
    var elHoyBar = document.getElementById('kpi-habitos-hoy-bar');
    if (elHoyBar) elHoyBar.style.width = pctGlobal + '%';

    // 3. KPI BENTO 3: BALANCE DE PILARES DE VIDA
    var categoriasActivas = 0;
    var pilarLider = 'Ninguno';
    var maxCountPilar = -1;
    var NOMBRES_CANONICOS = {
      'SALUD_DEPORTE': 'Salud & Deporte',
      'DESARROLLO_ESTUDIO': 'Desarrollo Personal',
      'LABORAL_HONORARIO': 'Trabajo & Carrera',
      'FINANZAS_TRAMITES': 'Finanzas & Admin',
      'SOCIAL_FAMILIA': 'Hogar & Familia',
      'PERSONAL_DESCANSO': 'Ocio & Social'
    };
    CATEGORIAS_HABITOS_CANONICAS.forEach(function (cat) {
      var count = kpis.pilarCounts[cat] || 0;
      if (count > 0) categoriasActivas++;
      if (count > maxCountPilar) {
        maxCountPilar = count;
        pilarLider = NOMBRES_CANONICOS[cat] || cat;
      }
    });

    var elPilares = document.getElementById('kpi-balance-pilares');
    if (elPilares) elPilares.textContent = categoriasActivas + ' / 6 pilares';
    var elPilaresSub = document.getElementById('kpi-balance-subtexto');
    if (elPilaresSub) {
      elPilaresSub.textContent = categoriasActivas === 6 ? 'Equilibrio total de vida' : 'Líder: ' + pilarLider;
    }

    // 4. KPI BENTO 4: RADAR DE HÁBITOS & CONTROL PSICOLÓGICO
    var elRadar = document.getElementById('kpi-radar-habitos');
    var elRadarSub = document.getElementById('kpi-radar-subtexto');
    if (kpis.controlTotal > 0) {
      if (elRadar) elRadar.textContent = kpis.controlTotal + ' en control';
      if (elRadarSub) elRadarSub.textContent = (kpis.maxRachaControl > 0 ? kpis.maxRachaControl + ' días limpios' : kpis.controlCumplidos + '/' + kpis.controlTotal + ' cumplidos hoy');
    } else {
      if (elRadar) elRadar.textContent = kpis.countHabitual + ' constructivos';
      if (elRadarSub) elRadarSub.textContent = '100% positivos / sin recaídas';
    }

    // 5. KPI BENTO 5: INVERSIÓN BIENESTAR (DESGLOSE MULTIDIMENSIONAL)
    var desgloseInv = (typeof window.calcularDesgloseInversionBienestar === 'function')
      ? window.calcularDesgloseInversionBienestar()
      : { totalMacroPEN: 0, desglose: {}, dimensiones: [] };

    var elGasto = document.getElementById('kpi-gasto-vida');
    if (elGasto) {
      elGasto.textContent = 'S/ ' + (desgloseInv.totalMacroPEN || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    var microCont = document.getElementById('kpi-gasto-vida-microbadges');
    if (microCont) {
      var badgesHtml = '';
      (desgloseInv.dimensiones || []).forEach(function (k) {
        var d = desgloseInv.desglose[k];
        if (d && d.gastoRealPEN > 0) {
          var cfg = d.config || {};
          badgesHtml += '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[9.5px] font-mono font-bold border transition-all hover:scale-105" style="background-color: ' + (cfg.bg || '#f1f5f9') + '; color: ' + (cfg.color || '#334155') + '; border-color: ' + (cfg.border || '#cbd5e1') + ';" title="' + cfg.nombre + ': S/ ' + d.gastoRealPEN.toFixed(2) + '">' +
            '<span>' + (cfg.icono || '•') + '</span>' +
            '<span>S/ ' + Math.round(d.gastoRealPEN) + '</span>' +
            '</span>';
        }
      });
      microCont.innerHTML = badgesHtml || '<span class="text-[9.5px] text-slate-400 italic">Sin egresos imputados</span>';
    }

    // 6. Horas invertidas globales
    var kpiHoras = document.getElementById('kpi-habitos-global-horas');
    if (kpiHoras) kpiHoras.textContent = kpis.horasInvertidasGlobal.toFixed(1) + 'h invertidas';
  }

  /**
   * Actualización quirúrgica de los contadores, porcentajes y badge de una columna específica (0ms)
   */
  function actualizarColumnaHabitos(catKey) {
    if (!catKey) return;
    var actividades = state.actividadesPersonales || [];
    var hoyStr = new Date().toISOString().split('T')[0];
    var q = (state.filtroTextoHabito || '').toLowerCase();

    var itemsFiltradosCount = 0;
    var completadasCount = 0;
    var horasCat = 0.0;

    actividades.forEach(function (act) {
      if (normalizarCategoriaVida(act.Categoria_Vida) !== catKey) return;
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(act)) return;
      if (state.filtroTipoHabito === 'HABITUAL' && act.Tipo_Compromiso !== 'HABITUAL') return;
      if (state.filtroTipoHabito === 'UNICO' && act.Tipo_Compromiso === 'HABITUAL') return;
      if (state.filtroTipoHabito === 'RACHA' && (parseInt(act.Racha_Actual, 10) || 0) <= 0) return;
      if (q) {
        var nom = String(act.Nombre_Actividad || '').toLowerCase();
        var not = String(act.Notas_Checklist || '').toLowerCase();
        if (nom.indexOf(q) === -1 && not.indexOf(q) === -1) return;
      }

      itemsFiltradosCount++;
      var esComp = (act.Estado === '04_Completado');
      if (act.Tipo_Compromiso === 'HABITUAL' && act.Fecha_Programada > hoyStr && (parseInt(act.Racha_Actual, 10) || 0) > 0) {
        esComp = true;
      }
      if (esComp) {
        completadasCount++;
        horasCat += parseFloat(act.Duracion_Horas || 0);
      }
    });

    var pct = itemsFiltradosCount > 0 ? Math.round((completadasCount / itemsFiltradosCount) * 100) : 0;
    var badgeCount = document.getElementById('badge-count-' + catKey);
    var progBar = document.getElementById('progreso-bar-' + catKey);
    var metricHoras = document.getElementById('metric-horas-' + catKey);
    var metricPct = document.getElementById('metric-pct-' + catKey);

    if (badgeCount) badgeCount.textContent = completadasCount + '/' + itemsFiltradosCount;
    if (progBar) progBar.style.width = pct + '%';
    if (metricHoras) metricHoras.textContent = horasCat.toFixed(1) + 'h hoy';
    if (metricPct) metricPct.textContent = pct + '%';

    var wrapComp = document.getElementById('wrapper-completadas-' + catKey);
    if (wrapComp) {
      var summarySpan = wrapComp.querySelector('summary span.font-mono');
      if (summarySpan) {
        summarySpan.innerHTML = `
          <svg class="w-3.5 h-3.5 transition-transform duration-200 group-open:rotate-90 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
          Completadas (${completadasCount})
        `;
      }
      var summaryPct = wrapComp.querySelector('summary span:last-child');
      if (summaryPct) {
        summaryPct.textContent = '✓ ' + pct + '%';
      }
    }
  }

  /**
   * Refresco selectivo in-situ de una sola tarjeta en el DOM sin recargar la columna (60 fps)
   */
  function actualizarTarjetaActividadEnDOM(idActividad) {
    var idNorm = String(idActividad || '').trim();
    var act = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idNorm;
    });
    if (!act) return false;

    var cardEl = document.getElementById('card-act-' + idNorm) || document.querySelector('[data-id-actividad="' + idNorm + '"]');
    if (!cardEl) return false;

    var catKey = normalizarCategoriaVida(act.Categoria_Vida);
    var cardCat = cardEl.getAttribute('data-categoria');

    if (cardCat && cardCat !== catKey) {
      renderTableroActividadesPersonales();
      return true;
    }

    var hoyStr = new Date().toISOString().split('T')[0];
    var esComp = act.Estado === '04_Completado';
    if (act.Tipo_Compromiso === 'HABITUAL' && act.Fecha_Programada > hoyStr && (parseInt(act.Racha_Actual, 10) || 0) > 0) {
      esComp = true;
    }

    var nuevaTarjeta = crearTarjetaActividadGoogleTasks(act, esComp);
    nuevaTarjeta.classList.add('ring-2', 'ring-indigo-500/50', 'transition-all', 'duration-300');
    vincularDragCard(nuevaTarjeta);

    cardEl.replaceWith(nuevaTarjeta);
    setTimeout(function () {
      nuevaTarjeta.classList.remove('ring-2', 'ring-indigo-500/50');
    }, 500);

    actualizarColumnaHabitos(catKey);
    actualizarKPIsGlobalesHabitos();
    return true;
  }

  /**
   * ELIMINACIÓN DIRECTA SIN MODAL DE CONFIRMACIÓN (OPTIMISTIC UI + TOAST DESHACER)
   */
  function eliminarActividadPersonalDirecto(idActividad) {
    if (typeof eliminarEntidadDirectoConDeshacer === 'function') {
      eliminarEntidadDirectoConDeshacer('actividad', idActividad);
      return;
    }

    var idNorm = String(idActividad || '').trim();
    if (!idNorm) return;

    var idx = (state.actividadesPersonales || []).findIndex(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idNorm;
    });
    if (idx === -1) {
      idx = (state.actividades || []).findIndex(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() === idNorm;
      });
    }
    if (idx === -1) return;

    var act = (state.actividadesPersonales && state.actividadesPersonales[idx]) || (state.actividades && state.actividades[idx]);
    if (!act) return;

    var nombreAct = act.Nombre_Actividad || 'Actividad';
    var catKey = normalizarCategoriaVida(act.Categoria_Vida);
    var subtareasAct = (state.subtareas || []).filter(function (s) {
      return String(s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre || '').trim() === idNorm;
    });

    closeModal('modal-actividad-flow');

    var cardEl = document.getElementById('card-act-' + idNorm) || document.querySelector('[data-id-actividad="' + idNorm + '"]');
    if (cardEl) {
      cardEl.style.pointerEvents = 'none';
      cardEl.classList.add('card-eliminando-optimista');
      setTimeout(function () {
        if (cardEl && cardEl.parentNode) {
          cardEl.parentNode.removeChild(cardEl);
          var listaPend = document.getElementById('lista-pendientes-' + catKey);
          if (listaPend && listaPend.children.length === 0) {
            listaPend.innerHTML = '<div class="text-center py-6 text-slate-400 dark:text-slate-500 text-xs italic">Sin hábitos pendientes</div>';
          }
        }
      }, 210);
    }

    if (state.actividadesPersonales) {
      state.actividadesPersonales = state.actividadesPersonales.filter(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() !== idNorm;
      });
    }
    if (state.actividades) {
      state.actividades = state.actividades.filter(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() !== idNorm;
      });
    }
    state.subtareas = (state.subtareas || []).filter(function (s) {
      return String(s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre || '').trim() !== idNorm;
    });

    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    }

    actualizarColumnaHabitos(catKey);
    actualizarKPIsGlobalesHabitos();
    if (typeof actualizarMetricasDashboard === 'function') {
      actualizarMetricasDashboard();
    }

    if (pendingDeletionsHabitos[idNorm]) {
      clearTimeout(pendingDeletionsHabitos[idNorm].timer);
      ejecutarConsolidacionEliminarActividad(idNorm);
    }

    var timer = setTimeout(function () {
      ejecutarConsolidacionEliminarActividad(idNorm);
    }, 4500);

    pendingDeletionsHabitos[idNorm] = {
      timer: timer,
      act: JSON.parse(JSON.stringify(act)),
      subtareas: subtareasAct.slice(),
      index: idx,
      catKey: catKey
    };

    mostrarToastDeshacerEliminacion(idNorm, nombreAct);
  }

  function cerrarToastDeshacer(idNorm) {
    var toast = document.getElementById('toast-undo-' + idNorm);
    if (!toast) return;
    toast.classList.add('toast-undo-salida');
    setTimeout(function () {
      if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
    }, 240);
  }

  function deshacerEliminarActividadPersonal(idActividad) {
    var idNorm = String(idActividad || '').trim();
    var pending = pendingDeletionsHabitos[idNorm];
    if (!pending) return;

    clearTimeout(pending.timer);
    delete pendingDeletionsHabitos[idNorm];
    cerrarToastDeshacer(idNorm);

    if (!state.actividadesPersonales) state.actividadesPersonales = [];
    var insIdx = Math.min(pending.index, state.actividadesPersonales.length);
    state.actividadesPersonales.splice(insIdx, 0, pending.act);

    if (state.actividades) {
      state.actividades = state.actividadesPersonales;
    }

    if (!state.subtareas) state.subtareas = [];
    (pending.subtareas || []).forEach(function (sub) {
      if (!state.subtareas.some(function (s) { return s.ID_Subtarea === sub.ID_Subtarea; })) {
        state.subtareas.push(sub);
      }
    });

    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    }

    if (typeof renderTableroActividadesPersonales === 'function') {
      renderTableroActividadesPersonales();
    }
    if (typeof actualizarMetricasDashboard === 'function') {
      actualizarMetricasDashboard();
    }

    if (typeof notificarRestauracion === 'function') {
      notificarRestauracion('Actividad', (pending.act && pending.act.Nombre_Actividad) || '', 'f');
    } else if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo('↺ Actividad restaurada');
    }
  }

  function ejecutarConsolidacionEliminarActividad(idNorm) {
    var pending = pendingDeletionsHabitos[idNorm];
    if (!pending) return;

    clearTimeout(pending.timer);
    delete pendingDeletionsHabitos[idNorm];
    cerrarToastDeshacer(idNorm);

    callBackend('deleteactividadpersonal', { idActividad: idNorm }, function (res) {
      if (res && (res.success === true || res.success === 'true')) {
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        }
      } else {
        console.warn('[Fallo en eliminación remota]:', res);
        restaurarActividadPorFallo(pending);
      }
    }, function (err) {
      console.warn('[Fallo de red al eliminar]:', err);
      restaurarActividadPorFallo(pending);
    }, { silent: true });
  }

  function restaurarActividadPorFallo(pending) {
    if (!pending || !pending.act) return;
    if (!state.actividadesPersonales) state.actividadesPersonales = [];
    var insIdx = Math.min(pending.index, state.actividadesPersonales.length);
    state.actividadesPersonales.splice(insIdx, 0, pending.act);

    if (state.actividades) {
      state.actividades = state.actividadesPersonales;
    }

    if (!state.subtareas) state.subtareas = [];
    (pending.subtareas || []).forEach(function (sub) {
      if (!state.subtareas.some(function (s) { return s.ID_Subtarea === sub.ID_Subtarea; })) {
        state.subtareas.push(sub);
      }
    });

    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    }

    if (typeof renderTableroActividadesPersonales === 'function') {
      renderTableroActividadesPersonales();
    }

    if (typeof Swal !== 'undefined') {
      var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      });
      Toast.fire({
        icon: 'error',
        title: 'Error de red',
        text: 'No se pudo eliminar la actividad en el servidor. Ha sido restaurada.'
      });
    }
  }

  function renderTableroActividadesPersonales() {
    var actividades = state.actividadesPersonales || [];
    var hoyStr = new Date().toISOString().split('T')[0];

    if (!state.filtroTipoHabito) {
      try {
        var savedTipoHabito = localStorage.getItem('pmo_habitos_tipo_filtro');
        state.filtroTipoHabito = (savedTipoHabito && ['TODOS', 'HABITUAL', 'UNICO', 'RACHA'].indexOf(savedTipoHabito) !== -1) ? savedTipoHabito : 'TODOS';
      } catch (eStorage) {
        state.filtroTipoHabito = 'TODOS';
      }
    }
    if (typeof state.filtroTextoHabito !== 'string') state.filtroTextoHabito = '';
    var q = state.filtroTextoHabito.toLowerCase();

    // 1. Inicializar acumuladores de KPIs globales y buckets por categoría
    var kpis = {
      total: actividades.length,
      countHabitual: 0,
      countUnico: 0,
      countRacha: 0,
      maxRacha: 0,
      habConRachaCount: 0,
      sumaRachas: 0,
      completadosHoy: 0,
      horasInvertidasGlobal: 0,
      controlTotal: 0,
      controlCumplidos: 0,
      maxRachaControl: 0,
      pilarCounts: {
        'SALUD_DEPORTE': 0,
        'DESARROLLO_ESTUDIO': 0,
        'LABORAL_HONORARIO': 0,
        'FINANZAS_TRAMITES': 0,
        'SOCIAL_FAMILIA': 0,
        'PERSONAL_DESCANSO': 0
      }
    };

    var catBuckets = {
      'SALUD_DEPORTE': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 },
      'DESARROLLO_ESTUDIO': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 },
      'LABORAL_HONORARIO': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 },
      'FINANZAS_TRAMITES': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 },
      'SOCIAL_FAMILIA': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 },
      'PERSONAL_DESCANSO': { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 }
    };

    var regexControl = /(dejar|evitar|reducir|limitar|no\s+|cero|sin\s+|fumar|alcohol|azucar|chatarra|procrastinar|redes|pantalla|gasto|eliminar|erradicar)/i;

    // 2. Único barrido acumulativo lineal O(N)
    actividades.forEach(function (a) {
      var racha = parseInt(a.Racha_Actual, 10) || 0;
      var esHabitual = (a.Tipo_Compromiso === 'HABITUAL');
      var catNorm = normalizarCategoriaVida(a.Categoria_Vida);
      var durHoras = parseFloat(a.Duracion_Horas || 0);

      // Métricas de píldoras
      if (esHabitual) kpis.countHabitual++;
      else kpis.countUnico++;
      if (racha > 0) kpis.countRacha++;

      // Streaks
      if (racha > kpis.maxRacha) kpis.maxRacha = racha;
      if (esHabitual && racha > 0) {
        kpis.habConRachaCount++;
        kpis.sumaRachas += racha;
      }

      // Cumplimiento diario hoy
      var esComp = (a.Estado === '04_Completado');
      if (esHabitual && a.Fecha_Programada > hoyStr && racha > 0) {
        esComp = true;
      }
      if (esComp) {
        kpis.completadosHoy++;
        kpis.horasInvertidasGlobal += durHoras;
      }

      // Pilares de vida
      if (kpis.pilarCounts[catNorm] !== undefined) {
        kpis.pilarCounts[catNorm]++;
      }

      // Radar de control
      var esControl = regexControl.test(a.Nombre_Actividad || '') || regexControl.test(a.Notas_Checklist || '');
      if (esControl) {
        kpis.controlTotal++;
        if (a.Estado === '04_Completado') kpis.controlCumplidos++;
        if (racha > kpis.maxRachaControl) kpis.maxRachaControl = racha;
      }

      // Clasificación en buckets por categoría para el Tablero Kanban
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(a)) return;

      if (state.filtroTipoHabito === 'HABITUAL' && !esHabitual) return;
      if (state.filtroTipoHabito === 'UNICO' && esHabitual) return;
      if (state.filtroTipoHabito === 'RACHA' && racha <= 0) return;

      if (q) {
        var nom = String(a.Nombre_Actividad || '').toLowerCase();
        var not = String(a.Notas_Checklist || '').toLowerCase();
        if (nom.indexOf(q) === -1 && not.indexOf(q) === -1) return;
      }

      var bucket = catBuckets[catNorm];
      if (bucket) {
        bucket.itemsFiltradosCount++;
        if (esComp) {
          bucket.completadas.push(a);
          bucket.horasCat += durHoras;
        } else {
          bucket.pendientes.push(a);
        }
      }
    });

    // 3. Actualizar KPIs globales en el DOM pasando el objeto acumulado
    actualizarKPIsGlobalesHabitos(kpis);

    // 4. Ordenamiento y renderizado de las 6 columnas con DocumentFragment
    var sortMode = localStorage.getItem('pmo_habitos_sort_mode') || 'TIME';
    var sortFn = function (a, b) {
      if (sortMode === 'STREAK') {
        return (parseInt(b.Racha_Actual, 10) || 0) - (parseInt(a.Racha_Actual, 10) || 0);
      } else if (sortMode === 'ALPHA') {
        return String(a.Nombre_Actividad || '').localeCompare(String(b.Nombre_Actividad || ''));
      } else if (sortMode === 'PRIORITY') {
        var pA = String(a.Prioridad_Eisenhower || a.Prioridad || '04_P4').toLowerCase();
        var pB = String(b.Prioridad_Eisenhower || b.Prioridad || '04_P4').toLowerCase();
        return pA.localeCompare(pB);
      } else { // TIME
        var tA = a.Hora_Inicio || '23:59';
        var tB = b.Hora_Inicio || '23:59';
        return tA.localeCompare(tB);
      }
    };

    CATEGORIAS_HABITOS_CANONICAS.forEach(function (cat) {
      var listaPend = document.getElementById('lista-pendientes-' + cat);
      var wrapComp = document.getElementById('wrapper-completadas-' + cat);
      if (!listaPend || !wrapComp) return;

      var bucket = catBuckets[cat] || { pendientes: [], completadas: [], itemsFiltradosCount: 0, horasCat: 0 };
      var pendientes = bucket.pendientes;
      var completadas = bucket.completadas;

      pendientes.sort(sortFn);
      completadas.sort(sortFn);

      var estabaAbierto = false;
      var oldDetails = wrapComp.querySelector('details');
      if (oldDetails && oldDetails.hasAttribute('open')) {
        estabaAbierto = true;
      }

      listaPend.innerHTML = '';
      wrapComp.innerHTML = '';

      // Inserción de pendientes con DocumentFragment (0 layout thrashing)
      if (pendientes.length === 0) {
        var msgVacio = (bucket.itemsFiltradosCount === 0 && kpis.pilarCounts[cat] > 0) ? 'Sin coincidencias de filtro' : 'Sin hábitos pendientes';
        listaPend.innerHTML =
          '<div class="py-5 px-3 flex flex-col items-center justify-center text-center select-none">' +
          '  <div class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center mx-auto mb-1.5 text-slate-400 dark:text-slate-500 border border-slate-200/60 dark:border-slate-700/60">' +
          '    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>' +
          '  </div>' +
          '  <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400">' + msgVacio + '</span>' +
          '</div>';
      } else {
        var fragPend = document.createDocumentFragment();
        pendientes.forEach(function (act) {
          var card = crearTarjetaActividadGoogleTasks(act, false);
          vincularDragCard(card);
          fragPend.appendChild(card);
        });
        listaPend.appendChild(fragPend);
      }

      // Inserción de completadas con DocumentFragment (0 layout thrashing)
      var pct = bucket.itemsFiltradosCount > 0 ? Math.round((completadas.length / bucket.itemsFiltradosCount) * 100) : 0;
      if (completadas.length > 0) {
        var details = document.createElement('details');
        details.className = 'group text-xs text-slate-500 dark:text-slate-400';
        if (estabaAbierto) {
          details.setAttribute('open', '');
        }
        details.innerHTML = `
          <summary class="cursor-pointer font-bold select-none list-none flex items-center justify-between py-1.5 px-2 rounded-lg bg-slate-100/70 dark:bg-slate-800/50 hover:bg-slate-200/60 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100 transition shadow-2xs border border-slate-200/60 dark:border-slate-700/50">
            <span class="flex items-center gap-1.5 font-mono">
              <svg class="w-3.5 h-3.5 transition-transform duration-200 group-open:rotate-90 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
              Completadas (${completadas.length})
            </span>
            <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono font-semibold bg-emerald-50 dark:bg-emerald-950/40 px-1.5 py-0.5 rounded border border-emerald-200/60 dark:border-emerald-800/40">✓ ${pct}%</span>
          </summary>
          <div class="mt-2.5 space-y-2.5" id="completadas-list-${cat}"></div>
        `;
        var cList = details.querySelector('#completadas-list-' + cat);
        var fragComp = document.createDocumentFragment();
        completadas.forEach(function (act) {
          var card = crearTarjetaActividadGoogleTasks(act, true);
          vincularDragCard(card);
          fragComp.appendChild(card);
        });
        cList.appendChild(fragComp);
        wrapComp.appendChild(details);
      }

      // Actualizar cabecera métrica de la columna directamente desde el bucket
      var badgeCount = document.getElementById('badge-count-' + cat);
      var progBar = document.getElementById('progreso-bar-' + cat);
      var metricHoras = document.getElementById('metric-horas-' + cat);
      var metricPct = document.getElementById('metric-pct-' + cat);

      if (badgeCount) badgeCount.textContent = completadas.length + '/' + bucket.itemsFiltradosCount;
      if (progBar) progBar.style.width = pct + '%';
      if (metricHoras) metricHoras.textContent = bucket.horasCat.toFixed(1) + 'h hoy';
      if (metricPct) metricPct.textContent = pct + '%';
    });

    setupDragAndDropHabitos();
  }

  // ============================================================================
  // CONTROLADORES DE FILTROS BENTO PARA HÁBITOS & VIDA
  // ============================================================================
  window.filtrarTipoActividadPersonal = function (tipo) {
    tipo = tipo || 'TODOS';
    state.filtroTipoHabito = tipo;
    try {
      localStorage.setItem('pmo_habitos_tipo_filtro', tipo);
    } catch (eStorage) {
      console.warn('[filtrarTipoActividadPersonal] Error guardando en localStorage:', eStorage);

    renderTableroActividadesPersonales();

  window.setFiltroTipoHabito = window.filtrarTipoActividadPersonal;

    if (btnClear) {
      if (state.filtroTextoHabito.length > 0) btnClear.classList.remove('hidden');

  window.setSortModeHabitos = function (mode) {

  function formatearFechaLegibleGoogleTasks(fechaStr, horaStr, duracion) {
    if (!fechaStr) return "Sin fecha";
    var fHumana = formatFechaHumana(fechaStr);
    var hLimpia = formatHoraLimpia(horaStr);
    var durNum = (duracion !== undefined && duracion !== null && !isNaN(parseFloat(duracion))) ? parseFloat(duracion) : 1.0;
    var durMin = (durNum === 0) ? ' • <svg class="portal-icon-sm inline shrink-0 align-sub" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" x2="12" y1="17" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg> Puntual' : (" (" + formatearDuracionMinutos(durNum) + ")");

    if (hLimpia && hLimpia !== "--:--") {
      return fHumana + ' • <svg class="portal-icon-sm inline shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + hLimpia + durMin;
    }
    return fHumana + durMin;
  }
  function toggleCompletarActividadPersonal(idActividad, completado, ev) {

      ev.stopPropagation();
      ev.preventDefault();
      if (ev.currentTarget && completado) {
        ev.currentTarget.classList.add('habit-pulse-success');
      }
    }

    var act = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad).trim() === String(idActividad).trim();
    });
    if (!act) return;

    var catKey = normalizarCategoriaVida(act.Categoria_Vida);
    var estadoPrevio = act.Estado;
    var rachaPrevia = parseInt(act.Racha_Actual, 10) || 0;
    var fechaPrevia = act.Fecha_Programada;

    var nuevoEstado = completado ? '04_Completado' : '02_Por_Hacer';
    var nuevaRacha = rachaPrevia;
    if (completado && act.Tipo_Compromiso === 'HABITUAL') {
      nuevaRacha = rachaPrevia + 1;
    } else if (!completado && act.Tipo_Compromiso === 'HABITUAL') {
      nuevaRacha = Math.max(0, rachaPrevia - 1);
    }

    act.Estado = nuevoEstado;
    act.Racha_Actual = nuevaRacha;

    window._actividadesEnTransito = window._actividadesEnTransito || new Set();
    window._actividadesEnTransito.add(String(idActividad).trim());

    var cardEl = document.getElementById('card-act-' + idActividad) || document.querySelector('[data-id-actividad="' + idActividad + '"]');
    var listaPend = document.getElementById('lista-pendientes-' + catKey);
    var wrapComp = document.getElementById('wrapper-completadas-' + catKey);

    if (cardEl && listaPend && wrapComp) {
      if (completado) {
        var nuevaTarjeta = crearTarjetaActividadGoogleTasks(act, true);
        nuevaTarjeta.classList.add('habit-pulse-success');
        vincularDragCard(nuevaTarjeta);

        var details = wrapComp.querySelector('details');
        if (!details) {
          details = document.createElement('details');
          details.className = 'group text-xs text-slate-500 dark:text-slate-400';
          details.setAttribute('open', '');
          details.innerHTML = `
            <summary class="cursor-pointer font-bold select-none list-none flex items-center justify-between py-1.5 px-2 rounded-lg bg-slate-100/70 dark:bg-slate-800/50 hover:bg-slate-200/60 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-slate-100 transition shadow-2xs border border-slate-200/60 dark:border-slate-700/50">
              <span class="flex items-center gap-1.5 font-mono">
                <svg class="portal-icon-sm transition-transform duration-200 group-open:rotate-90 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                Completadas (1)
              </span>
              <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono font-semibold bg-emerald-50 dark:bg-emerald-950/40 px-1.5 py-0.5 rounded border border-emerald-200/60 dark:border-emerald-800/40">✓ 100%</span>
            </summary>
            <div class="mt-2.5 space-y-2.5" id="completadas-list-${catKey}"></div>
          `;
          wrapComp.appendChild(details);
        }
        var cList = details.querySelector('#completadas-list-' + catKey);
        if (cList) {
          cList.insertBefore(nuevaTarjeta, cList.firstChild);
        }

        if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl);
        if (listaPend.children.length === 0) {
          listaPend.innerHTML = '<div class="text-center py-6 text-slate-400 dark:text-slate-500 text-xs italic">Sin hábitos pendientes</div>';
        }
      } else {
        var nuevaTarjeta = crearTarjetaActividadGoogleTasks(act, false);
        vincularDragCard(nuevaTarjeta);

        var emptyMsg = listaPend.querySelector('.italic');
        if (emptyMsg) emptyMsg.remove();

        listaPend.insertBefore(nuevaTarjeta, listaPend.firstChild);
        if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl);

        var cList = wrapComp.querySelector('#completadas-list-' + catKey);
        if (cList && cList.children.length === 0) {
          wrapComp.innerHTML = '';
        }
      }
      actualizarColumnaHabitos(catKey);
      actualizarKPIsGlobalesHabitos();
    } else {
      renderTableroActividadesPersonales();
    }

    if (typeof Swal !== 'undefined') {
      var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1600,
        timerProgressBar: true
      });

      if (completado) {
        var msgRacha = (act.Tipo_Compromiso === 'HABITUAL' && nuevaRacha > 0)
          ? ` · ¡Racha de ${nuevaRacha} ${nuevaRacha === 1 ? 'día' : 'días'}!`
          : ' · ¡Objetivo cumplido!';

        Toast.fire({
          icon: 'success',
          title: '¡Hábito Cumplido!',
          text: (act.Nombre_Actividad || 'Actividad') + msgRacha
        });

        lanzarCelebracionConfetti(nuevaRacha);
      } else {
        Toast.fire({
          icon: 'info',
          title: 'Hábito Reabierto',
          text: (act.Nombre_Actividad || 'Actividad') + ' marcado como pendiente'
        });
      }
    }

    callBackend('completarActividadPersonal', {
      idActividad: idActividad,
      nuevoEstado: nuevoEstado,
      incrementarRacha: completado
    }, function (res) {
      if (window._actividadesEnTransito) {
        window._actividadesEnTransito.delete(String(idActividad).trim());
      }
      if (res && res.success) {
        if (res.data) {
          act.Estado = res.data.Estado;
          act.Racha_Actual = res.data.Racha_Actual;
          if (res.data.ID_Evento_Calendar) act.ID_Evento_Calendar = res.data.ID_Evento_Calendar;
        }
        if (res.repetida) {
          act.Fecha_Programada = res.nuevaFecha;
          act.Racha_Actual = res.racha;
          act.Estado = res.nuevoEstado || '02_Por_Hacer';
          renderTableroActividadesPersonales();
        }
      } else {
        act.Estado = estadoPrevio;
        act.Racha_Actual = rachaPrevia;
        act.Fecha_Programada = fechaPrevia;
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        }
        renderTableroActividadesPersonales();
        if (typeof Swal !== 'undefined') {
          Swal.mixin({
            toast: true,
            position: 'bottom-end',
            showConfirmButton: false,
            timer: 4000,
            timerProgressBar: true
          }).fire({
            icon: 'error',
            title: 'Error de sincronización',
            text: (res && res.message) || 'No se pudo actualizar el estado de la actividad.'
          });
        }
      }
    }, function (err) {
      if (window._actividadesEnTransito) {
        window._actividadesEnTransito.delete(String(idActividad).trim());
      }
      act.Estado = estadoPrevio;
      act.Racha_Actual = rachaPrevia;
      act.Fecha_Programada = fechaPrevia;
      if (typeof window.sincronizarCacheLocalState === 'function') {
        window.sincronizarCacheLocalState();
      }
      renderTableroActividadesPersonales();
      if (typeof Swal !== 'undefined') {
        Swal.mixin({
          toast: true,
          position: 'bottom-end',
          showConfirmButton: false,
          timer: 4000,
          timerProgressBar: true
        }).fire({
          icon: 'error',
          title: 'Error de sincronización',
          text: (err && (err.message || err)) || 'Error de red o conexión al sincronizar la actividad.'
        });
      }
    }, { silent: true });
  }

  function setupDragAndDropHabitos() {
    var cards = document.querySelectorAll('#vista-habitos-wrapper [draggable="true"]');
    cards.forEach(function (card) {
      if (card.dataset.dragReady === 'true') return;
      card.dataset.dragReady = 'true';

      card.addEventListener('dragstart', function (e) {
        e.stopPropagation();
        var idAct = card.dataset.idActividad;
        e.dataTransfer.setData('text/plain', idAct);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('opacity-40', 'scale-95', 'rotate-1', 'shadow-2xl', 'border-indigo-500');
      });

      card.addEventListener('dragend', function () {
        card.classList.remove('opacity-40', 'scale-95', 'rotate-1', 'shadow-2xl', 'border-indigo-500');
        document.querySelectorAll('#vista-habitos-wrapper .kanban-col-body').forEach(function (body) {
          body.classList.remove('kanban-dropzone-active', 'bg-indigo-50/40', 'dark:bg-slate-800/40', 'border-2', 'border-dashed', 'border-indigo-400', 'rounded-2xl');
        });
      });
    });

    var colBodies = document.querySelectorAll('#vista-habitos-wrapper .kanban-col-body');
    colBodies.forEach(function (body) {
      if (body.dataset.dndReady === 'true') return;
      body.dataset.dndReady = 'true';

      body.addEventListener('dragover', function (e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        body.classList.add('kanban-dropzone-active', 'bg-indigo-50/40', 'dark:bg-slate-800/40', 'border-2', 'border-dashed', 'border-indigo-400', 'rounded-2xl');
      });

      body.addEventListener('dragleave', function (e) {
        if (!body.contains(e.relatedTarget)) {
          body.classList.remove('kanban-dropzone-active', 'bg-indigo-50/40', 'dark:bg-slate-800/40', 'border-2', 'border-dashed', 'border-indigo-400', 'rounded-2xl');
        }
      });

      body.addEventListener('drop', function (e) {
        e.preventDefault();
        e.stopPropagation();
        body.classList.remove('kanban-dropzone-active', 'bg-indigo-50/40', 'dark:bg-slate-800/40', 'border-2', 'border-dashed', 'border-indigo-400', 'rounded-2xl');

        var idAct = e.dataTransfer.getData('text/plain');
        if (!idAct) return;

        var colContainer = body.closest('[data-categoria]');
        if (!colContainer) return;
        var nuevaCat = colContainer.getAttribute('data-categoria');
        if (!nuevaCat) return;

        cambiarCategoriaActividadPersonal(idAct, nuevaCat);
      });
    });
  }

  function cambiarCategoriaActividadPersonal(idActividad, nuevaCat) {
    var act = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad).trim() === String(idActividad).trim();
    });
    if (!act) return;

    var catNormal = normalizarCategoriaVida(nuevaCat);
    var catPrevia = normalizarCategoriaVida(act.Categoria_Vida);
    if (catNormal === catPrevia) return;

    var confDest = CATEGORIAS_VIDA_CONFIG[catNormal] || { nombre: catNormal, icono: '📌' };

    act.Categoria_Vida = catNormal;
    renderTableroActividadesPersonales();

    if (typeof Swal !== 'undefined') {
      var Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1800,
        timerProgressBar: true
      });
      Toast.fire({
        icon: 'success',
        title: 'Categoría actualizada',
        text: '"' + act.Nombre_Actividad + '" movido a ' + confDest.icono + ' ' + confDest.nombre
      });
    }

    callBackend('updateActividadPersonal', {
      idActividad: idActividad,
      categoriaVida: catNormal
    }, function (res) {
      if (!res || !res.success) {
        act.Categoria_Vida = catPrevia;
        renderTableroActividadesPersonales();
        Swal.fire({
          icon: 'error',
          title: 'Error de Sincronización',
          text: 'No se pudo mover de categoría en la base de datos.',
          confirmButtonColor: '#4f46e5'
        });
      }
    }, function (err) {
      act.Categoria_Vida = catPrevia;
      renderTableroActividadesPersonales();
    }, { silent: true });
  }

  function activarEdicionFechaRapida(e, idActividad, fechaActual, horaActual) {

  function guardarEdicionFechaRapida(e, idActividad) {
    e.stopPropagation();
    var nFecha = document.getElementById('input-fast-date-' + idActividad).value;
    var rawHora = document.getElementById('input-fast-time-' + idActividad).value;
    var nHora = formatHoraLimpia(rawHora);

    var act = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad).trim() === String(idActividad).trim();
    });
    if (!act) return;

    act.Fecha_Programada = nFecha;
    act.Hora_Inicio = nHora;
    renderTableroActividadesPersonales();

    callBackend('updateActividadPersonal', {
      idActividad: idActividad,
      fechaProgramada: nFecha,
      horaInicio: nHora
    }, function (res) {
      if (!res || !res.success) {

          title: 'Error',
          text: 'Error al actualizar la fecha en la base de datos.',
          confirmButtonColor: '#4f46e5'
        });
        renderTableroActividadesPersonales();
      }
    });

  function normalizarCategoriaClave(cat) {
    var c = String(cat || '').toUpperCase().trim();
    if (c.indexOf('SALUD') !== -1 || c.indexOf('DEPORTE') !== -1) return 'SALUD_DEPORTE';
    if (c.indexOf('ESTUDIO') !== -1 || c.indexOf('DESARROLLO') !== -1 || c.indexOf('MENTE') !== -1) return 'DESARROLLO_ESTUDIO';
    if (c.indexOf('LABORAL') !== -1 || c.indexOf('TRABAJO') !== -1 || c.indexOf('HONORARIO') !== -1 || c.indexOf('CARRERA') !== -1) return 'LABORAL_HONORARIO';
    if (c.indexOf('FINANZAS') !== -1 || c.indexOf('TRAMITE') !== -1 || c.indexOf('ADMIN') !== -1) return 'FINANZAS_TRAMITES';
    if (c.indexOf('SOCIAL') !== -1 || c.indexOf('FAMILIA') !== -1) return 'SOCIAL_FAMILIA';
    if (c.indexOf('PERSONAL') !== -1 || c.indexOf('DESCANSO') !== -1 || c.indexOf('RELAX') !== -1) return 'PERSONAL_DESCANSO';
    return 'SALUD_DEPORTE';
  }

  /**
   * Actualiza el chip y la equivalencia en soles al escribir un monto o alternar divisa.
   * @param {number|string} val - Monto ingresado
   */
  function actualizarGastoLabelFlow(val) {
    var num = parseFloat(val) || 0;
    activityFlowState.gasto = num;
    var mon = activityFlowState.gastoMoneda || 'PEN';
    var sim = (mon === 'USD') ? '$' : (mon === 'EUR') ? '€' : 'S/';
    var lbl = document.getElementById('flow-chip-gasto-label');
    var chip = document.getElementById('flow-chip-gasto');
    if (lbl) {
      lbl.textContent = num > 0 ? (sim + ' ' + num.toFixed(2) + ' ' + mon) : 'Sin gasto';
    }
    if (chip) {
      if (num > 0) {
        chip.className = 'inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 transition shadow-2xs';
      } else {
        chip.className = 'inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-50 dark:bg-slate-800/60 text-slate-600 dark:text-slate-400 border border-slate-200/80 dark:border-slate-700/60 hover:border-emerald-300 transition shadow-2xs';
      }
    }

    // Actualizar equivalencia en PEN si divisa es extranjera
    var eqBox = document.getElementById('act-flow-gasto-equiv-box');
    var eqLbl = document.getElementById('act-flow-gasto-equiv-lbl');
    var tcBadge = document.getElementById('act-flow-gasto-tc-badge');
    if (num > 0 && mon !== 'PEN') {
      var tcUsd = (state.tipoCambioOficial && state.tipoCambioOficial.usd) || 3.75;
      var tcEur = (state.tipoCambioOficial && state.tipoCambioOficial.eur) || 4.12;
      var tc = (mon === 'USD') ? tcUsd : tcEur;
      var equivPen = num * tc;
      if (eqBox && eqLbl) {
        eqLbl.textContent = '≈ S/ ' + equivPen.toFixed(2);
        eqBox.classList.remove('hidden');
      }
      if (tcBadge) {
        tcBadge.textContent = 'TC: ' + tc.toFixed(2);
        tcBadge.classList.remove('hidden');
      }
    } else {
      if (eqBox) eqBox.classList.add('hidden');
      if (tcBadge) tcBadge.classList.add('hidden');
    }
  }

  /**
   * Renderiza el listado interactivo de gastos existentes disponibles para vincular a esta actividad
   */
  function renderGastosDisponiblesActividadFlow(query) {
    var cont = document.getElementById('act-flow-gastos-disponibles-list');
    if (!cont) return;

    var q = String(query || '').toLowerCase().trim();
    var idActActual = activityFlowState.currentActId || '';
    var vinculados = activityFlowState.gastosVinculados || [];

    var todos = (state.gastos || []).filter(function (g) {
      var yaAsociado = (String(g.ID_Tarea || '').trim() === String(idActActual).trim() && idActActual !== '') ||
                       (vinculados.indexOf(g.ID_Gasto) !== -1);
      if (yaAsociado) return false;

      if (!q) return true;
      var conc = String(g.Descripcion_Gasto || g.Concepto || '').toLowerCase();
      var cod = String(g.ID_Gasto || '').toLowerCase();
      var cat = String(g.Categoria_Gasto || '').toLowerCase();
      var mStr = String(g.Monto_PEN || g.Monto_Original || '');
      return conc.indexOf(q) !== -1 || cod.indexOf(q) !== -1 || cat.indexOf(q) !== -1 || mStr.indexOf(q) !== -1;
    });

    if (todos.length === 0) {
      cont.innerHTML = '<div class="p-3 text-center text-slate-400 text-xs italic bg-white dark:bg-slate-900 rounded-xl border border-slate-200/60 dark:border-slate-800">' +
        (q ? 'No se encontraron gastos con el término "' + q + '".' : 'No hay otros gastos disponibles para vincular.') +
        '</div>';
      return;
    }

    var html = '';
    todos.slice(0, 15).forEach(function (g) {
      var mPen = parseFloat(g.Monto_PEN || g.Monto_Original || 0).toFixed(2);
      var desc = g.Descripcion_Gasto || g.Concepto || 'Sin concepto';
      var fec = g.Fecha_Gasto ? String(g.Fecha_Gasto).split('T')[0] : '';
      var cod = g.ID_Gasto || '';
      var monOrig = g.Moneda_Original || 'PEN';
      var mOrig = parseFloat(g.Monto_Original || mPen).toFixed(2);
      var extraDivisa = (monOrig !== 'PEN') ? (' <span class="text-[9px] text-slate-400 font-mono">(' + monOrig + ' ' + mOrig + ')</span>') : '';

      html += '<div class="flex items-center justify-between p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-emerald-300 dark:hover:border-emerald-700 transition shadow-2xs gap-2">' +
        '<div class="min-w-0 flex-1">' +
          '<div class="flex items-center gap-1.5">' +
            '<span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold">' + cod + '</span>' +
            '<span class="text-[10px] text-slate-400">' + fec + '</span>' +
          '</div>' +
          '<p class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate" title="' + desc + '">' + desc + '</p>' +
        '</div>' +
        '<div class="text-right shrink-0">' +
          '<span class="font-mono font-bold text-xs text-emerald-700 dark:text-emerald-400 block">S/ ' + mPen + extraDivisa + '</span>' +
          '<button type="button" onclick="vincularGastoExistenteActividadFlow(\'' + cod + '\')" ' +
            'class="mt-1 px-2.5 py-0.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 hover:bg-emerald-600 hover:text-white text-[10px] font-bold transition active:scale-95">' +
            '🔗 Vincular' +
          '</button>' +
        '</div>' +
      '</div>';
    });

    cont.innerHTML = html;
  }

  /**
   * Persistencia ATÓMICA e INMEDIATA del gasto para la actividad (cero dependencias del modal principal)
   */
  function guardarGastoAtomicoActividadFlow() {
    var mInp = document.getElementById('act-flow-gasto-input');
    var monto = parseFloat(mInp ? mInp.value : 0) || 0;

    if (monto <= 0) {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('warning', 'Monto Requerido', 'Ingresa un monto mayor a 0 para guardar el gasto.');
      } else if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'warning',
          title: 'Monto inválido',
          text: 'Ingresa un monto mayor a 0 para registrar el gasto.',
          confirmButtonColor: '#10b981'
        });
      }
      if (mInp) mInp.focus();
      return;
    }

    var mon = activityFlowState.gastoMoneda || 'PEN';
    var cat = (document.getElementById('act-flow-gasto-categoria')?.value) || 'Otros';
    var desc = (document.getElementById('act-flow-gasto-desc')?.value || '').trim();
    var titInp = document.getElementById('act-flow-titulo');
    var tituloAct = titInp ? titInp.value.trim() : 'Actividad Personal';

    if (!desc) {
      desc = '[Actividad Personal] ' + (tituloAct || 'Gasto Operativo');
    }

    var idAct = activityFlowState.currentActId;
    if (!idAct) {
      idAct = 'ACT-DRAFT-' + Date.now();
      activityFlowState.currentActId = idAct;
      var fId = document.getElementById('act-flow-id');
      if (fId) fId.value = idAct;
    }

    var tcUsd = (state.tipoCambioOficial && state.tipoCambioOficial.usd) || 3.75;
    var tcEur = (state.tipoCambioOficial && state.tipoCambioOficial.eur) || 4.12;
    var tcGasto = (mon === 'USD') ? tcUsd : (mon === 'EUR') ? tcEur : 1.0;
    var montoPen = (mon === 'PEN') ? monto : (monto * tcGasto);
    var montoUsd = (mon === 'USD') ? monto : (tcUsd > 0 ? (montoPen / tcUsd) : 0);
    var hoyStr = new Date().toISOString().split('T')[0];

    var tempGastoId = 'GAS-ATM-' + Date.now();
    var nuevoGasto = {
      ID_Gasto: tempGastoId,
      ID_Transaccion: tempGastoId,
      ID_Proyecto: '',
      ID_Hito: '',
      ID_Tarea: idAct,
      ID_Entidad_Vinculada: idAct,
      Clasificacion_Origen: 'Personal',
      Tipo_Entidad: 'Actividad Personal',
      Tipo_Gasto: 'Actividad Personal',
      tipoGasto: 'Actividad Personal',
      Fecha_Gasto: hoyStr,
      Fecha_Registro: hoyStr,
      Descripcion_Gasto: desc,
      Descripcion: desc,
      Concepto: desc,
      concepto: desc,
      Categoria_Gasto: cat,
      Categoria: cat,
      categoria: cat,
      Moneda_Original: mon,
      monedaOriginal: mon,
      Monto_Original: monto,
      montoOriginal: monto,
      Tipo_Cambio: tcGasto,
      tipoCambio: tcGasto,
      Monto_PEN: montoPen,
      montoPEN: montoPen,
      Monto_Moneda_Base: montoPen,
      Monto_USD: montoUsd,
      Modalidad: 'Real / Ejecutado',
      modalidad: 'Real / Ejecutado',
      Metodo_Pago: 'Efectivo',
      Estado_Pago: 'Pagado',
      Estado: 'Pagado',
      _isOptimistic: true
    };

    if (!state.gastos) state.gastos = [];
    state.gastos.unshift(nuevoGasto);

    if (!activityFlowState.gastosVinculados) activityFlowState.gastosVinculados = [];
    activityFlowState.gastosVinculados.push(tempGastoId);

    // Limpiar inputs de nuevo gasto
    if (mInp) mInp.value = '';
    var descInp = document.getElementById('act-flow-gasto-desc');
    if (descInp) descInp.value = '';
    actualizarGastoLabelFlow(0);

    // Recalcular monto total en state.actividadesPersonales y refrescar DOM inmediatamente
    var totalRestante = (state.gastos || []).reduce(function (acc, x) {
      if (String(x.ID_Tarea || '').trim() === String(idAct).trim() ||
          (activityFlowState.gastosVinculados && activityFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1)) {
        return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
      }
      return acc;
    }, 0);
    var actObj = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || '').trim() === String(idAct).trim();
    });
    if (actObj) {
      actObj.Monto_Gasto_Asociado = totalRestante;
    }
    if (typeof actualizarTarjetaActividadEnDOM === 'function') {
      actualizarTarjetaActividadEnDOM(idAct);
    }
    if (typeof aplicarFiltrosCruzados === 'function') {
      aplicarFiltrosCruzados();
    }

    // Actualizar lista de asociados de inmediato
    renderGastosAsociadosActividadFlow();

    // Notificar al usuario
    if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', 'Gasto Registrado', 'Se guardó ' + mon + ' ' + monto.toFixed(2) + ' exitosamente.');
    }

    // Persistir atómicamente en backend
    var btnSave = document.getElementById('act-btn-guardar-gasto-inmediato');
    if (btnSave) {
      btnSave.disabled = true;
      btnSave.innerHTML = '<span>⏳ Guardando...</span>';
    }

    callBackend('createGasto', {
      idProyecto: '',
      idHito: '',
      idTarea: idAct,
      idEntidadVinculada: idAct,
      tipoEntidad: 'Actividad Personal',
      clasificacionOrigen: 'Personal',
      concepto: desc,
      modalidad: 'Real / Ejecutado',
      montoOriginal: monto,
      monedaOriginal: mon,
      montoMonedaBase: montoPen,
      tipoCambio: tcGasto,
      categoriaGasto: cat,
      descripcionGasto: desc,
      fechaGasto: hoyStr,
      metodoPago: 'Efectivo',
      estadoPago: 'Pagado'
    }, function (res) {
      if (btnSave) {
        btnSave.disabled = false;
        btnSave.innerHTML = '<span>💾</span><span>Guardar Gasto</span>';
      }
      if (res && res.success && res.idGasto) {
        var realIdGasto = res.idGasto;
        nuevoGasto.ID_Gasto = realIdGasto;
        nuevoGasto.ID_Transaccion = realIdGasto;
        nuevoGasto._isOptimistic = false;
        var idx = activityFlowState.gastosVinculados.indexOf(tempGastoId);
        if (idx !== -1) activityFlowState.gastosVinculados[idx] = realIdGasto;
        renderGastosAsociadosActividadFlow();
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
        if (typeof actualizarMetricasDashboard === 'function') actualizarMetricasDashboard();
      }
    }, function (err) {
      if (btnSave) {
        btnSave.disabled = false;
        btnSave.innerHTML = '<span>💾</span><span>Guardar Gasto</span>';
      }
      console.error('[GastoAtomicoActividad] Error al persistir:', err);
    }, { silent: true });
  }

  /**
   * Vincula un gasto preexistente a esta actividad y actualiza en backend
   */
  function vincularGastoExistenteActividadFlow(idGasto) {
    if (!idGasto) return;

    var idAct = activityFlowState.currentActId;
    if (!idAct) {
      idAct = 'ACT-DRAFT-' + Date.now();
      activityFlowState.currentActId = idAct;
      var fId = document.getElementById('act-flow-id');
      if (fId) fId.value = idAct;
    }

    var g = (state.gastos || []).find(function (item) { return item.ID_Gasto === idGasto; });
    if (!g) return;

    g.ID_Tarea = idAct;

    if (!activityFlowState.gastosVinculados) activityFlowState.gastosVinculados = [];
    if (activityFlowState.gastosVinculados.indexOf(idGasto) === -1) {
      activityFlowState.gastosVinculados.push(idGasto);
    }

    // Recalcular monto total en state.actividadesPersonales y refrescar DOM inmediatamente
    var totalRestante = (state.gastos || []).reduce(function (acc, x) {
      if (String(x.ID_Tarea || '').trim() === String(idAct).trim() ||
          (activityFlowState.gastosVinculados && activityFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1)) {
        return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
      }
      return acc;
    }, 0);
    var actObj = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || '').trim() === String(idAct).trim();
    });
    if (actObj) {
      actObj.Monto_Gasto_Asociado = totalRestante;
    }
    if (typeof actualizarTarjetaActividadEnDOM === 'function') {
      actualizarTarjetaActividadEnDOM(idAct);
    }
    if (typeof aplicarFiltrosCruzados === 'function') {
      aplicarFiltrosCruzados();
    }

    renderGastosAsociadosActividadFlow();
    var searchInp = document.getElementById('act-flow-gasto-search-input');
    renderGastosDisponiblesActividadFlow(searchInp ? searchInp.value : '');

    if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', 'Gasto Vinculado', 'Gasto ' + idGasto + ' asociado a esta actividad.');
    }

    // Persistir vínculo en backend
    if (idGasto.indexOf('GAS-TMP-') === -1 && idGasto.indexOf('GAS-ATM-') === -1) {
      callBackend('updateGasto', {
        idGasto: idGasto,
        idTarea: idAct
      }, null, null, { silent: true });
    }
  }

  /**
   * Diálogo dual SweetAlert2 para desvincular o eliminar definitivamente un gasto de la actividad
   */
  function confirmarAccionGastoActividadFlow(idGasto) {
    if (!idGasto) return;

    var g = (state.gastos || []).find(function (item) {
      return String(item.ID_Gasto || '').trim() === String(idGasto).trim();
    });

    var desc = g ? (g.Descripcion_Gasto || g.Descripcion || g.Concepto || 'Gasto vinculado') : 'Gasto vinculado';
    var mon = g ? (g.Moneda_Original || 'PEN') : 'PEN';
    var sim = (mon === 'USD') ? '$' : (mon === 'EUR' ? '€' : 'S/');
    var mOrig = g ? (parseFloat(g.Monto_Original) || parseFloat(g.Monto_PEN) || 0) : 0;
    var mPen = g ? (parseFloat(g.Monto_PEN) || (mOrig * (g.Tipo_Cambio || 1)) || 0) : 0;
    var montoTxt = sim + ' ' + mOrig.toFixed(2) + (mon !== 'PEN' ? (' (≈ S/ ' + mPen.toFixed(2) + ')') : '');

    var fnEscape = window.escapeHtmlAttr || function (s) { return String(s || '').replace(/"/g, '&quot;'); };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Gestión de Egreso Vinculado',
        html:
          '<div class="text-left text-xs space-y-3">' +
          '  <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl">' +
          '    <div class="font-mono text-[10px] text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider mb-0.5">' + idGasto + '</div>' +
          '    <div class="font-semibold text-slate-800 dark:text-slate-100 text-sm">' + fnEscape(desc) + '</div>' +
          '    <div class="font-mono font-bold text-emerald-700 dark:text-emerald-400 mt-1">' + montoTxt + '</div>' +
          '  </div>' +
          '  <p class="text-slate-500 dark:text-slate-400 leading-relaxed">' +
          '    ¿Qué acción deseas realizar con este egreso de la actividad personal?' +
          '  </p>' +
          '  <ul class="text-[11px] space-y-1.5 text-slate-500 dark:text-slate-400 list-disc list-inside">' +
          '    <li><b class="text-indigo-600 dark:text-indigo-400">Solo Desvincular:</b> Quita el vínculo con esta actividad pero <u>se conserva</u> en Finanzas como gasto corriente.</li>' +
          '    <li><b class="text-rose-600 dark:text-rose-400">Eliminar Definitivamente:</b> Borra <u>físicamente</u> la fila en BBDD_Gastos de forma permanente con LockService.</li>' +
          '  </ul>' +
          '</div>',
        icon: 'question',
        showCancelButton: true,
        showDenyButton: true,
        confirmButtonText: '🔗 Solo Desvincular',
        denyButtonText: '🗑️ Eliminar Definitivamente',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#4f46e5',
        denyButtonColor: '#e11d48',
        cancelButtonColor: '#64748b',
        reverseButtons: false,
        focusCancel: true
      }).then(function (result) {
        if (result.isConfirmed) {
          ejecutarDesvinculacionGastoActividadFlow(idGasto);
        } else if (result.isDenied) {
          ejecutarEliminacionGastoActividadFlow(idGasto);
        }
      });
    } else {
      if (confirm('¿Deseas desvincular este gasto de la actividad? (Aceptar = Desvincular, Cancelar = Mantener)')) {
        ejecutarDesvinculacionGastoActividadFlow(idGasto);
      }
    }
  }

    }
    if (typeof actualizarTarjetaActividadEnDOM === 'function') {
      actualizarTarjetaActividadEnDOM(idAct);
    }
    if (typeof aplicarFiltrosCruzados === 'function') {
      aplicarFiltrosCruzados();
    }

    renderGastosAsociadosActividadFlow();
    var sInp = document.getElementById('act-flow-gasto-search-input');
    if (typeof renderGastosDisponiblesActividadFlow === 'function') {
      renderGastosDisponiblesActividadFlow(sInp ? sInp.value : '');
    }

    if (typeof actualizarKPIsGlobalesHabitos === 'function') actualizarKPIsGlobalesHabitos();
    if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();

    if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', '🗑️ Gasto Eliminado', 'Gasto ' + idGasto + ' eliminado de forma definitiva.');
    }

    // Solo despachar deleteGasto a backend si tiene ID GAS-XXX real
    if (idGasto.indexOf('GAS-TMP-') === -1 && idGasto.indexOf('GAS-ATM-') === -1) {
      callBackend('deleteGasto', { idGasto: idGasto }, function (res) {
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
        if (typeof actualizarKPIsGlobalesHabitos === 'function') actualizarKPIsGlobalesHabitos();
      }, function (err) {
        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('error', 'Error al Eliminar', (err && err.message) || 'No se pudo eliminar el gasto.');
        }
      });
    }
  }

  /**
   * Elimina o descarta el gasto desde el modal de ActividadFlow.
   * Si es un borrador (inputs con monto/descripción no guardados o ID no persistido), limpia los inputs a vacío.
   * Si ya tiene ID GAS-XXX (egreso persistido en Sheets), despacha callBackend('deleteGasto') y limpia state.gastos.
   */
  function eliminarGastoModalActividadFlow(idGasto) {
    var inpMonto = document.getElementById('act-flow-gasto-input');
    var inpDesc = document.getElementById('act-flow-gasto-desc');

    var idTarget = idGasto;
    if (!idTarget) {
      if (activityFlowState.gastosVinculados && activityFlowState.gastosVinculados.length > 0) {
        idTarget = activityFlowState.gastosVinculados[activityFlowState.gastosVinculados.length - 1];
      } else {
        var idActActual = String(activityFlowState.currentActId || '').trim();
        var gVin = (state.gastos || []).find(function (g) {
          return idActActual && String(g.ID_Tarea || '').trim() === idActActual;
        });
        if (gVin) idTarget = gVin.ID_Gasto;
      }
    }

    var esGastoPersistido = idTarget && /^GAS-[A-Za-z0-9_]+$/.test(idTarget) &&
      idTarget.indexOf('GAS-TMP-') === -1 && idTarget.indexOf('GAS-ATM-') === -1;

    if (esGastoPersistido) {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          title: '¿Eliminar gasto definitivamente?',
          text: 'Se eliminará el egreso ' + idTarget + ' de Finanzas (Sheets) y se desvinculará de la actividad.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#e11d48',
          cancelButtonColor: '#64748b',
          confirmButtonText: 'Sí, eliminar',
          cancelButtonText: 'Cancelar'
        }).then(function (result) {
          if (result.isConfirmed) {
            ejecutarEliminacionGastoActividadFlow(idTarget);
          }
        });
      } else {
        ejecutarEliminacionGastoActividadFlow(idTarget);
      }
    } else {
      // Es un BORRADOR: limpia los inputs a vacío
      if (inpMonto) inpMonto.value = '';
      if (inpDesc) inpDesc.value = '';
      actualizarGastoLabelFlow(0);

      if (idTarget) {
        if (activityFlowState.gastosVinculados) {
          activityFlowState.gastosVinculados = activityFlowState.gastosVinculados.filter(function (x) { return x !== idTarget; });
        }
        if (state.gastos) {
          state.gastos = state.gastos.filter(function (x) { return x.ID_Gasto !== idTarget; });
        }
      }

      var idAct = activityFlowState.currentActId;
      var totalRestante = (state.gastos || []).reduce(function (acc, x) {
        if (String(x.ID_Tarea || '').trim() === String(idAct).trim() ||
            (activityFlowState.gastosVinculados && activityFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1)) {
          return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
        }
        return acc;
      }, 0);
      var actObj = (state.actividadesPersonales || []).find(function (a) {
        return String(a.ID_Actividad || a.ID_Tarea || '').trim() === String(idAct).trim();
      });
      if (actObj) {
        actObj.Monto_Gasto_Asociado = totalRestante;
      }
      if (typeof actualizarTarjetaActividadEnDOM === 'function') {
        actualizarTarjetaActividadEnDOM(idAct);
      }
      if (typeof aplicarFiltrosCruzados === 'function') {
        aplicarFiltrosCruzados();
      }

      renderGastosAsociadosActividadFlow();

      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('info', 'Borrador Descartado', 'Los campos de gasto se han limpiado.');
      }
    }
  }

  /**

   */
  function desvincularGastoActividadFlow(idGasto) {
    confirmarAccionGastoActividadFlow(idGasto);
  }

  /**
   * Guarda de forma atómica la micro-edición in-place del egreso vinculado
   */
  function guardarEdicionRapidaGastoActividad(idGasto) {
    if (!idGasto) return;
    var inpDesc = document.getElementById('act-edit-desc-' + idGasto);
    var inpMonto = document.getElementById('act-edit-monto-' + idGasto);
    var nuevoDesc = inpDesc ? inpDesc.value.trim() : '';
    var nuevoMonto = parseFloat(inpMonto ? inpMonto.value : 0) || 0;

    if (nuevoMonto <= 0) {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('warning', 'Monto Requerido', 'Ingresa un monto válido mayor a 0.');
      }
      return;
    }

    var g = (state.gastos || []).find(function (item) { return String(item.ID_Gasto || '').trim() === String(idGasto).trim(); });
    if (!g) return;

    var mon = g.Moneda_Original || 'PEN';
    var tc = parseFloat(g.Tipo_Cambio) || 1.0;
    var mPen = (mon === 'PEN') ? nuevoMonto : (nuevoMonto * tc);

    g.Descripcion_Gasto = nuevoDesc || g.Descripcion_Gasto;
    g.Descripcion = nuevoDesc || g.Descripcion;
    g.Concepto = nuevoDesc || g.Concepto;
    g.concepto = nuevoDesc || g.concepto;
    g.Monto_Original = nuevoMonto;
    g.montoOriginal = nuevoMonto;
    g.Monto_PEN = mPen;
    g.montoPEN = mPen;
    g.Monto_Moneda_Base = mPen;

    var idAct = activityFlowState.currentActId;
    var totalRestante = (state.gastos || []).reduce(function (acc, x) {
      if (String(x.ID_Tarea || '').trim() === String(idAct).trim() ||
          (activityFlowState.gastosVinculados && activityFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1)) {
        return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
      }
      return acc;
    }, 0);
    var actObj = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || '').trim() === String(idAct).trim();
    });
    if (actObj) {
      actObj.Monto_Gasto_Asociado = totalRestante;
    }
    if (typeof actualizarTarjetaActividadEnDOM === 'function') {
      actualizarTarjetaActividadEnDOM(idAct);
    }
    if (typeof aplicarFiltrosCruzados === 'function') {
      aplicarFiltrosCruzados();
    }

    renderGastosAsociadosActividadFlow();

    if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', 'Gasto Actualizado', 'Egreso ' + idGasto + ' actualizado a ' + mon + ' ' + nuevoMonto.toFixed(2));
    }

    // Persistir actualización en backend de forma atómica
    if (idGasto.indexOf('GAS-TMP-') === -1 && idGasto.indexOf('GAS-ATM-') === -1) {
      callBackend('updateGasto', {
        idGasto: idGasto,
        montoOriginal: nuevoMonto,
        concepto: nuevoDesc,
        descripcionGasto: nuevoDesc,
        monedaOriginal: mon,
        tipoCambio: tc
      }, function () {
        if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
      }, null, { silent: true });
    }
  }

  /**

        '<div class="flex items-center justify-between">' +
          '<div class="min-w-0 flex-1 pr-2">' +
            '<div class="flex items-center gap-1.5">' +

              '<span class="text-[11px] font-medium text-slate-800 dark:text-slate-200 truncate">' + desc + '</span>' +
            '</div>' +
          '</div>' +

            '<span class="font-mono font-bold text-xs text-emerald-700 dark:text-emerald-400">S/ ' + mPen.toFixed(2) + extraDivisa + '</span>' +
            '<button type="button" onclick="toggleEdicionRapidaGastoActividad(\'' + cod + '\')" class="text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-300 text-xs p-1 rounded hover:bg-indigo-50 dark:hover:bg-indigo-950/40 transition active:scale-95 flex items-center justify-center" title="Editar monto o concepto de forma rápida"><svg class="portal-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
            '<button type="button" onclick="confirmarAccionGastoActividadFlow(\'' + cod + '\')" ' +
              'class="text-rose-500 hover:text-rose-700 dark:hover:text-rose-300 text-xs font-bold px-1.5 py-0.5 rounded hover:bg-rose-50 dark:hover:bg-rose-950/40 transition active:scale-95" title="Gestionar egreso (Desvincular o Eliminar definitivamente)">' +
              '✕' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div id="act-flow-gasto-edit-' + cod + '" class="hidden pt-1.5 border-t border-slate-100 dark:border-slate-800 flex items-center gap-1.5">' +
          '<input type="text" id="act-edit-desc-' + cod + '" value="' + fnEscape(desc) + '" class="flex-1 text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Concepto o descripción">' +
          '<input type="number" step="0.01" min="0" id="act-edit-monto-' + cod + '" value="' + mOrig + '" class="w-20 font-mono text-[11px] px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-right focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="0.00">' +
          '<button type="button" onclick="guardarEdicionRapidaGastoActividad(\'' + cod + '\')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold rounded-lg shadow-2xs transition active:scale-95" title="Guardar cambios">💾</button>' +
          '<button type="button" onclick="toggleEdicionRapidaGastoActividad(\'' + cod + '\')" class="px-2 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] font-bold rounded-lg transition active:scale-95" title="Cancelar">✕</button>' +

    if (chip) {
      chip.className = 'inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 transition shadow-2xs';

  function toggleSeccionPasosFlow(e) {
    if (e) e.stopPropagation();
    var c = document.getElementById('flow-pasos-container');
    if (c) {
      c.classList.toggle('hidden');

        var inp = document.getElementById('act-flow-nuevo-paso-input');
