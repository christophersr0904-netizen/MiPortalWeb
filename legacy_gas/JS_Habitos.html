  function agregarPasoFlow() {
    var inp = document.getElementById('act-flow-nuevo-paso-input');
    if (!inp) return;
    var texto = inp.value.trim();
    if (!texto) return;

    if (activityFlowState.mode === 'EDIT' && activityFlowState.currentActId) {
      var idPadre = activityFlowState.currentActId;
      var pasos = obtenerSubtareasPadre(idPadre);
      var siguienteNumero = pasos.length + 1;
      var tempId = 'SUB-TMP-' + Date.now();
      var nuevoObj = {
        ID_Subtarea: tempId,
        idSubtarea: tempId,
        Tipo_Padre: 'ACTIVIDAD',
        tipoPadre: 'ACTIVIDAD',
        ID_Padre_Vinculado: idPadre,
        idPadreVinculado: idPadre,
        ID_Padre: idPadre,
        idPadre: idPadre,
        Numero_Paso: siguienteNumero,
        numeroPaso: siguienteNumero,
        Descripcion_Paso: texto,
        descripcionPaso: texto,
        Completado: false,
        completado: false,
        Fecha_Completado: '',
        fechaCompletado: ''
      };
      if (!Array.isArray(state.subtareas)) state.subtareas = [];
      state.subtareas.push(nuevoObj);
      actualizarWidgetSubtareasEnTarjetaDOM(idPadre);

      callBackend('createsubtarea', {
        idPadre: idPadre,
        idPadreVinculado: idPadre,
        tipoPadre: 'ACTIVIDAD',
        descripcionPaso: texto,
        numeroPaso: siguienteNumero
      }, function (res) {
        if (res && res.success && res.data && res.data.ID_Subtarea) {
          nuevoObj.ID_Subtarea = res.data.ID_Subtarea;
        }
        cargarPasosDesdeStateEnFlow(idPadre);
        actualizarWidgetSubtareasEnTarjetaDOM(idPadre);
      }, null, { silent: true });

      cargarPasosDesdeStateEnFlow(idPadre);
      inp.value = '';
      inp.focus();
      return;
    }

    var nuevoPaso = {
      ID_Subtarea: 'TEMP-STEP-' + Date.now() + '-' + Math.floor(Math.random() * 100),
      Descripcion_Paso: texto,
      Completado: false,
      Numero_Paso: (activityFlowState.pasos || []).length + 1
    };
    if (!Array.isArray(activityFlowState.pasos)) activityFlowState.pasos = [];
    activityFlowState.pasos.push(nuevoPaso);

    inp.value = '';
    inp.focus();
    renderPasosFlow();
  }

  function reordenarPasoFlow(idx, dir) {
    if (!Array.isArray(activityFlowState.pasos)) return;
    var targetIdx = idx + dir;
    if (targetIdx < 0 || targetIdx >= activityFlowState.pasos.length) return;
    var item = activityFlowState.pasos.splice(idx, 1)[0];
    activityFlowState.pasos.splice(targetIdx, 0, item);

    for (var i = 0; i < activityFlowState.pasos.length; i++) {
      activityFlowState.pasos[i].Numero_Paso = i + 1;
    }

    if (activityFlowState.mode === 'EDIT' && activityFlowState.currentActId) {
      var idPadre = activityFlowState.currentActId;
      var pasosState = obtenerSubtareasPadre(idPadre);
      activityFlowState.pasos.forEach(function (p, i) {
        var s = pasosState.find(function (ps) { return ps.ID_Subtarea === p.ID_Subtarea; });
        if (s) s.Numero_Paso = i + 1;
      });
      actualizarWidgetSubtareasEnTarjetaDOM(idPadre);
    }

    renderPasosFlow();
  }

  function eliminarPasoFlow(idx) {
    if (!Array.isArray(activityFlowState.pasos) || idx < 0 || idx >= activityFlowState.pasos.length) return;
    var paso = activityFlowState.pasos[idx];

    if (activityFlowState.mode === 'EDIT' && activityFlowState.currentActId && paso.ID_Subtarea && !paso.ID_Subtarea.startsWith('TEMP-STEP-')) {
      eliminarSubtareaProcedural(paso.ID_Subtarea, activityFlowState.currentActId, 'ACTIVIDAD');
      cargarPasosDesdeStateEnFlow(activityFlowState.currentActId);
      return;
    }

    activityFlowState.pasos.splice(idx, 1);
    for (var i = 0; i < activityFlowState.pasos.length; i++) {
      activityFlowState.pasos[i].Numero_Paso = i + 1;
    }
    renderPasosFlow();
  }

  function toggleEstadoPasoFlow(idx) {
    if (!Array.isArray(activityFlowState.pasos) || idx < 0 || idx >= activityFlowState.pasos.length) return;
    var pasos = activityFlowState.pasos;
    var paso = pasos[idx];
    var isDone = paso.Completado === true || String(paso.Completado).toLowerCase() === 'true';

    if (!isDone) {
      if (idx > 0) {
        var prevIncompletos = pasos.slice(0, idx).filter(function (p) {
          return !(p.Completado === true || String(p.Completado).toLowerCase() === 'true');
        });
        if (prevIncompletos.length > 0) {
          var primerFaltante = prevIncompletos[0];
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'info',
              title: 'Secuencia Bloqueada 🔒',
              text: 'Debes completar primero el Paso ' + (primerFaltante.Numero_Paso || 1) + ' ("' + (primerFaltante.Descripcion_Paso || '') + '") para habilitar este paso.',
              confirmButtonColor: '#4f46e5',
              timer: 3000
            });
          }
          return;
        }
      }
      paso.Completado = true;
    } else {
      paso.Completado = false;
      for (var j = idx + 1; j < pasos.length; j++) {
        pasos[j].Completado = false;
      }
    }

    if (activityFlowState.mode === 'EDIT' && activityFlowState.currentActId && paso.ID_Subtarea && !paso.ID_Subtarea.startsWith('TEMP-STEP-')) {
      toggleSubtareaOptimista(paso.ID_Subtarea, activityFlowState.currentActId, paso.Completado);
      cargarPasosDesdeStateEnFlow(activityFlowState.currentActId);
      return;
    }

    renderPasosFlow();
  }

  function renderPasosFlow() {
    var cont = document.getElementById('act-flow-lista-pasos');
    var badge = document.getElementById('flow-pasos-progreso-badge');
    var bar = document.getElementById('flow-pasos-progreso-bar');
    var lblToggle = document.getElementById('flow-pasos-toggle-label');

    var pasos = activityFlowState.pasos || [];
    var total = pasos.length;
    var comp = pasos.filter(function (p) {
      return p.Completado === true || String(p.Completado).toLowerCase() === 'true';
    }).length;
    var pct = total > 0 ? Math.round((comp / total) * 100) : 0;

    if (badge) {
      if (total > 0) {
        badge.classList.remove('hidden');
        badge.textContent = comp + '/' + total + ' pasos (' + pct + '%)';
        badge.className = 'font-mono text-[10px] font-bold px-2 py-0.5 rounded-full ' + (
          comp === total
            ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60'
            : (comp > 0
              ? 'bg-indigo-100 dark:bg-indigo-950/60 text-indigo-800 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/60'
              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700/60')
        );
      } else {
        badge.classList.add('hidden');
      }
    }
    if (bar) {
      bar.style.width = pct + '%';
      bar.className = (comp === total && total > 0)
        ? 'bg-emerald-500 h-full rounded-full transition-all duration-300'
        : 'bg-gradient-to-r from-indigo-500 to-emerald-500 h-full rounded-full transition-all duration-300';
    }
    if (lblToggle) {
      lblToggle.textContent = total > 0 ? ('Pasos procedurales (' + total + ')') : '+ Añadir pasos secuenciales';
    }

    if (!cont) return;

    if (total === 0) {
      cont.innerHTML = '<p class="text-[11px] text-slate-400 italic text-center py-2.5 bg-white/60 dark:bg-slate-900/40 rounded-xl border border-dashed border-slate-200 dark:border-slate-800">No hay pasos definidos aún. Escribe arriba para guiar el "cómo hacer".</p>';
      return;
    }

    var html = pasos.map(function (p, idx) {
      var isDone = p.Completado === true || String(p.Completado).toLowerCase() === 'true';
      var num = parseInt(p.Numero_Paso, 10) || (idx + 1);

      var isLocked = false;
      if (!isDone && idx > 0) {
        var prevPaso = pasos[idx - 1];
        var prevDone = prevPaso.Completado === true || String(prevPaso.Completado).toLowerCase() === 'true';
        if (!prevDone) isLocked = true;
      }

      var btnChk = isLocked
        ? '<button type="button" disabled class="w-5 h-5 rounded-full border border-slate-300 dark:border-slate-600 flex items-center justify-center text-[10px] cursor-not-allowed bg-slate-200 dark:bg-slate-700 text-slate-500 select-none" title="Bloqueado: completa el Paso ' + idx + ' primero">🔒</button>'
        : '<button type="button" onclick="toggleEstadoPasoFlow(' + idx + ')" class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-transform active:scale-90 ' +
        (isDone ? 'bg-emerald-500 border-emerald-500 text-white font-bold text-xs' : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500 bg-white dark:bg-slate-900') + '" title="' + (isDone ? 'Completado (Clic para desmarcar)' : 'Completar paso ' + num) + '">' +
        (isDone ? '✓' : '') +
        '</button>';

      var strikeClass = isDone ? 'line-through text-slate-400 dark:text-slate-500' : (isLocked ? 'text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100 font-medium');

      return '<div class="flex items-center justify-between gap-2 p-2 rounded-xl border transition text-xs ' +
        (isDone
          ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800/60'
          : (isLocked
            ? 'bg-slate-100/60 dark:bg-slate-800/30 border-slate-200/50 dark:border-slate-800 opacity-60'
            : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700/70 hover:border-indigo-300 dark:hover:border-indigo-600 shadow-2xs')) + '">' +
        '<div class="flex items-center gap-2 min-w-0 flex-1">' +
        btnChk +
        '<span class="font-mono text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200/60 dark:border-slate-700/60 shrink-0 select-none">P' + num + '</span>' +
        '<span class="flex-1 truncate select-none ' + strikeClass + '" title="' + escapeHtml(p.Descripcion_Paso || p.Descripcion || '') + '">' +
        escapeHtml(p.Descripcion_Paso || p.Descripcion || '') +
        '</span>' +
        '</div>' +
        '<div class="flex items-center gap-0.5 shrink-0">' +
        '<button type="button" onclick="reordenarPasoFlow(' + idx + ', -1)" ' + (idx === 0 ? 'disabled class="opacity-25 p-1 text-slate-300"' : 'class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded transition"') + ' title="Subir orden">▲</button>' +
        '<button type="button" onclick="reordenarPasoFlow(' + idx + ', 1)" ' + (idx === total - 1 ? 'disabled class="opacity-25 p-1 text-slate-300"' : 'class="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded transition"') + ' title="Bajar orden">▼</button>' +
        '<button type="button" onclick="eliminarPasoFlow(' + idx + ')" class="p-1 text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded transition" title="Eliminar paso">🗑️</button>' +
        '</div>' +
        '</div>';
    }).join('');

    cont.innerHTML = html;
  }

  function abrirDatePickerFlow(e) {
    if (e) e.stopPropagation();
    var pop = document.getElementById('flow-datepicker-popover');
    if (!pop) return;

    var d = activityFlowState.picker.selectedDate ? new Date(activityFlowState.picker.selectedDate + 'T00:00:00') : new Date();
    activityFlowState.picker.currentMonth = d.getMonth();
    activityFlowState.picker.currentYear = d.getFullYear();

    renderCalendarioDatePicker();

    var timeInp = document.getElementById('flow-picker-time-input');
    if (timeInp) timeInp.value = activityFlowState.picker.hora || '08:00';

    var recSelect = document.getElementById('flow-recurrencia-preset');
    if (recSelect) recSelect.value = activityFlowState.picker.frecuencia || 'DIARIA';

    var custPanel = document.getElementById('flow-recurrencia-custom-panel');
    if (custPanel) {
      if (activityFlowState.picker.frecuencia === 'PERSONALIZADA') custPanel.classList.remove('hidden');
      else custPanel.classList.add('hidden');
    }

    var isPuntual = (activityFlowState.picker.duracion === 0 || activityFlowState.picker.esPuntual === true);
    activityFlowState.picker.esPuntual = isPuntual;
    var tog = document.getElementById('flow-toggle-puntual');
    if (tog) tog.checked = isPuntual;

    var durCont = document.getElementById('flow-duracion-container');
    if (durCont) {
      if (isPuntual) durCont.classList.add('opacity-40', 'pointer-events-none');
      else durCont.classList.remove('opacity-40', 'pointer-events-none');
    }

    var h = Math.floor(activityFlowState.picker.duracion || 0);
    var m = Math.round(((activityFlowState.picker.duracion || 0) % 1) * 60);
    var inpH = document.getElementById('flow-custom-horas');
    var inpM = document.getElementById('flow-custom-minutos');
    if (inpH) inpH.value = isPuntual ? 0 : h;
    if (inpM) inpM.value = isPuntual ? 0 : m;

    renderDiasRecurrenciaBotones();
    actualizarDuracionPillsUI();
    actualizarResumenRecurrencia();

    pop.classList.remove('hidden');
  }

  function cerrarDatePickerFlow() {
    var pop = document.getElementById('flow-datepicker-popover');
    if (pop) pop.classList.add('hidden');
  }

  function navegarMesDatePicker(delta) {
    var m = activityFlowState.picker.currentMonth + delta;
    var y = activityFlowState.picker.currentYear;
    if (m < 0) { m = 11; y--; }
    else if (m > 11) { m = 0; y++; }
    activityFlowState.picker.currentMonth = m;
    activityFlowState.picker.currentYear = y;
    renderCalendarioDatePicker();
  }

  function irAHoyDatePicker() {
    var now = new Date();
    activityFlowState.picker.currentMonth = now.getMonth();
    activityFlowState.picker.currentYear = now.getFullYear();
    activityFlowState.picker.selectedDate = now.toISOString().split('T')[0];
    renderCalendarioDatePicker();
    actualizarResumenRecurrencia();
  }

  var MESES_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  function renderCalendarioDatePicker() {
    var m = activityFlowState.picker.currentMonth;
    var y = activityFlowState.picker.currentYear;
    var tit = document.getElementById('flow-cal-mes-ano');
    if (tit) tit.textContent = MESES_ES[m] + ' ' + y;

    var grid = document.getElementById('flow-cal-dias-grid');
    if (!grid) return;

    var primerDia = new Date(y, m, 1);
    var ultimoDia = new Date(y, m + 1, 0);
    var diasEnMes = ultimoDia.getDate();

    var diaSemanaInicio = (primerDia.getDay() + 6) % 7;

    var hoyStr = new Date().toISOString().split('T')[0];
    var selStr = activityFlowState.picker.selectedDate;

    var html = '';
    for (var i = 0; i < diaSemanaInicio; i++) {
      html += '<div class="p-1"></div>';
    }

    for (var d = 1; d <= diasEnMes; d++) {
      var dPad = d < 10 ? '0' + d : String(d);
      var mPad = (m + 1) < 10 ? '0' + (m + 1) : String(m + 1);
      var fechaVal = y + '-' + mPad + '-' + dPad;

      var esHoy = (fechaVal === hoyStr);
      var esSel = (fechaVal === selStr);

      var cls = 'flow-cal-day py-1.5 rounded-lg text-center font-medium cursor-pointer transition select-none';
      if (esSel) {
        cls += ' selected bg-indigo-600 text-white font-bold shadow-xs';
      } else if (esHoy) {
        cls += ' today bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 font-bold border border-indigo-200 dark:border-indigo-800';
      } else {
        cls += ' text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800';
      }

      html += '<button type="button" onclick="seleccionarDiaDatePicker(\'' + fechaVal + '\')" class="' + cls + '">' + d + '</button>';
    }

    grid.innerHTML = html;
  }

  function seleccionarDiaDatePicker(fechaStr) {
    activityFlowState.picker.selectedDate = fechaStr;
    renderCalendarioDatePicker();
    actualizarResumenRecurrencia();
  }

  function toggleTareaPuntualPicker(checked) {
    activityFlowState.picker.esPuntual = !!checked;
    var durCont = document.getElementById('flow-duracion-container');
    var hidEsPuntual = document.getElementById('act-flow-es-puntual');
    if (hidEsPuntual) hidEsPuntual.value = checked ? 'true' : 'false';
    var hidDurMin = document.getElementById('act-flow-duracion-minutos');
    if (hidDurMin) hidDurMin.value = checked ? '0' : '60';

    if (checked) {
      activityFlowState.picker.duracion = 0;
      if (durCont) {
        durCont.classList.add('opacity-40', 'pointer-events-none');
      }
      var inpHoras = document.getElementById('flow-custom-horas');
      var inpMins = document.getElementById('flow-custom-minutos');
      if (inpHoras) inpHoras.value = 0;
      if (inpMins) inpMins.value = 0;
      var badge = document.getElementById('flow-custom-total-badge');
      if (badge) {
        badge.textContent = '0h (Puntual)';
        badge.className = 'text-[10px] font-mono font-bold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/60 px-2 py-1 rounded-md border border-amber-200/50 dark:border-amber-800/40';
      }
    } else {
      activityFlowState.picker.duracion = 1.0;
      if (durCont) {
        durCont.classList.remove('opacity-40', 'pointer-events-none');
      }
      var inpHoras = document.getElementById('flow-custom-horas');
      var inpMins = document.getElementById('flow-custom-minutos');
      if (inpHoras) inpHoras.value = 1;
      if (inpMins) inpMins.value = 0;
    }

    actualizarDuracionPillsUI();
    actualizarResumenRecurrencia();
  }

  function seleccionarHoraPreset(hora, dur) {
    activityFlowState.picker.hora = hora;
    var numDur = (dur !== undefined && !isNaN(parseFloat(dur))) ? parseFloat(dur) : 1.0;
    activityFlowState.picker.duracion = numDur;
    activityFlowState.picker.esPuntual = (numDur === 0);

    var tog = document.getElementById('flow-toggle-puntual');
    if (tog) tog.checked = activityFlowState.picker.esPuntual;

    var durCont = document.getElementById('flow-duracion-container');
    if (durCont) {
      if (activityFlowState.picker.esPuntual) durCont.classList.add('opacity-40', 'pointer-events-none');
      else durCont.classList.remove('opacity-40', 'pointer-events-none');
    }

    var inp = document.getElementById('flow-picker-time-input');
    if (inp) inp.value = hora;

    actualizarDuracionPillsUI();
    actualizarResumenRecurrencia();
  }

  function actualizarHoraManualPicker(val) {
    activityFlowState.picker.hora = val || '08:00';
    actualizarResumenRecurrencia();
  }

  function seleccionarDuracionPicker(dur) {
    var num = parseFloat(dur);
    activityFlowState.picker.duracion = isNaN(num) ? 1.0 : num;
    activityFlowState.picker.esPuntual = (activityFlowState.picker.duracion === 0);

    var tog = document.getElementById('flow-toggle-puntual');
    if (tog) tog.checked = activityFlowState.picker.esPuntual;

    var durCont = document.getElementById('flow-duracion-container');
    if (durCont) {
      if (activityFlowState.picker.esPuntual) durCont.classList.add('opacity-40', 'pointer-events-none');
      else durCont.classList.remove('opacity-40', 'pointer-events-none');
    }

    var h = Math.floor(activityFlowState.picker.duracion);
    var m = Math.round((activityFlowState.picker.duracion % 1) * 60);
    var inpH = document.getElementById('flow-custom-horas');
    var inpM = document.getElementById('flow-custom-minutos');
    if (inpH) inpH.value = h;
    if (inpM) inpM.value = m;

    actualizarDuracionPillsUI();
    actualizarResumenRecurrencia();
  }

  function actualizarDuracionManualExacta() {
    var inpH = document.getElementById('flow-custom-horas');
    var inpM = document.getElementById('flow-custom-minutos');
    var h = inpH ? Math.max(0, parseInt(inpH.value, 10) || 0) : 0;
    var m = inpM ? Math.max(0, Math.min(59, parseInt(inpM.value, 10) || 0)) : 0;

    var dur = h + (m / 60);
    dur = Math.round(dur * 100) / 100;

    activityFlowState.picker.duracion = dur;
    activityFlowState.picker.esPuntual = (dur === 0);

    var tog = document.getElementById('flow-toggle-puntual');
    if (tog) tog.checked = activityFlowState.picker.esPuntual;

    var durCont = document.getElementById('flow-duracion-container');
    if (durCont) {
      if (activityFlowState.picker.esPuntual) durCont.classList.add('opacity-40', 'pointer-events-none');
      else durCont.classList.remove('opacity-40', 'pointer-events-none');
    }

    actualizarDuracionPillsUI();
    actualizarResumenRecurrencia();
  }

  function actualizarDuracionPillsUI() {
    var cur = activityFlowState.picker.duracion;
    var isPuntual = (cur === 0);

    var pills = document.querySelectorAll('#flow-duracion-pills .flow-dur-btn');
    pills.forEach(function (btn) {
      if (isPuntual) {
        btn.className = 'flow-dur-btn px-2 py-0.5 text-[10px] font-bold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-indigo-500 transition';
        return;
      }
      var d = parseFloat(btn.textContent);
      var match = false;
      if (btn.textContent === '15m' && Math.abs(cur - 0.25) < 0.05) match = true;
      else if (btn.textContent === '30m' && Math.abs(cur - 0.5) < 0.05) match = true;
      else if (btn.textContent === '45m' && Math.abs(cur - 0.75) < 0.05) match = true;
      else if (btn.textContent === '1h' && Math.abs(cur - 1.0) < 0.05) match = true;
      else if (btn.textContent === '1.5h' && Math.abs(cur - 1.5) < 0.05) match = true;
      else if (btn.textContent === '2h' && Math.abs(cur - 2.0) < 0.05) match = true;
      else if (!isNaN(d) && Math.abs(d - cur) < 0.05) match = true;

      if (match) {
        btn.className = 'flow-dur-btn px-2 py-0.5 text-[10px] font-bold rounded-lg border border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 transition shadow-2xs';
      } else {
        btn.className = 'flow-dur-btn px-2 py-0.5 text-[10px] font-bold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-indigo-500 transition';
      }
    });

    var badge = document.getElementById('flow-custom-total-badge');
    if (badge) {
      if (isPuntual) {
        badge.textContent = '0h (Puntual)';
        badge.className = 'text-[10px] font-mono font-bold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/60 px-2 py-1 rounded-md border border-amber-200/50 dark:border-amber-800/40';
      } else {
        var h = Math.floor(cur);
        var m = Math.round((cur % 1) * 60);
        var text = cur.toFixed(2).replace(/\.00$/, '') + 'h';
        if (m > 0 && h > 0) text += ' (' + h + 'h ' + m + 'm)';
        else if (h === 0 && m > 0) text += ' (' + m + 'm)';
        badge.textContent = text;
        badge.className = 'text-[10px] font-mono font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-2 py-1 rounded-md border border-indigo-200/50 dark:border-indigo-800/40';
      }
    }
  }

  function cambiarFrecuenciaPresetPicker(val) {
    activityFlowState.picker.frecuencia = val;
    var panel = document.getElementById('flow-recurrencia-custom-panel');
    if (panel) {
      if (val === 'PERSONALIZADA') panel.classList.remove('hidden');
      else panel.classList.add('hidden');
    }
    if (val === 'DIARIA_LABORAL') {
      activityFlowState.picker.repeatDays = ['LU', 'MA', 'MI', 'JU', 'VI'];
    } else if (val === 'FIN_SEMANA') {
      activityFlowState.picker.repeatDays = ['SA', 'DO'];
    } else if (val === 'DIARIA') {
      activityFlowState.picker.repeatDays = ['LU', 'MA', 'MI', 'JU', 'VI', 'SA', 'DO'];
    }
    renderDiasRecurrenciaBotones();
    actualizarResumenRecurrencia();
  }

  function toggleDiaRecurrencia(dia) {
    // Si la frecuencia actual no es personalizada o semanal, iniciar selección limpia con el día pulsado
    if (activityFlowState.picker.frecuencia !== 'PERSONALIZADA' && activityFlowState.picker.frecuencia !== 'SEMANAL') {
      activityFlowState.picker.repeatDays = [dia];
    } else {
      var arr = activityFlowState.picker.repeatDays || [];
      var idx = arr.indexOf(dia);
      if (idx !== -1) {
        if (arr.length > 1) arr.splice(idx, 1);
      } else {
        arr.push(dia);
      }
      activityFlowState.picker.repeatDays = arr;
    }

    // Asegurar que la frecuencia pase a PERSONALIZADA para que la serie semanal se cree en backend
    activityFlowState.picker.frecuencia = 'PERSONALIZADA';
    var selFrec = document.getElementById('flow-recurrencia-preset');
    if (selFrec) selFrec.value = 'PERSONALIZADA';
    var panel = document.getElementById('flow-recurrencia-custom-panel');
    if (panel) panel.classList.remove('hidden');

    renderDiasRecurrenciaBotones();
    actualizarResumenRecurrencia();
  }

  function renderDiasRecurrenciaBotones() {
    var arr = activityFlowState.picker.repeatDays || [];
    var btns = document.querySelectorAll('#flow-repeat-days-container .flow-day-btn');
    btns.forEach(function (btn) {
      var d = btn.getAttribute('data-day');
      if (arr.indexOf(d) !== -1) {
        btn.className = 'flow-day-btn active w-6 h-6 rounded-full border border-indigo-600 bg-indigo-600 text-white text-[10px] font-bold transition flex items-center justify-center shadow-2xs';
      } else {
        btn.className = 'flow-day-btn w-6 h-6 rounded-full border border-slate-300 dark:border-slate-600 text-[10px] font-bold text-slate-500 dark:text-slate-400 hover:border-indigo-400 transition flex items-center justify-center';
      }
    });
  }

  function formatHoraHumanaFlow(hStr) {
    if (!hStr) return '08:00 AM';
    var parts = hStr.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts[1] || '00';
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if (h === 0) h = 12;
    var hPad = h < 10 ? '0' + h : String(h);
    return hPad + ':' + m + ' ' + ampm;
  }

  function actualizarResumenRecurrencia() {
    var p = activityFlowState.picker;
    var h = formatHoraHumanaFlow(p.hora);
    var f = p.frecuencia;
    var durTxt = (p.duracion === 0) ? ' · 📌 Tarea puntual (0h)' : (' · ⏱️ ' + formatearDuracionMinutos(p.duracion));
    var txt = '';

    if (f === 'NINGUNA') {
      txt = p.selectedDate
        ? ('Actividad puntual el ' + p.selectedDate + ' a las ' + h + durTxt)
        : ('Sin fecha programada (Borrador)' + durTxt);
    } else if (f === 'DIARIA') {
      txt = 'Se repite todos los días a las ' + h + durTxt;
    } else if (f === 'DIARIA_LABORAL') {
      txt = 'De lunes a viernes a las ' + h + durTxt;
    } else if (f === 'FIN_SEMANA') {
      txt = 'Fines de semana (Sábados y Domingos) a las ' + h + durTxt;
    } else if (f === 'SEMANAL') {
      txt = 'Cada semana a las ' + h + durTxt;
    } else if (f === 'MENSUAL') {
      txt = 'Mensualmente a las ' + h + durTxt;
    } else if (f === 'PERSONALIZADA') {
      var intv = document.getElementById('flow-repeat-interval')?.value || p.repeatInterval || 1;
      var unit = document.getElementById('flow-repeat-unit')?.value || p.repeatUnit || 'SEMANA';
      var uMap = { 'DIA': 'día(s)', 'SEMANA': 'semana(s)', 'MES': 'mes(es)' };
      txt = 'Cada ' + intv + ' ' + (uMap[unit] || 'semana(s)');
      if (unit === 'SEMANA' && p.repeatDays && p.repeatDays.length > 0) {
        txt += ' los ' + p.repeatDays.join(', ');
      }
      txt += ' a las ' + h + durTxt;
    }

    var el = document.getElementById('flow-resumen-recurrencia');
    if (el) el.textContent = txt;
  }

  /**
   * Compila el array estructurado de días seleccionados (ej: [1, 4] donde 1=Lunes, 4=Jueves, 0=Domingo)
   */
  function compilarDiasSeleccionadosFlow() {
    var p = activityFlowState.picker;
    var f = String(p.frecuencia || 'DIARIA').trim().toUpperCase();

    if (f === 'NINGUNA') return [];
    if (f === 'DIARIA_LABORAL') return [1, 2, 3, 4, 5];
    if (f === 'FIN_SEMANA') return [6, 0];
    if (f === 'DIARIA') return [1, 2, 3, 4, 5, 6, 0];

    var mapDias = {
      'LU': 1, 'LUN': 1, 'L': 1,
      'MA': 2, 'MAR': 2, 'M': 2,
      'MI': 3, 'MIER': 3, 'X': 3,
      'JU': 4, 'JUE': 4, 'J': 4,
      'VI': 5, 'VIE': 5, 'V': 5,
      'SA': 6, 'SAB': 6, 'S': 6,
      'DO': 0, 'DOM': 0, 'D': 0
    };

    if (Array.isArray(p.repeatDays) && p.repeatDays.length > 0) {
      var nums = [];
      p.repeatDays.forEach(function (d) {
        var k = String(d).toUpperCase().trim();
        if (mapDias[k] !== undefined && nums.indexOf(mapDias[k]) === -1) {
          nums.push(mapDias[k]);
        }
      });
      nums.sort(function (a, b) {
        var oA = a === 0 ? 7 : a;
        var oB = b === 0 ? 7 : b;
        return oA - oB;
      });
      return nums;
    }

    return [];
  }

  /**
   * Compila la regla de repetición al formato canónico compatible con CalendarService
   */
  function compilarReglaRepeticionFlow() {
    var p = activityFlowState.picker;
    var f = String(p.frecuencia || 'DIARIA').trim().toUpperCase();

    if (f === 'NINGUNA' || f === 'DIARIA') {
      return '';
    }

    if (f === 'DIARIA_LABORAL') {
      return 'L-V';
    } else if (f === 'FIN_SEMANA') {
      return 'DIAS:S,D';
    } else if (f === 'SEMANAL' || f === 'PERSONALIZADA' || (Array.isArray(p.repeatDays) && p.repeatDays.length > 0)) {
      if (Array.isArray(p.repeatDays) && p.repeatDays.length > 0) {
        var ordenCanonico = ['LU', 'MA', 'MI', 'JU', 'VI', 'SA', 'DO'];
        var mapDias = {
          'LU': 'L', 'LUN': 'L',
          'MA': 'M', 'MAR': 'M',
          'MI': 'X', 'MIER': 'X',
          'JU': 'J', 'JUE': 'J',
          'VI': 'V', 'VIE': 'V',
          'SA': 'S', 'SAB': 'S',
          'DO': 'D', 'DOM': 'D'
        };
        var diasFiltrados = ordenCanonico.filter(function (diaRef) {
          return p.repeatDays.some(function (d) {
            return String(d).toUpperCase().trim() === diaRef;
          });
        });
        var diasFormateados = diasFiltrados.map(function (d) {
          return mapDias[d] || d;
        });
        return diasFormateados.length > 0 ? ('DIAS:' + diasFormateados.join(',')) : '';
      }
    }
    return '';
  }

  function aplicarDatePickerFlow() {
    var p = activityFlowState.picker;
    var hidFecha = document.getElementById('act-flow-fecha-val');
    var hidHora = document.getElementById('act-flow-hora-val');
    var hidDur = document.getElementById('act-flow-duracion-val');
    var hidDurMin = document.getElementById('act-flow-duracion-minutos');

    var hidRegla = document.getElementById('act-flow-regla-val');

    var isPuntual = (p.esPuntual || parseFloat(p.duracion) === 0);
    var durVal = isPuntual ? 0 : ((p.duracion !== undefined && p.duracion !== null && !isNaN(parseFloat(p.duracion))) ? parseFloat(p.duracion) : 1.0);
    var durMin = isPuntual ? 0 : Math.round(durVal * 60);

    var diasSel = compilarDiasSeleccionadosFlow();
    var reglaRep = compilarReglaRepeticionFlow();

    if (hidFecha) hidFecha.value = p.selectedDate || '';

    if (hidFrec) hidFrec.value = p.frecuencia || (isPuntual ? 'NINGUNA' : 'DIARIA');

    var lbl = document.getElementById('flow-chip-datetime-label');
    if (lbl) {
      var hHum = formatHoraHumanaFlow(p.hora);
      var durSuffix = (durVal === 0) ? ' · 📌 Puntual' : (durVal !== 1.0 ? ' · ' + formatearDuracionMinutos(durVal) : '');
      if (p.frecuencia === 'NINGUNA') {

      }
    }

  }

  /**
   * Abre y pre-pobla el modal interactivo de Actividades / Hábitos en modo edición.
   * Restaura fielmente fecha, hora, duración, frecuencia, regla de repetición y notas
   * sin modificar valores por defecto ni alterar el estado guardado.
   *
   * @param {string} idActividad - Identificador único de la actividad a editar
   */
  function abrirModalEditarActividadPersonal(idActividad, abrirNotasDirecto) {
    // 1. Localizar la actividad en el estado en memoria
    var act = (state.actividadesPersonales || []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea).trim() === String(idActividad).trim();
    });
    if (!act) return;

    // 2. Limpiar el formulario base
    limpiarFormularioActividad();

    // 3. Configurar modo y referencias principales
    var idActReal = String(act.ID_Actividad || act.ID_Tarea || act.id || idActividad || '').trim();
    activityFlowState.mode = 'EDIT';
    activityFlowState.currentActId = idActReal;
    activityFlowState.notasVinculadasDraft = [];

    // 4. Restaurar Categoría de Vida
    var normCat = normalizarCategoriaClave(act.Categoria_Vida);
    seleccionarCategoriaFlow(normCat);

    // 5. Asignar Título e Identificadores
    var tit = document.getElementById('act-flow-titulo');
    if (tit) tit.value = act.Nombre_Actividad || '';

    var fId = document.getElementById('act-flow-id');
    if (fId) fId.value = idActReal;
    var fEditId = document.getElementById('edit-act-id');
    if (fEditId) fEditId.value = idActReal;
    var modalEl = document.getElementById('modal-actividad-flow');
    if (modalEl) modalEl.setAttribute('data-id-actividad', idActReal);

    // 6. Asignar Notas / Observaciones
    var not = document.getElementById('act-flow-notas');
    if (not) {
      not.value = String(act.Notas_Checklist || '');
    }

    // 6.1. Restaurar Metas Cuantificables (Fase 4.8)
    var mmInp = document.getElementById('act-flow-meta-macro'); if (mmInp) mmInp.value = act.Meta_Macro_Nombre || '';
    var umInp = document.getElementById('act-flow-unidad-medida'); if (umInp) umInp.value = act.Unidad_Medida || '';
    var mtInp = document.getElementById('act-flow-meta-total'); if (mtInp) mtInp.value = act.Meta_Objetivo_Total || '';
    var vaInp = document.getElementById('act-flow-valor-acumulado'); if (vaInp) vaInp.value = act.Valor_Acumulado_Actual || '';
    var mdInp = document.getElementById('act-flow-meta-diaria'); if (mdInp) mdInp.value = act.Meta_Diaria_Estandar || '';
    var rmInp = document.getElementById('act-flow-rescate-minimo'); if (rmInp) rmInp.value = act.Nivel_Rescate_Minimo || '';
    var secMeta = document.getElementById('act-flow-meta-section');
    if (secMeta) {
      if (act.Meta_Macro_Nombre || (parseFloat(act.Meta_Objetivo_Total) || 0) > 0 || (parseFloat(act.Valor_Acumulado_Actual) || 0) > 0 || (parseFloat(act.Nivel_Rescate_Minimo) || 0) > 0) {
        secMeta.classList.remove('hidden');
      } else {
        secMeta.classList.add('hidden');
      }
    }

    // 7. Restaurar Gasto Asociado y Divisa
    activityFlowState.gastosVinculados = [];
    activityFlowState.tabGasto = 'NUEVO';
    var gasDesc = document.getElementById('act-flow-gasto-desc');
    if (gasDesc) gasDesc.value = '';
    var gasSearch = document.getElementById('act-flow-gasto-search-input');
    if (gasSearch) gasSearch.value = '';

    var gastoAsoc = (state.gastos || []).find(function (g) {
      return String(g.ID_Tarea || '').trim() === String(act.ID_Actividad).trim();
    });
    var monGasto = gastoAsoc ? (gastoAsoc.Moneda_Original || gastoAsoc.monedaOriginal || 'PEN') : 'PEN';
    seleccionarMonedaActividadFlow(monGasto);

    var gasInp = document.getElementById('act-flow-gasto-input');
    if (gasInp) gasInp.value = '';
    actualizarGastoLabelFlow(0);
    cambiarTabGastoActividadFlow('NUEVO');
    renderGastosAsociadosActividadFlow();

    var gasCont = document.getElementById('flow-gasto-container');
    if (gasCont) {
      var tieneGastos = (state.gastos || []).some(function (g) { return String(g.ID_Tarea || '').trim() === String(act.ID_Actividad).trim(); });
      if (tieneGastos) {
        gasCont.classList.remove('hidden');
      } else {
        gasCont.classList.add('hidden');
      }
    }

    // 8. Restaurar Prioridad Eisenhower
    actualizarPrioridadUIFlow(act.Prioridad_Eisenhower || '02_P2_Media');

    // 9. Restaurar Estado de Sincronización con Google Calendar
    var calSyncPrevia = (
      String(act.Agendado_Calendar || '').toLowerCase().startsWith('s') ||
      String(act.Agendado_Calendar || '') === 'true' ||
      Boolean(act.ID_Evento_Calendar)
    ) ? 'Sí' : 'No';
    activityFlowState.agendadoCalendar = calSyncPrevia;
    actualizarCalendarUIFlow(calSyncPrevia);

    // 10. Normalizar y parsear Fecha y Hora
    var fecLimpia = act.Fecha_Programada ? String(act.Fecha_Programada).split('T')[0].split(' ')[0] : '';
    var horLimpia = (typeof formatHoraLimpia === 'function')
      ? formatHoraLimpia(act.Hora_Inicio)
      : (act.Hora_Inicio || '08:00');
    if (horLimpia === '--:--' || !horLimpia) horLimpia = '08:00';

    // 11. Normalizar Duración y distinguir actividades puntuales (0 horas)
    var durVal = 1.0;
    if (act.Duracion_Horas !== undefined && act.Duracion_Horas !== null && !isNaN(parseFloat(act.Duracion_Horas))) {
      durVal = parseFloat(act.Duracion_Horas);
    }
    var esPuntual = (durVal === 0 || act.Tipo_Compromiso === 'PUNTUAL');

    // 12. Interpretar Frecuencia de Ciclo y Regla de Repetición
    var frecGuardada = String(act.Frecuencia_Ciclo || (esPuntual ? 'NINGUNA' : 'DIARIA')).trim().toUpperCase();
    var reglaGuardada = String(act.Regla_Repeticion || '').trim().toUpperCase();

    // Actualizar el estado interno de la ventana (activityFlowState.picker)
    activityFlowState.tipo = esPuntual ? 'PUNTUAL' : 'HABITUAL';
    activityFlowState.picker.selectedDate = fecLimpia;
    activityFlowState.picker.hora = horLimpia;
    activityFlowState.picker.duracion = durVal;
    activityFlowState.picker.esPuntual = esPuntual;
    activityFlowState.picker.frecuencia = frecGuardada;

    // 13. Decodificar días específicos si la regla guardada los contiene
    if (reglaGuardada.startsWith('DIAS:')) {
      var diasRaw = reglaGuardada.replace('DIAS:', '').split(',');
      var mapReverse = { 'L': 'LU', 'M': 'MA', 'X': 'MI', 'J': 'JU', 'V': 'VI', 'S': 'SA', 'D': 'DO' };
      activityFlowState.picker.repeatDays = diasRaw.map(function (d) {
        var clean = d.trim();
        return mapReverse[clean] || clean;
      });
    } else if (frecGuardada === 'DIARIA_LABORAL' || reglaGuardada === 'L-V') {
      activityFlowState.picker.repeatDays = ['LU', 'MA', 'MI', 'JU', 'VI'];
    } else if (frecGuardada === 'FIN_SEMANA' || reglaGuardada === 'DIAS:S,D') {
      activityFlowState.picker.repeatDays = ['SA', 'DO'];
    } else {
      activityFlowState.picker.repeatDays = ['LU', 'MA', 'MI', 'JU', 'VI'];
    }

  function cargarPasosDesdeStateEnFlow(idActividad) {
    var idNorm = String(idActividad || '').trim();
    if (!idNorm) {
      activityFlowState.pasos = [];
      renderPasosFlow();
      return;
    }
    var subs = (typeof obtenerSubtareasPadre === 'function')
      ? obtenerSubtareasPadre(idNorm)
      : (state.subtareas || []).filter(function (s) {
        return String(s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre || '').trim() === idNorm;
      });

    activityFlowState.pasos = subs.map(function (s, idx) {
      var isComp = (s.Completado === true || String(s.Completado).toLowerCase() === 'true' || s.Estado === '02_Completada' || s.Estado === 'Completada');
      return {
        ID_Subtarea: s.ID_Subtarea,
        Descripcion_Paso: s.Descripcion_Paso || s.Descripcion || '',
        Descripcion: s.Descripcion_Paso || s.Descripcion || '',
        Completado: isComp,
        Estado: isComp ? '02_Completada' : '01_Pendiente',
        Numero_Paso: parseInt(s.Numero_Paso || s.Orden_Ejecucion || (idx + 1), 10) || (idx + 1)
      };
    });

    var pasosCont = document.getElementById('flow-pasos-container');
    if (pasosCont) {
      if (activityFlowState.pasos.length > 0) pasosCont.classList.remove('hidden');

    var durMinutos = esPuntualCheck ? 0 : Math.round(durHoras * 60);

    // Tipo de compromiso: Puntual si es 0 horas, caso contrario el seleccionado (o HABITUAL por defecto)

      console.log('[ActividadFlow] Enviando payload (creación):', payloadCreate);

    } else {

        if (String(x.ID_Tarea || '').trim() === String(idAct).trim() ||

          return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
        }
        return acc;
      }, 0);

      var payloadUpdate = {

  /**

  function guardarNuevaActividadPersonal(payloadForm) {
    var tempId = 'TEMP-' + Date.now();
    var fechaDef = payloadForm.fechaProgramada || new Date().toISOString().split('T')[0];
    var catKey = normalizarCategoriaVida(payloadForm.categoriaVida || 'SALUD_DEPORTE');

    // Normalización de duración 0 y actividad puntual
    var isPuntual = (payloadForm.esPuntual === true || String(payloadForm.esPuntual) === 'true' || Number(payloadForm.duracionMinutos) === 0 || parseFloat(payloadForm.duracionHoras) === 0);
    var duracionReal = isPuntual ? 0 : ((payloadForm.duracionHoras !== undefined && payloadForm.duracionHoras !== null && !isNaN(parseFloat(payloadForm.duracionHoras))) ? parseFloat(payloadForm.duracionHoras) : 1.0);
    payloadForm.esPuntual = isPuntual;
    payloadForm.duracionHoras = duracionReal;
    payloadForm.duracionMinutos = isPuntual ? 0 : Math.round(duracionReal * 60);

    console.log('[ActividadFlow] Payload final procesado en guardarNuevaActividadPersonal:', payloadForm);

    var nuevaActividadLocal = {
      ID_Actividad: tempId,
      Nombre_Actividad: payloadForm.nombreActividad,
      Tipo_Compromiso: isPuntual ? 'PUNTUAL' : (payloadForm.tipoCompromiso || 'HABITUAL'),
      Categoria_Vida: payloadForm.categoriaVida || 'SALUD_DEPORTE',
      Estado: payloadForm.estado || '02_Por_Hacer',
      Prioridad_Eisenhower: payloadForm.prioridad || '02_P2_Media',
      Frecuencia_Ciclo: payloadForm.frecuenciaCiclo || (isPuntual ? 'NINGUNA' : 'DIARIA'),
      Regla_Repeticion: payloadForm.reglaRepeticion || '',
      Racha_Actual: 0,
      Fecha_Programada: fechaDef,
      Hora_Inicio: payloadForm.horaInicio || '08:00',
      Duracion_Horas: duracionReal,
      Agendado_Calendar: payloadForm.agendadoCalendar || 'No',
      ID_Evento_Calendar: '',
      Monto_Gasto_Asociado: parseFloat(payloadForm.montoGastoAsociado) || 0.0,
      Notas_Checklist: payloadForm.notasChecklist || ''
    };

    if (!state.actividadesPersonales) state.actividadesPersonales = [];
    state.actividadesPersonales.unshift(nuevaActividadLocal);
    if (state.actividades) state.actividades = state.actividadesPersonales;

    if (!state.subtareas) state.subtareas = [];
    var subsArray = Array.isArray(payloadForm.subtareas) ? payloadForm.subtareas : [];
    subsArray.forEach(function (desc, idx) {
      var descStr = (typeof desc === 'object' && desc !== null)
        ? (desc.Descripcion_Paso || desc.Descripcion || '')
        : String(desc || '');
      if (descStr.trim()) {
        state.subtareas.push({
          ID_Subtarea: 'TEMP-STEP-' + tempId + '-' + (idx + 1),
          idSubtarea: 'TEMP-STEP-' + tempId + '-' + (idx + 1),
          ID_Padre_Vinculado: tempId,
          idPadreVinculado: tempId,
          ID_Padre: tempId,
          idPadre: tempId,
          Tipo_Padre: 'ACTIVIDAD',
          tipoPadre: 'ACTIVIDAD',
          Numero_Paso: idx + 1,
          numeroPaso: idx + 1,
          Orden_Ejecucion: idx + 1,
          Descripcion_Paso: descStr.trim(),
          descripcionPaso: descStr.trim(),
          Completado: false,
          completado: false,
          Estado: '01_Pendiente',
          Fecha_Completado: '',
          fechaCompletado: ''
        });
      }
    });

    closeModal('modal-actividad-flow');
    limpiarFormularioActividad();

    var listaPend = document.getElementById('lista-pendientes-' + catKey);
    if (listaPend) {
      var emptyMsg = listaPend.querySelector('.italic');
      if (emptyMsg) emptyMsg.remove();

      var nuevaTarjeta = crearTarjetaActividadGoogleTasks(nuevaActividadLocal, false);
      nuevaTarjeta.classList.add('transition-all', 'duration-300', 'transform', '-translate-y-2', 'opacity-0');
      vincularDragCard(nuevaTarjeta);

  function obtenerIdActividadContextoFlow() {
    var idAct = '';

    if (typeof activityFlowState !== 'undefined' && activityFlowState && activityFlowState.currentActId) {
      idAct = String(activityFlowState.currentActId).trim();
    }
    // 2. Input oculto #act-flow-id
    if (!idAct) {
      var elActFlowId = document.getElementById('act-flow-id');
      if (elActFlowId && elActFlowId.value) idAct = String(elActFlowId.value).trim();
    }
    // 3. Input oculto #edit-act-id
    if (!idAct) {
      var elEditActId = document.getElementById('edit-act-id');
      if (elEditActId && elEditActId.value) idAct = String(elEditActId.value).trim();
    }
    // 4. Atributo en modal #modal-actividad-flow
    if (!idAct) {
      var elModal = document.getElementById('modal-actividad-flow');
      if (elModal && elModal.getAttribute('data-id-actividad')) {
        idAct = String(elModal.getAttribute('data-id-actividad')).trim();
      }
    }
    // 5. Elemento visible en modal: #flow-badge-modo (únicamente si coincide con formato ACT/HAB)
    if (!idAct) {

        if (matchBadge) {
          idAct = matchBadge[0].toUpperCase();

      }

    return idAct || '';

        '</div>' +
        '<button type="button" onclick="event.stopPropagation(); desvincularNotaDeActividadFlow(\'' + idN + '\')" class="p-1 text-slate-400 hover:text-rose-500 transition rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40 cursor-pointer" title="Desvincular nota de este hábito">' +
          '<svg class="portal-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
        '</button>' +
      '</div>';
    }).join('');
  }

  function filtrarNotasParaVincularActividadFlow(query) {
    var cont = document.getElementById('act-flow-notas-disponibles-list');
    if (!cont) return;

    var idAct = obtenerIdActividadContextoFlow();
    var q = String(query || '').trim().toLowerCase();

    var st = window.state || (typeof state !== 'undefined' ? state : null);
    var todasNotas = (st && Array.isArray(st.notas)) ? st.notas : [];

    var vinculadasActuales = (idAct && typeof obtenerNotasVinculadasAEntidad === 'function')
      ? obtenerNotasVinculadasAEntidad(idAct, 'ACTIVIDAD')
      : [];
    var vinculadasMap = {};
    vinculadasActuales.forEach(function (n) {
      var k = String(n.ID_Nota || n.idNota || n.id || '').toUpperCase();
      if (k) vinculadasMap[k] = true;
    });

    if (!idAct && activityFlowState && Array.isArray(activityFlowState.notasVinculadasDraft)) {
      activityFlowState.notasVinculadasDraft.forEach(function (kD) {
        if (kD) vinculadasMap[kD] = true;
      });
    }

    var candidatas = todasNotas.filter(function (n) {
      if (!n) return false;
      var idN = String(n.ID_Nota || n.idNota || n.id || '').toUpperCase();
      if (vinculadasMap[idN]) return false;
      if (!q) return true;
      var tit = String(n.Titulo || n.titulo || '').toLowerCase();
      var cont = String(n.Contenido || n.contenido || '').toLowerCase();
      var tags = String(n.Etiquetas || n.tags || '').toLowerCase();
      return idN.toLowerCase().includes(q) || tit.includes(q) || cont.includes(q) || tags.includes(q);
    });

    if (candidatas.length === 0) {
      cont.innerHTML = '<div class="py-2 text-center text-slate-400 italic text-xs">' +
        (q ? 'No se encontraron notas con "' + escapeHtml(q) + '"' : 'No hay más notas disponibles para vincular') +
      '</div>';
      return;
    }

    cont.innerHTML = candidatas.slice(0, 8).map(function (n) {
      var idN = n.ID_Nota || n.idNota || n.id || '';
      var tit = n.Titulo || n.titulo || 'Nota sin título';
      var tipo = (typeof clasificarTipoNota === 'function') ? clasificarTipoNota(n) : 'NOTA';
      var cfg = (typeof CONFIG_TIPO_NOTA !== 'undefined' && CONFIG_TIPO_NOTA[tipo]) ? CONFIG_TIPO_NOTA[tipo] : null;
      var iconSvg = cfg ? cfg.svg : '<svg class="portal-icon-sm shrink-0 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>';

      return '<div class="flex items-center justify-between gap-2 p-1.5 rounded-xl hover:bg-purple-50/80 dark:hover:bg-purple-950/40 border border-slate-200/60 dark:border-slate-800 text-xs transition group">' +
        '<div class="flex items-center gap-1.5 overflow-hidden flex-1 min-w-0">' +
          iconSvg +
          '<span class="truncate font-medium text-slate-700 dark:text-slate-200 group-hover:text-purple-700 dark:group-hover:text-purple-300">' + escapeHtml(tit) + '</span>' +
          '<span class="font-mono text-[10px] text-slate-400 shrink-0">(' + idN + ')</span>' +
        '</div>' +
        '<button type="button" onclick="event.stopPropagation(); event.preventDefault(); vincularNotaAActividadFlow(\'' + idN + '\')" ' +
          'class="px-2 py-0.5 rounded-lg text-[10px] font-bold text-purple-600 dark:text-purple-400 hover:bg-purple-100 dark:hover:bg-purple-900/60 active:scale-95 transition shrink-0 cursor-pointer">' +
          '+ Vincular' +
        '</button>' +
      '</div>';
    }).join('');
  }

  function ejecutarFallbackGuardadoNota(idNota, nuevoVinculo, callback) {
    var st = window.state || (typeof state !== 'undefined' ? state : null);
    var notaObj = (st && Array.isArray(st.notas)) ? st.notas.find(function (n) {
      return String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase() === String(idNota).trim().toUpperCase();
    }) : null;

    if (!notaObj) {
      var errObj = { success: false, error: 'Nota no encontrada en state.notas' };
      if (typeof callback === 'function') callback(errObj);
      return;
    }

    var vinculosFinales = Array.isArray(notaObj.Vinculos) ? notaObj.Vinculos : [nuevoVinculo];
    var payloadBackend = Object.assign({}, notaObj, {
      ID_Nota: notaObj.ID_Nota || idNota,
      Vinculos: vinculosFinales,
      esNueva: false,
      isNew: false
    });

    if (typeof callBackend === 'function') {
      callBackend('updateNota', payloadBackend, function (res) {
        if (res && res.success && res.nota && typeof res.nota === 'object') {
          Object.assign(notaObj, res.nota);
        }
        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('success', 'Vínculo guardado (fallback)', nuevoVinculo.titulo || nuevoVinculo.codigo);
        }
        if (typeof callback === 'function') callback(res || { success: true });
      }, function (err) {
        console.error('[Habitos Vincular Fallback Error]:', err);
        var errRes = { success: false, error: err && (err.message || String(err)) || 'Error en callBackend' };
        if (typeof callback === 'function') callback(errRes);
      }, { silent: true });
    } else {
      console.error('[Habitos Vincular Fallback] callBackend no disponible en el entorno');
      if (typeof callback === 'function') callback({ success: false, error: 'callBackend no disponible' });
    }
  }

  function vincularNotaAActividadFlow(idNota) {
    console.log('[Habitos Vincular] Click detectado para nota:', idNota);

    var idAct = obtenerIdActividadContextoFlow();

    if (!idAct) {
      console.error('[Habitos Vincular] ERROR: ID Actividad no detectado. Fallaron: activityFlowState.currentActId, #act-flow-id, #edit-act-id, #flow-badge-modo, modal/card dataset');
      if (!activityFlowState) activityFlowState = {};
      if (!Array.isArray(activityFlowState.notasVinculadasDraft)) activityFlowState.notasVinculadasDraft = [];
      var idNotaUpper = String(idNota).trim().toUpperCase();
      if (!activityFlowState.notasVinculadasDraft.includes(idNotaUpper)) {
        activityFlowState.notasVinculadasDraft.push(idNotaUpper);
      }
      renderNotasVinculadasActividadFlow();
      filtrarNotasParaVincularActividadFlow('');
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('success', 'Nota asociada al borrador', 'Se vinculará automáticamente al guardar el hábito.');
      }
      return;
    }

    console.log('[Habitos Vincular] ID Actividad detectado:', idAct);

    if (typeof activityFlowState !== 'undefined' && activityFlowState) {
      activityFlowState.currentActId = idAct;
    }

    var st = window.state || (typeof state !== 'undefined' ? state : null);
    var actObj = (st && Array.isArray(st.actividadesPersonales) ? st.actividadesPersonales : []).find(function (a) {
      return String(a.ID_Actividad || a.ID_Tarea || a.id || '').trim().toUpperCase() === idAct.toUpperCase();
    });
    var nomAct = actObj ? (actObj.Nombre_Actividad || idAct) : idAct;

    var nuevoVinculo = {
      tipo: 'ACTIVIDAD',
      codigo: idAct,
      titulo: nomAct
    };

    // a) Agrega inmediatamente el objeto de la actividad al array 'Vinculos' de la nota en 'state.notas'
    var notaObj = (st && Array.isArray(st.notas)) ? st.notas.find(function (n) {
      return String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase() === String(idNota).trim().toUpperCase();
    }) : null;

    if (notaObj) {
      var arrV = notaObj.Vinculos || notaObj.vinculos || [];
      if (typeof arrV === 'string' && arrV.trim()) {
        try { arrV = JSON.parse(arrV); } catch (e) { arrV = []; }
      }
      if (!Array.isArray(arrV)) arrV = [];
      var yaVinculado = arrV.some(function (v) {
        if (!v) return false;
        var c = typeof v === 'string' ? v : (v.codigo || v.id);
        return String(c || '').trim().toUpperCase() === idAct.toUpperCase();
      });
      if (!yaVinculado) {
        arrV.push(nuevoVinculo);
        notaObj.Vinculos = arrV;
        notaObj.vinculos = arrV;
      }
    }

    // Actualización visual reactiva inmediata en memoria
    if (typeof window.invalidarCacheNotasVinculadas === 'function') {
      window.invalidarCacheNotasVinculadas();
    }
    renderNotasVinculadasActividadFlow();
    filtrarNotasParaVincularActividadFlow('');
    actualizarBadgesActividadFlow(idAct);
    if (typeof window.renderTableroActividadesPersonales === 'function') {
      try { window.renderTableroActividadesPersonales(); } catch (eTab) { console.warn(eTab); }
    }

    // Callback de refresco y traza tras persistencia
    var callbackRefresco = function (res) {
      console.log('[Habitos Vincular] Estado de vinculacion:', res);
      renderNotasVinculadasActividadFlow();
      filtrarNotasParaVincularActividadFlow('');
      actualizarBadgesActividadFlow(idAct);
      if (typeof window.renderTableroActividadesPersonales === 'function') {
        try { window.renderTableroActividadesPersonales(); } catch (eTab) { console.warn(eTab); }
      }
    };

    // b) Llama a 'window.vincularNotaAEntidad'
    var vincularFn = (typeof window.vincularNotaAEntidad === 'function')
      ? window.vincularNotaAEntidad
      : (typeof vincularNotaAEntidad === 'function' ? vincularNotaAEntidad : null);

    if (vincularFn) {
      try {
        vincularFn(idNota, nuevoVinculo, function (res) {
          callbackRefresco(res);
        });
      } catch (errSync) {
        console.warn('[Habitos Vincular] Error en vincularNotaAEntidad, ejecutando fallback directo:', errSync);
        // c) Fallback directo con callBackend
        ejecutarFallbackGuardadoNota(idNota, nuevoVinculo, callbackRefresco);
      }
    } else {
      console.warn('[Habitos Vincular] vincularNotaAEntidad no disponible, ejecutando fallback directo');
      // c) Fallback directo con callBackend
      ejecutarFallbackGuardadoNota(idNota, nuevoVinculo, callbackRefresco);
    }
  }

  function desvincularNotaDeActividadFlow(idNota) {
    var idAct = obtenerIdActividadContextoFlow();

    if (!idAct) {
      if (activityFlowState && Array.isArray(activityFlowState.notasVinculadasDraft)) {
        var idNotaUpper = String(idNota).trim().toUpperCase();
        activityFlowState.notasVinculadasDraft = activityFlowState.notasVinculadasDraft.filter(function (x) {
          return x !== idNotaUpper && x.replace(/^NOT-0*/, 'NOT-') !== idNotaUpper.replace(/^NOT-0*/, '');
        });
      }
      renderNotasVinculadasActividadFlow();
      filtrarNotasParaVincularActividadFlow('');
      return;
    }

    var st = window.state || (typeof state !== 'undefined' ? state : null);
    var notaObj = (st && Array.isArray(st.notas)) ? st.notas.find(function (n) {
      return String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase() === String(idNota).trim().toUpperCase();
    }) : null;

    if (notaObj) {
      var arrV = notaObj.Vinculos || notaObj.vinculos || [];
      if (typeof arrV === 'string' && arrV.trim()) {
        try { arrV = JSON.parse(arrV); } catch (e) { arrV = []; }
      }
      if (Array.isArray(arrV)) {
        arrV = arrV.filter(function (v) {
          if (!v) return false;
          var c = typeof v === 'string' ? v : (v.codigo || v.id);
          return String(c || '').trim().toUpperCase() !== idAct.toUpperCase();
        });
        notaObj.Vinculos = arrV;
        notaObj.vinculos = arrV;
      }
    }

    if (typeof window.invalidarCacheNotasVinculadas === 'function') {
      window.invalidarCacheNotasVinculadas();
    }
    renderNotasVinculadasActividadFlow();
    filtrarNotasParaVincularActividadFlow('');

    var desvincularFn = (typeof window.desvincularNotaDeEntidad === 'function')
      ? window.desvincularNotaDeEntidad
      : (typeof desvincularNotaDeEntidad === 'function' ? desvincularNotaDeEntidad : null);

    if (desvincularFn) {
      try {
        desvincularFn(idNota, idAct, function (res) {
          renderNotasVinculadasActividadFlow();
          filtrarNotasParaVincularActividadFlow('');
          actualizarBadgesActividadFlow(idAct);
          if (typeof window.renderTableroActividadesPersonales === 'function') {
            try { window.renderTableroActividadesPersonales(); } catch (eTab) { console.warn(eTab); }
          }
        });
      } catch (errDesv) {
        console.error('[desvincularNotaDeActividadFlow Error]:', errDesv);
      }
    } else {
      console.warn('[desvincularNotaDeActividadFlow] desvincularNotaDeEntidad no disponible');
    }
  }

  // ============================================================================
  // SECCIÓN: METAS CUANTIFICABLES Y AVANCE RÁPIDO (FASE 4.8)
  // ============================================================================
  function toggleMetaCuantitativaFlow(event) {
    if (event) {
      if (typeof event.stopPropagation === 'function') event.stopPropagation();
      if (typeof event.preventDefault === 'function') event.preventDefault();
    }
    var sec = document.getElementById('act-flow-meta-section');
    if (!sec) return;
    var isHidden = sec.classList.contains('hidden');
    if (isHidden) {
      sec.classList.remove('hidden');
      var mInp = document.getElementById('act-flow-meta-macro');
      if (mInp) setTimeout(function () { mInp.focus(); }, 60);
    } else {
      sec.classList.add('hidden');
    }
  }

  function registrarAvanceHabitoRapido(idActividad) {
    var st = window.state || (typeof state !== 'undefined' ? state : null);
    var act = (st && Array.isArray(st.actividadesPersonales))
      ? st.actividadesPersonales.find(function(a) {
          return String(a.ID_Actividad || a.ID_Tarea).trim() === String(idActividad).trim();
        })
      : null;
    if (!act) return;

    var uMed = act.Unidad_Medida || "unidades";
    var rescMin = parseFloat(act.Nivel_Rescate_Minimo) || 0;
    var metaDia = parseFloat(act.Meta_Diaria_Estandar) || 0;
    var metaTot = parseFloat(act.Meta_Objetivo_Total) || 0;
    var valAcum = parseFloat(act.Valor_Acumulado_Actual) || 0;

    var infoHtml = `
      <div class="text-left text-xs space-y-2 mb-2">
        <p><strong>Meta:</strong> ${escapeHtml(act.Nombre_Actividad)}</p>
        <p><strong>Acumulado actual:</strong> <span class="font-mono font-bold">${valAcum} ${escapeHtml(uMed)}</span> ${metaTot > 0 ? `(de ${metaTot})` : ''}</p>
        ${rescMin > 0 ? `<p class="text-cyan-600 dark:text-cyan-400"><strong>Rescate mínimo de racha:</strong> ≥ ${rescMin} ${escapeHtml(uMed)}</p>` : ''}
        ${metaDia > 0 ? `<p class="text-slate-500"><strong>Meta diaria estándar:</strong> ${metaDia} ${escapeHtml(uMed)}</p>` : ''}
      </div>
    `;

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Registrar Avance Cuantitativo',
        html: infoHtml + '<input type="number" step="any" min="0" id="swal-inp-avance" class="swal2-input !mt-2" placeholder="Cantidad de ' + escapeHtml(uMed) + '">',
        showCancelButton: true,
        confirmButtonText: 'Registrar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#0891b2',
        preConfirm: function() {
          var val = document.getElementById('swal-inp-avance')?.value;
          var num = parseFloat(val);
          if (isNaN(num) || num <= 0) {
            Swal.showValidationMessage('Ingresa un valor numérico válido mayor a 0');
            return false;
          }
          return num;
        }
      }).then(function(res) {
        if (!res.isConfirmed || !res.value) return;
        var avanceNum = res.value;

        // Actualización optimista
        var nuevoAcum = valAcum + avanceNum;
        act.Valor_Acumulado_Actual = nuevoAcum;
        if (rescMin > 0 && avanceNum >= rescMin) {
          act.Racha_Actual = (parseInt(act.Racha_Actual, 10) || 0) + 1;
          lanzarCelebracionConfetti(act.Racha_Actual);
        }
        if (metaTot > 0 && nuevoAcum >= metaTot) {
          act.Estado = '04_Completado';
        }

        if (typeof renderizarHabitosGoogleTasks === 'function') {
          renderizarHabitosGoogleTasks();
        } else if (typeof renderTableroActividadesPersonales === 'function') {
          renderTableroActividadesPersonales();
        }

        procesarAccionBackend('registraravancecuantitativo', {
          idActividad: idActividad,
          valorAvance: avanceNum
        }, function(resp) {
          if (resp && resp.success) {
            if (resp.valorAcumuladoActual !== undefined) act.Valor_Acumulado_Actual = resp.valorAcumuladoActual;
            if (resp.rachaActual !== undefined) act.Racha_Actual = resp.rachaActual;
            if (resp.estado !== undefined) act.Estado = resp.estado;
            if (typeof renderizarHabitosGoogleTasks === 'function') {
              renderizarHabitosGoogleTasks();
            } else if (typeof renderTableroActividadesPersonales === 'function') {
              renderTableroActividadesPersonales();
            }
          }
        });
      });
    } else {
      var promptVal = prompt('Ingresa la cantidad de ' + uMed + ' para registrar avance:');
      var num = parseFloat(promptVal);
      if (!isNaN(num) && num > 0) {
        procesarAccionBackend('registraravancecuantitativo', {
          idActividad: idActividad,
          valorAvance: num
        }, function(resp) {
          if (resp && resp.success) {
            if (resp.valorAcumuladoActual !== undefined) act.Valor_Acumulado_Actual = resp.valorAcumuladoActual;
            if (resp.rachaActual !== undefined) act.Racha_Actual = resp.rachaActual;
            if (resp.estado !== undefined) act.Estado = resp.estado;
            if (typeof renderizarHabitosGoogleTasks === 'function') renderizarHabitosGoogleTasks();
          }
        });
      }
    }
  }

  window.obtenerIdActividadContextoFlow = obtenerIdActividadContextoFlow;
  window.actualizarBadgesActividadFlow = actualizarBadgesActividadFlow;
  window.toggleNotasSectionActividadFlow = toggleNotasSectionActividadFlow;
  window.toggleMetaCuantitativaFlow = toggleMetaCuantitativaFlow;
  window.registrarAvanceHabitoRapido = registrarAvanceHabitoRapido;
  window.renderNotasVinculadasActividadFlow = renderNotasVinculadasActividadFlow;
  window.filtrarNotasParaVincularActividadFlow = filtrarNotasParaVincularActividadFlow;
  window.vincularNotaAActividadFlow = vincularNotaAActividadFlow;
  window.desvincularNotaDeActividadFlow = desvincularNotaDeActividadFlow;

  window.renderTableroActividadesPersonales = renderTableroActividadesPersonales;
  window.renderHabitos = renderTableroActividadesPersonales;
</script>
