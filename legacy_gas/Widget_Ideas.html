<!-- ===================================================================== -->
<!-- COMPONENTE: MICRO-BOTÓN '+' EXPANDIBLE Y VENTANA FLOTANTE PIP IDEAS   -->
<!-- ESTÁNDAR: Cobalt Aerodynamic A.2.2 • Glassmorphism • Cero Emojis       -->
<!-- ===================================================================== -->

<!-- 1. MICRO-BOTÓN FLOTANTE EXPANDIBLE (Dynamic Micro-Pill) -->
<div id="widget-ideas-bubble-container"
     class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-[9990] flex flex-col items-end gap-2.5 select-none pointer-events-auto">

  <!-- POPOVER DE MICRO-CAPTURA RÁPIDA (Diseño Original Limpio + Detección de #tags) -->
  <div id="popover-captura-rapida-idea"
       class="hidden w-80 sm:w-96 p-4 rounded-3xl bg-slate-900/95 dark:bg-slate-950/95 backdrop-blur-2xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5),0_0_20px_rgba(99,102,241,0.25)] text-slate-100 flex-col gap-3.5 transition-all duration-200 origin-bottom-right">
    
    <!-- Cabecera Limpia Original: Título, Expandir a Editor y Botón 'x' -->
    <div class="flex items-center justify-between border-b border-white/5 pb-2.5">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 text-indigo-400 flex items-center justify-center border border-indigo-500/30">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M5 12h14"/><path d="M12 5v14"/>
          </svg>
        </div>
        <span class="text-xs font-bold tracking-wide text-slate-200">Captura Rápida de Idea</span>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" onclick="expandirCapturaAEditorAmplio()"
                class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-300 hover:bg-white/5 transition cursor-pointer"
                title="Expandir a Editor Amplio">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>
          </svg>
        </button>
        <button type="button" onclick="togglePopoverCapturaRapida(false)"
                class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition cursor-pointer"
                title="Cerrar Captura">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Campo de Texto Principal: Textarea Nativo Único y Limpio (Cero superposición, cero divs fantasma) -->
    <textarea id="input-captura-rapida-enunciado"
              rows="4"
              placeholder="Escribe tu pensamiento, chispazo o idea... (puedes usar #tags)"
              class="w-full bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/60 focus:ring-1 focus:ring-indigo-500/40 transition-all duration-200 resize-none min-h-[100px] leading-relaxed"></textarea>

    <!-- Micro-Badge Interactivo de Adjunto Temporal Cargado (Sin cerrar ni guardar a traición) -->
    <div id="badge-adjunto-temporal-popover" class="hidden items-center justify-between px-3 py-1.5 rounded-xl bg-indigo-950/70 border border-indigo-500/40 text-indigo-200 text-xs shadow-inner">
      <div class="flex items-center gap-2 overflow-hidden min-w-0">
        <div id="badge-adjunto-preview-icon" class="shrink-0 flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </div>
        <span id="badge-adjunto-nombre" class="truncate font-mono text-[11px] text-slate-200">archivo.ext</span>
        <span id="badge-adjunto-tamano" class="text-[10px] text-indigo-300/70 shrink-0 font-mono"></span>
      </div>
      <button type="button" onclick="quitarAdjuntoTemporalIdea(event)"
              class="p-1 rounded-lg hover:bg-white/10 text-slate-400 hover:text-rose-300 transition cursor-pointer shrink-0 ml-1.5"
              title="Quitar adjunto">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Controles de Captura Multimodal y Envío en Disposición Original -->
    <div class="flex items-center justify-between gap-2 pt-0.5">
      <div class="flex items-center gap-1.5">
        <!-- Botón 1: Grabar Audio -->
        <button type="button" id="btn-quick-audio-record" onclick="alternarGrabacionAudioRapida(event)"
                class="px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white border border-white/5 transition flex items-center gap-1.5 text-xs font-medium cursor-pointer group"
                title="Grabar Nota de Voz">
          <svg class="w-3.5 h-3.5 text-indigo-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
          <span id="label-quick-audio" class="font-mono text-[11px]">Voz</span>
        </button>

        <!-- Botón 2: Adjuntar Archivo Multiformato (Fotos, Audios, Documentos) -->
        <button type="button" id="btn-quick-file-attach" onclick="dispararCapturaArchivoIdea()"
                class="px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white border border-white/5 transition flex items-center gap-1.5 text-xs font-medium cursor-pointer group"
                title="Adjuntar foto, audio o archivo">
          <svg class="w-3.5 h-3.5 text-emerald-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
          <span class="font-mono text-[11px]">Adjuntar</span>
        </button>
        <input type="file" id="input-archivo-idea" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" class="hidden" onchange="procesarArchivoIdeaSeleccionado(event)">
        <input type="file" id="input-archivo-foto-oculto" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" class="hidden" onchange="procesarArchivoIdeaSeleccionado(event)">
      </div>

      <!-- Botón de Guardado con animación de carga -->
      <button type="button" id="btn-quick-idea-submit" onclick="guardarCapturaRapidaIdea()"
              class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white transition-all duration-150 flex items-center gap-1.5 text-xs font-bold shadow-md shadow-indigo-600/30 cursor-pointer">
        <span id="label-quick-submit">Guardar</span>
        <svg id="icon-quick-submit" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </button>
    </div>

    <!-- Banner de Grabación de Audio Activa -->
    <div id="banner-grabacion-activa" class="hidden items-center justify-between px-3 py-1.5 rounded-xl bg-rose-950/70 border border-rose-800/60 text-rose-300">
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-0.5 h-3.5">
          <span class="w-1 bg-rose-400 rounded-full wave-bar-1"></span>
          <span class="w-1 bg-rose-400 rounded-full wave-bar-2"></span>
          <span class="w-1 bg-rose-400 rounded-full wave-bar-3"></span>
          <span class="w-1 bg-rose-400 rounded-full wave-bar-4"></span>
          <span class="w-1 bg-rose-400 rounded-full wave-bar-5"></span>
        </div>
        <span class="text-xs font-bold">Grabando</span>
        <span id="timer-grabacion-audio" class="font-mono tabular-nums text-xs font-bold text-rose-200">00:00</span>
      </div>
      <button type="button" onclick="cancelarGrabacionAudio()" class="text-[11px] font-semibold text-rose-300 hover:text-white underline cursor-pointer">
        Cancelar
      </button>
    </div>

    <!-- Guía de Micrófono -->
    <div id="banner-guia-permisos-mic" class="hidden flex-col gap-1.5 p-2.5 rounded-xl bg-amber-950/70 border border-amber-800/80 text-amber-200">
      <div class="text-[11px] leading-relaxed">
        <strong class="font-bold text-amber-100 block">Permiso de micrófono bloqueado</strong>
        Haz clic en el candado <span class="font-bold text-white underline">🔒</span> de tu navegador y activa "Micrófono".
      </div>
      <button type="button" onclick="document.getElementById('banner-guia-permisos-mic').classList.add('hidden')"
              class="self-end text-[10px] font-bold text-amber-300 hover:text-white cursor-pointer">
        Entendido
      </button>
    </div>
  </div>

  <!-- CONTENEDOR FLOTANTE: [ DRAG HANDLE ] + [ BOTÓN '+' ] + [ HOVER: FOCO + CONTADOR ] -->
  <div id="widget-ideas-pill"
       class="group flex items-center p-1 rounded-full bg-slate-900/90 dark:bg-slate-950/90 backdrop-blur-xl border border-white/10 shadow-2xl transition-all duration-300 ease-out select-none">
    
    <!-- 1. DRAG HANDLE / GRIP DEDICADO: Micro-zona con rejilla de 6 puntos para mover la cápsula -->
    <div id="widget-ideas-drag-handle"
         class="ideas-drag-handle flex items-center justify-center w-5 h-8 px-1 text-slate-400 hover:text-slate-200 cursor-grab active:cursor-grabbing shrink-0 transition-colors"
         style="touch-action: none;"
         title="Arrastrar widget de ideas">
      <svg class="w-3.5 h-3.5 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="8" cy="6" r="1.5"/>
        <circle cx="16" cy="6" r="1.5"/>
        <circle cx="8" cy="12" r="1.5"/>
        <circle cx="16" cy="12" r="1.5"/>
        <circle cx="8" cy="18" r="1.5"/>
        <circle cx="16" cy="18" r="1.5"/>
      </svg>
    </div>

    <!-- 2. Micro-Botón (+) de Captura Rápida Instantánea -->
    <button type="button" id="btn-widget-ideas-add" onclick="togglePopoverCapturaRapida()"
            class="w-8 h-8 rounded-full bg-indigo-600/90 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer border border-indigo-400/40 shrink-0"
            title="Nueva Idea Rápida (+)">
      <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- Botón Secundario del Foco con Badge: Oculto en reposo, revelado al Hover del contenedor -->
    <div class="max-w-0 opacity-0 group-hover:max-w-xs group-hover:opacity-100 group-focus-within:max-w-xs group-focus-within:opacity-100 transition-all duration-300 ease-out flex items-center overflow-hidden pointer-events-none group-hover:pointer-events-auto group-focus-within:pointer-events-auto">
      <div class="w-[1px] h-4 bg-white/10 mx-1 shrink-0"></div>
      
      <button type="button" id="btn-widget-ideas-bubble" onclick="toggleVentanaFlotanteIdeas()"
              class="flex items-center gap-1.5 px-2 py-1 rounded-full hover:bg-white/10 transition-colors cursor-pointer shrink-0"
              title="Abrir Gestión de Ideas">
        <!-- Icono Foco (Lucide lightbulb) -->
        <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-amber-400 via-orange-500 to-indigo-500 flex items-center justify-center text-white shadow-xs">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
            <path d="M9 18h6"/>
            <path d="M10 22h4"/>
          </svg>
        </div>

        <!-- Micro-Badge Contador Monospaciado -->
        <span id="badge-contador-ideas-activas"
              class="font-mono tabular-nums text-[11px] font-bold text-amber-300 bg-amber-500/15 border border-amber-500/30 px-1.5 py-0.2 rounded-full">
          0
        </span>
      </button>
    </div>
  </div>
</div>

<!-- ===================================================================== -->
<!-- 2. VENTANA FLOTANTE ESTILO CANVAS / PIP (ARRASTRABLE Y REDIMENSIONABLE)-->
<!-- ===================================================================== -->
<div id="ventana-flotante-ideas"
     class="ideas-floating-window hidden z-[9995] rounded-2xl bg-slate-900/95 dark:bg-slate-950/95 backdrop-blur-2xl border border-slate-700/60 shadow-2xl select-none"
     style="width: 440px; height: 580px; bottom: 85px; right: 24px;">

  <!-- Cabecera Arrastrable con Controles PIP: Minimizar, Maximizar y Cerrar -->
  <div id="ideas-floating-drag-header"
       class="ideas-window-drag-header p-3 px-4 border-b border-white/10 flex items-center justify-between shrink-0 bg-white/[0.03]">
    
    <div class="flex items-center gap-2.5 pointer-events-none">
      <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-amber-400/20 via-orange-500/20 to-indigo-500/20 text-amber-300 flex items-center justify-center border border-amber-500/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
        </svg>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-extrabold text-slate-100 tracking-tight">Gestión de Ideas</span>
        <span id="drawer-ideas-total-badge" class="font-mono tabular-nums text-[10px] font-bold px-1.5 py-0.2 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
          0
        </span>
      </div>
    </div>

    <!-- Controles de Ventana PIP -->
    <div class="flex items-center gap-1">
      <!-- Botón Minimizar -->
      <button type="button" onclick="toggleMinimizarVentanaIdeas()"
              class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition cursor-pointer"
              title="Minimizar ventana">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- Botón Maximizar / Restaurar -->
      <button type="button" id="btn-maximize-ideas-window" onclick="toggleMaximizarVentanaIdeas()"
              class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition cursor-pointer"
              title="Maximizar / Restaurar">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
        </svg>
      </button>

      <!-- Botón Cerrar -->
      <button type="button" onclick="cerrarVentanaFlotanteIdeas()"
              class="p-1 rounded-lg text-slate-400 hover:text-rose-300 hover:bg-rose-500/20 transition cursor-pointer"
              title="Cerrar ventana">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Barra de Filtros y Búsqueda -->
  <div id="ideas-floating-filterbar" class="p-2.5 sm:px-3 border-b border-white/10 bg-black/20 flex flex-col gap-2 shrink-0">
    <!-- Pestañas Zen -->
    <div class="flex items-center justify-between gap-1 p-0.5 rounded-xl bg-white/[0.03] border border-white/5">
      <button type="button" id="tab-ideas-inbox" onclick="cambiarFiltroEstadoIdeas('inbox')"
              class="flex-1 text-center py-1 rounded-lg text-xs font-bold bg-indigo-600/30 text-indigo-200 border border-indigo-500/30 transition cursor-pointer">
        Inbox (<span id="count-tab-ideas-inbox" class="font-mono tabular-nums">0</span>)
      </button>
      <button type="button" id="tab-ideas-incubacion" onclick="cambiarFiltroEstadoIdeas('incubacion')"
              class="flex-1 text-center py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition cursor-pointer">
        Incubación (<span id="count-tab-ideas-incubacion" class="font-mono tabular-nums">0</span>)
      </button>
      <button type="button" id="tab-ideas-procesadas" onclick="cambiarFiltroEstadoIdeas('procesadas')"
              class="flex-1 text-center py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition cursor-pointer">
        Procesadas (<span id="count-tab-ideas-procesadas" class="font-mono tabular-nums">0</span>)
      </button>
    </div>

    <!-- Buscador Reactivo -->
    <div class="relative">
      <input type="text" id="input-busqueda-ideas-drawer" oninput="filtrarIdeasDrawer()"
             placeholder="Buscar en ideas capturadas..."
             class="w-full pl-7 pr-3 py-1 text-xs bg-black/30 text-slate-200 placeholder-slate-500 rounded-lg border border-white/5 focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30 transition outline-none">
      <svg class="w-3.5 h-3.5 absolute left-2 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
  </div>

  <!-- Contenedor con Scroll de la Lista de Ideas (Tarjetas Ligeras Kanban Zen) -->
  <div id="ideas-floating-body" class="flex-1 overflow-hidden flex flex-col relative">
    <div id="contenedor-lista-ideas-drawer"
         class="flex-1 overflow-y-auto p-3 flex flex-col gap-2">
      <!-- Se inyecta dinámicamente vía renderListaDrawerIdeas() -->
    </div>

    <!-- Indicador visual sutil de tirador de redimensión -->
    <svg class="ideas-resize-handle text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="20" y1="10" x2="10" y2="20"/>
      <line x1="20" y1="16" x2="16" y2="20"/>
    </svg>
  </div>
</div>
