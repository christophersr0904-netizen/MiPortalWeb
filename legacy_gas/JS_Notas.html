  /**
   * Helper universal para normalizar variantes cromáticas (Fase 4.13).
   * Acepta: tokens Tailwind canónicos, aliases en español/inglés, valores #HEX.
   * Los tokens HEX se devuelven tal cual (pasan-through), sin entrada en PALETA.
   */
  function normalizarColorNota(c) {
    if (!c) return 'default';
    var s = String(c).trim();
    // Pass-through HEX
    if (/^#[0-9a-fA-F]{3,8}$/.test(s)) return s.toLowerCase();
    s = s.toLowerCase();
    // Tokens canónicos Tailwind directos
    // 16 tonos canónicos Fase 4.13 + 'default' + tonos legacy (fuchsia, pink) por no regresión
    var canonicos = ['default','slate','red','orange','amber','yellow','lime','green','emerald',
                     'teal','cyan','sky','blue','indigo','violet','purple','rose','fuchsia','pink'];
    if (canonicos.indexOf(s) !== -1) return s;
    // Aliases en español
    if (s === 'verde') return 'green';
    if (s === 'azul') return 'indigo';
    if (s === 'amarillo') return 'amber';
    if (s === 'rojo') return 'red';
    if (s === 'rosa') return 'pink';
    if (s === 'morado') return 'purple';
    if (s === 'violeta') return 'violet';
    if (s === 'celeste') return 'sky';
    if (s === 'turquesa') return 'teal';
    if (s === 'ambar') return 'amber';
    if (s === 'naranja') return 'orange';
    if (s === 'lima') return 'lime';
    if (s === 'lila') return 'violet';
    // Aliases inglés no-canónicos
    if (s === 'gray' || s === 'grey') return 'slate';
    if (s === 'white') return 'default';
    if (s === 'magenta') return 'fuchsia';
    return 'default';
  }

  /**
   * Helper universal para interpretar estrictamente el estado booleano de fijado ('Sí' / 'No' / true / false)
   */
  function esNotaFijada(val) {
    if (val === true || val === 1) return true;
    if (typeof val === 'string') {
      var s = val.trim().toLowerCase();
      return s === 'sí' || s === 'si' || s === 'true' || s === '1';
    }
    return false;
  }

  /**
   * Helper universal para encontrar una nota por ID con tolerancia a formatos (correlativos con ceros, etc.)
   */
  function buscarNotaPorIdUniversal(targetId) {
    if (!targetId || !Array.isArray(state.notas)) return null;
    var cleanTarget = String(targetId).trim().toUpperCase();
    var normTarget = cleanTarget.replace(/^NOT-0*/, 'NOT-');
    var numTarget = cleanTarget.replace(/^NOT-/, '');

    return state.notas.find(function (n) {
      if (!n) return false;
      var rawId = String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase();
      if (!rawId) return false;
      if (rawId === cleanTarget) return true;
      var normRaw = rawId.replace(/^NOT-0*/, 'NOT-');
      if (normRaw === normTarget) return true;
      var numRaw = rawId.replace(/^NOT-/, '');
      if (numRaw && numRaw === numTarget) return true;
      return false;
    }) || null;
  }

  /**

  function sincronizarCacheLocalNotas() {

      if (raw) {
        var parsed = JSON.parse(raw);
        parsed.notas = state.notas;
        parsed.timestamp = Date.now();
        localStorage.setItem('PMO_LOCAL_STATE_CACHE', JSON.stringify(parsed));
      }
    } catch (eCache) {
      console.warn('[sincronizarCacheLocalNotas] Advertencia al actualizar caché local:', eCache);
    }
  }

  /**
   * Generador determinista de estilo cromático para etiquetas basado en hash del nombre
   */
  function obtenerEstiloCromaticoEtiqueta(tag) {
    var str = String(tag || '').trim().toLowerCase().replace(/^#+/, '');
    if (!str) return PALETA_CROMATICA_TAGS[0];
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    var index = Math.abs(hash) % PALETA_CROMATICA_TAGS.length;
    return PALETA_CROMATICA_TAGS[index];
  }

  /**
   * Extrae y sincroniza de forma reactiva todas las etiquetas existentes en las notas cargadas (state.etiquetasNotas)
   */
  function actualizarCatalogoEtiquetasGlobales() {
    var set = {};
    (state.notas || []).forEach(function (n) {
      var tArr = Array.isArray(n.Etiquetas) ? n.Etiquetas : (typeof n.Etiquetas === 'string' ? n.Etiquetas.split(',') : []);
      tArr.forEach(function (t) {
        var clean = String(t || '').trim().replace(/^#+/, '');
        if (clean) set[clean] = true;
      });
    });
    state.etiquetasNotas = Object.keys(set).sort();
    return state.etiquetasNotas;
  }

  // ============================================================================
  // 2. RENDERIZADO PRINCIPAL DE LA VISTA DE NOTAS (MASONRY & LISTA)
  // ============================================================================

  /**
   * Renderiza el tablero completo de notas respetando filtros y búsqueda
   */
  function renderVistaNotas() {
    // Sincronizar catálogo global de etiquetas reactivo
    actualizarCatalogoEtiquetasGlobales();

    // Garantizar estructura reactiva de estado multi-criterio y multi-tags
    if (!state.filtrosNotas) {
      state.filtrosNotas = {
        tipos: new Set(),
        tags: new Set(),
        query: '',
        color: ''
      };
    }
    if (!(state.filtrosNotas.tipos instanceof Set)) {
      state.filtrosNotas.tipos = new Set(Array.isArray(state.filtrosNotas.tipos) ? state.filtrosNotas.tipos : []);
    }
    if (!(state.filtrosNotas.tags instanceof Set)) {
      state.filtrosNotas.tags = new Set(Array.isArray(state.filtrosNotas.tags) ? state.filtrosNotas.tags : []);
    }

    var lista = Array.isArray(state.notas) ? state.notas : [];

    // 1. Filtrado por texto de búsqueda en tiempo real
    var query = String((state.filtrosNotas && state.filtrosNotas.query) || state.filtroBusquedaNotas || '').trim().toLowerCase();
    if (query) {
      lista = lista.filter(function (n) {
        var tit = String(n.Titulo || '').toLowerCase();
        var con = String(n.Contenido || '').toLowerCase();
        var checkText = Array.isArray(n.Checklist) ? n.Checklist.map(function (c) { return String(c.texto || '').toLowerCase(); }).join(' ') : '';
        var tablaText = '';
        if (n.Tabla && Array.isArray(n.Tabla.filas)) {
          tablaText = n.Tabla.filas.map(function (f) {
            return Object.values(f.valores || {}).join(' ') + ' ' + (f.criterio || '');
          }).join(' ').toLowerCase();
        }
        var vincText = Array.isArray(n.Vinculos) ? n.Vinculos.map(function (v) { return String((v.codigo || '') + ' ' + (v.titulo || '')).toLowerCase(); }).join(' ') : '';
        var tagsText = (Array.isArray(n.Etiquetas) ? n.Etiquetas.join(' ') : String(n.Etiquetas || '')).toLowerCase();
        var idN = String(n.ID_Nota || n.idNota || n.id || '').toLowerCase();
        return tit.includes(query) || con.includes(query) || checkText.includes(query) || tablaText.includes(query) || vincText.includes(query) || tagsText.includes(query) || idN.includes(query);
      });
    }

    // 2. Filtrado por Tipo de Nota (TODAS | NORMAL | WISHLIST | CHECKLIST)
    var filtroTipo = (state.filtrosNotas && state.filtrosNotas.tipoNota) || 'TODAS';
    if (filtroTipo === 'NORMAL') {
      lista = lista.filter(function (n) {
        var t = (n.Tipo_Nota || 'NORMAL').toUpperCase();
        var esCheck = t === 'CHECKLIST' || (Array.isArray(n.Checklist) && n.Checklist.length > 0) || (n.Tabla && Array.isArray(n.Tabla.filas) && n.Tabla.filas.length > 0);
        var esWish = t === 'WISHLIST' || !!n.WishlistMeta;
        return !esWish && !esCheck;
      });
    } else if (filtroTipo === 'WISHLIST') {
      lista = lista.filter(function (n) { return (n.Tipo_Nota || '').toUpperCase() === 'WISHLIST' || !!n.WishlistMeta; });
    } else if (filtroTipo === 'CHECKLIST') {
      lista = lista.filter(function (n) {
        var t = (n.Tipo_Nota || '').toUpperCase();
        return t === 'CHECKLIST' || (Array.isArray(n.Checklist) && n.Checklist.length > 0) || (n.Tabla && Array.isArray(n.Tabla.filas) && n.Tabla.filas.length > 0);
      });
    }

    // 3. Filtrado multi-criterio combinable (Intersección AND de tipos seleccionados)
    if (state.filtrosNotas.tipos.size > 0) {
      lista = lista.filter(function (n) {
        var esCheck = (n.Tipo_Nota || '').toUpperCase() === 'CHECKLIST' || (Array.isArray(n.Checklist) && n.Checklist.length > 0) || (n.Tabla && Array.isArray(n.Tabla.filas) && n.Tabla.filas.length > 0);
        if (state.filtrosNotas.tipos.has('FIJADAS') && !esNotaFijada(n.Es_Fijada)) return false;
        if (state.filtrosNotas.tipos.has('CHECKLIST') && !esCheck) return false;
        if (state.filtrosNotas.tipos.has('ADJUNTOS') && (!Array.isArray(n.Adjuntos) || n.Adjuntos.length === 0)) return false;
        if (state.filtrosNotas.tipos.has('VINCULADAS') && (!Array.isArray(n.Vinculos) || n.Vinculos.length === 0)) return false;
        return true;
      });
    } else if (state.filtroNotas && state.filtroNotas !== 'TODAS') {
      // Compatibilidad con filtro simple
      var fSimple = state.filtroNotas;
      if (fSimple === 'FIJADAS') lista = lista.filter(function (n) { return esNotaFijada(n.Es_Fijada); });
      else if (fSimple === 'CHECKLIST') lista = lista.filter(function (n) {
        return (n.Tipo_Nota || '').toUpperCase() === 'CHECKLIST' || (Array.isArray(n.Checklist) && n.Checklist.length > 0) || (n.Tabla && Array.isArray(n.Tabla.filas) && n.Tabla.filas.length > 0);
      });
      else if (fSimple === 'ADJUNTOS') lista = lista.filter(function (n) { return Array.isArray(n.Adjuntos) && n.Adjuntos.length > 0; });
      else if (fSimple === 'VINCULADAS') lista = lista.filter(function (n) { return Array.isArray(n.Vinculos) && n.Vinculos.length > 0; });
    }

    // 4. Filtrado multi-etiqueta (Intersección AND: debe poseer todas las etiquetas marcadas)
    if (state.filtrosNotas.tags.size > 0) {
      lista = lista.filter(function (n) {
        var noteTags = (Array.isArray(n.Etiquetas) ? n.Etiquetas : (typeof n.Etiquetas === 'string' ? n.Etiquetas.split(',') : []))
          .map(function (t) { return String(t || '').trim().toLowerCase().replace(/^#+/, ''); });
        var tagsSeleccionadas = Array.from(state.filtrosNotas.tags);
        return tagsSeleccionadas.every(function (tagSel) {
          return noteTags.includes(tagSel);
        });
      });
    } else if (state.filtroEtiquetaNotas) {
      var filtroEtiqueta = String(state.filtroEtiquetaNotas || '').trim().toLowerCase().replace(/^#+/, '');
      if (filtroEtiqueta) {
        lista = lista.filter(function (n) {
          var tags = Array.isArray(n.Etiquetas) ? n.Etiquetas : (typeof n.Etiquetas === 'string' ? n.Etiquetas.split(',') : []);
          return tags.some(function (t) { return String(t || '').trim().toLowerCase().replace(/^#+/, '') === filtroEtiqueta; });
        });
      }
    }

    // 5. Filtrado por color / tono cromático
    var filtroColor = (state.filtrosNotas && state.filtrosNotas.color) || state.filtroColorNotas || '';
    if (filtroColor) {
      lista = lista.filter(function (n) {
        return String(n.Color || n.Color_Tema || 'default').toLowerCase() === filtroColor.toLowerCase();
      });
    }

    // 5.b Filtrado dinámico por código de entidad (Enlaces_Entidades_JSON – Fase 4.13)
    var filtroEntidad = String((state.filtrosNotas && state.filtrosNotas.entidad) || '').trim().toUpperCase();
    if (filtroEntidad) {
      lista = lista.filter(function (n) {
        var enl = Array.isArray(n.Vinculos) ? n.Vinculos : (Array.isArray(n.Enlaces_Entidades_JSON) ? n.Enlaces_Entidades_JSON : []);
        return enl.some(function (v) {
          var c = typeof v === 'string' ? v : (v && (v.codigo || v.id));
          return String(c || '').trim().toUpperCase() === filtroEntidad;
        });
      });
    }

    // 6. Separación en Notas Fijadas, Otras Notas y Deseos Conseguidos de WishList
    var fijadas = [];
    var otras = [];
    var conseguidosWishlist = [];

    lista.forEach(function (n) {
      var esWish = (n.Tipo_Nota || '').toUpperCase() === 'WISHLIST' || !!n.WishlistMeta;
      var esConseguido = esWish && n.WishlistMeta && n.WishlistMeta.estadoDeseo === 'Conseguido';

      if (esConseguido) {
        conseguidosWishlist.push(n);
      } else if (esNotaFijada(n.Es_Fijada)) {
        fijadas.push(n);
      } else {
        otras.push(n);
      }
    });

    // 7. Actualización de Badges de Conteo, UI de Filtros y Botón ✕ Limpiar
    actualizarUiChipsFiltrosNotas();
    actualizarEstadoFiltroEtiquetasUI();
    actualizarEstadoBotonesLimpiezaNotas();

    var badgeTotal = document.getElementById('badge-total-notas');
    if (badgeTotal) badgeTotal.textContent = lista.length + ' notas';

    var badgeHeader = document.getElementById('badge-header-notas') || document.getElementById('badge-count-notas');
    if (badgeHeader) {
      badgeHeader.textContent = (state.notas || []).length;
      badgeHeader.classList.toggle('hidden', (state.notas || []).length === 0);
    }

    var secFijadas = document.getElementById('seccion-notas-fijadas');
    var gridFijadas = document.getElementById('grid-notas-fijadas');
    var badgeFijadas = document.getElementById('badge-count-fijadas');

    var secOtras = document.getElementById('seccion-notas-otras');
    var gridOtras = document.getElementById('grid-notas-otras');
    var headerOtras = document.getElementById('header-notas-otras');
    var badgeOtras = document.getElementById('badge-count-otras');

    var wrapConseguidos = document.getElementById('wrapper-conseguidos-wishlist');
    var badgeConseguidos = document.getElementById('badge-count-conseguidos-wishlist');
    var gridConseguidos = document.getElementById('grid-conseguidos-wishlist');

    var emptyState = document.getElementById('notas-empty-state');

    // Estado vacío si no hay notas que cumplan el criterio
    if (lista.length === 0) {
      if (secFijadas) secFijadas.classList.add('hidden');
      if (secOtras) secOtras.classList.add('hidden');
      if (wrapConseguidos) wrapConseguidos.classList.add('hidden');
      if (emptyState) emptyState.classList.remove('hidden');
      return;
    }

    if (emptyState) emptyState.classList.add('hidden');
    if (secOtras) secOtras.classList.remove('hidden');

    // Configurar layout de rejilla (Masonry vs Lista)
    var esLista = (state.vistaModoNotas === 'list');
    var layoutClasses = esLista
      ? 'flex flex-col gap-3 max-w-3xl mx-auto'

      });
      if (p && (p.Nombre_Proyecto || p.Nombre || p.nombre || p.titulo)) return p.Nombre_Proyecto || p.Nombre || p.nombre || p.titulo;
    } else if (tipo === 'HITO' || codClean.startsWith('HIT-')) {
      var h = (state.hitos || []).find(function (x) {

    } else if (tipo === 'HABITO' || tipo === 'ACTIVIDAD' || codClean.startsWith('ACT-') || codClean.startsWith('HAB-')) {
      var habitos = (state.actividadesPersonales && state.actividadesPersonales.length > 0)
        ? state.actividadesPersonales

      });
      if (a && (a.Nombre_Actividad || a.Nombre_Tarea_Actividad || a.Nombre_Habito || a.nombre || a.titulo)) return a.Nombre_Actividad || a.Nombre_Tarea_Actividad || a.Nombre_Habito || a.nombre || a.titulo;
    } else if (tipo === 'INGRESO' || codClean.startsWith('ING-')) {
      var ing = (state.ingresos || []).find(function (x) {
        if (!x) return false;
        var xId = String(x.ID_Ingreso || x.id || '').trim().toUpperCase();
        return xId === codClean || xId.replace(/-0+/, '-') === codClean.replace(/-0+/, '-');
      });
      if (ing && (ing.Descripcion || ing.descripcion || ing.Categoria || ing.categoria)) return ing.Descripcion || ing.descripcion || ing.Categoria || ing.categoria;
    } else if (tipo === 'GASTO' || tipo === 'FINANZAS' || codClean.startsWith('GAS-')) {

  /**
   * Renderizador ligero y seguro de Markdown para notas (Fase 4.13)
   * Soporta negrita, cursiva, tachado, código en línea y bloques, enlaces, menciones @ y listas.
   */
  function renderizarMarkdownNota(txt) {
    if (!txt) return '';
    var s = String(txt);
    if (typeof escapeHtml === 'function') {
      s = escapeHtml(s);
    } else {
      s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    // Bloques de código ```code```
    s = s.replace(/```([\s\S]*?)```/g, function (match, code) {
      return '<pre class="my-1.5 p-2 rounded-lg bg-slate-900 text-slate-100 font-mono text-[10.5px] overflow-x-auto leading-relaxed border border-slate-700"><code>' + code.trim() + '</code></pre>';
    });
    // Código en línea `code`
    s = s.replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-200/80 dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 font-mono text-[10.5px]">$1</code>');
    // Negritas
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-slate-100">$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong class="font-bold text-slate-900 dark:text-slate-100">$1</strong>');
    // Cursivas
    s = s.replace(/(^|[^\*])\*([^\*]+)\*([^\*]|$)/g, '$1<em class="italic">$2</em>$3');
    s = s.replace(/(^|[^_])_([^_]+)_([^_]|$)/g, '$1<em class="italic">$2</em>$3');
    // Tachado
    s = s.replace(/~~([^~]+)~~/g, '<del class="line-through opacity-60">$1</del>');
    // Enlaces
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="text-indigo-600 dark:text-indigo-400 hover:underline font-semibold">$1</a>');
    // Menciones @
    s = s.replace(/@([A-Za-z0-9_-]+)/g, '<span class="inline-block px-1 rounded bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 font-semibold font-mono text-[11px]">@$1</span>');
    // Listas con viñetas
    var lineas = s.split('\n');
    var resultado = [];
    for (var i = 0; i < lineas.length; i++) {
      var l = lineas[i];
      var m = l.match(/^(\s*)([-*])\s+(.+)$/);
      if (m) {
        resultado.push(m[1] + '<span class="text-indigo-500 font-bold">•</span> ' + m[3]);
      } else {
        resultado.push(l);
      }
    }
    return resultado.join('\n');
  }

  /**
   * Alterna el Pin de una nota con UI optimista instantánea
   */
  function togglePinNotaOptimista(idNota) {
    if (!idNota) return;
    var nota = (state.notas || []).find(function (n) { return n.ID_Nota === idNota; });
    if (!nota) return;

    // Actualización inmediata en memoria con booleano estricto
    nota.Es_Fijada = !esNotaFijada(nota.Es_Fijada);
    renderVistaNotas();

    // Sincronización en segundo plano con el backend
    callBackend('togglePinNota', { idNota: idNota }, function (res) {
      if (res && res.success) {
        nota.Es_Fijada = esNotaFijada(res.esFijada);
        renderVistaNotas();
      } else {
        // Revertir en caso de error
        nota.Es_Fijada = !esNotaFijada(nota.Es_Fijada);
        renderVistaNotas();
      }
    }, function () {
      nota.Es_Fijada = !esNotaFijada(nota.Es_Fijada);
      renderVistaNotas();
    }, { silent: true });
  }

  /**
   * Alterna un ítem de checklist en una nota con respuesta en 0ms
   */
  function toggleChecklistItemNota(idNota, index) {
    if (!idNota || index === undefined) return;
    var nota = (state.notas || []).find(function (n) { return n.ID_Nota === idNota; });
    if (!nota || !Array.isArray(nota.Checklist) || !nota.Checklist[index]) return;

    var item = nota.Checklist[index];
    item.completado = !item.completado;

    // Re-render en caliente
    renderVistaNotas();

    // Sincronización en segundo plano
    callBackend('actualizarChecklistNota', {
      idNota: idNota,
      index: index,
      completado: item.completado
    }, null, null, { silent: true });
  }

  /**
   * Elimina una nota con desvanecimiento inmediato optimista y Toast con "Deshacer"
   */
  function eliminarNotaOptimista(idNota) {
    if (!idNota) return;

    if (typeof window.eliminarEntidadDirectoConDeshacer === 'function') {
      window.eliminarEntidadDirectoConDeshacer('nota', idNota);
      return;
    }

    var index = (state.notas || []).findIndex(function (n) { return n.ID_Nota === idNota; });
    if (index === -1) return;

    var notaRespaldo = state.notas[index];
    state.notas.splice(index, 1);
    if (typeof window.sincronizarCacheLocalState === 'function') {
      window.sincronizarCacheLocalState();
    } else {
      sincronizarCacheLocalNotas();
    }
    renderVistaNotas();
    if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();

    if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo('🗑️ Nota eliminada');
    }

    callBackend('eliminarNota', { idNota: idNota }, function (res) {
      if (res && (res.success === true || res.success === 'true')) {
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        } else {
          sincronizarCacheLocalNotas();
        }
      } else {
        // Restaurar en caso de fallo
        state.notas.splice(index, 0, notaRespaldo);
        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        } else {
          sincronizarCacheLocalNotas();
        }
        renderVistaNotas();
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'No se pudo eliminar la nota',
            text: 'Error del servidor: ' + ((res && res.error) ? res.error : 'Desconocido'),
            confirmButtonColor: '#4f46e5'
          });
        }
      }
    }, function (err) {
      state.notas.splice(index, 0, notaRespaldo);
      if (typeof window.sincronizarCacheLocalState === 'function') {
        window.sincronizarCacheLocalState();
      } else {
        sincronizarCacheLocalNotas();
      }
      renderVistaNotas();
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'error',
          title: 'Error de conexión',
          text: 'No se pudo contactar al servidor: ' + ((err && err.message) ? err.message : String(err)),
          confirmButtonColor: '#4f46e5'
        });
      }
    }, { silent: true });
  }

  function expandirQuickNoteCreator(modoInicial) {
    var collapsed = document.getElementById('quick-note-collapsed');
    var expanded = document.getElementById('quick-note-expanded');
    if (collapsed) collapsed.classList.add('hidden');
    if (expanded) expanded.classList.remove('hidden');

    if (modoInicial === 'checklist') {
      setQuickNoteTipo('checklist');
    }

    actualizarQuickNotePinBtn();
    renderQuickNoteTags();

    var titleInput = document.getElementById('quick-note-title');
    if (titleInput) titleInput.focus();
  }

  function cerrarQuickNoteCreator() {
    var collapsed = document.getElementById('quick-note-collapsed');
    var expanded = document.getElementById('quick-note-expanded');
    if (collapsed) collapsed.classList.remove('hidden');
    if (expanded) expanded.classList.add('hidden');

    // Limpiar campos
    var tit = document.getElementById('quick-note-title');
    if (tit) tit.value = '';
    var con = document.getElementById('quick-note-content');
    if (con) con.value = '';
    var newChk = document.getElementById('quick-note-new-item-input');
    if (newChk) newChk.value = '';
    var newTag = document.getElementById('quick-note-new-tag-input');
    if (newTag) newTag.value = '';

    // Limpiar campos específicos de WishList
    var qCosto = document.getElementById('quick-wishlist-costo');
    if (qCosto) qCosto.value = '';
    var qMoneda = document.getElementById('quick-wishlist-moneda');
    if (qMoneda) qMoneda.value = 'PEN';
    var qNivel = document.getElementById('quick-wishlist-nivel');
    if (qNivel) qNivel.value = 'Media';
    var qEnlace = document.getElementById('quick-wishlist-enlace');
    if (qEnlace) qEnlace.value = '';

    notasState.checklistQuick = [];
    notasState.linksQuick = [];
    notasState.adjuntosQuick = [];
    notasState.tagsQuick = [];
    notasState.colorQuick = 'default';
    notasState.pinQuick = false; // Reset estricto de pin

    setQuickNoteTipo('texto');
    actualizarQuickNotePinBtn();
    renderQuickNoteChecklistItems();
    renderQuickNoteLinks();
    renderQuickNoteAttachments();
    renderQuickNoteTags();
    cerrarSugerenciasEtiquetasQuick();
    cerrarQuickNoteColorPicker();

  function mostrarSugerenciasEtiquetasQuick(e) {
    var query = String(e.target.value || '').trim().toLowerCase().replace(/^#+/, '');
    var pop = document.getElementById('quick-note-tags-autocomplete');
    if (!pop) return;

    var todas = obtenerTodasLasEtiquetasExistentes();
    var filtradas = todas.filter(function (t) {
      return !query || t.toLowerCase().includes(query);
    });

    var html = '';
    if (query && !todas.some(function (t) { return t.toLowerCase() === query; })) {
      html += '<div onclick="agregarTagQuick(\'' + escapeHtml(query) + '\')" class="p-1.5 rounded-lg text-xs font-bold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/40 cursor-pointer flex items-center gap-1.5 border-b border-slate-100 dark:border-slate-700/60 mb-1"><span>＋</span> Crear etiqueta: <span class="underline">#' + escapeHtml(query) + '</span></div>';
    }

    if (filtradas.length > 0) {
      html += filtradas.slice(0, 10).map(function (t) {
        return '<div onclick="agregarTagQuick(\'' + escapeHtml(t) + '\')" class="p-1.5 rounded-lg text-xs hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer flex items-center justify-between text-slate-700 dark:text-slate-200"><span>#' + escapeHtml(t) + '</span><span class="text-[10px] text-slate-400">Existente</span></div>';
      }).join('');
    } else if (!query) {
      html += '<div class="text-[11px] text-slate-400 italic p-1.5 text-center">Sin etiquetas previas</div>';

    pop.innerHTML = html;
    pop.classList.remove('hidden');

  /**
   * Guarda la nota creada desde el widget rápido superior
   */
  function guardarQuickNota() {
    var tit = String(document.getElementById('quick-note-title').value || '').trim();
    var con = String(document.getElementById('quick-note-content').value || '').trim();
    var esWish = (notasState.tipoActivoQuick === 'wishlist');

    if (!tit && !con && notasState.checklistQuick.length === 0 && notasState.adjuntosQuick.length === 0 && !esWish) {
      cerrarQuickNoteCreator();
      return;
    }

    var tempId = 'NOT-' + String(Math.floor(Math.random() * 90000) + 10000);
    var nowIso = new Date().toISOString();

    var vinculos = JSON.parse(JSON.stringify(notasState.linksQuick));
    var wishMeta = null;

    if (esWish) {
      var inpCosto = document.getElementById('quick-wishlist-costo');
      var inpMoneda = document.getElementById('quick-wishlist-moneda');
      var inpNivel = document.getElementById('quick-wishlist-nivel');
      var inpEnlace = document.getElementById('quick-wishlist-enlace');

      var costoEst = inpCosto ? (parseFloat(inpCosto.value) || 0) : 0;
      var moneda = inpMoneda ? inpMoneda.value : 'PEN';
      var nivel = inpNivel ? (inpNivel.value || '') : '';
      var enlace = inpEnlace ? String(inpEnlace.value || '').trim() : '';

      wishMeta = {
        tipo: 'WISHLIST_META',
        costoEstimado: costoEst,
        moneda: moneda,
        nivelDeseo: nivel,
        enlaceReferencia: enlace,
        estadoDeseo: 'Pendiente',
        montoRealGastado: 0,
        fechaConseguido: null,
        idGastoVinculado: null
      };
      vinculos.push(wishMeta);
    }

    var nuevaNota = {
      ID_Nota: tempId,
      Titulo: tit, // Cero inventos: si no se escribe título, se guarda vacío
      Tipo_Nota: esWish ? 'WISHLIST' : 'NORMAL',
      Contenido: con,
      Color: notasState.colorQuick,
      Es_Fijada: !!notasState.pinQuick,
      Checklist: JSON.parse(JSON.stringify(notasState.checklistQuick)),
      Vinculos: vinculos,
      WishlistMeta: wishMeta,
      Adjuntos: JSON.parse(JSON.stringify(notasState.adjuntosQuick)),
      Etiquetas: JSON.parse(JSON.stringify(notasState.tagsQuick || [])),
      Fecha_Creacion: nowIso,
      Fecha_Actualizacion: nowIso
    };

    // Inserción optimista inmediata (0ms)
    state.notas.unshift(nuevaNota);
    sincronizarCacheLocalNotas();
    renderVistaNotas();
    if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();
    cerrarQuickNoteCreator();

    if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo('✨ Nota guardada');
    }

    // Persistencia en Google Sheets y Drive en segundo plano
    callBackend('guardarNota', nuevaNota, function (res) {
      if (res && res.success && res.nota) {
        // Reemplazar ID temporal por ID definitivo asignado por el correlativo
        var idx = state.notas.findIndex(function (x) { return x.ID_Nota === tempId; });
        if (idx !== -1) {
          state.notas[idx] = res.nota;
          sincronizarCacheLocalNotas();
          renderVistaNotas();
        }
      }
    }, function (err) {
      console.error('[Error guardando nota]:', err);
    }, { silent: true });
  }

  function abrirModalEditarNotaConDatos(idNota) {
    if (!idNota) return;
    var nota = buscarNotaPorIdUniversal(idNota);
    if (!nota) {
      console.warn('[abrirModalEditarNotaConDatos] Nota no encontrada para ID:', idNota, state.notas);
      return;
    }

    // Hidratación estricta con clonación profunda y validación booleana del pin
    var rawColor = normalizarColorNota(nota.Color || nota.color || 'default');
    var idReal = String(nota.ID_Nota || nota.idNota || nota.id || idNota || '').trim();
    notasState.notaEnEdicion = JSON.parse(JSON.stringify(nota));
    notasState.notaEnEdicion.ID_Nota = idReal;
    notasState.notaEnEdicion.idNota = idReal;
    notasState.notaEnEdicion.id = idReal;
    notasState.notaEnEdicion.Color = rawColor;
    notasState.notaEnEdicion.color = rawColor;
    notasState.notaEnEdicion._esNueva = false;
    notasState.notaEnEdicion.Es_Fijada = esNotaFijada(nota.Es_Fijada);

    // Carga o inicialización limpia de Checklist e ítems con columnas extra bajo demanda
    notasState.checklistItems = [];
    notasState.extraColumnas = [];

    var tablaObj = null;
    if (nota.Tabla && Array.isArray(nota.Tabla.filas) && nota.Tabla.filas.length > 0) {
      tablaObj = nota.Tabla;
    } else if (nota.Contenido && (nota.Contenido.trim().startsWith('{') || nota.Contenido.includes('"tipoEstructura":"tabla_multicolumna"'))) {
      try {
        var parsed = JSON.parse(nota.Contenido);
        if (parsed && (parsed.tipoEstructura === 'tabla_multicolumna' || Array.isArray(parsed.columnas) || Array.isArray(parsed.filas))) {
          tablaObj = parsed;
        }
      } catch (eParse) {}
    }

    if (tablaObj) {
      notasState.tablaEnEdicion = JSON.parse(JSON.stringify(tablaObj));
      var cols = Array.isArray(tablaObj.columnas) ? tablaObj.columnas : [];
      // Extraer únicamente columnas adicionales agregadas por el usuario (no base criterio ni check)
      var extraCols = cols.filter(function (c) {
        return c.id !== 'criterio' && c.id !== 'check' && c.tipo !== 'checkbox';
      });
      notasState.extraColumnas = JSON.parse(JSON.stringify(extraCols));

      var checkCol = cols.find(function (c) { return c.tipo === 'checkbox' || c.id === 'check'; });
      notasState.checklistItems = (tablaObj.filas || []).map(function (f, idx) {
        var isChk = checkCol ? !!(f.valores && f.valores[checkCol.id]) : false;
        var txt = f.criterio || (f.valores && f.valores.criterio) || '';
        return {
          id: f.id || ('chk_' + (idx + 1)),
          texto: txt,
          completado: isChk,
          valores: Object.assign({}, f.valores || {})
        };
      });
    } else if (Array.isArray(nota.Checklist) && nota.Checklist.length > 0) {
      notasState.extraColumnas = [];
      notasState.tablaEnEdicion = null;
      notasState.checklistItems = nota.Checklist.map(function (c, idx) {
        return {
          id: c.id || ('chk_' + (idx + 1)),
          texto: c.texto || '',
          completado: !!c.completado,
          valores: {}
        };
      });
    } else {
      notasState.extraColumnas = [];
      notasState.checklistItems = [];
      notasState.tablaEnEdicion = null;
    }

    var modal = document.getElementById('modal-editar-nota');
    var badgeId = document.getElementById('modal-nota-id-badge');
    var inpTit = document.getElementById('modal-nota-titulo');
    var txtCon = document.getElementById('modal-nota-contenido');
    var bannerWrap = document.getElementById('modal-nota-image-banner-wrap');
    var bannerImg = document.getElementById('modal-nota-image-banner');
    var inpCheck = document.getElementById('modal-nota-new-check-input');
    var inpCol = document.getElementById('input-nueva-columna-nombre');

    if (badgeId) badgeId.textContent = nota.ID_Nota || nota.idNota || idNota;
    if (inpTit) inpTit.value = nota.Titulo || '';
    if (txtCon) {
      var cVal = nota.Contenido || '';
      txtCon.value = cVal.trim().startsWith('{"tipoEstructura":"tabla_multicolumna"') ? '' : cVal;
    }
    if (inpCheck) inpCheck.value = '';
    if (inpCol) inpCol.value = '';

    // Carga de campos de Tipo de Nota (NORMAL | WISHLIST | CHECKLIST | HIBRIDA)
    var tipoNota = String(nota.Tipo_Nota || 'NORMAL').toUpperCase();
    var wlMeta = nota.WishlistMeta || ((nota.Wishlist_JSON && typeof nota.Wishlist_JSON === 'object') ? nota.Wishlist_JSON : null);
    var tieneWishlist = !!(wlMeta && Object.keys(wlMeta).length > 0) || tipoNota === 'WISHLIST';
    var tieneCheck = (Array.isArray(nota.Checklist) && nota.Checklist.length > 0) || (tablaObj && Array.isArray(tablaObj.filas) && tablaObj.filas.length > 0) || tipoNota === 'CHECKLIST';
    var tieneMarkdown = !!(nota.Contenido && !String(nota.Contenido).trim().startsWith('{"tipoEstructura":"tabla_multicolumna"'));

    setModalNotaTipoFormato('HIBRIDA');

    var meta = nota.WishlistMeta || {};
    var inpCostoModal = document.getElementById('modal-wishlist-costo');
    if (inpCostoModal) inpCostoModal.value = meta.costoEstimado || '';
    var inpMonedaModal = document.getElementById('modal-wishlist-moneda');
    if (inpMonedaModal) inpMonedaModal.value = meta.moneda || 'PEN';
    var inpNivelModal = document.getElementById('modal-wishlist-nivel');
    if (inpNivelModal) inpNivelModal.value = meta.nivelDeseo || '';
    var inpEstadoModal = document.getElementById('modal-wishlist-estado');
    if (inpEstadoModal) inpEstadoModal.value = meta.estadoDeseo || 'Pendiente';
    var inpEnlaceModal = document.getElementById('modal-wishlist-enlace');
    if (inpEnlaceModal) inpEnlaceModal.value = meta.enlaceReferencia || '';
    var badgeWishModal = document.getElementById('modal-wishlist-status-badge');
    if (badgeWishModal) badgeWishModal.textContent = meta.estadoDeseo || 'Pendiente';

    var btnVisitarModal = document.getElementById('modal-wishlist-enlace-btn');
    if (btnVisitarModal) {
      if (meta.enlaceReferencia) {
        btnVisitarModal.href = meta.enlaceReferencia;
        btnVisitarModal.classList.remove('hidden');
      } else {
        btnVisitarModal.classList.add('hidden');
      }
    }

    // Banner de imagen si existe
    var bannerUrl = '';
    var adj = Array.isArray(nota.Adjuntos) ? nota.Adjuntos : [];
    for (var i = 0; i < adj.length; i++) {
      if (adj[i] && (adj[i].esImagen || (adj[i].mimeType && adj[i].mimeType.startsWith('image/')))) {
        bannerUrl = adj[i].url || adj[i].downloadUrl || '';
        break;
      }
    }
    if (bannerWrap && bannerImg) {
      if (bannerUrl) {
        bannerImg.src = bannerUrl;
        bannerWrap.classList.remove('hidden');
      } else {
        bannerWrap.classList.add('hidden');
      }
    }

    // Normalizar etiquetas
    if (typeof notasState.notaEnEdicion.Etiquetas === 'string') {
      notasState.notaEnEdicion.Etiquetas = notasState.notaEnEdicion.Etiquetas.split(',').map(function (s) { return s.trim().replace(/^#+/, ''); }).filter(Boolean);
    } else if (!Array.isArray(notasState.notaEnEdicion.Etiquetas)) {
      notasState.notaEnEdicion.Etiquetas = [];
    }

    actualizarModalNotaPinBtn();
    renderModalChecklist();
    renderModalVinculos();
    renderModalAdjuntos();
    renderModalNotaTags();
    actualizarColorModalCard(rawColor);
    actualizarOpcionesSelectorRapidoVinculo();
    cerrarModalNotaColorPicker();
    cerrarSugerenciasEtiquetasModal();

    if (typeof openModal === 'function') {
      openModal('modal-editar-nota');
    } else if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      modal.style.display = 'flex';
      modal.style.zIndex = '9999';
    }
  }

  function toggleModalNotaColorPicker(event) {
    if (event) {
      if (typeof event.preventDefault === 'function') event.preventDefault();
      if (typeof event.stopPropagation === 'function') event.stopPropagation();
    }
    var popover = document.getElementById('modal-nota-color-picker-popover');
    if (!popover) return;
    if (popover.classList.contains('hidden')) {
      popover.classList.remove('hidden');
      setTimeout(function () {

      cerrarModalNotaColorPicker();

  function cerrarModalNotaColorPicker() {
    var popover = document.getElementById('modal-nota-color-picker-popover');

      popover.classList.add('hidden');
    }
    document.removeEventListener('click', cerrarModalNotaColorPickerAlClickAfuera);

  function cerrarModalNotaColorPickerAlClickAfuera(event) {
    var wrap = document.getElementById('modal-nota-color-picker-wrap');

      cerrarModalNotaColorPicker();

  function actualizarColorModalCard(colorForzado) {
    var card = document.getElementById('modal-editar-nota-card');
    var header = document.getElementById('modal-editar-nota-header');
    var body = document.getElementById('modal-editar-nota-body');
    var footer = document.getElementById('modal-editar-nota-footer');
    var vinculosBar = document.getElementById('modal-nota-vinculos-bar');
    var dot = document.getElementById('modal-nota-color-indicador');
    var tit = document.getElementById('modal-nota-titulo');
    var txt = document.getElementById('modal-nota-contenido');
    var badge = document.getElementById('modal-nota-id-badge');
    var checkSec = document.getElementById('modal-nota-checklist-seccion');
    var wishlistWrap = document.getElementById('modal-nota-wishlist-wrap');
    if (!card) return;

    var col = normalizarColorNota(colorForzado || (notasState.notaEnEdicion && (notasState.notaEnEdicion.Color || notasState.notaEnEdicion.color)) || 'default');
    var isDark = document.documentElement.classList.contains('dark');
    var cfg = obtenerConfigPaletaModal(col);
    var theme = isDark ? cfg.dark : cfg.light;
    var paleta = PALETA_COLORES_NOTAS[col] || PALETA_COLORES_NOTAS.default;

    // 1. Contenedor principal del modal: clases Tailwind + estilos directos de color
    card.className = 'portal-surface elevation-3 rounded-2xl border shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[92vh] transition-all duration-200 ease-in-out transform scale-100 ' + paleta.card;
    card.style.backgroundColor = theme.cardBg;
    card.style.borderColor = theme.border;
    card.style.color = theme.text;

    // 2. Cabecera adaptada con sintonía directa
    if (header) {
      header.className = 'px-5 sm:px-6 py-3.5 border-b flex items-center justify-between gap-3 shrink-0 transition-colors duration-200 ease-in-out';
      header.style.backgroundColor = theme.headerBg;
      header.style.borderColor = theme.border;
      header.style.color = theme.text;
    }

    // 3. Superficie completa del cuerpo scrollable (Previsualización de Fondo Completo en Vivo)
    if (body) {
      body.style.backgroundColor = theme.bodyBg;
      body.style.color = theme.text;
    }

    // 4. Barra de vínculos asociados (si está visible)
    if (vinculosBar) {
      vinculosBar.style.backgroundColor = isDark ? 'rgba(30, 27, 75, 0.45)' : 'rgba(238, 242, 255, 0.75)';
      vinculosBar.style.borderColor = theme.border;
    }

    // 5. Pie de acciones adaptado
    if (footer) {
      footer.className = 'px-5 sm:px-6 py-3 border-t flex flex-wrap items-center justify-between gap-3 shrink-0 transition-colors duration-200 ease-in-out';
      footer.style.backgroundColor = theme.footerBg;
      footer.style.borderColor = theme.border;
      footer.style.color = theme.text;
    }

    // 6. Título y área de texto
    if (tit) {
      tit.style.color = theme.text;
    }
    if (txt) {
      txt.style.backgroundColor = theme.inputBg;
      txt.style.borderColor = theme.inputBorder;
      txt.style.color = theme.text;
    }

    // 7. Badge de ID
    if (badge) {
      badge.style.backgroundColor = theme.badgeBg;
      badge.style.color = theme.badgeText;
      badge.style.borderColor = theme.badgeBorder;
    }

    // 8. Sección Checklist y WishList
    if (checkSec) {
      checkSec.style.backgroundColor = isDark ? 'rgba(0, 0, 0, 0.25)' : 'rgba(255, 255, 255, 0.65)';
      checkSec.style.borderColor = theme.border;
    }
    if (wishlistWrap) {
      wishlistWrap.style.backgroundColor = isDark ? 'rgba(0, 0, 0, 0.25)' : 'rgba(255, 255, 255, 0.65)';
      wishlistWrap.style.borderColor = theme.border;
    }

    // 9. Punto indicador de color en el botón "Color" (si existe)
    if (dot) {
      dot.style.backgroundColor = cfg.dot;
      dot.style.borderColor = theme.border;
    }

    // 10. Resaltar swatch activo en el popover
    var swatches = document.querySelectorAll('.modal-color-swatch');
    if (swatches && swatches.length) {
      swatches.forEach(function (btn) {
        var sCol = normalizarColorNota(btn.getAttribute('data-color'));
        if (sCol === col) {
          btn.classList.add('ring-2', 'ring-indigo-500', 'dark:ring-indigo-400', 'bg-slate-100', 'dark:bg-slate-700/80');
        } else {
          btn.classList.remove('ring-2', 'ring-indigo-500', 'dark:ring-indigo-400', 'bg-slate-100', 'dark:bg-slate-700/80');
        }
      });
    }

    // 11. Sincronizar input oculto
    var hiddenInp = document.getElementById('modal-nota-color');
    if (hiddenInp) {
      hiddenInp.value = col;
    }
  }

  // --- ETIQUETAS EN MODAL 360° (TAG-INPUT ÁGIL) ---
  function renderModalNotaTags() {
    var cont = document.getElementById('modal-nota-tags-list');
    var countEl = document.getElementById('modal-nota-tags-count');
    if (!notasState.notaEnEdicion) return;

    var tags = Array.isArray(notasState.notaEnEdicion.Etiquetas) ? notasState.notaEnEdicion.Etiquetas : [];

    // 1. Contador de etiquetas activas
    if (countEl) {
      countEl.textContent = tags.length + (tags.length === 1 ? ' etiqueta' : ' etiquetas');
    }

      } else {
        cont.innerHTML = tags.map(function (tag, idx) {
          var estilo = obtenerEstiloCromaticoEtiqueta(tag);
          return (
            '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-bold border shadow-2xs transition ' + estilo.badge + '">' +
              '<span>#' + escapeHtml(tag) + '</span>' +
              '<button type="button" onclick="eliminarTagModal(' + idx + ')" class="hover:text-rose-500 font-bold ml-0.5 cursor-pointer" title="Quitar etiqueta">✕</button>' +
            '</span>'
          );
        }).join('');
      }
    }
  }

  function toggleTagModal(tag) {
    if (!notasState.notaEnEdicion) return;
    var clean = String(tag || '').trim().replace(/^#+/, '');
    if (!clean) return;
    if (!Array.isArray(notasState.notaEnEdicion.Etiquetas)) notasState.notaEnEdicion.Etiquetas = [];
    var idx = notasState.notaEnEdicion.Etiquetas.indexOf(clean);
    if (idx !== -1) {
      notasState.notaEnEdicion.Etiquetas.splice(idx, 1);
    } else {
      notasState.notaEnEdicion.Etiquetas.push(clean);
    }
    renderModalNotaTags();
  }

  function agregarTagModal(tag) {
    if (!notasState.notaEnEdicion) return;
    var clean = String(tag || '').trim().replace(/^#+/, '');
    if (!clean) return;
    if (!Array.isArray(notasState.notaEnEdicion.Etiquetas)) notasState.notaEnEdicion.Etiquetas = [];
    if (!notasState.notaEnEdicion.Etiquetas.includes(clean)) {
      notasState.notaEnEdicion.Etiquetas.push(clean);
      renderModalNotaTags();
    }
    var input = document.getElementById('modal-nota-new-tag-input');
    if (input) {
      input.value = '';
      input.focus();
    }
    cerrarSugerenciasEtiquetasModal();
  }

  function eliminarTagModal(idx) {
    if (!notasState.notaEnEdicion || !Array.isArray(notasState.notaEnEdicion.Etiquetas)) return;
    notasState.notaEnEdicion.Etiquetas.splice(idx, 1);
    renderModalNotaTags();
  }

  function handleModalNotaTagKeydown(e) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      var val = (e.target ? e.target.value : '').replace(',', '');
      agregarTagModal(val);
    }
  }

  function mostrarSugerenciasEtiquetasModal(e) {
    var query = String(e.target.value || '').trim().toLowerCase().replace(/^#+/, '');
    var pop = document.getElementById('modal-nota-tags-autocomplete');
    if (!pop) return;

    var todas = obtenerTodasLasEtiquetasExistentes();
    var filtradas = todas.filter(function (t) {
      return !query || t.toLowerCase().includes(query);
    });

    var html = '';
    if (query && !todas.some(function (t) { return t.toLowerCase() === query; })) {
      html += '<div onclick="agregarTagModal(\'' + escapeHtml(query) + '\')" class="p-1.5 rounded-lg text-xs font-bold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/40 cursor-pointer flex items-center gap-1.5 border-b border-slate-100 dark:border-slate-700/60 mb-1"><span>＋</span> Crear etiqueta: <span class="underline">#' + escapeHtml(query) + '</span></div>';
    }

    if (filtradas.length > 0) {
      html += filtradas.slice(0, 10).map(function (t) {
        return '<div onclick="agregarTagModal(\'' + escapeHtml(t) + '\')" class="p-1.5 rounded-lg text-xs hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer flex items-center justify-between text-slate-700 dark:text-slate-200"><span>#' + escapeHtml(t) + '</span><span class="text-[10px] text-slate-400">Existente</span></div>';
      }).join('');
    } else if (!query) {
      html += '<div class="text-[11px] text-slate-400 italic p-1.5 text-center">Sin etiquetas previas</div>';
    }

    pop.innerHTML = html;
    pop.classList.remove('hidden');
  }

  function cerrarSugerenciasEtiquetasModal() {
    var pop = document.getElementById('modal-nota-tags-autocomplete');
    if (pop) pop.classList.add('hidden');
  }

  // ============================================================================
  // 6.1 CHECKLIST INTERACTIVO TRADICIONAL Y TABLA EXPANDIBLE BAJO DEMANDA
  // ============================================================================

  /**
   * Renderiza el Checklist interactivo en el modal.
   * - Si extraColumnas.length === 0: Modo Checklist simple vertical (estilo Keep).
   * - Si extraColumnas.length > 0: Modo Matriz / Tabla expandible con columnas bajo demanda.
   */
  function renderModalChecklist() {
    var cont = document.getElementById('modal-nota-checklist-items-container');
    var pctEl = document.getElementById('modal-nota-checklist-pct');
    if (!cont) return;

    if (!Array.isArray(notasState.checklistItems)) {
      notasState.checklistItems = [];
    }
    if (!Array.isArray(notasState.extraColumnas)) {
      notasState.extraColumnas = [];
    }

    var items = notasState.checklistItems;
    var extraCols = notasState.extraColumnas;
    var total = items.length;
    var completados = items.filter(function (it) { return !!it.completado; }).length;
    var pct = total > 0 ? Math.round((completados / total) * 100) : 0;

    if (pctEl) {
      pctEl.textContent = pct + '% completado (' + completados + '/' + total + ')';
    }

    // =========================================================================
    // MODO A: CHECKLIST SIMPLE VERTICAL (0 columnas extra añadidas)
    // =========================================================================
    if (extraCols.length === 0) {
      if (total === 0) {
        cont.innerHTML = '<div class="py-6 text-center text-slate-400 dark:text-slate-500 italic text-xs">No hay ítems en el checklist. Escribe arriba y presiona Enter para agregar.</div>';
        return;
      }

      cont.innerHTML = items.map(function (item, idx) {
        var isChecked = !!item.completado;
        return (
          '<div class="flex items-center justify-between gap-2.5 p-2 rounded-xl bg-white dark:bg-slate-800/80 border border-slate-200/90 dark:border-slate-700/80 shadow-2xs group hover:border-amber-400 dark:hover:border-amber-500/60 transition">' +
            '<div class="flex items-center gap-2.5 flex-1 min-w-0">' +
              '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleChecklistItemModal(' + idx + ', this.checked)" ' +
                'class="w-4 h-4 min-w-[16px] min-h-[16px] shrink-0 rounded text-amber-500 focus:ring-amber-500 cursor-pointer transition" />' +
              '<input type="text" value="' + escapeHtml(item.texto || '') + '" oninput="actualizarTextoItemChecklist(' + idx + ', this.value)" placeholder="Descripción de la tarea..." ' +
                'class="w-full text-xs bg-transparent border-none outline-hidden focus:ring-0 p-0 text-slate-800 dark:text-slate-100 placeholder-slate-400 ' + (isChecked ? 'line-through opacity-50' : '') + '" />' +
            '</div>' +
            '<button type="button" onclick="eliminarItemChecklistModal(' + idx + ')" ' +
              'class="p-1 text-slate-400 hover:text-rose-500 opacity-60 group-hover:opacity-100 transition cursor-pointer text-xs shrink-0" title="Eliminar ítem">✕</button>' +
          '</div>'
        );
      }).join('');
      return;
    }

    // =========================================================================
    // MODO B: MATRIZ / TABLA MULTICOLUMNA EXPANDIDA (>= 1 columnas extra)
    // =========================================================================
    var theadThs = extraCols.map(function (col) {
      return (
        '<th class="px-2.5 py-1.5 min-w-[110px] text-left text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">' +
          '<div class="flex items-center justify-between gap-1">' +
            '<span class="truncate">' + escapeHtml(col.titulo) + '</span>' +
            '<button type="button" onclick="eliminarColumnaModal(\'' + col.id + '\')" class="text-slate-400 hover:text-rose-500 text-[10px] font-bold p-0.5 rounded cursor-pointer" title="Eliminar columna ' + escapeHtml(col.titulo) + '">✕</button>' +
          '</div>' +
        '</th>'
      );
    }).join('');

    var tableHeader = (
      '<thead>' +
        '<tr class="bg-slate-100/90 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700/80">' +
          '<th class="w-8 px-2 py-1.5 text-center text-[10px] font-bold text-slate-400">#</th>' +
          '<th class="w-10 px-2 py-1.5 text-center text-[10px] font-bold text-slate-400">Estado</th>' +
          '<th class="px-2.5 py-1.5 min-w-[140px] text-left text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Ítem / Tarea</th>' +
          theadThs +
          '<th class="w-8 px-2 py-1.5 text-center text-slate-400"></th>' +
        '</tr>' +
      '</thead>'
    );

    var tableBody = '';
    if (total === 0) {
      tableBody = '<tbody><tr><td colspan="' + (4 + extraCols.length) + '" class="py-6 text-center text-slate-400 italic text-xs">No hay filas en la tabla. Escribe una tarea arriba y presiona Enter para agregar.</td></tr></tbody>';
    } else {
      var rowsHtml = items.map(function (item, idx) {
        if (!item.valores) item.valores = {};
        var isChecked = !!item.completado;
        var rowBg = isChecked ? 'bg-amber-50/30 dark:bg-amber-950/15' : 'bg-white dark:bg-slate-850';

        var extraTds = extraCols.map(function (col) {
          var val = item.valores[col.id] !== undefined ? item.valores[col.id] : '';
          return (
            '<td class="px-2 py-1">' +
              '<input type="text" value="' + escapeHtml(String(val)) + '" oninput="actualizarValorColumnaItemChecklist(' + idx + ', \'' + col.id + '\', this.value)" ' +
                'placeholder="' + escapeHtml(col.titulo) + '..." ' +

  function agregarItemModalChecklist() {
    var inp = document.getElementById('modal-nota-new-check-input');
    if (!inp) return;
    var val = String(inp.value || '').trim();
    if (!val) return;

    if (!Array.isArray(notasState.checklistItems)) {
      notasState.checklistItems = [];
    }

    var valoresObj = {};
    (notasState.extraColumnas || []).forEach(function (col) {
      valoresObj[col.id] = '';
    });
    valoresObj['criterio'] = val;
    valoresObj['check'] = false;

    notasState.checklistItems.push({
      id: 'chk_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      texto: val,
      completado: false,
      valores: valoresObj
    });

    inp.value = '';
    renderModalChecklist();
    inp.focus();
  }

  function toggleChecklistItemModal(idx, checked) {
    if (!notasState.checklistItems || !notasState.checklistItems[idx]) return;
    notasState.checklistItems[idx].completado = !!checked;
    if (notasState.checklistItems[idx].valores) {
      notasState.checklistItems[idx].valores['check'] = !!checked;
    }
    renderModalChecklist();
  }

  function actualizarTextoItemChecklist(idx, nuevoTexto) {
    if (!notasState.checklistItems || !notasState.checklistItems[idx]) return;
    notasState.checklistItems[idx].texto = nuevoTexto;
    if (notasState.checklistItems[idx].valores) {
      notasState.checklistItems[idx].valores['criterio'] = nuevoTexto;
    }
  }

  function actualizarValorColumnaItemChecklist(idx, colId, valor) {
    if (!notasState.checklistItems || !notasState.checklistItems[idx]) return;
    if (!notasState.checklistItems[idx].valores) {
      notasState.checklistItems[idx].valores = {};

    notasState.checklistItems[idx].valores[colId] = valor;

  function eliminarItemChecklistModal(idx) {

  function agregarColumnaDesdeInputModal() {
    var inp = document.getElementById('input-nueva-columna-nombre');
    if (!inp) return;
    var tit = String(inp.value || '').trim();
    if (!tit) return;

    if (!Array.isArray(notasState.extraColumnas)) {
      notasState.extraColumnas = [];
    }

    var colId = 'col_' + tit.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now().toString(36);

    notasState.extraColumnas.push({
      id: colId,
      titulo: tit,
      tipo: 'texto'
    });

    // Inicializar campo en todas las filas existentes
    (notasState.checklistItems || []).forEach(function (item) {
      if (!item.valores) item.valores = {};
      item.valores[colId] = '';
    });

    inp.value = '';
    renderModalChecklist();
  }

  function eliminarColumnaModal(colId) {
    if (!notasState.extraColumnas || !Array.isArray(notasState.extraColumnas)) return;
    notasState.extraColumnas = notasState.extraColumnas.filter(function (c) {
      return c.id !== colId;
    });

    // Limpiar de los ítems
    (notasState.checklistItems || []).forEach(function (item) {
      if (item.valores && item.valores[colId] !== undefined) {
        delete item.valores[colId];
      }
    });

    // Si se eliminaron todas las columnas extra, automáticamente vuelve a la lista simple
    renderModalChecklist();

  function toggleCheckFilaTabla(idNota, filaId, colCheckId) {
    var nota = buscarNotaPorIdUniversal(idNota);
    if (!nota || !nota.Tabla || !Array.isArray(nota.Tabla.filas)) return;

    var fila = nota.Tabla.filas.find(function (f) { return String(f.id) === String(filaId); });
    if (!fila) return;

    if (!fila.valores) fila.valores = {};
    var checkCol = colCheckId || 'check';
    fila.valores[checkCol] = !fila.valores[checkCol];

    // Sincronizar checklist plano para compatibilidad
    if (Array.isArray(nota.Checklist)) {
      var itemFlat = nota.Checklist.find(function (c) { return String(c.id) === String(filaId) || c.texto === fila.criterio; });
      if (itemFlat) itemFlat.completado = fila.valores[checkCol];
    }

    // Actualizar Contenido serializado si es tipo CHECKLIST
    if ((nota.Tipo_Nota || '').toUpperCase() === 'CHECKLIST') {
      nota.Contenido = JSON.stringify(nota.Tabla);
    }

    sincronizarCacheLocalNotas();
    renderVistaNotas();

    callBackend('updateNota', {
      idNota: idNota,
      ID_Nota: idNota,
      Tabla: nota.Tabla,
      tabla: nota.Tabla,
      Contenido: nota.Contenido,
      Checklist: nota.Checklist,
      checklist: nota.Checklist
    }, function () {}, function (err) {
      console.warn('Error sincronizando check de tabla:', err);
    }, { silent: true });
  }

  function renderModalVinculos() {
    var cont = document.getElementById('modal-nota-vinculos-list');
    var bar = document.getElementById('modal-nota-vinculos-bar');
    var badgeCount = document.getElementById('badge-count-vinculos-modal');
    if (!notasState.notaEnEdicion) return;

    if (typeof notasState.notaEnEdicion.Vinculos === 'string') {
      try {
        notasState.notaEnEdicion.Vinculos = JSON.parse(notasState.notaEnEdicion.Vinculos);
      } catch (e) {
        notasState.notaEnEdicion.Vinculos = [];
      }
    }
    var list = Array.isArray(notasState.notaEnEdicion.Vinculos)
      ? notasState.notaEnEdicion.Vinculos.filter(function (v) { return v && v.tipo !== 'WISHLIST_META'; })
      : [];

    if (badgeCount) {
      if (list.length > 0) {
        badgeCount.textContent = list.length;
        badgeCount.classList.remove('hidden');
      } else {
        badgeCount.classList.add('hidden');
      }
    }

    if (bar) {
      if (list.length > 0) {
        bar.classList.remove('hidden');
        bar.classList.add('flex');
      } else {
        bar.classList.add('hidden');
        bar.classList.remove('flex');
      }
    }

    if (!cont) return;

    if (list.length === 0) {
      cont.innerHTML = '';
      return;
    }

    cont.innerHTML = list.map(function (v, idx) {
      var t = String(v.tipo || 'PROYECTO').toUpperCase();
      if (t === 'ACTIVIDAD') t = 'HABITO';
      if (t === 'FINANZAS') t = 'GASTO';
      var conf = CONFIG_ICONOS_VINCULOS[t] || CONFIG_ICONOS_VINCULOS.PROYECTO;

      var nombreReal = resolverTituloEntidadVinculo(v);
      var tieneCodDistinto = v.codigo && v.codigo !== nombreReal;

  function refrescarSlotsBadgesEnDOM(codigo, tipo) {
    if (!codigo || typeof generarBadgeNotasVinculadas !== 'function') return;
    var codStr = String(codigo).trim();
    var codUpper = codStr.toUpperCase();
    var tUpper = String(tipo || '').toUpperCase();
    var codDigits = codUpper.replace(/\D/g, '');

    // 1. Tarjetas de Hábitos / Actividades
    if (tUpper === 'HABITO' || tUpper === 'ACTIVIDAD' || !tipo) {
      var slotsHab = document.querySelectorAll('.habit-badge-notas-slot[data-id-actividad]');
      if (slotsHab && slotsHab.length > 0) {
        slotsHab.forEach(function (slot) {
          var idA = String(slot.getAttribute('data-id-actividad') || '').trim();
          var idAUpper = idA.toUpperCase();
          var idADigits = idAUpper.replace(/\D/g, '');
          if (idAUpper === codUpper ||
              idAUpper.replace(/^ACT-0*/, '') === codUpper.replace(/^ACT-0*/, '') ||
              (codDigits && idADigits && codDigits === idADigits)) {
            slot.innerHTML = generarBadgeNotasVinculadas(idA, 'ACTIVIDAD');
          }
        });
      }
      var bModalAct = document.getElementById('actividad-flow-badge-notas');
      if (bModalAct) {
        bModalAct.innerHTML = generarBadgeNotasVinculadas(codStr, 'ACTIVIDAD');
      }
    }

    // 2. Tarjetas Kanban / Tareas
    if (tUpper === 'TAREA' || !tipo) {
      var slotsTask = document.querySelectorAll('.kanban-badge-notas-slot[data-id-tarea]');
      if (slotsTask && slotsTask.length > 0) {
        slotsTask.forEach(function (slot) {
          var idT = String(slot.getAttribute('data-id-tarea') || '').trim();
          var idTUpper = idT.toUpperCase();
          var idTDigits = idTUpper.replace(/\D/g, '');
          if (idTUpper === codUpper ||
              idTUpper.replace(/^TAR-0*/, '') === codUpper.replace(/^TAR-0*/, '') ||
              (codDigits && idTDigits && codDigits === idTDigits)) {
            slot.innerHTML = generarBadgeNotasVinculadas(idT, 'TAREA');
          }
        });
      }
      var bModalTar = document.getElementById('tarea-flow-badge-notas');
      if (bModalTar) {
        bModalTar.innerHTML = generarBadgeNotasVinculadas(codStr, 'TAREA');
      }
    }
  }
  window.refrescarSlotsBadgesEnDOM = refrescarSlotsBadgesEnDOM;

  function desvincularEntidadModal(idx) {
    if (!notasState.notaEnEdicion || !Array.isArray(notasState.notaEnEdicion.Vinculos)) return;
    var realList = notasState.notaEnEdicion.Vinculos.filter(function (v) { return v && v.tipo !== 'WISHLIST_META'; });
    var targetItem = realList[idx];
    if (targetItem) {
      var realIdx = notasState.notaEnEdicion.Vinculos.indexOf(targetItem);
      if (realIdx !== -1) {
        notasState.notaEnEdicion.Vinculos.splice(realIdx, 1);
      }
      renderModalVinculos();

      var idNotaActual = notasState.notaEnEdicion.ID_Nota || notasState.notaEnEdicion.idNota || notasState.notaEnEdicion.id;
      if (!idNotaActual) {
        var badgeIdEl = document.getElementById('modal-nota-id-badge');
        if (badgeIdEl && badgeIdEl.textContent) {
          var mId = badgeIdEl.textContent.match(/NOT-\d+/i);
          if (mId) idNotaActual = mId[0];
        }
      }
      var codEnt = targetItem.codigo || targetItem.id;
      var esExistente = idNotaActual && String(idNotaActual).trim() !== '' && String(idNotaActual).trim().toUpperCase() !== 'NOT-00000';

      if (esExistente && codEnt) {
        // 1. Mutar inmediatamente state.notas
        var st = window.state || (typeof state !== 'undefined' ? state : null);
        if (st && Array.isArray(st.notas)) {
          var targetId = String(idNotaActual).trim().toUpperCase();
          var targetNorm = targetId.replace(/^NOT-0*/, 'NOT-');
          var targetDigits = targetId.replace(/\D/g, '');
          var nEnState = st.notas.find(function (n) {
            if (!n) return false;
            var curId = String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase();
            return curId === targetId || curId.replace(/^NOT-0*/, 'NOT-') === targetNorm || (targetDigits && curId.replace(/\D/g, '') === targetDigits);
          });
          if (nEnState) {
            var rawV = nEnState.Vinculos || nEnState.vinculos || [];
            if (typeof rawV === 'string' && rawV.trim()) {
              try { rawV = JSON.parse(rawV); } catch (e) { rawV = []; }
            }
            var prevArr = Array.isArray(rawV) ? rawV : [];
            var filtradosState = prevArr.filter(function (v) {
              if (!v) return false;
              var c = typeof v === 'string' ? v : (v.codigo || v.id);
              return String(c || '').trim().toUpperCase() !== String(codEnt).trim().toUpperCase();
            });
            nEnState.Vinculos = filtradosState;
            nEnState.vinculos = filtradosState;
          }
        }

        // 2. Purgar caché y refrescar vistas reactivamente al instante
        if (typeof window.invalidarCacheNotasVinculadas === 'function') window.invalidarCacheNotasVinculadas();
        if (typeof sincronizarCacheLocalNotas === 'function') sincronizarCacheLocalNotas();
        if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();
        if (typeof window.renderTableroActividadesPersonales === 'function') {
          try { window.renderTableroActividadesPersonales(); } catch (eH) {}
        }
        refrescarSlotsBadgesEnDOM(codEnt, targetItem.tipo);

        // 3. Persistir en backend
        var fnDesvincular = window.desvincularNotaDeEntidad || (typeof desvincularNotaDeEntidad === 'function' ? desvincularNotaDeEntidad : null);
        if (typeof fnDesvincular === 'function') {
          fnDesvincular(idNotaActual, codEnt, function (res) {
            if (res && res.success && notasState.notaEnEdicion) {
              var stNow = window.state || (typeof state !== 'undefined' ? state : null);
              var nActualizada = stNow && stNow.notas && stNow.notas.find(function (x) {
                return String(x.ID_Nota || x.idNota || x.id || '') === String(idNotaActual);
              });
              if (nActualizada && nActualizada.Vinculos) {
                notasState.notaEnEdicion.Vinculos = nActualizada.Vinculos;
                renderModalVinculos();
              }
            }
          });
        }
      }
    }
  }

  function renderModalAdjuntos() {
    var cont = document.getElementById('modal-nota-adjuntos-list');
    if (!cont || !notasState.notaEnEdicion) return;
    var list = Array.isArray(notasState.notaEnEdicion.Adjuntos) ? notasState.notaEnEdicion.Adjuntos : [];

    if (list.length === 0) {
      cont.innerHTML = '<span class="text-slate-400 italic text-[11px]">Sin archivos adjuntos.</span>';

  function guardarNotaDesdeModal() {
    if (!notasState.notaEnEdicion) return;

    var tit = String(document.getElementById('modal-nota-titulo').value || '').trim();
    var con = String(document.getElementById('modal-nota-contenido').value || '').trim();

    var tipoNota = 'HIBRIDA';
    notasState.notaEnEdicion.Tipo_Nota = 'HIBRIDA';

    // Sección C: Wishlist / Ítems Deseados (Opcional - solo si se llena algún campo de wishlist)
    var inpC = document.getElementById('modal-wishlist-costo');
    var inpN = document.getElementById('modal-wishlist-nivel');
    var inpE = document.getElementById('modal-wishlist-estado');
    var inpL = document.getElementById('modal-wishlist-enlace');
    var inpM = document.getElementById('modal-wishlist-moneda');

    var costoVal = inpC ? (parseFloat(inpC.value) || 0) : 0;
    var nivelVal = inpN ? (inpN.value || '') : '';
    var estadoVal = inpE ? (inpE.value || 'Pendiente') : 'Pendiente';
    var enlaceVal = inpL ? String(inpL.value || '').trim() : '';
    var monedaVal = inpM ? inpM.value : 'PEN';

    var tieneDatosWishlist = (costoVal > 0) || !!nivelVal || !!enlaceVal || (estadoVal === 'Conseguido');

    if (tieneDatosWishlist) {
      var meta = notasState.notaEnEdicion.WishlistMeta || {};
      meta.tipo = 'WISHLIST_META';
      meta.costoEstimado = costoVal;
      meta.moneda = monedaVal;
      meta.nivelDeseo = nivelVal;
      meta.estadoDeseo = estadoVal;
      meta.enlaceReferencia = enlaceVal;
      if (meta.estadoDeseo === 'Conseguido' && !meta.fechaConseguido) {
        meta.fechaConseguido = new Date().toISOString();
      } else if (meta.estadoDeseo === 'Pendiente') {
        meta.fechaConseguido = null;
      }
      notasState.notaEnEdicion.WishlistMeta = meta;

      // Sincronizar en array Vinculos
      if (!Array.isArray(notasState.notaEnEdicion.Vinculos)) notasState.notaEnEdicion.Vinculos = [];
      var vIdx = notasState.notaEnEdicion.Vinculos.findIndex(function (v) { return v && v.tipo === 'WISHLIST_META'; });
      if (vIdx !== -1) {
        notasState.notaEnEdicion.Vinculos[vIdx] = meta;
      } else {
        notasState.notaEnEdicion.Vinculos.push(meta);
      }
    } else {
      notasState.notaEnEdicion.WishlistMeta = null;
      if (Array.isArray(notasState.notaEnEdicion.Vinculos)) {
        notasState.notaEnEdicion.Vinculos = notasState.notaEnEdicion.Vinculos.filter(function (v) {
          return !v || v.tipo !== 'WISHLIST_META';
        });
      }
    }

    var tituloFinal = tit; // Cero inventos: si está vacío se guarda vacío
    var esFijadaVal = esNotaFijada(notasState.notaEnEdicion.Es_Fijada);
    var hiddenCol = document.getElementById('modal-nota-color');
    var colorVal = normalizarColorNota((hiddenCol && hiddenCol.value) || (notasState.notaEnEdicion && (notasState.notaEnEdicion.Color || notasState.notaEnEdicion.color)) || 'default');
    notasState.notaEnEdicion.Color = colorVal;
    notasState.notaEnEdicion.color = colorVal;
    var tagsArr = Array.isArray(notasState.notaEnEdicion.Etiquetas) ? notasState.notaEnEdicion.Etiquetas : [];
    var flatChecklist = [];
    var conservarChecklist = Array.isArray(notasState.checklistItems) && notasState.checklistItems.length > 0;
    if (conservarChecklist) {
      flatChecklist = (notasState.checklistItems || []).map(function (item, idx) {
        return {
          id: item.id || ('chk_' + (idx + 1)),
          texto: item.texto || '',
          completado: !!item.completado
        };
      });
      checklistArr = flatChecklist;
      notasState.notaEnEdicion.Checklist = flatChecklist;
    } else {
      checklistArr = [];
      notasState.notaEnEdicion.Checklist = [];
    }
    var adjuntosArr = Array.isArray(notasState.notaEnEdicion.Adjuntos) ? notasState.notaEnEdicion.Adjuntos : [];
    var vinculosArr = Array.isArray(notasState.notaEnEdicion.Vinculos) ? notasState.notaEnEdicion.Vinculos : [];
    var idNota = String(
      (notasState.notaEnEdicion && (notasState.notaEnEdicion.ID_Nota || notasState.notaEnEdicion.idNota || notasState.notaEnEdicion.id)) || ''
    ).trim();
    var esNuevaNota = !idNota || !!(notasState.notaEnEdicion && notasState.notaEnEdicion._esNueva);
    if (idNota) {
      esNuevaNota = false;
      if (notasState.notaEnEdicion) notasState.notaEnEdicion._esNueva = false;
    }
    var nowIso = new Date().toISOString();

    // Payload con soporte dual camelCase (Directiva Técnica) y PascalCase (Esquema Canónico)
    var payloadBackend = {
      // Directiva Técnica camelCase
      idNota: idNota,
      titulo: tituloFinal,
      contenido: con,
      tags: tagsArr,
      esFijada: esFijadaVal,
      tipoNota: tipoNota,
      color: colorVal,
      checklist: checklistArr,
      adjuntos: adjuntosArr,
      vinculos: vinculosArr,
      wishlistMeta: notasState.notaEnEdicion.WishlistMeta,
      esNueva: esNuevaNota,
      isNew: esNuevaNota,

      // PascalCase Canónico
      ID_Nota: idNota,
      Titulo: tituloFinal,
      Tipo_Nota: tipoNota,
      Contenido: con,
      Color: colorVal,
      Es_Fijada: esFijadaVal,
      Etiquetas: tagsArr,
      Checklist: checklistArr,
      Adjuntos: adjuntosArr,
      Vinculos: vinculosArr,
      WishlistMeta: notasState.notaEnEdicion.WishlistMeta,
      Fecha_Actualizacion: nowIso,

      // Claves canónicas Fase 4.13 (12 columnas A:L)
      Contenido_Markdown: con,
      Checklists_JSON: checklistArr,
      Wishlist_JSON: notasState.notaEnEdicion.WishlistMeta || null,
      Color_Tema: colorVal,
      Adjuntos_Drive_JSON: adjuntosArr,
      Enlaces_Entidades_JSON: vinculosArr.filter(function (v) { return v && v.tipo !== 'WISHLIST_META'; })
    };

    // Serialización limpia: Sólo crear objeto Tabla si el usuario añadió columnas extra
    if (tipoNota === 'CHECKLIST' || tipoNota === 'HIBRIDA') {
      if (Array.isArray(notasState.extraColumnas) && notasState.extraColumnas.length > 0) {
        var fullCols = [
          { id: 'criterio', titulo: 'Ítem / Tarea', tipo: 'texto' },
          { id: 'check', titulo: 'Estado', tipo: 'checkbox' }
        ].concat(notasState.extraColumnas);

        var fullFilas = (notasState.checklistItems || []).map(function (item, idx) {
          var rowVals = Object.assign({}, item.valores || {});
          rowVals.criterio = item.texto || '';
          rowVals.check = !!item.completado;
          return {
            id: item.id || ('f_' + (idx + 1)),
            criterio: item.texto || '',
            valores: rowVals
          };
        });

        var tablaGenerada = {
          tipoEstructura: 'tabla_multicolumna',
          columnas: fullCols,
          filas: fullFilas
        };

        payloadBackend.Tabla = tablaGenerada;
        payloadBackend.tabla = tablaGenerada;
        payloadBackend.Contenido = JSON.stringify(tablaGenerada);
        payloadBackend.contenido = payloadBackend.Contenido;
        notasState.notaEnEdicion.Tabla = tablaGenerada;
      } else {
        // Modo Checklist Simple: Sin columnas inventadas ni json artificial
        payloadBackend.Tabla = null;
        payloadBackend.tabla = null;
        payloadBackend.Contenido = con;
        payloadBackend.contenido = con;
        notasState.notaEnEdicion.Tabla = null;
      }
    } else {
      payloadBackend.Tabla = null;
      payloadBackend.tabla = null;
      payloadBackend.Contenido = con;
      payloadBackend.contenido = con;
      notasState.notaEnEdicion.Tabla = null;
    }

    if (esNuevaNota) {
      payloadBackend.Fecha_Creacion = nowIso;
    }

    // Actualización optimista inmediata en memoria (state.notas) sin duplicar filas
    if (!Array.isArray(state.notas)) state.notas = [];
    var idx = -1;
    if (idNota) {
      var targetId = idNota.toUpperCase();
      var targetNorm = targetId.replace(/^NOT-0*/, 'NOT-');
      var targetDigits = targetId.replace(/\D/g, '');
      idx = state.notas.findIndex(function (n) {
        if (!n) return false;
        var curId = String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase();
        var curNorm = curId.replace(/^NOT-0*/, 'NOT-');
        var curDigits = curId.replace(/\D/g, '');
        return curId === targetId || curNorm === targetNorm || (targetDigits && curDigits === targetDigits);
      });
    }

    if (idx !== -1) {
      state.notas[idx] = Object.assign({}, state.notas[idx], payloadBackend);
    } else if (esNuevaNota) {
      state.notas.unshift(payloadBackend);
    } else {
      // Reemplazo defensivo in-place si existía discrepancia de ID
      state.notas.unshift(payloadBackend);
    }

    // Sincronizar caché local persistente (localStorage) para garantizar 0ms tras recarga
    sincronizarCacheLocalNotas();

    // Re-renderizado de la vista y componentes reactivos
    renderVistaNotas();
    if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();
    cerrarModalEditarNota();

    // Feedback visual inmediato (Toast)
    var msgToast = esNuevaNota ? 'Nota creada correctamente' : 'Nota actualizada correctamente';
    if (typeof mostrarToastOperativo === 'function') {
      mostrarToastOperativo('success', msgToast, tituloFinal);
    } else if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo(msgToast);
    }

    // Despacho transaccional al backend vía updateNota o guardarNota
    var accionBackend = esNuevaNota ? 'guardarNota' : 'updateNota';
    callBackend(accionBackend, payloadBackend, function (res) {
      if (res && res.success && res.nota) {
        var serverNota = res.nota;
        serverNota.Es_Fijada = esNotaFijada(serverNota.Es_Fijada);
        var foundIdx = state.notas.findIndex(function (n) {
          if (!n) return false;
          var curId = String(n.ID_Nota || n.idNota || n.id || '').trim().toUpperCase();
          var tempId = idNota.toUpperCase();
          var serverId = String(serverNota.ID_Nota || serverNota.idNota || serverNota.id || '').trim().toUpperCase();
          var sDigits = serverId.replace(/\D/g, '');
          var cDigits = curId.replace(/\D/g, '');
          return curId === tempId || curId === serverId ||
            (serverId && curId.replace(/^NOT-0*/, 'NOT-') === serverId.replace(/^NOT-0*/, 'NOT-')) ||
            (sDigits && cDigits && sDigits === cDigits);
        });

        if (foundIdx !== -1) {
          state.notas[foundIdx] = Object.assign({}, state.notas[foundIdx], serverNota);
        } else if (esNuevaNota) {
          state.notas.unshift(serverNota);
        } else if (idx !== -1 && state.notas[idx]) {
          state.notas[idx] = Object.assign({}, state.notas[idx], serverNota);
        }

        sincronizarCacheLocalNotas();
        renderVistaNotas();
        if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();

        if (typeof notificarEntidadCreadaDesdeIdea === 'function') {
          var realNotaId = serverNota.ID_Nota || serverNota.idNota || serverNota.id;
          notificarEntidadCreadaDesdeIdea('NOTA', realNotaId);
        }
      }
    }, function (err) {
      console.error('[Error persistiendo nota en backend]:', err);
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('error', 'Error de sincronización', (err && err.message) || 'No se pudieron guardar los cambios en la nube.');
      }
    }, { silent: true });
  }

  function abrirModalVincularEntidadNota(contexto) {
    notasState.contextoVincular = contexto || (notasState.notaEnEdicion ? 'modal' : 'quick');
    notasState.tabVincularActivo = 'PROYECTO';

    var modal = document.getElementById('modal-vincular-entidad-nota');
    if (!modal) {
      console.warn('[abrirModalVincularEntidadNota] Elemento #modal-vincular-entidad-nota no encontrado');
      return;
    }

    // Asegurar que el submodal resida directamente en document.body para evitar clipping de overflow y jerarquía de z-index
    if (modal.parentElement !== document.body) {
      document.body.appendChild(modal);
    }

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.style.display = 'flex';
    modal.style.position = 'fixed';
    modal.style.inset = '0';
    modal.style.zIndex = '10050';

    var inp = document.getElementById('input-buscar-entidad-vincular');
    if (inp) inp.value = '';

    setTabVincularEntidad('PROYECTO');

    if (inp) {
      setTimeout(function () {
        try { inp.focus(); } catch (e) {}
      }, 100);
    }
  }

    var modal = document.getElementById('modal-vincular-entidad-nota');

      modal.classList.add('hidden');

  function setTabVincularEntidad(tab) {
    var tabNorm = String(tab || 'PROYECTO').toUpperCase();
    if (tabNorm === 'ACTIVIDAD') tabNorm = 'HABITO';
    if (tabNorm === 'FINANZAS') tabNorm = 'GASTO';
    notasState.tabVincularActivo = tabNorm;

    var tabs = ['tab-vinc-proy', 'tab-vinc-hit', 'tab-vinc-tar', 'tab-vinc-hab', 'tab-vinc-ing', 'tab-vinc-gas'];
    var activeId = 'tab-vinc-' + (
      tabNorm === 'PROYECTO' ? 'proy' :
      tabNorm === 'HITO' ? 'hit' :
      tabNorm === 'TAREA' ? 'tar' :
      tabNorm === 'HABITO' ? 'hab' :
      tabNorm === 'INGRESO' ? 'ing' : 'gas'
    );

    tabs.forEach(function (tId) {
      var el = document.getElementById(tId);
      if (!el) return;
      if (tId === activeId) {
        el.className = 'tab-vinc-btn px-3 py-1.5 rounded-t-xl font-bold border-b-2 border-indigo-600 text-indigo-600 dark:text-indigo-400 bg-indigo-50/50 dark:bg-indigo-950/30 whitespace-nowrap cursor-pointer transition inline-flex items-center gap-1.5';
      } else {
        el.className = 'tab-vinc-btn px-3 py-1.5 rounded-t-xl font-semibold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap cursor-pointer transition inline-flex items-center gap-1.5';
      }
    });

    filtrarEntidadesParaVincular();
