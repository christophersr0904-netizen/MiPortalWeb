  function filtrarEntidadesParaVincular() {
    var cont = document.getElementById('lista-entidades-vincular');
    var inp = document.getElementById('input-buscar-entidad-vincular');
    if (!cont) return;

    var query = String(inp ? inp.value : '').trim().toLowerCase();
    var tab = String(notasState.tabVincularActivo || 'PROYECTO').toUpperCase();
    var items = [];

    if (tab === 'PROYECTO') {
      (state.proyectos || []).forEach(function (p) {
        if (!p) return;
        var id = String(p.ID_Proyecto || p.id || '').trim();
        var nom = String(p.Nombre_Proyecto || p.Nombre || p.nombre || p.titulo || '').trim();
        var subTexto = p.Tipo_Iniciativa || p.Estado || 'Proyecto';
        if (!query || id.toLowerCase().includes(query) || nom.toLowerCase().includes(query) || String(subTexto).toLowerCase().includes(query)) {
          items.push({ tipo: 'PROYECTO', codigo: id, titulo: nom || id, sub: subTexto });
        }
      });
    } else if (tab === 'HITO') {
      (state.hitos || []).forEach(function (h) {
        if (!h) return;
        var id = String(h.ID_Hito || h.id || '').trim();
        var nom = String(h.Nombre_Hito || h.Nombre || h.nombre || h.titulo || '').trim();
        var idProy = String(h.ID_Proyecto || '').trim();
        var proy = idProy ? (state.proyectos || []).find(function (p) { return p && (p.ID_Proyecto === idProy || p.id === idProy); }) : null;
        var subTexto = proy ? (proy.Nombre_Proyecto || idProy) : (h.ID_Proyecto || 'Sin proyecto');
        if (!query || id.toLowerCase().includes(query) || nom.toLowerCase().includes(query) || String(subTexto).toLowerCase().includes(query)) {
          items.push({ tipo: 'HITO', codigo: id, titulo: nom || id, sub: subTexto });
        }
      });
    } else if (tab === 'TAREA') {
      (state.tareas || []).forEach(function (t) {
        if (!t) return;
        var id = String(t.ID_Tarea || t.id || '').trim();
        var nom = String(t.Nombre_Tarea_Actividad || t.Nombre_Tarea || t.nombre || t.titulo || '').trim();
        var idProy = String(t.ID_Proyecto || '').trim();
        var proy = idProy ? (state.proyectos || []).find(function (p) { return p && (p.ID_Proyecto === idProy || p.id === idProy); }) : null;
        var subTexto = proy ? (proy.Nombre_Proyecto || idProy) : (t.Estado || t.Estado_Tarea || 'Tarea');
        if (!query || id.toLowerCase().includes(query) || nom.toLowerCase().includes(query) || String(subTexto).toLowerCase().includes(query)) {
          items.push({ tipo: 'TAREA', codigo: id, titulo: nom || id, sub: subTexto });
        }
      });
    } else if (tab === 'HABITO' || tab === 'ACTIVIDAD') {
      var habitosList = (state.actividadesPersonales && state.actividadesPersonales.length > 0)
        ? state.actividadesPersonales
        : (state.actividades || state.habitos || []);
      habitosList.forEach(function (a) {
        if (!a) return;
        var id = String(a.ID_Actividad || a.ID_Habito || a.id || a.ID_Tarea || '').trim();
        var nom = String(a.Nombre_Actividad || a.Nombre_Tarea_Actividad || a.Nombre_Habito || a.nombre || a.titulo || '').trim();
        var cat = a.Categoria_Vida || a.categoria || 'Hábito / Rutina';
        if (!query || id.toLowerCase().includes(query) || nom.toLowerCase().includes(query) || String(cat).toLowerCase().includes(query)) {
          items.push({ tipo: 'ACTIVIDAD', codigo: id, titulo: nom || id, sub: cat });
        }
      });
    } else if (tab === 'INGRESO') {
      (state.ingresos || []).forEach(function (ing) {
        if (!ing) return;
        var id = String(ing.ID_Ingreso || ing.id || '').trim();
        var des = String(ing.Descripcion || ing.descripcion || ing.Categoria || ing.categoria || 'Ingreso').trim();
        if (!query || id.toLowerCase().includes(query) || des.toLowerCase().includes(query)) {
          var monto = (ing.Moneda_Original || ing.moneda || 'PEN') + ' ' + (ing.Monto_Original || ing.monto || 0);
          items.push({ tipo: 'INGRESO', codigo: id, titulo: des || id, sub: monto });
        }
      });
    } else if (tab === 'GASTO' || tab === 'FINANZAS') {
      (state.gastos || []).forEach(function (g) {
        if (!g) return;
        var id = String(g.ID_Gasto || g.id || '').trim();
        var des = String(g.Descripcion || g.descripcion || g.Categoria || g.categoria || 'Gasto').trim();
        if (!query || id.toLowerCase().includes(query) || des.toLowerCase().includes(query)) {
          var monto = (g.Moneda_Original || g.moneda || 'PEN') + ' ' + (g.Monto_Original || g.monto || 0);
          items.push({ tipo: 'GASTO', codigo: id, titulo: des || id, sub: monto });
        }
      });
    }

    if (items.length === 0) {
      cont.innerHTML = '<div class="text-center py-8 text-slate-400 italic">No se encontraron entidades coincidentes para este filtro.</div>';
      return;
    }

    notasState._itemsEntidadesParaVincular = items;

    cont.innerHTML = items.slice(0, 50).map(function (it, idx) {
      var tieneTitulo = it.titulo && it.titulo !== it.codigo;
      var tituloPrincipal = tieneTitulo ? it.titulo : it.codigo;
      var confIcono = CONFIG_ICONOS_VINCULOS[it.tipo] || CONFIG_ICONOS_VINCULOS.PROYECTO;
      return (
        '<div onclick="seleccionarEntidadParaVincularPorIndice(' + idx + ');" ' +
          'class="portal-surface p-2.5 rounded-2xl bg-white dark:bg-slate-850 hover:border-indigo-400 dark:hover:border-indigo-500 border border-slate-200/80 dark:border-slate-700/80 cursor-pointer flex items-center justify-between gap-3 transition group active:scale-[0.99] shadow-2xs">' +
          '<div class="flex items-center gap-2.5 overflow-hidden flex-1 min-w-0">' +
            '<span class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ' + confIcono.badge + '">' +
              confIcono.svg +
            '</span>' +

  function posicionarPopoverNota(event) {
    var popover = document.getElementById('popover-nota-preview');
    if (!popover || !event) return;

    var pad = 14;
    var mouseX = event.clientX;
    var mouseY = event.clientY;

    var popoverWidth = popover.offsetWidth || 300;
    var popoverHeight = popover.offsetHeight || 120;
    var winWidth = window.innerWidth;
    var winHeight = window.innerHeight;

    var posX = mouseX + pad;
    var posY = mouseY + pad;

    // Colisión derecha: si se desborda del viewport, posicionar a la izquierda
    if (posX + popoverWidth + pad > winWidth) {
      posX = mouseX - popoverWidth - pad;
    }
    // Colisión inferior: si se desborda del viewport, posicionar arriba
    if (posY + popoverHeight + pad > winHeight) {
      posY = mouseY - popoverHeight - pad;
    }

    // Límites mínimos
    if (posX < pad) posX = pad;
    if (posY < pad) posY = pad;

    popover.style.left = posX + 'px';
    popover.style.top = posY + 'px';
  }

  function formatearContenidoPopover(cuerpoRaw) {
    if (!cuerpoRaw || !String(cuerpoRaw).trim()) {
      return '<span class="italic text-slate-400">Nota sin contenido adicional</span>';
    }
    var str = String(cuerpoRaw).trim();
    // 1. JSON parse si es checklist o wishlist estructurado
    if (str.startsWith('{')) {
      try {
        var obj = JSON.parse(str);
        var partes = [];
        if (obj.texto && typeof obj.texto === 'string' && obj.texto.trim()) {
          partes.push(obj.texto.trim());
        }
        if (obj.items && Array.isArray(obj.items) && obj.items.length > 0) {
          var checks = obj.items.slice(0, 5).map(function (it) {
            return (it.check ? '☑ ' : '☐ ') + (it.texto || '');
          });
          if (obj.items.length > 5) checks.push('... y ' + (obj.items.length - 5) + ' más');
          partes.push(checks.join('\n'));
        }
        if (obj.filas && Array.isArray(obj.filas) && obj.filas.length > 0) {
          var wish = obj.filas.slice(0, 4).map(function (f) {
            var nom = f.item || f.Nombre || f.nombre || Object.values(f)[0] || '';
            var precio = f.costo || f.precio || f.Precio || '';
            return '• ' + nom + (precio ? ' (' + precio + ')' : '');
          });
          if (obj.filas.length > 4) wish.push('... y ' + (obj.filas.length - 4) + ' más');
          partes.push(wish.join('\n'));
        }
        if (partes.length > 0) str = partes.join('\n\n');
      } catch (eJson) {}
    }

    // 2. Limpieza de prefijos crudos como [Wishlist], [Checklist], [Nota], etc.
    str = str.replace(/^\[(Wishlist|Checklist|Nota|Hibrida|HÍBRIDA)\]\s*/i, '');

    // 3. Reemplazar saltos de línea escapados literales '\\n' por saltos reales '\n'
    str = str.replace(/\\n/g, '\n');

    // 4. Escape de HTML básico
    var helperEscape = (typeof escapeHtml === 'function') ? escapeHtml : function (s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    var escaped = helperEscape(str);

    // 5. Parseo de Markdown ligero (negritas y viñetas)
    escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<b class="text-slate-100 font-semibold">$1</b>');
    escaped = escaped.replace(/^[\*\-]\s+(.*)$/gm, '• $1');

    // 6. Saltos de línea a <br>
    escaped = escaped.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');

    return escaped;
  }

  function mostrarPopoverNotaHover(event, idNota) {
    // 1. Supresión inmediata del recuadro blanco/gris nativo del navegador (atributo title)
    if (event && event.currentTarget) {
      event.currentTarget.removeAttribute('title');
      if (event.currentTarget.parentElement && event.currentTarget.parentElement.getAttribute('title')) {
        event.currentTarget.parentElement.removeAttribute('title');
      }
    }

    // 2. Adaptación ergonómica: silenciar hover en móvil o dispositivos táctiles sin hover
    if (window.innerWidth < 768) return;
    if ('ontouchstart' in window && !window.matchMedia('(hover: hover)').matches) return;

    var popover = document.getElementById('popover-nota-preview');
    if (!popover) return;

    var elTitulo = document.getElementById('popover-nota-titulo');
    var elFecha = document.getElementById('popover-nota-fecha');
    var elCuerpo = document.getElementById('popover-nota-cuerpo');
    var elTags = document.getElementById('popover-nota-tags');

    var nota = buscarNotaPorId(idNota);

    // 1. Cabecera - Título
    var titulo = nota ? (nota.Titulo_Nota || nota.Titulo || nota.titulo || 'Nota sin título') : 'Nota vinculada';
    if (elTitulo) elTitulo.textContent = titulo;

    // 2. Cabecera - Fecha (DD/MM/AAAA)
    var fechaStr = '';
    if (nota) {
      var fRaw = nota.Fecha_Modificacion || nota.Fecha_Creacion || nota.Fecha || nota.fecha;
      if (fRaw) {
        var d = new Date(fRaw);
        if (!isNaN(d.getTime())) {
          var dd = String(d.getDate()).padStart(2, '0');
          var mm = String(d.getMonth() + 1).padStart(2, '0');
          var yy = d.getFullYear();
          fechaStr = dd + '/' + mm + '/' + yy;
        } else {
          fechaStr = String(fRaw).split('T')[0];
        }
      }
    }
    if (elFecha) elFecha.textContent = fechaStr || 'Reciente';

    // 3. Cuerpo - Contenido formateado elegantemente (sin escapes crudos ni [Wishlist])
    var cuerpoRaw = nota ? (nota.Contenido_Nota || nota.Contenido || nota.Cuerpo || nota.contenido || '') : '';
    if (elCuerpo) {
      elCuerpo.innerHTML = formatearContenidoPopover(cuerpoRaw);
    }

    // 4. Pie con Chips de Tags
    if (elTags) {
      var tagsRaw = nota ? (nota.Etiquetas || nota.Tags || nota.tags || '') : '';
      var tagsArr = Array.isArray(tagsRaw) ? tagsRaw : (typeof tagsRaw === 'string' && tagsRaw.trim() ? tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(Boolean) : []);
      if (tagsArr.length > 0) {
        var helperEscape = (typeof escapeHtml === 'function') ? escapeHtml : function (s) { return String(s || ''); };
        elTags.innerHTML = tagsArr.slice(0, 5).map(function (t) {
          return '<span class="inline-block bg-slate-800 text-slate-300 border border-slate-700/60 font-mono text-[9px] px-2 py-0.5 rounded-md">#' + helperEscape(t.replace(/^#/, '')) + '</span>';
        }).join('');
        elTags.classList.remove('hidden');
      } else {
        elTags.innerHTML = '';
        elTags.classList.add('hidden');
      }
    }

    // 5. Posicionamiento inteligente y animación fluida
    popover.classList.remove('hidden');
    posicionarPopoverNota(event);

    clearTimeout(window._timerOcultarPopoverNota);
    requestAnimationFrame(function () {
      popover.classList.remove('opacity-0');
      popover.classList.add('opacity-100');
    });
  }

  function moverPopoverNotaHover(event) {
    if (window.innerWidth < 768) return;
    posicionarPopoverNota(event);
  }

  function ocultarPopoverNotaHover() {
    var popover = document.getElementById('popover-nota-preview');
    if (!popover) return;
    popover.classList.remove('opacity-100');

    window._timerOcultarPopoverNota = setTimeout(function () {

        popover.classList.add('hidden');
      }
    }, 150);
  }

      actList.forEach(function (a) {

        var nom = a.Nombre_Actividad || a.Nombre_Tarea_Actividad || a.Nombre_Habito || a.nombre || a.titulo || cod;

  /**
   * Abre directamente la ficha de la entidad vinculada según su tipo
   */
  function navegarAEntidadVinculada(tipo, codigo) {
    if (!tipo || !codigo) return;
    var t = String(tipo).toUpperCase();
    var cod = String(codigo).trim();

    if (t === 'PROYECTO' || cod.startsWith('PRO-')) {
      if (typeof abrirDetalle360 === 'function') {
        abrirDetalle360(cod);
      }
    } else if (t === 'HITO' || cod.startsWith('HIT-')) {
      var hito = Array.isArray(state.hitos) ? state.hitos.find(function (h) { return h.ID_Hito === cod; }) : null;
      if (hito && hito.ID_Proyecto && typeof abrirDetalle360 === 'function') {
        abrirDetalle360(hito.ID_Proyecto);
      } else if (typeof filtrarHitoEnProyectos === 'function') {
        filtrarHitoEnProyectos(cod);
      } else if (typeof abrirDetalle360 === 'function') {
        abrirDetalle360(cod);
      }
    } else if (t === 'TAREA' || cod.startsWith('TAR-')) {
      if (typeof abrirModalEditarTareaFlow === 'function') {
        abrirModalEditarTareaFlow(cod);
      } else if (typeof abrirModalDetalleTarea === 'function') {
        abrirModalDetalleTarea(cod);
      }
    } else if (t === 'HABITO' || t === 'ACTIVIDAD' || cod.startsWith('ACT-')) {
      if (typeof abrirModalEditarActividadPersonal === 'function') {
        abrirModalEditarActividadPersonal(cod);
      }
    } else if (t === 'GASTO' || cod.startsWith('GAS-')) {
      if (typeof abrirDrawerDetalleTransaccion === 'function') {
        abrirDrawerDetalleTransaccion('gasto', cod);
      }
    } else if (t === 'INGRESO' || cod.startsWith('ING-')) {
      if (typeof abrirDrawerDetalleTransaccion === 'function') {
        abrirDrawerDetalleTransaccion('ingreso', cod);
      }
    } else {
      // Intento inteligente por prefijo
      if (cod.startsWith('PRO-') && typeof abrirDetalle360 === 'function') {
        abrirDetalle360(cod);
      } else if (cod.startsWith('HIT-')) {
        var hitoPref = Array.isArray(state.hitos) ? state.hitos.find(function (h) { return h.ID_Hito === cod; }) : null;
        if (hitoPref && hitoPref.ID_Proyecto && typeof abrirDetalle360 === 'function') {
          abrirDetalle360(hitoPref.ID_Proyecto);
        }
      } else if (cod.startsWith('TAR-') && typeof abrirModalEditarTareaFlow === 'function') {
        abrirModalEditarTareaFlow(cod);
      }
    }
  }

          tagCounts[clean] = (tagCounts[clean] || 0) + 1;
        }
      });
    });

    var tags = Object.keys(tagCounts).sort();
    var filtradas = tags.filter(function (t) {
      return !query || t.includes(query);
    });

    var tagsActivos = (state.filtrosNotas && state.filtrosNotas.tags instanceof Set) ? state.filtrosNotas.tags : new Set();
    var html = '';

    // Opción "Crear / Filtrar por nueva" si hay query y no existe exactamente
    if (query && !tags.some(function (t) { return t === query; })) {
      html += '<button type="button" onclick="setFiltroEtiquetaNotas(\'' + escapeHtml(query) + '\')" class="w-full text-left px-2 py-1.5 rounded-lg text-xs font-bold text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-950/40 flex items-center justify-between border-b border-slate-100 dark:border-slate-700/60 mb-1"><span>＋ Añadir tag: #' + escapeHtml(query) + '</span><span class="text-[10px]">Nuevo</span></button>';
    }

    if (filtradas.length > 0) {
      html += filtradas.map(function (t) {
        var esActiva = tagsActivos.has(t);
        var estilo = obtenerEstiloCromaticoEtiqueta(t);
        return (
          '<div onclick="toggleTagFiltroNotas(\'' + escapeHtml(t) + '\', event)" class="cursor-pointer select-none w-full px-2 py-1.5 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-700/60 flex items-center justify-between transition ' + (esActiva ? 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 font-bold ring-1 ring-amber-400/50' : 'text-slate-700 dark:text-slate-200') + '">' +
            '<div class="flex items-center gap-2">' +
              '<input type="checkbox" ' + (esActiva ? 'checked' : '') + ' onclick="event.stopPropagation(); toggleTagFiltroNotas(\'' + escapeHtml(t) + '\', event);" class="rounded text-amber-500 focus:ring-amber-400 h-3.5 w-3.5 cursor-pointer accent-amber-500" />' +
              '<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold border ' + estilo.badge + '">#' + escapeHtml(t) + '</span>' +
            '</div>' +
            '<span class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold">' + tagCounts[t] + '</span>' +
          '</div>'
        );
      }).join('');
    } else if (!query) {
      html += '<div class="text-center py-4 text-xs text-slate-400 italic">No hay etiquetas creadas aún.</div>';
    }

    cont.innerHTML = html;
  }

  /**
   * Ejecución optimista de marcado como conseguido y despacho asíncrono hacia backend
   */
  function ejecutarMarcarDeseoConseguidoOptimista(idNota, registrarGasto, monto) {
    var idx = (state.notas || []).findIndex(function (n) { return n.ID_Nota === idNota; });
    if (idx === -1) return;

    var nota = state.notas[idx];
    var copiaRespaldo = JSON.parse(JSON.stringify(nota));

    if (!nota.WishlistMeta) {
      nota.WishlistMeta = {
        tipo: 'WISHLIST_META',
        costoEstimado: 0,
        moneda: 'PEN',
        nivelDeseo: 'Media',
        enlaceReferencia: '',
        estadoDeseo: 'Pendiente',
        montoRealGastado: 0,
        fechaConseguido: null,
        idGastoVinculado: null
      };
    }

    nota.WishlistMeta.estadoDeseo = 'Conseguido';
    nota.WishlistMeta.fechaConseguido = new Date().toISOString();
    if (monto > 0) {
      nota.WishlistMeta.montoRealGastado = monto;
    }

    if (!Array.isArray(nota.Vinculos)) nota.Vinculos = [];
    var vIdx = nota.Vinculos.findIndex(function (v) { return v && v.tipo === 'WISHLIST_META'; });
    if (vIdx !== -1) {
      nota.Vinculos[vIdx] = nota.WishlistMeta;
    } else {
      nota.Vinculos.push(nota.WishlistMeta);
    }

    renderVistaNotas();
    if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();

    if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo(registrarGasto ? '🎉 ¡Deseo conseguido y gasto registrado en Finanzas!' : '🎉 ¡Deseo conseguido!');
    }

    var payload = {
      idNota: idNota,
      estadoDeseo: 'Conseguido',
      registrarGasto: !!registrarGasto,
      montoGastado: monto,
      moneda: nota.WishlistMeta.moneda || 'PEN'
    };

    callBackend('marcarDeseoConseguido', payload, function (res) {
      if (res && res.success) {
        if (res.wishlistMeta) {
          nota.WishlistMeta = res.wishlistMeta;
        }
        if (res.gastoCreado && Array.isArray(state.gastos)) {
          state.gastos.unshift(res.gastoCreado);
          if (typeof window.renderVistaFinanzas === 'function') window.renderVistaFinanzas();
        }
        renderVistaNotas();
      } else {
        state.notas[idx] = copiaRespaldo;
        renderVistaNotas();
        if (typeof Swal !== 'undefined') {
          Swal.fire('Error', (res && res.error) || 'No se pudo actualizar el deseo', 'error');
        }
      }
    }, function (err) {
      state.notas[idx] = copiaRespaldo;
      renderVistaNotas();
    }, { silent: true });
  }

  /**
   * Reabrir deseo conseguido moviéndolo de regreso a pendientes
   */
  function desmarcarDeseoConseguido(idNota) {
    var idx = (state.notas || []).findIndex(function (n) { return n.ID_Nota === idNota; });
    if (idx === -1) return;

    var nota = state.notas[idx];
    var copiaRespaldo = JSON.parse(JSON.stringify(nota));

    if (!nota.WishlistMeta) return;

    nota.WishlistMeta.estadoDeseo = 'Pendiente';
    nota.WishlistMeta.fechaConseguido = null;

    if (Array.isArray(nota.Vinculos)) {
      var vIdx = nota.Vinculos.findIndex(function (v) { return v && v.tipo === 'WISHLIST_META'; });
      if (vIdx !== -1) nota.Vinculos[vIdx] = nota.WishlistMeta;
    }

    renderVistaNotas();
    if (typeof window.actualizarVistasActivasNotas === 'function') window.actualizarVistasActivasNotas();

    if (typeof mostrarToastAtajo === 'function') {
      mostrarToastAtajo('↩ Deseo reabierto en pendientes');
    }

    callBackend('marcarDeseoConseguido', { idNota: idNota, estadoDeseo: 'Pendiente' }, function (res) {
      if (res && res.success) {
        if (res.wishlistMeta) nota.WishlistMeta = res.wishlistMeta;
        renderVistaNotas();
      } else {
        state.notas[idx] = copiaRespaldo;
        renderVistaNotas();
      }
    }, function () {
      state.notas[idx] = copiaRespaldo;
      renderVistaNotas();
    }, { silent: true });
  }

  /**
   * Formatea un array o string de etiquetas al formato estándar: Tags: #tag1 #tag2
   * @param {Array|string} etiquetas
   * @returns {string} Cadena formateada o vacía si no hay tags
   */
  function formatearTagsTextoPlano(etiquetas) {
    if (!etiquetas) return '';
    var lista = [];
    if (Array.isArray(etiquetas)) {
      lista = etiquetas;
    } else if (typeof etiquetas === 'string') {
      lista = etiquetas.split(',').map(function (s) { return s.trim(); });
    }
    var tagsValidos = lista
      .map(function (t) { return String(t || '').trim().replace(/^#+/, ''); })
      .filter(Boolean)
      .map(function (t) { return '#' + t; });
    if (tagsValidos.length === 0) return '';
    return 'Tags: ' + tagsValidos.join(' ');
  }

  /**
   * Limpia el texto de contenido eliminando artefactos JSON internos o tags HTML
   * respetando los saltos de línea originales del usuario.
   * @param {string} raw
   * @returns {string}
   */
  function limpiarContenidoTextoPlano(raw) {
    if (!raw) return '';
    var str = String(raw).trim();
    if (str.startsWith('{') || str.startsWith('[')) {
      try {
        var parsed = JSON.parse(str);
        if (parsed && (parsed.tipoEstructura === 'tabla_multicolumna' || parsed.tipo === 'WISHLIST_META' || Array.isArray(parsed.columnas))) {
          return '';
        }
      } catch (e) {}
    }
    // Convertir etiquetas HTML habituales preservando saltos de línea
    str = str.replace(/<br\s*[\/]?>/gi, '\n')
             .replace(/<\/p>/gi, '\n\n')
             .replace(/<[^>]+>/g, '');
    // Decodificar entidades HTML comunes
    str = str.replace(/&nbsp;/gi, ' ')
             .replace(/&amp;/gi, '&')
             .replace(/&lt;/gi, '<')
             .replace(/&gt;/gi, '>')
             .replace(/&quot;/gi, '"')
             .replace(/&#39;/gi, "'");
    return str.trim();
  }

  /**
   * Serializa una nota a texto plano estructurado según su tipo:
   * A. NOTA ESTANDAR: Titulo, Contenido y Tags
   * B. CHECKLIST: Titulo, items [x]/[ ] y Tags (soporta Checklist y Tabla.filas)
   * C. WISHLIST: Titulo, Costo/Estado, Enlace, Contenido y Tags
   * @param {Object} nota Objeto de nota en memoria
   * @returns {string} Texto plano listo para portapapeles
   */
  function serializarNotaATextoPlano(nota) {
    if (!nota || typeof nota !== 'object') return '';

    var titulo = String(nota.Titulo || '').trim();
    var tipoNota = String(nota.Tipo_Nota || 'NORMAL').toUpperCase();
    var esWishlist = (tipoNota === 'WISHLIST') || !!nota.WishlistMeta;

    // Resolver si cuenta con estructura de checklist / matriz dinámica
    var tablaObj = (nota.Tabla && Array.isArray(nota.Tabla.filas) && nota.Tabla.filas.length > 0) ? nota.Tabla : null;
    if (!tablaObj && nota.Contenido) {
      var cTrim = String(nota.Contenido).trim();
      if (cTrim.startsWith('{') && (cTrim.includes('"tipoEstructura"') || cTrim.includes('"columnas"'))) {
        try {
          var pTabla = JSON.parse(cTrim);
          if (pTabla && (pTabla.tipoEstructura === 'tabla_multicolumna' || Array.isArray(pTabla.columnas) || Array.isArray(pTabla.filas))) {
            tablaObj = pTabla;
          }
        } catch (ePT) {}
      }
    }
    var esChecklist = (tipoNota === 'CHECKLIST') || !!tablaObj || (Array.isArray(nota.Checklist) && nota.Checklist.length > 0);

    var bloques = [];

    // ==========================================
    // C. WISHLIST
    // ==========================================
    if (esWishlist) {
      if (titulo) bloques.push(titulo);

      var meta = nota.WishlistMeta || {};
      var moneda = (meta.moneda && String(meta.moneda).trim()) ? String(meta.moneda).trim() : 'PEN';
      var costoNum = parseFloat(meta.costoEstimado || 0);
      var montoStr = isNaN(costoNum) ? '0.00' : costoNum.toFixed(2);
      var estadoStr = meta.estadoDeseo || 'Pendiente';

      var lineasWish = ['Costo: ' + moneda + ' ' + montoStr + ' | Estado: ' + estadoStr];
      if (meta.enlaceReferencia && String(meta.enlaceReferencia).trim()) {
        lineasWish.push('Enlace: ' + String(meta.enlaceReferencia).trim());
      }
      bloques.push(lineasWish.join('\n'));

      var contenidoWish = limpiarContenidoTextoPlano(nota.Contenido);
      if (contenidoWish) bloques.push(contenidoWish);

      var tagsWish = formatearTagsTextoPlano(nota.Etiquetas);
      if (tagsWish) bloques.push(tagsWish);

      return bloques.join('\n\n');
    }

    // ==========================================
    // B. CHECKLIST
    // ==========================================
    if (esChecklist) {
      if (titulo) bloques.push(titulo);

      var itemsList = [];
      if (tablaObj && Array.isArray(tablaObj.filas) && tablaObj.filas.length > 0) {
        var tCols = Array.isArray(tablaObj.columnas) ? tablaObj.columnas : [];
        var checkCol = tCols.find(function (c) { return c.tipo === 'checkbox' || c.id === 'check'; });
        tablaObj.filas.forEach(function (f) {
          var isChecked = checkCol ? !!(f.valores && f.valores[checkCol.id]) : false;
          var txt = f.criterio || (f.valores && f.valores.criterio) || '';
          if (txt && String(txt).trim()) {
            itemsList.push((isChecked ? '[x] ' : '[ ] ') + String(txt).trim());
          }
        });
      } else if (Array.isArray(nota.Checklist) && nota.Checklist.length > 0) {
        nota.Checklist.forEach(function (item) {
          var isChecked = !!item.completado;
          var txt = item.texto || '';
          if (txt && String(txt).trim()) {
            itemsList.push((isChecked ? '[x] ' : '[ ] ') + String(txt).trim());
          }
        });
      }

      if (itemsList.length > 0) {
        bloques.push(itemsList.join('\n'));
      }

      var tagsCheck = formatearTagsTextoPlano(nota.Etiquetas);
      if (tagsCheck) bloques.push(tagsCheck);

      return bloques.join('\n\n');
    }

    // ==========================================
    // A. NOTA ESTÁNDAR
    // ==========================================
    if (titulo) bloques.push(titulo);

    var contenidoNormal = limpiarContenidoTextoPlano(nota.Contenido);
    if (contenidoNormal) bloques.push(contenidoNormal);

    var tagsNormal = formatearTagsTextoPlano(nota.Etiquetas);
    if (tagsNormal) bloques.push(tagsNormal);

    return bloques.join('\n\n');
  }

  /**
   * Copia el texto serializado de una nota individual al portapapeles
   * y muestra una notificación toast reactiva.
   * @param {string} idNota Identificador de la nota
   */
  function copiarNotaTextoPlano(idNota) {
    if (!idNota) return;
    var lista = (typeof state !== 'undefined' && Array.isArray(state.notas)) ? state.notas : [];
    var nota = lista.find(function (n) {
      return (n.ID_Nota && n.ID_Nota === idNota) || (n.idNota && n.idNota === idNota) || (n.id && n.id === idNota);
    });

    if (!nota && typeof buscarNotaPorIdUniversal === 'function') {
      nota = buscarNotaPorIdUniversal(idNota);
    }

    if (!nota) {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('error', 'Error al copiar', 'No se encontró la nota solicitada.');
      }
      return;
    }

    var textoPlano = serializarNotaATextoPlano(nota);
    if (!textoPlano) {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('warning', 'Nota vacía', 'La nota no tiene contenido para copiar.');
      }
      return;
    }

    var copiarFallback = function (txt) {
      return new Promise(function (resolve, reject) {
        try {
          var textarea = document.createElement('textarea');
          textarea.value = txt;
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          textarea.setAttribute('readonly', '');
          document.body.appendChild(textarea);
          textarea.select();
          var exitoso = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (exitoso) {
            resolve();
          } else {
            reject(new Error('execCommand falló'));
          }
        } catch (err) {
          reject(err);
        }
      });
    };

    var promesaCopia;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      promesaCopia = navigator.clipboard.writeText(textoPlano).catch(function () {
        return copiarFallback(textoPlano);
      });
    } else {
      promesaCopia = copiarFallback(textoPlano);
    }

    promesaCopia.then(function () {
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('success', 'Nota copiada', 'Texto listo para pegar como mensaje');
      } else if (typeof mostrarToastAtajo === 'function') {
        mostrarToastAtajo('📋 Nota copiada al portapapeles');
      }
    }).catch(function (err) {
      console.error('[copiarNotaTextoPlano] Error al acceder al portapapeles:', err);
      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('error', 'Error al copiar', 'No se pudo acceder al portapapeles.');
      }
    });
  }
