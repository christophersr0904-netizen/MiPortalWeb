<!-- SISTEMA: PMO Personal Modular & Life Operating System                 -->

<!-- ESTÁNDAR: Cobalt Aerodynamic A.2.2 • SYSTEM_RULES.md • Anti-Jitter    -->
<!-- ===================================================================== -->

<div id="modal-detalle-idea" style="z-index: 9999;" onclick="if (event.target === this) cerrarModalDetalleIdea();"
     class="hidden fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 select-none transition-opacity duration-200">

  <!-- TARJETA CONTENEDOR ZEN ESTILO NOTION/OBSIDIAN (Tier 2: max-w-2xl, Rígida sin Jitter, Micro-Densidad Limpia) -->
  <div id="modal-detalle-idea-card"
       class="w-full max-w-2xl max-h-[94vh] sm:max-h-[90vh] flex flex-col overflow-hidden rounded-t-3xl sm:rounded-3xl bg-slate-900/95 dark:bg-[#070D1D]/95 backdrop-blur-2xl border border-white/10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7),0_0_30px_rgba(99,102,241,0.15)] relative transition-all duration-200 ease-out transform scale-95 opacity-0 text-slate-100">

    <!-- DRAG HANDLE MÓVIL (BOTTOM SHEET) -->
    <div class="w-12 h-1.5 bg-slate-700/80 rounded-full mx-auto my-2.5 block sm:hidden shrink-0"></div>

    <!-- CABECERA ZEN Y COMPACTA (Badges + Micro-Adjunto Integrado + Cierre) -->
    <header class="px-5 sm:px-6 py-3.5 border-b border-white/5 flex items-center justify-between gap-3 shrink-0 bg-white/[0.02]">
      
      <!-- Lado Izquierdo: Identificador y Badges de Estado/Tipo -->
      <div class="flex items-center gap-2 flex-wrap">
        <span id="modal-idea-id-badge"
              class="px-2.5 py-0.5 rounded-lg text-[10px] font-mono font-bold bg-indigo-500/10 text-indigo-300 border border-indigo-500/25 shadow-2xs">
          IDE-00000000-000
        </span>

        <!-- Badge Semántico de Estado -->
        <span id="modal-idea-estado-badge"
              class="px-2.5 py-0.5 rounded-lg text-[10px] font-bold bg-sky-950/40 text-sky-300 border border-sky-800/50 flex items-center gap-1.5 shadow-2xs">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
          <span id="modal-idea-estado-label">Borrador / Inbox</span>
        </span>

        <!-- Badge Tipo Captura -->
        <span id="modal-idea-tipo-badge"
              class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-white/5 text-slate-300 border border-white/10 flex items-center gap-1">
          <svg id="modal-idea-tipo-icon" class="portal-icon-sm w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>
          </svg>
          <span id="modal-idea-tipo-label">Texto</span>
        </span>
      </div>

      <!-- Lado Derecho: Micro-Adjuntos Minimalistas Integrados (Sin ocupar filas toscas) + Botón Cerrar -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- 1. Micro-Miniatura de Imagen con Zoom (0 espacio si no existe) -->
        <div id="modal-idea-foto-container" class="hidden items-center">
          <div class="relative group cursor-pointer" onclick="abrirZoomFotoIdea()" title="Clic para ampliar imagen">
            <img id="modal-idea-foto-img" src="" alt="Captura"
                 class="w-8 h-8 rounded-lg object-cover border border-white/20 shadow-sm group-hover:scale-110 group-hover:border-indigo-400 transition-all">
            <div class="absolute inset-0 bg-black/30 rounded-lg opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- 2. Micro-Reproductor de Audio Lineal (0 espacio si no existe) -->
        <div id="modal-idea-audio-container" class="hidden items-center">
          <div class="flex items-center gap-1.5 px-2 py-1 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-300">
            <svg class="w-3.5 h-3.5 text-indigo-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
            <audio id="modal-idea-audio-player" controls class="h-6 w-36 sm:w-44 rounded-md outline-none"></audio>
          </div>
        </div>

        <!-- 3. Micro-Chip para Documentos / Archivos Generales (0 espacio si no existe) -->
        <div id="modal-idea-archivo-chip" class="hidden items-center">
          <a id="modal-idea-adjunto-enlace" href="#" target="_blank"
             class="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white text-[11px] font-medium transition group"
             title="Abrir evidencia en Google Drive">
            <svg class="w-3.5 h-3.5 text-emerald-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
            <span id="modal-idea-archivo-nombre" class="truncate max-w-[110px] font-mono text-[10px]">Drive</span>
            <svg class="w-3 h-3 text-slate-500 group-hover:text-indigo-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            </svg>
          </a>
        </div>

        <!-- Contenedor oculto de retrocompatibilidad para IDs anteriores -->
        <div id="modal-idea-multimedia-section" class="hidden"></div>

        <!-- Botón Cerrar -->
        <button type="button" onclick="cerrarModalDetalleIdea()"
                class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition active:scale-90 cursor-pointer"
                title="Cerrar ventana">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- CUERPO SCROLLEABLE TIPO BLOC DE NOTAS / NOTION (ANTI-JITTER) -->
    <div class="flex-1 overflow-y-auto p-5 sm:p-6 space-y-5">
      <input type="hidden" id="modal-idea-id" value="" />

      <!-- 1. ÚNICO EDITOR CENTRAL AMPLIO, AUTOEXPANDIBLE Y LIMPIO (SINGLE BODY CANVAS) -->
      <div class="py-1">
        <textarea id="modal-idea-cuerpo"
                  rows="8"
                  placeholder="Escribe tu idea, notas, desarrollo o reflexiones (#tags automáticos)..."
                  oninput="this.style.height = 'auto'; this.style.height = Math.max(160, this.scrollHeight) + 'px';"
                  class="w-full text-base text-slate-100 placeholder:text-slate-500 leading-relaxed border-none bg-transparent focus:ring-0 focus:outline-none resize-none min-h-[160px]"></textarea>
        <!-- Elementos ocultos para sincronización defensiva y retrocompatibilidad total -->
        <input type="hidden" id="modal-idea-enunciado" value="" />
        <input type="hidden" id="modal-idea-detalle" value="" />
        <input type="hidden" id="detalle-idea-contexto" value="" />
      </div>

      <!-- 2. BLOQUE SUTIL DE TRANSCRIPCIÓN IA / OCR BAJO DEMANDA -->
      <div id="modal-idea-transcripcion-container" class="space-y-1.5 p-3 rounded-2xl bg-black/25 border border-white/5">
        <div class="flex items-center justify-between">
          <label for="modal-idea-transcripcion" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
            <span>Transcripción de Voz / OCR</span>
          </label>
          <button type="button" id="btn-transcribir-audio" onclick="transcribirAudioModalIdea()"
                  class="px-2.5 py-1 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[11px] font-bold flex items-center gap-1.5 transition cursor-pointer">
            <svg id="icon-transcribir-audio" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>
            </svg>
            <span id="label-transcribir-audio">Transcribir a Texto</span>
          </button>
        </div>
        <textarea id="modal-idea-transcripcion"
                  rows="2"
                  placeholder="La transcripción del audio o extracción OCR de la imagen aparecerá aquí..."
                  class="w-full px-3 py-1.5 text-xs bg-black/40 text-slate-200 placeholder-slate-500 rounded-xl border border-white/5 focus:border-indigo-500/40 outline-none resize-y leading-relaxed"></textarea>
      </div>

      <!-- 3. BLOQUE BENTO DE CLARIFICACIÓN IA (MINIMALISTA CON AURORA GLOW) -->
      <div class="p-4 rounded-3xl bg-indigo-950/20 dark:bg-gradient-to-br dark:from-indigo-950/30 dark:via-purple-950/15 dark:to-slate-950/50 border border-indigo-500/25 space-y-3 shadow-lg shadow-indigo-950/20">
        
        <!-- Header Bento IA Minimalista -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 text-white flex items-center justify-center shadow-xs">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>
              </svg>
            </div>
            <div>
              <span class="text-xs font-bold text-indigo-200 tracking-tight block">Clarificación Estratégica con Gemini</span>
              <span class="text-[10px] text-slate-400">Viabilidad, fricción y recomendación de triaje</span>
            </div>
          </div>
          <span class="text-[10px] font-mono text-indigo-300 bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-full">Gemini Flash</span>
        </div>

        <!-- Ficha Dinámica de Resultados (Inyectada reactivamente) -->
        <div id="modal-idea-clarificacion-resultado" class="space-y-2 text-xs text-slate-200">
          <div class="p-3 rounded-2xl bg-black/30 border border-white/5 text-slate-400 text-center text-xs leading-relaxed">
            Formula una duda o solicita una evaluación de viabilidad, costos ocultos y ruta óptima.
          </div>
        </div>

        <!-- Input de Duda Libre + Botón de Clarificación -->
        <div class="flex flex-col sm:flex-row gap-2 pt-1 border-t border-white/5">
          <input type="text" id="input-pregunta-ia-idea"
                 placeholder="¿Tienes alguna duda estratégica? (ej. ¿Vale la pena frente a otra opción?)..."
                 class="flex-1 px-3.5 py-2 text-xs bg-black/50 text-slate-100 placeholder-slate-500 rounded-xl border border-white/5 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition outline-none">
          <!-- Alias de retrocompatibilidad -->
          <input type="hidden" id="modal-idea-pregunta-usuario" value="" />
          
          <button type="button" id="btn-clarificar-idea-ia" onclick="clarificarConIAModalIdea()"
                  class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:brightness-110 active:scale-95 text-white transition-all duration-150 flex items-center justify-center gap-1.5 text-xs font-bold shadow-md shadow-indigo-500/25 cursor-pointer shrink-0 ideas-aurora-glow">
            <svg id="icon-clarificar-ia" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>
            </svg>
            <span id="label-clarificar-ia">Clarificar con IA</span>
          </button>
          <!-- Alias retrocompatible id -->
          <button type="button" id="btn-clarificar-ia" onclick="clarificarConIAModalIdea()" class="hidden"></button>
        </div>
      </div>
    </div>

    <!-- PIE ERGONÓMICO DE ACCIONES (TRIAJE COMPACTO Y GUARDADO) -->
    <footer class="px-5 sm:px-6 py-3.5 border-t border-white/5 bg-white/[0.02] flex flex-col sm:flex-row items-center justify-between gap-3 shrink-0">
      
      <!-- Lado Izquierdo: Botones de Triaje Directo con Micro-Iconos Compactos -->
      <div class="flex items-center gap-1.5 flex-wrap w-full sm:w-auto">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider hidden sm:inline mr-1">Triaje a:</span>
        
        <!-- 1. A Tarea (Lucide check-square w-4 h-4) -->
        <button type="button" onclick="convertirIdeaATarea()"
                class="px-2.5 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-2xs hover:scale-105"
                title="Convertir en Tarea del Tablero Kanban">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>A Tarea</span>
        </button>

        <!-- 2. A Proyecto (Lucide folder-kanban w-4 h-4) -->
        <button type="button" onclick="convertirIdeaAProyecto()"
                class="px-2.5 py-1.5 rounded-xl bg-violet-500/10 hover:bg-violet-500/20 text-violet-300 border border-violet-500/30 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-2xs hover:scale-105"
                title="Convertir en Proyecto del Portafolio">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/>
          </svg>
          <span>A Proyecto</span>
        </button>

        <!-- 3. A Hábito (Lucide target w-4 h-4) -->
        <button type="button" onclick="convertirIdeaAHabito()"
                class="px-2.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-2xs hover:scale-105"
                title="Convertir en Hábito o Rutina">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
          <span>A Hábito</span>
        </button>

        <!-- 4. A Nota (Lucide file-text w-4 h-4) -->
        <button type="button" onclick="convertirIdeaANota()"
                class="px-2.5 py-1.5 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-2xs hover:scale-105"
                title="Convertir en Nota de Conocimiento">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
          </svg>
          <span>A Nota</span>
        </button>
      </div>

      <!-- Lado Derecho: Estado de Incubación, Eliminación y Guardado -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button type="button" onclick="moverIdeaIncubacionModal()"
                class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-slate-200 hover:bg-white/5 transition cursor-pointer"
                title="Mover a Incubación / Algún día">
          <span>Incubar</span>
        </button>
        <!-- Eliminar (Lucide trash-2 w-4 h-4) -->
        <button type="button" onclick="eliminarIdeaModal()"
                class="p-2 rounded-xl text-rose-400 hover:text-rose-200 hover:bg-rose-950/40 transition cursor-pointer"
                title="Eliminar Idea">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
          </svg>
        </button>
        <!-- Guardar (Lucide check w-3.5 h-3.5) -->
        <button type="button" onclick="guardarCambiosModalIdea()"
                class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-1.5 text-xs font-bold shadow-md shadow-indigo-600/30 cursor-pointer active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          <span>Guardar</span>
        </button>
      </div>
    </footer>
  </div>
</div>

<!-- MICRO-LIGHTBOX ZEN PARA ZOOM DE IMÁGENES -->
<div id="modal-idea-lightbox" class="hidden fixed inset-0 z-[10000] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out select-none" onclick="this.classList.add('hidden')">
  <img id="modal-idea-lightbox-img" src="" alt="Zoom" class="max-w-full max-h-[90vh] rounded-2xl object-contain shadow-2xl border border-white/10">
</div>
