<script>
  /**
   * 4.2. Renderizado del Sidebar Ejecutivo Izquierdo de Proyectos
   */
  function renderSidebarProyectos() {
    var container = document.getElementById('lista-proyectos-sidebar');
    if (!container) return;
    container.innerHTML = '';

    var query = (state.filtros.busquedaSidebar || '').trim().toLowerCase();
    var tipo = state.filtros.tipo;

    // Sincronizar input de búsqueda si existe en el DOM
    var inputSearch = document.getElementById('sidebar-search-proyectos');
    if (inputSearch && inputSearch.value !== (state.filtros.busquedaSidebar || '')) {
      inputSearch.value = state.filtros.busquedaSidebar || '';
    }
    var clearBtn = document.getElementById('btn-clear-search-sidebar');
    if (clearBtn) {
      if (query) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    var proyectosAMostrar = state.proyectos.filter(function (p) {
      var cumpleTipo = !tipo || p.Tipo_Iniciativa === tipo;
      if (!cumpleTipo) return false;
      if (query) {
        var idMatch = String(p.ID_Proyecto || '').toLowerCase().indexOf(query) !== -1;
        var nomMatch = String(p.Nombre_Proyecto || '').toLowerCase().indexOf(query) !== -1;
        var liderMatch = String(p.Lider_Proyecto || '').toLowerCase().indexOf(query) !== -1;
        return idMatch || nomMatch || liderMatch;
      }
      return true;
    });

    // Actualizar badge del total de proyectos filtrados / visibles
    var badgeTotal = document.getElementById('badge-total-proyectos-sidebar');
    if (badgeTotal) {
      badgeTotal.textContent = proyectosAMostrar.length;
    }

    if (proyectosAMostrar.length === 0) {
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'p-4 text-center text-slate-400 text-xs bg-slate-800/40 rounded-xl border border-slate-700/60 mt-1';
      if (query) {
        emptyDiv.innerHTML =
          '<p class="font-bold text-slate-300 mb-1 flex items-center justify-center gap-1.5"><svg class="portal-icon-lg text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Sin coincidencias</span></p>' +
          '<p class="text-[10px] text-slate-400 mb-2.5">No hay proyectos que coincidan con "' + query + '"</p>' +
          '<button type="button" onclick="limpiarBusquedaSidebar()" class="px-2.5 py-1 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded-lg text-[10px] font-bold shadow transition">Limpiar búsqueda</button>';
      } else {
        emptyDiv.innerHTML =
          '<p class="font-bold text-slate-300 mb-1 flex items-center justify-center gap-1.5"><svg class="portal-icon-lg text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg><span>Sin proyectos</span></p>' +
          '<p class="text-[10px] text-slate-400">No hay proyectos activos en esta categoría.</p>';
      }
      container.appendChild(emptyDiv);
      return;
    }

    proyectosAMostrar.forEach(function (p) {
      var isSelected = state.selectedProjectId === p.ID_Proyecto;
      var rawHealth = String(p.Health_Status || '🟢 En Rango').trim();
      var healthType = 'rango';
      var healthLabel = 'En Rango';
      var dotHtml = '';
      var pillClasses = '';

      if (/bloqueado|cr[ií]tico|danger|rojo/i.test(rawHealth) || rawHealth.indexOf('🔴') !== -1) {
        healthType = 'bloqueado';
        healthLabel = 'Bloqueado';
        dotHtml = '<span class="relative flex h-2 w-2 shrink-0"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span></span>';
        pillClasses = 'badge-sem-rose animate-pulse';
      } else if (/riesgo|alerta|warning|amarillo/i.test(rawHealth) || rawHealth.indexOf('🟡') !== -1 || rawHealth.indexOf('⚠️') !== -1) {
        healthType = 'riesgo';
        healthLabel = 'En Riesgo';
        dotHtml = '<span class="relative flex h-2 w-2 shrink-0"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span></span>';
        pillClasses = 'badge-sem-amber';
      } else {
        healthType = 'rango';
        healthLabel = 'En Rango';
        dotHtml = '<span class="h-2 w-2 rounded-full bg-emerald-400 shrink-0 shadow-xs shadow-emerald-400/50"></span>';
        pillClasses = 'badge-sem-emerald';
      }

      var healthTooltip = p.Health_Motivo ? p.Health_Motivo : ('Salud determinista: ' + rawHealth);
      var checkinAlert = p.Requiere_Checkin
        ? '<span class="portal-icon-sm text-amber-400 animate-pulse shrink-0 inline-flex items-center" title="Requiere check-in de gobernanza"><svg class="portal-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>'
        : '';

      var healthBadge = '<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 cursor-help ' + pillClasses + '" title="' + healthTooltip + '">' +
        dotHtml +
        '<span>' + healthLabel + '</span>' +
        '</div>' + checkinAlert;

      var estadoLimpio = String(p.Estado_Proyecto || 'Backlog');
      if (estadoLimpio.indexOf('_') !== -1) estadoLimpio = estadoLimpio.substring(estadoLimpio.indexOf('_') + 1);
      estadoLimpio = estadoLimpio.replace(/_/g, ' ');
      var avances = calcularAvancesProyectoSeguro(p);

      if (state.isSidebarCollapsed) {
        var avatar = document.createElement('button');
        avatar.type = 'button';
        avatar.dataset.idProyecto = p.ID_Proyecto;
        avatar.title = '[' + p.ID_Proyecto + '] ' + p.Nombre_Proyecto + ' (' + avances.avanceReal + '% | ' + healthLabel + ')';
        avatar.onclick = function () { seleccionarProyecto(p.ID_Proyecto); };
        avatar.className = 'w-10 h-10 mx-auto rounded-xl flex items-center justify-center font-bold text-xs relative transition-all duration-200 hover:scale-105 border ' +
          (isSelected ? 'bg-indigo-600 text-white border-white ring-2 ring-indigo-400 shadow-lg' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white');
        
        var avatarDot = '';
        if (healthType === 'bloqueado') {
          avatarDot = '<span class="absolute -bottom-0.5 -right-0.5 flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500 border border-slate-900"></span></span>';
        } else if (healthType === 'riesgo') {
          avatarDot = '<span class="absolute -bottom-0.5 -right-0.5 flex h-2.5 w-2.5"><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-400 border border-slate-900"></span></span>';
        } else {
          avatarDot = '<span class="absolute -bottom-0.5 -right-0.5 flex h-2.5 w-2.5"><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400 border border-slate-900"></span></span>';
        }

        avatar.innerHTML =
          '<span>' + (p.Nombre_Proyecto ? p.Nombre_Proyecto.substring(0, 2).toUpperCase() : 'PR') + '</span>' +
          avatarDot;
        container.appendChild(avatar);
      } else {
        var card = document.createElement('div');
        card.dataset.idProyecto = p.ID_Proyecto;
        card.className = 'group relative p-3 rounded-xl cursor-pointer transition-all duration-200 hover:translate-x-1 border ' +
          (isSelected
            ? 'bg-indigo-950/70 border-indigo-500/80 border-l-4 border-l-indigo-400 shadow-md ring-1 ring-indigo-500/40 text-white'
            : 'bg-slate-800/50 hover:bg-slate-800/90 border-slate-700/60 border-l-4 border-l-transparent text-slate-300 hover:border-slate-600/80 hover:shadow');
        card.onclick = function () { seleccionarProyecto(p.ID_Proyecto); };

        card.innerHTML =
          '<div class="flex items-center justify-between mb-1.5 text-[10px] gap-1">' +
            '<div class="flex items-center gap-1.5 min-w-0">' +
              '<span class="font-mono font-bold text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded border border-slate-800 shrink-0">' + p.ID_Proyecto + '</span>' +
              '<span class="px-2 py-0.5 rounded-full bg-slate-700/80 text-slate-300 font-semibold text-[9px] truncate">' + (p.Tipo_Iniciativa || 'General') + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 shrink-0">' +
              '<button type="button" onclick="event.stopPropagation(); abrirDetalle360(\'' + p.ID_Proyecto + '\');" title="Ver Detalle 360°" class="opacity-0 group-hover:opacity-100 transition-opacity duration-150 px-1.5 py-0.5 text-[10px] font-bold rounded bg-indigo-600/90 hover:bg-indigo-500 text-white shadow-xs border border-indigo-400/40 flex items-center gap-1 active:scale-95">' +
                '<svg class="portal-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span>360°</span>' +
              '</button>' +
              healthBadge +
            '</div>' +
          '</div>' +
          '<div class="font-bold text-xs text-white leading-snug truncate mb-1" title="' + p.Nombre_Proyecto + '">' + p.Nombre_Proyecto + '</div>' +
          '<div class="space-y-1 mt-2 pt-1 border-t border-slate-700/40">' +
            '<div class="flex justify-between text-[10px] font-mono tabular-nums leading-none">' +
              '<span class="text-slate-400">Avance: <b class="text-indigo-300 font-bold">' + avances.avanceReal + '%</b></span>' +
              '<span class="text-amber-300/90 font-medium">Meta: ' + avances.avanceTotalProyectado + '%</span>' +
            '</div>' +
            '<div class="w-full bg-slate-700/70 h-1.5 rounded-full overflow-hidden relative">' +
              '<div class="bg-indigo-400/40 h-full rounded-full absolute left-0 top-0 transition-all duration-500" style="width: ' + avances.avanceTotalProyectado + '%"></div>' +
              '<div class="bg-indigo-500 h-full rounded-full absolute left-0 top-0 transition-all duration-500" style="width: ' + avances.avanceReal + '%"></div>' +
            '</div>' +
          '</div>';
        container.appendChild(card);
      }
    });
  }

  /**
   * 4.2.1. Búsqueda y Filtrado Reactivo en Vivo en el Sidebar (60 fps)
   */
  function filtrarProyectosSidebarEnVivo(term) {
    var q = (term || '').trim().toLowerCase();
    state.filtros.busquedaSidebar = q;

    var clearBtn = document.getElementById('btn-clear-search-sidebar');
    if (clearBtn) {
      if (q) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
    }

    var container = document.getElementById('lista-proyectos-sidebar');
    if (!container) return;

    var cards = container.querySelectorAll('[data-id-proyecto]');
    if (cards.length === 0 || state.isSidebarCollapsed) {
      renderSidebarProyectos();
      return;
    }

    var visiblesCount = 0;
    cards.forEach(function (card) {
      var idProy = card.dataset.idProyecto;
      var proy = state.proyectos.find(function (p) { return p.ID_Proyecto === idProy; });
      if (!proy) return;

      var cumpleTipo = !state.filtros.tipo || proy.Tipo_Iniciativa === state.filtros.tipo;
      var cumpleBusqueda = !q ||
        String(proy.ID_Proyecto || '').toLowerCase().indexOf(q) !== -1 ||
        String(proy.Nombre_Proyecto || '').toLowerCase().indexOf(q) !== -1 ||
        String(proy.Lider_Proyecto || '').toLowerCase().indexOf(q) !== -1;

      if (cumpleTipo && cumpleBusqueda) {
        card.classList.remove('hidden');
        visiblesCount++;
      } else {
        card.classList.add('hidden');
      }
    });

    var badgeTotal = document.getElementById('badge-total-proyectos-sidebar');
    if (badgeTotal) {
      badgeTotal.textContent = visiblesCount;
    }

    var noResultsMsg = document.getElementById('sidebar-no-results-msg');
    if (visiblesCount === 0 && q) {
      if (!noResultsMsg) {
        noResultsMsg = document.createElement('div');
        noResultsMsg.id = 'sidebar-no-results-msg';
        noResultsMsg.className = 'p-3 text-center text-slate-400 text-xs bg-slate-800/40 rounded-xl border border-slate-700/60 mt-2';
        container.appendChild(noResultsMsg);
      }
      noResultsMsg.innerHTML =
        '<p class="font-bold text-slate-300 mb-1">Sin coincidencias</p>' +
        '<p class="text-[10px] text-slate-400 mb-2">No hay proyectos para "' + q + '"</p>' +
        '<button type="button" onclick="limpiarBusquedaSidebar()" class="px-2 py-1 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded text-[10px] font-bold transition">Limpiar filtro</button>';
      noResultsMsg.classList.remove('hidden');
    } else if (noResultsMsg) {
      noResultsMsg.classList.add('hidden');
    }
  }

  /**
   * 4.2.2. Limpiar Búsqueda del Sidebar
   */
  function limpiarBusquedaSidebar() {
    state.filtros.busquedaSidebar = '';
    var input = document.getElementById('sidebar-search-proyectos');
    if (input) input.value = '';
    var clearBtn = document.getElementById('btn-clear-search-sidebar');
    if (clearBtn) clearBtn.classList.add('hidden');
    renderSidebarProyectos();
  }

  /**
   * 4.3. Renderizado de Portafolio General Ejecutivo, KPIs y Vistas Dinámicas (Grid / Tabla)
   */
  function indexarTareasPorProyecto() {
    var map = new Map();
    var proyIds = new Set();
    if (state && Array.isArray(state.proyectos)) {
      state.proyectos.forEach(function (p) {
        if (p && p.ID_Proyecto) proyIds.add(String(p.ID_Proyecto).trim());
      });
    }

    var tareas = (state && Array.isArray(state.tareas)) ? state.tareas : [];
    for (var i = 0; i < tareas.length; i++) {
      var t = tareas[i];
      if (!t) continue;
      var idProy = String(t.ID_Proyecto || '').trim();
      if (!idProy || !proyIds.has(idProy)) {
        var idHito = String(t.ID_Hito || '').trim();
        if (idHito) {
          var matched = false;
          proyIds.forEach(function (pId) {
            if (!matched && (idHito === pId || idHito.indexOf(pId) === 0)) {
              idProy = pId;
              matched = true;
            }
          });
        }
      }
      if (idProy) {
        if (!map.has(idProy)) map.set(idProy, []);
        map.get(idProy).push(t);
      }
    }
    return map;
  }

  function indexarGastosPorProyecto() {
    var map = new Map();
    var proyIds = new Set();
    if (state && Array.isArray(state.proyectos)) {
      state.proyectos.forEach(function (p) {
        if (p && p.ID_Proyecto) proyIds.add(String(p.ID_Proyecto).trim());
      });
    }

    var gastos = (state && Array.isArray(state.gastos)) ? state.gastos : [];
    for (var i = 0; i < gastos.length; i++) {
      var g = gastos[i];
      if (!g) continue;
      var idProy = String(g.ID_Proyecto || '').trim();
      if (!idProy || !proyIds.has(idProy)) {
        var idHito = String(g.ID_Hito || '').trim();
        if (idHito) {
          var matched = false;
          proyIds.forEach(function (pId) {
            if (!matched && (idHito === pId || idHito.indexOf(pId) === 0)) {
              idProy = pId;
              matched = true;
            }
          });
        }
      }
      if (idProy) {
        if (!map.has(idProy)) map.set(idProy, []);
        map.get(idProy).push(g);
      }
    }
    return map;
  }

  function renderKPIsPortafolio() {
    var proys = (state && Array.isArray(state.proyectos)) ? state.proyectos : [];
    var totalProyectos = proys.length;

    actualizarContadoresPildorasPortafolio();
    // Preconstrucción en memoria de Mapas Hash O(1) de Tareas y Gastos
    const tareasPorProyecto = indexarTareasPorProyecto();
    const gastosPorProyecto = indexarGastosPorProyecto();

    // Consolidación de contadores, métricas y salud en un solo ciclo O(N)
    var proyEjecucion = 0, proyPlan = 0, proyBacklog = 0, proyPausa = 0, proyCerrados = 0;
    var sumaAvanceReal = 0;
    var sumaAvanceMeta = 0;
    var sumaBAC = 0;
    var sumaAC = 0;
    var countRango = 0, countRiesgo = 0, countBloqueado = 0;

    for (var k = 0; k < totalProyectos; k++) {
      var p = proys[k];
      if (!p) continue;

      // 1. Conteo por estado
      var st = String(p.Estado_Proyecto || '');
      if (st.indexOf('03_En_Ejecucion') !== -1) proyEjecucion++;
      else if (st.indexOf('02_Planificado') !== -1) proyPlan++;
      else if (st.indexOf('01_Backlog') !== -1) proyBacklog++;
      else if (st.indexOf('04_En_Pausa') !== -1) proyPausa++;
      else if (st.indexOf('06_Cerrado') !== -1) proyCerrados++;

      // 2. Avances ponderados
      var av = calcularAvancesProyectoSeguro(p);
      sumaAvanceReal += av.avanceReal;
      sumaAvanceMeta += av.avanceTotalProyectado;

      // 3. Consumo presupuestario (BAC y AC)
      sumaBAC += (parseFloat(p.Presupuesto_Tope) || 0);
      sumaAC += (parseFloat(p.Costo_Ejecutado_Real_PEN) || 0);

      // 4. Salud y alertas críticas
      var h = String(p.Health_Status || '');
      if (h.indexOf('🔴') !== -1 || h.toLowerCase().indexOf('bloqueado') !== -1) countBloqueado++;
      else if (h.indexOf('🟡') !== -1 || h.toLowerCase().indexOf('riesgo') !== -1) countRiesgo++;
      else countRango++;
    }

    var proyActivos = totalProyectos - proyCerrados;

    var elTotal = document.getElementById('kpi-total-proyectos');
    if (elTotal) elTotal.textContent = totalProyectos;
    var elSubTotal = document.getElementById('kpi-sub-total-proyectos');
    if (elSubTotal) elSubTotal.textContent = proyActivos + ' activas';
    var elProyEjec = document.getElementById('kpi-proy-ejecucion');
    if (elProyEjec) elProyEjec.textContent = proyEjecucion + ' ejec.';
    var elProyPlan = document.getElementById('kpi-proy-plan');
    if (elProyPlan) elProyPlan.textContent = proyPlan + ' plan.';
    var elProyCerr = document.getElementById('kpi-proy-cerrados');
    if (elProyCerr) elProyCerr.textContent = proyCerrados + ' cerrados';

    // Avance Global Ponderado / Promedio
    var promReal = totalProyectos > 0 ? Math.round(sumaAvanceReal / totalProyectos) : 0;
    var promMeta = totalProyectos > 0 ? Math.round(sumaAvanceMeta / totalProyectos) : 0;

    var elAvanceProm = document.getElementById('kpi-avance-promedio');
    if (elAvanceProm) elAvanceProm.textContent = promReal + '%';
    var elAvanceMeta = document.getElementById('kpi-avance-meta');
    if (elAvanceMeta) elAvanceMeta.textContent = 'Meta: ' + promMeta + '%';
    var elBarReal = document.getElementById('kpi-avance-real-bar');
    if (elBarReal) elBarReal.style.width = promReal + '%';
    var elBarMeta = document.getElementById('kpi-avance-meta-bar');
    if (elBarMeta) elBarMeta.style.width = promMeta + '%';

    // Consumo Presupuestario (Burn Rate & Saldo)
    var pctBurn = sumaBAC > 0 ? Math.round((sumaAC / sumaBAC) * 100) : 0;
    var saldoRestante = Math.max(0, sumaBAC - sumaAC);

    var elGastoTotal = document.getElementById('kpi-gasto-total');
    if (elGastoTotal) elGastoTotal.textContent = 'PEN ' + sumaAC.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    var elPresupuestoTotal = document.getElementById('kpi-presupuesto-total');
    if (elPresupuestoTotal) elPresupuestoTotal.textContent = 'PEN ' + sumaBAC.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elPresupuestoPct = document.getElementById('kpi-presupuesto-pct');
    if (elPresupuestoPct) {
      elPresupuestoPct.textContent = pctBurn + '%';
      if (pctBurn > 100) {
        elPresupuestoPct.className = 'text-[10px] font-bold px-1.5 py-0.2 rounded bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60';
      } else if (pctBurn > 85) {
        elPresupuestoPct.className = 'text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60';
      } else {
        elPresupuestoPct.className = 'text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60';
      }
    }

    var elSaldoRestante = document.getElementById('kpi-saldo-restante');
    if (elSaldoRestante) elSaldoRestante.textContent = 'PEN ' + saldoRestante.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Salud & Alertas Críticas
    var totalAlertas = countRiesgo + countBloqueado;

    var elAlertasCrit = document.getElementById('kpi-alertas-criticas');
    if (elAlertasCrit) {
      elAlertasCrit.innerHTML = totalAlertas === 0
        ? '<span class="text-emerald-600 dark:text-emerald-400">0 en riesgo</span>'
        : '<span class="text-rose-600 dark:text-rose-400">' + totalAlertas + ' en alerta</span>';
    }
    var elAlertasDesc = document.getElementById('kpi-alertas-desc');
    if (elAlertasDesc) {
      elAlertasDesc.textContent = totalAlertas === 0
        ? 'Portafolio operando en rango normal'
        : countBloqueado + ' bloqueado(s) • ' + countRiesgo + ' en riesgo';
    }
    var elHealthIcon = document.getElementById('kpi-health-icon');
    if (elHealthIcon) {
      var colorClass = countBloqueado > 0 ? 'bg-rose-500' : (countRiesgo > 0 ? 'bg-amber-500' : 'bg-emerald-500');

  function escapeHtmlSeguro(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function calcularAvancesProyectoSeguro(p) {
    if (!p) return { avanceReal: 0, avanceTotalProyectado: 0 };
    if (typeof calcularAvancesProyecto === 'function') {
      try {
        var res = calcularAvancesProyecto(p);
        if (res && typeof res.avanceReal === 'number') return res;
      } catch (e) {}
    }
    var avReal = parseFloat(p.Avance_Real_Pct) || 0;
    var avPlan = parseFloat(p.Avance_Plan_Pct) || parseFloat(p.Avance_Proyectado_Pct) || 0;
    return { avanceReal: Math.round(avReal), avanceTotalProyectado: Math.round(avPlan) };
  }

  /**
   * 4.3.1. Filtro y ordenamiento centralizado de Proyectos
   */
  function obtenerProyectosFiltradosPortafolio() {
    var inputSearch = document.getElementById('portafolio-search');
    var query = inputSearch ? inputSearch.value.trim().toLowerCase() : '';

    var btnClearSearch = document.getElementById('btn-clear-portafolio-search');
    if (btnClearSearch) {
      if (query.length > 0) btnClearSearch.classList.remove('hidden');
      else btnClearSearch.classList.add('hidden');
    }

    var elTipo = document.getElementById('grid-filter-tipo');
    var fTipo = elTipo ? elTipo.value : '';
    var elEstado = document.getElementById('grid-filter-estado');
    var fEstado = elEstado ? elEstado.value : '';
    var elSalud = document.getElementById('grid-filter-salud');
    var fSalud = elSalud ? elSalud.value : '';
    var elOrden = document.getElementById('grid-filter-orden');
    var fOrden = elOrden ? elOrden.value : 'avance_desc';

    var btnLimpiar = document.getElementById('btn-limpiar-filtros-portafolio');
    var hayFiltrosActivos = (query !== '' || fTipo !== '' || fEstado !== '' || fSalud !== '' || fOrden !== 'avance_desc');
    if (btnLimpiar) {
      if (hayFiltrosActivos) btnLimpiar.classList.remove('hidden');
      else btnLimpiar.classList.add('hidden');
    }

    // Actualizar estilos activos de las pastillas de salud
    var fSaludLower = String(fSalud || '').toLowerCase();
    ['rango', 'riesgo', 'bloqueado'].forEach(function (tipo) {
      var pillBtn = document.getElementById('btn-pill-salud-' + tipo);
      if (pillBtn) {
        var activo = (tipo === 'rango' && (fSalud.indexOf('🟢') !== -1 || fSaludLower.indexOf('rango') !== -1)) ||
          (tipo === 'riesgo' && (fSalud.indexOf('🟡') !== -1 || fSaludLower.indexOf('riesgo') !== -1)) ||
          (tipo === 'bloqueado' && (fSalud.indexOf('🔴') !== -1 || fSaludLower.indexOf('bloqueado') !== -1));
        if (activo) {
          pillBtn.classList.add('ring-2', 'ring-indigo-500', 'font-black');
        } else {
          pillBtn.classList.remove('ring-2', 'ring-indigo-500', 'font-black');
        }
      }
    });

    var proys = (state && Array.isArray(state.proyectos)) ? state.proyectos : [];


    var filtrados = proys.filter(function (p) {
      // Regla estricta: todo objeto completado/conciliado con más de 10 días desaparece del canvas activo
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(p)) return false;
      if (fTipo && p.Tipo_Iniciativa !== fTipo) return false;
      if (fEstado && String(p.Estado_Proyecto || '').indexOf(fEstado) === -1) return false;
      if (fSalud) {
        var pSalud = String(p.Health_Status || '').toLowerCase();
        var fSaludLower = String(fSalud).toLowerCase();
        if ((fSalud.indexOf('🟢') !== -1 || fSaludLower.indexOf('rango') !== -1) && pSalud.indexOf('🟢') === -1 && pSalud.indexOf('rango') === -1) return false;
        if ((fSalud.indexOf('🟡') !== -1 || fSaludLower.indexOf('riesgo') !== -1) && pSalud.indexOf('🟡') === -1 && pSalud.indexOf('riesgo') === -1) return false;
        if ((fSalud.indexOf('🔴') !== -1 || fSaludLower.indexOf('bloqueado') !== -1) && pSalud.indexOf('🔴') === -1 && pSalud.indexOf('bloqueado') === -1) return false;
      }
      if (query) {
        var matchNombre = String(p.Nombre_Proyecto || '').toLowerCase().indexOf(query) !== -1;
        var matchId = String(p.ID_Proyecto || '').toLowerCase().indexOf(query) !== -1;
        var matchOkr = String(p.North_Star_OKR || '').toLowerCase().indexOf(query) !== -1;
        var matchDod = String(p.Criterios_Aceptacion_DoD || '').toLowerCase().indexOf(query) !== -1;
        var matchTipo = String(p.Tipo_Iniciativa || '').toLowerCase().indexOf(query) !== -1;
        var matchLider = String(p.Lider_Responsable || p.Responsable || '').toLowerCase().indexOf(query) !== -1;
        if (!matchNombre && !matchId && !matchOkr && !matchDod && !matchTipo && !matchLider) return false;
      }
      return true;
    });

    // Ordenamiento
    filtrados.sort(function (a, b) {
      var avA = calcularAvancesProyectoSeguro(a).avanceReal;
      var avB = calcularAvancesProyectoSeguro(b).avanceReal;
      var bacA = parseFloat(a.Presupuesto_Tope) || 0;
      var bacB = parseFloat(b.Presupuesto_Tope) || 0;
      var acA = parseFloat(a.Costo_Ejecutado_Real_PEN) || 0;
      var acB = parseFloat(a.Costo_Ejecutado_Real_PEN) || 0;

      if (fOrden === 'avance_desc') return avB - avA;
      if (fOrden === 'avance_asc') return avA - avB;
      if (fOrden === 'presupuesto_desc') return bacB - bacA;
      if (fOrden === 'gasto_desc') return acB - acA;
      if (fOrden === 'fecha_asc') {
        var fA = a.Fecha_Fin_Plan ? new Date(String(a.Fecha_Fin_Plan).split('T')[0]).getTime() : 9999999999999;
        var fB = b.Fecha_Fin_Plan ? new Date(String(b.Fecha_Fin_Plan).split('T')[0]).getTime() : 9999999999999;
        return fA - fB;
      }
      if (fOrden === 'nombre_asc') {
        return String(a.Nombre_Proyecto || '').localeCompare(String(b.Nombre_Proyecto || ''));
      }
      return 0;
    });

    return filtrados;
  }

  /**
   * 4.3.4. Sincronización visual de contenedores (Tarjetas vs Tabla)
   */
  function sincronizarVistaPortafolio(vista) {
    var v = (vista === 'table') ? 'table' : 'grid';
    var btnGrid = document.getElementById('btn-view-grid-portafolio');
    var btnTable = document.getElementById('btn-view-table-portafolio');
    var cardsContainer = document.getElementById('grid-proyectos-cards');
    var tableWrapper = document.getElementById('table-proyectos-wrapper');
    var emptyState = document.getElementById('portafolio-empty-state');

    var activeClass = 'btn-portal-primary text-xs shadow-xs';
    var inactiveClass = 'btn-portal-secondary text-xs';

    var hayVacio = emptyState && !emptyState.classList.contains('hidden');

    if (v === 'table') {
      if (btnGrid) btnGrid.className = inactiveClass;
      if (btnTable) btnTable.className = activeClass;
      if (!hayVacio) {
        if (cardsContainer) cardsContainer.classList.add('hidden');
        if (tableWrapper) {
          tableWrapper.classList.remove('hidden');
          tableWrapper.style.display = 'block';
        }
      }
    } else {
      if (btnGrid) btnGrid.className = activeClass;
      if (btnTable) btnTable.className = inactiveClass;
      if (!hayVacio) {
        if (cardsContainer) cardsContainer.classList.remove('hidden');
        if (tableWrapper) {
          tableWrapper.classList.add('hidden');
          tableWrapper.style.display = 'none';
        }
      }
    }
  }

  /**
   * 4.3.5. Orquestador Central de Portafolio
   */
  function renderGridProyectos() {
    var cardsContainer = document.getElementById('grid-proyectos-cards');
    var tableWrapper = document.getElementById('table-proyectos-wrapper');
    var emptyState = document.getElementById('portafolio-empty-state');

    actualizarContadoresPildorasPortafolio();
    var filtrados = obtenerProyectosFiltradosPortafolio();

    var currentView = state.portfolioView || (function () {
      try { return localStorage.getItem('pmo_portfolio_view') || 'grid'; } catch (e) { return 'grid'; }
    })();

    if (filtrados.length === 0) {
      if (cardsContainer) cardsContainer.classList.add('hidden');
      if (tableWrapper) {
        tableWrapper.classList.add('hidden');
        tableWrapper.style.display = 'none';
      }
      if (emptyState) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      }
      return;
    }

    if (emptyState) {
      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');
    }

    // Pre-indexación en Mapas Hash O(1) de Tareas y Gastos por Proyecto
    const tareasPorProyecto = indexarTareasPorProyecto();
    const gastosPorProyecto = indexarGastosPorProyecto();

    // Renderizar tanto tarjetas como tabla con los mapas indexados
    renderTarjetasPortafolio(filtrados, tareasPorProyecto, gastosPorProyecto);
    renderTablaPortafolio(filtrados, tareasPorProyecto, gastosPorProyecto);

    // Ajustar visibilidad y botones según vista activa
    sincronizarVistaPortafolio(currentView);
  }

  /**
   * 4.3.6. Conmutador de Sub-vistas (Tarjetas vs Tabla)
   * Invoca explícitamente el renderizado de la tabla al alternar
   */
  function cambiarVistaPortafolio(vista) {
    var v = (vista === 'table') ? 'table' : 'grid';
    state.portfolioView = v;
    try {
      localStorage.setItem('pmo_portfolio_view', v);
    } catch (e) {}

    sincronizarVistaPortafolio(v);

    // INVOCACIÓN EXPLÍCITA Y DIRECTA: Obtener datos frescos y renderizar con mapas indexados
    var filtrados = obtenerProyectosFiltradosPortafolio();
    const tareasPorProyecto = indexarTareasPorProyecto();
    const gastosPorProyecto = indexarGastosPorProyecto();
    if (v === 'table') {
      renderTablaPortafolio(filtrados, tareasPorProyecto, gastosPorProyecto);
    } else {
      renderTarjetasPortafolio(filtrados, tareasPorProyecto, gastosPorProyecto);
    }
  }

  function filtrarPortafolioPorSalud(salud) {
    var elSalud = document.getElementById('grid-filter-salud');
    if (!elSalud) return;
    var normal = String(salud).replace(/[🟢🟡🔴]/g, '').trim().toLowerCase();
    var current = String(elSalud.value || '').replace(/[🟢🟡🔴]/g, '').trim().toLowerCase();
    var nuevoValor = '';
    var etiqueta = 'Salud: Todas';
    if (current !== normal) {
      nuevoValor = salud;
      etiqueta = (salud.indexOf('🟢') !== -1 || normal.indexOf('rango') !== -1) ? '🟢 Saludable' :
                 ((salud.indexOf('🟡') !== -1 || normal.indexOf('riesgo') !== -1) ? '🟡 En Riesgo' : '🔴 Crítico');
    }
    elSalud.value = nuevoValor;
    var lbl = document.getElementById('lbl-dropdown-salud');
    if (lbl) lbl.textContent = etiqueta;
    var led = document.getElementById('led-salud-trigger');
    if (led) {
      if (nuevoValor.indexOf('rango') !== -1 || nuevoValor.indexOf('🟢') !== -1) led.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block shrink-0';
      else if (nuevoValor.indexOf('riesgo') !== -1 || nuevoValor.indexOf('🟡') !== -1) led.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block shrink-0';
      else if (nuevoValor.indexOf('bloqueado') !== -1 || nuevoValor.indexOf('🔴') !== -1) led.className = 'w-2 h-2 rounded-full bg-rose-500 inline-block shrink-0';
      else led.className = 'w-2 h-2 rounded-full bg-slate-400 inline-block shrink-0';
    }
    renderGridProyectos();
  }

  function filtrarPortafolioPorEstado(estado) {
    var elEstado = document.getElementById('grid-filter-estado');
    if (!elEstado) return;
    if (elEstado.value === estado) {
      elEstado.value = '';
    } else {
      elEstado.value = estado;
    }
    renderGridProyectos();
  }

  function limpiarFiltrosPortafolio() {
    var inputSearch = document.getElementById('portafolio-search');
    if (inputSearch) {
      inputSearch.value = '';
      inputSearch.blur();
    }
    var btnClear = document.getElementById('btn-clear-portafolio-search');
    if (btnClear) btnClear.classList.add('hidden');

    var elTipo = document.getElementById('grid-filter-tipo');
    if (elTipo) elTipo.value = '';
    var elEstado = document.getElementById('grid-filter-estado');
    if (elEstado) elEstado.value = '';
    var elSalud = document.getElementById('grid-filter-salud');
    if (elSalud) elSalud.value = '';
    var elOrden = document.getElementById('grid-filter-orden');
    if (elOrden) elOrden.value = 'avance_desc';

    var btnLimpiar = document.getElementById('btn-limpiar-filtros-portafolio');
    if (btnLimpiar) {
      btnLimpiar.classList.add('hidden');
      btnLimpiar.classList.remove('flex', 'inline-flex');
    }

    actualizarEstilosPildorasPortafolio('');
    if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
    renderGridProyectos();
  }

  function limpiarBusquedaPortafolio() {
    var inputSearch = document.getElementById('portafolio-search');
    if (inputSearch) inputSearch.value = '';
    var btnClear = document.getElementById('btn-clear-portafolio-search');
    if (btnClear) btnClear.classList.add('hidden');
    renderGridProyectos();
  }

  /**
   * 4.4. Apertura y Desglose de la Vista Detalle 360°
   */

  function abrirWizardProyecto() {
    if (typeof window.abrirWizardProyecto === 'function') {
      window.abrirWizardProyecto();
    } else {
      openModal('modal-proyecto-wizard');
    }
  }

  function ejecutarAutocompletadoIA() {
    if (typeof window.ejecutarGeneracionPropuestaIA === 'function') {
      window.ejecutarGeneracionPropuestaIA();
    }
  }

  function renderPortafolioProyectos() {
    if (typeof renderKPIsPortafolio === 'function') renderKPIsPortafolio();
    renderGridProyectos();
  }

  // Auto-vinculación de botones de conmutación de vista
  if (typeof document !== 'undefined') {
    var initPortafolioViews = function () {
      var btnGrid = document.getElementById('btn-view-grid-portafolio');
      var btnTable = document.getElementById('btn-view-table-portafolio');
      if (btnGrid) {
        btnGrid.onclick = function (e) {
          if (e) e.preventDefault();
          cambiarVistaPortafolio('grid');
        };
      }
      if (btnTable) {
        btnTable.onclick = function (e) {
          if (e) e.preventDefault();
          cambiarVistaPortafolio('table');
        };
      }
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPortafolioViews);
    } else {
      initPortafolioViews();
    }
  }

  /**
   * 4.3.7. Píldoras de Cartera / Tipo (Glassmorphism & Acentos Luminosos)
   */
  function filtrarPortafolioPorTipo(tipo) {
    var inTipo = document.getElementById('grid-filter-tipo');
    if (inTipo) {
      inTipo.value = tipo || '';
    }
    actualizarEstilosPildorasPortafolio(tipo || '');
    if (typeof renderGridProyectos === 'function') {
      renderGridProyectos();
    }
  }

  function actualizarEstilosPildorasPortafolio(tipoActivo) {
    var config = [
      {
        tipo: '',
        id: 'pill-portafolio-tipo-todos',
        badgeId: 'badge-portafolio-tipo-todos',
        activeClass: 'bg-indigo-600 text-white shadow-md shadow-indigo-500/25 border-indigo-500',
        badgeActiveClass: 'bg-white/20 text-white',
        badgeInactiveClass: 'bg-slate-800 text-slate-400'
      },
      {
        tipo: 'Personal',
        id: 'pill-portafolio-tipo-personal',
        badgeId: 'badge-portafolio-tipo-personal',
        activeClass: 'bg-sky-600/90 text-white shadow-md shadow-sky-500/25 border-sky-400',
        badgeActiveClass: 'bg-white/20 text-white',
        badgeInactiveClass: 'bg-slate-800 text-slate-400'
      },
      {
        tipo: 'Profesional',
        id: 'pill-portafolio-tipo-profesional',
        badgeId: 'badge-portafolio-tipo-profesional',
        activeClass: 'bg-violet-600/90 text-white shadow-md shadow-violet-500/25 border-violet-400',
        badgeActiveClass: 'bg-white/20 text-white',
        badgeInactiveClass: 'bg-slate-800 text-slate-400'
      },
      {
        tipo: 'Inversiones',
        id: 'pill-portafolio-tipo-inversiones',
        badgeId: 'badge-portafolio-tipo-inversiones',
        activeClass: 'bg-emerald-600/90 text-white shadow-md shadow-emerald-500/25 border-emerald-400',
        badgeActiveClass: 'bg-white/20 text-white',
        badgeInactiveClass: 'bg-slate-800 text-slate-400'
      },
      {
        tipo: 'Social',
        id: 'pill-portafolio-tipo-social',
        badgeId: 'badge-portafolio-tipo-social',
        activeClass: 'bg-amber-600/90 text-white shadow-md shadow-amber-500/25 border-amber-400',
        badgeActiveClass: 'bg-white/20 text-white',
        badgeInactiveClass: 'bg-slate-800 text-slate-400'
      }
    ];

    var baseClass = 'pill-portafolio-tipo px-3 py-1.5 rounded-xl text-xs font-bold transition-all duration-200 flex items-center gap-2 cursor-pointer active:scale-95 border ';
    var inactiveClass = 'bg-slate-900/60 dark:bg-slate-900/80 border-slate-700/60 text-slate-300 hover:border-slate-500 hover:text-white';

    config.forEach(function (item) {
      var el = document.getElementById(item.id);
      var badge = document.getElementById(item.badgeId);
      var esActivo = (item.tipo === (tipoActivo || ''));

      if (el) {
        el.className = baseClass + (esActivo ? item.activeClass : inactiveClass);
      }
      if (badge) {
        badge.className = 'text-[10px] font-mono tabular-nums font-bold px-1.5 py-0.2 rounded-full ' + (esActivo ? item.badgeActiveClass : item.badgeInactiveClass);
      }
    });
  }

  function actualizarContadoresPildorasPortafolio() {
    var proys = (state && Array.isArray(state.proyectos)) ? state.proyectos : [];
    var counts = {
      todos: 0,
      personal: 0,
      profesional: 0,
      inversiones: 0,
      social: 0
    };

    proys.forEach(function (p) {
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(p)) return;
      counts.todos++;
      var t = String(p.Tipo_Iniciativa || '').trim();
      if (t === 'Personal') counts.personal++;
      else if (t === 'Profesional') counts.profesional++;
      else if (t === 'Inversiones') counts.inversiones++;
      else if (t === 'Social') counts.social++;
    });

    var bTodos = document.getElementById('badge-portafolio-tipo-todos');
    if (bTodos) bTodos.textContent = counts.todos;
    var bPersonal = document.getElementById('badge-portafolio-tipo-personal');
    if (bPersonal) bPersonal.textContent = counts.personal;
    var bProfesional = document.getElementById('badge-portafolio-tipo-profesional');
    if (bProfesional) bProfesional.textContent = counts.profesional;
    var bInversiones = document.getElementById('badge-portafolio-tipo-inversiones');
    if (bInversiones) bInversiones.textContent = counts.inversiones;
    var bSocial = document.getElementById('badge-portafolio-tipo-social');
    if (bSocial) bSocial.textContent = counts.social;
  }

  // Exportación Universal a window para compatibilidad estricta
  window.cambiarVistaPortafolio = cambiarVistaPortafolio;
  window.renderGridProyectos = renderGridProyectos;
  window.renderPortafolio = renderGridProyectos;
  window.renderPortafolioProyectos = renderPortafolioProyectos;
  window.renderTablaPortafolio = renderTablaPortafolio;
  window.renderTarjetasPortafolio = renderTarjetasPortafolio;
  window.sincronizarVistaPortafolio = sincronizarVistaPortafolio;
  window.obtenerProyectosFiltradosPortafolio = obtenerProyectosFiltradosPortafolio;
  window.filtrarPortafolioPorSalud = filtrarPortafolioPorSalud;
  window.filtrarPortafolioPorEstado = filtrarPortafolioPorEstado;
  window.limpiarFiltrosPortafolio = limpiarFiltrosPortafolio;
  window.limpiarBusquedaPortafolio = limpiarBusquedaPortafolio;
  window.filtrarPortafolioPorTipo = filtrarPortafolioPorTipo;
  window.toggleFlyoutCartera = toggleFlyoutCartera;
  window.toggleDropdownPortafolio = toggleDropdownPortafolio;
  window.seleccionarFiltroEstadoPortafolio = seleccionarFiltroEstadoPortafolio;
  window.seleccionarFiltroSaludPortafolio = seleccionarFiltroSaludPortafolio;
  window.seleccionarFiltroOrdenPortafolio = seleccionarFiltroOrdenPortafolio;

  function toggleFlyoutCartera() {
    var strip = document.getElementById('flyout-cartera-strip');
    if (strip) {
      var estaAbierto = strip.classList.contains('cartera-flyout-open');
      if (estaAbierto) {
        strip.classList.remove('cartera-flyout-open', 'opacity-100', 'translate-x-0', 'pointer-events-auto');
      } else {
        strip.classList.add('cartera-flyout-open', 'opacity-100', 'translate-x-0', 'pointer-events-auto');
      }
    }
  }

  function toggleDropdownPortafolio(tipo) {
    var tipos = ['estado', 'salud', 'orden'];
    tipos.forEach(function (t) {
      var menu = document.getElementById('menu-dropdown-' + t);
      var btn = document.getElementById('btn-dropdown-' + t);
      if (t === tipo) {
        if (menu) {
          var abierto = !menu.classList.contains('hidden');
          if (abierto) {
            menu.classList.add('hidden');
            if (btn) btn.classList.remove('border-indigo-500', 'text-white');
          } else {
            menu.classList.remove('hidden');
            if (btn) btn.classList.add('border-indigo-500', 'text-white');
          }
        }
      } else if (menu) {
        menu.classList.add('hidden');
        if (btn) btn.classList.remove('border-indigo-500', 'text-white');
      }
    });
  }

  function seleccionarFiltroEstadoPortafolio(valor, etiqueta) {
    var inEstado = document.getElementById('grid-filter-estado');
    if (inEstado) inEstado.value = valor;
    var lbl = document.getElementById('lbl-dropdown-estado');
    if (lbl) lbl.textContent = etiqueta;
    var menu = document.getElementById('menu-dropdown-estado');
    if (menu) menu.classList.add('hidden');
    renderGridProyectos();
  }

  function seleccionarFiltroSaludPortafolio(valor, etiqueta) {
    var inSalud = document.getElementById('grid-filter-salud');
    if (inSalud) inSalud.value = valor;
    var lbl = document.getElementById('lbl-dropdown-salud');
    if (lbl) lbl.textContent = etiqueta;
    var led = document.getElementById('led-salud-trigger');
    if (led) {
      if (valor === 'En Rango') led.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block shrink-0';
      else if (valor === 'En Riesgo') led.className = 'w-2 h-2 rounded-full bg-amber-500 inline-block shrink-0';
      else if (valor === 'Bloqueado') led.className = 'w-2 h-2 rounded-full bg-rose-500 inline-block shrink-0';
      else led.className = 'w-2 h-2 rounded-full bg-slate-400 inline-block shrink-0';
    }
    var menu = document.getElementById('menu-dropdown-salud');
    if (menu) menu.classList.add('hidden');
    renderGridProyectos();
  }

  function seleccionarFiltroOrdenPortafolio(valor, etiqueta) {
    var inOrden = document.getElementById('grid-filter-orden');
    if (inOrden) inOrden.value = valor;
    var lbl = document.getElementById('lbl-dropdown-orden');
    if (lbl) lbl.textContent = etiqueta;
    var menu = document.getElementById('menu-dropdown-orden');
    if (menu) menu.classList.add('hidden');
    renderGridProyectos();
  }

  // Listener para cerrar dropdowns al hacer clic fuera
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.custom-dropdown-portafolio')) {
      ['estado', 'salud', 'orden'].forEach(function(t) {
        var m = document.getElementById('menu-dropdown-' + t);
        if (m) m.classList.add('hidden');
        var b = document.getElementById('btn-dropdown-' + t);
        if (b) b.classList.remove('border-indigo-500', 'text-white');
      });
    }
  });

  window.actualizarEstilosPildorasPortafolio = actualizarEstilosPildorasPortafolio;
  window.actualizarContadoresPildorasPortafolio = actualizarContadoresPildorasPortafolio;
</script>
