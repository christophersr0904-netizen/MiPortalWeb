  // ============================================================================
  // SECCIÓN 0: ESCANEO Y EXTRACCIÓN OCR ASISTIDO POR IA (GEMINI)
  // ============================================================================
  function escanearComprobanteIA(event) {
    var file = event.target.files[0];
    if (!file) return;

    var btn = document.getElementById('btn-escanear-ia');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Extrayendo...</span>';
    }

    var reader = new FileReader();
    reader.onload = function () {
      var dataBase64 = reader.result.split(',')[1];
      var tipoMime = file.type || 'image/jpeg';
      var ctx = [];
      callBackend('parsearComprobante', { base64Data: dataBase64, mimeType: tipoMime, contexto: ctx }, function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<svg class="portal-icon-sm inline mr-1" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Subir Archivo';
        }
        event.target.value = '';

        if (res && res.success && res.data) {
          var d = res.data;
          if (d.descripcionGasto) document.getElementById('gasto-descripcion').value = d.descripcionGasto;
          if (d.montoOriginal) document.getElementById('gasto-monto').value = d.montoOriginal;
          if (d.monedaOriginal) document.getElementById('gasto-moneda').value = d.monedaOriginal;
          if (d.tipoCambio) document.getElementById('gasto-tc').value = d.tipoCambio;
          if (d.fechaGasto) document.getElementById('gasto-fecha').value = d.fechaGasto;

          var selProy = document.getElementById('selector-idProyecto-gasto');
          if (d.idProyectoInferido && selProy && state.proyectos && state.proyectos.some(function (p) { return p.ID_Proyecto === d.idProyectoInferido; })) {
            selProy.value = d.idProyectoInferido;
            if (typeof filtrarHitosYTareasGastoModal === 'function') filtrarHitosYTareasGastoModal(selProy.value);
          }
          var selHito = document.getElementById('selector-idHito-gasto');
          if (selHito && d.idHitoInferido) {
            selHito.value = d.idHitoInferido;
            if (typeof filtrarTareasPorHitoGastoModal === 'function') filtrarTareasPorHitoGastoModal(selHito.value);
          }

          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'success',
              title: '¡Comprobante Procesado!',
              text: 'Datos extraídos con éxito mediante Gemini IA.',
              confirmButtonColor: '#059669'
            });
          }
        } else {
          var errorMsg = (res && (res.error || res.message)) || 'No se pudieron extraer datos del comprobante.';
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'error',
              title: 'Error al Procesar Comprobante',
              text: errorMsg,
              confirmButtonColor: '#ef4444'
            });
          }
        }
      }, function (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<svg class="portal-icon-sm inline mr-1" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Subir Archivo';
        }
        event.target.value = '';
        var netErrorMsg = (err && (err.message || err)) || 'Error de red o conexión al procesar el comprobante.';
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'Error de Conexión',
            text: netErrorMsg,
            confirmButtonColor: '#ef4444'
          });
        }
      });
    };
    reader.readAsDataURL(file);
  }

  // ============================================================================
  // SECCIÓN 2: TIPO DE CAMBIO OFICIAL Y MONEDAS

  window.consultarTipoCambioActual = function (forzar) {
    var icon = document.getElementById('icon-refresh-tc');
    if (icon) icon.classList.add('animate-spin');

    callBackend('obtenertipocambio', {}, function (res) {
      if (icon) icon.classList.remove('animate-spin');
      var tcData = (res && res.data) ? res.data : (res && res.tipoCambio ? res.tipoCambio : null);
      if (res && res.success && tcData) {
        var tcUsd = parseFloat(tcData.usd || tcData.venta || tcData.precioVenta || tcData) || 3.760;
        var tcEur = parseFloat(tcData.eur || (tcUsd * 1.09)) || 4.120;
        state.tipoCambioActual = tcUsd;
        state.tipoCambioOficial = {
          usd: tcUsd,
          eur: tcEur,
          compra: parseFloat(tcData.compra) || (tcUsd - 0.03),
          venta: tcUsd,
          origen: tcData.origen || 'SUNAT/SBS Oficial',
          fecha: tcData.fecha || ''
        };

        var btnLbl = document.getElementById('btn-label-tc');
        if (btnLbl) btnLbl.textContent = tcUsd.toFixed(3);

        var kpiTc = document.getElementById('kpi-fin-tc-val');
        if (kpiTc) kpiTc.textContent = tcUsd.toFixed(3);

        var gMoneda = document.getElementById('gasto-moneda');
        if (gMoneda) alCambiarMonedaModal('gasto', gMoneda.value);

        var ingMoneda = document.getElementById('ingreso-moneda');
        if (ingMoneda) alCambiarMonedaModal('ingreso', ingMoneda.value);

        if (forzar) {
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: 'Tipo de Cambio SUNAT / SBS Actualizado',
              html: '<div class="text-xs">USD: <strong>S/ ' + tcUsd.toFixed(3) + '</strong> | EUR: <strong>S/ ' + tcEur.toFixed(3) + '</strong></div>',
              showConfirmButton: false,
              timer: 3000
            });
          }
          if (typeof renderTableroFinanciero === 'function') renderTableroFinanciero();
        }
      }
    }, function () {
      if (icon) icon.classList.remove('animate-spin');

  window.alCambiarMonedaModal = function (tipo, moneda) {
    var inputTc = document.getElementById(tipo === 'gasto' ? 'gasto-tc' : 'ingreso-tc');
    if (!inputTc) return;
    moneda = (moneda || 'PEN').toUpperCase();
    var tcOficial = state.tipoCambioOficial || { usd: 3.760, eur: 4.120 };

    if (moneda === 'PEN') {
      inputTc.value = '1.000';
    } else if (moneda === 'USD') {
      inputTc.value = (tcOficial.usd || 3.760).toFixed(3);
    } else if (moneda === 'EUR') {
      inputTc.value = (tcOficial.eur || 4.120).toFixed(3);
    } else {
      inputTc.value = (tcOficial.usd || 3.760).toFixed(3);
    }
  };

  // ============================================================================
  // SECCIÓN 3: EVALUACIÓN TEMPORAL NORMALIZADA (PERIODOS Y HORIZONTES)
  // ============================================================================
  window.pertinecePeriodoFinanzas = function (fechaStr, periodo) {
    if (!periodo || periodo === 'TODOS' || periodo === 'todos' || periodo === 'ALL' || periodo === 'HISTORICO') {
      return true;
    }
    if (!fechaStr) return false;

    var clean = String(fechaStr).split('T')[0].split(' ')[0].trim();
    var parts = clean.split('-');
    if (parts.length < 3) return true;

    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10) - 1;
    var d = parseInt(parts[2], 10);
    if (isNaN(y) || isNaN(m)) return true;

    var now = new Date();
    var anioHoy = now.getFullYear();
    var mesHoy = now.getMonth();
    var diaHoy = now.getDate();

    if (periodo === 'MES_ACTUAL' || periodo === 'ESTE_MES') {
      return y === anioHoy && m === mesHoy;
    } else if (periodo === 'MES_ANTERIOR') {
      var mesAnt = new Date(anioHoy, mesHoy - 1, 1);
      return y === mesAnt.getFullYear() && m === mesAnt.getMonth();
    } else if (periodo === 'ULTIMOS_3_MESES') {
      var itemDate = new Date(y, m, d);
      var inicio3Meses = new Date(anioHoy, mesHoy - 2, 1);
      var finMesHoy = new Date(anioHoy, mesHoy + 1, 0, 23, 59, 59);
      return itemDate >= inicio3Meses && itemDate <= finMesHoy;
    } else if (periodo === 'ANIO_ACTUAL') {
      return y === anioHoy;
    } else if (periodo === 'ESTA_SEMANA') {
      var targetDate = new Date(y, m, d);
      var hoyDate = new Date(anioHoy, mesHoy, diaHoy);
      var diffDays = Math.round((targetDate - hoyDate) / (1000 * 60 * 60 * 24));
      return diffDays >= -3 && diffDays <= 7;
    } else if (periodo === 'PROXIMOS_30') {
      var targetD = new Date(y, m, d);
      var hoyD = new Date(anioHoy, mesHoy, diaHoy);
      var diff = Math.round((targetD - hoyD) / (1000 * 60 * 60 * 24));
      return diff >= 0 && diff <= 30;
    }
    return true;
  };

  // ============================================================================
  // SECCIÓN 4: CÁLCULO DE KPIS DE IMPACTO DECISIONAL (FINANZAS PERSONALES REALES)
  // ============================================================================
  window.calcularMetricasSaludFinanciera = function () {
    var gastos = (window.state && Array.isArray(state.gastos)) ? state.gastos : [];
    var ingresos = (window.state && Array.isArray(state.ingresos)) ? state.ingresos : [];
    var cuotas = (window.state && Array.isArray(state.cuotas)) ? state.cuotas : [];
    var proyectos = (window.state && Array.isArray(state.proyectos)) ? state.proyectos : [];

    var filtroPeriodo = state.filtroMesFinanzas || 'MES_ACTUAL';
    var filtroSegmento = state.filtroSegmentoFinanzas || 'TODOS';
    var tc = state.tipoCambioActual || 3.760;

    // 1. Saldo en Mano Real Hoy (Ingresos Reales Cobrados - Gastos Reales Pagados)
    var totalIngresosRealesPEN = 0;
    var totalGastosRealesPEN = 0;
    var saldoLiquidoPEN = 0;
    var saldoLiquidoUSD = 0;

    // 2. Proyecciones y Compromisos del Mes
    var compromisosCuotasPendientesPEN = 0;
    var compromisosOtrosPendientesPEN = 0;
    var ingresosPendientesPEN = 0;
    var countPendientesMes = 0;

    // 3. Gastos Hormiga del Mes (Compras menores no esenciales <= S/ 40 o cat 'Otros')
    var totalGastosHormigaMes = 0;

    // 4. Radar de Categorías del Periodo
    var consumoPorCategoria = {};

    // 5. Lista de Próximos Vencimientos (Próximos 15 Días)
    var proximosVencimientos = [];
    var hoy = new Date();
    var hoyDateOnly = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());

    // Procesar INGRESOS
    ingresos.forEach(function (ing) {
      var idProyIng = String(ing.ID_Proyecto_Asociado || ing.idProyectoAsociado || ing.ID_Proyecto || '').trim();
      var esProyIng = idProyIng && idProyIng.toUpperCase() !== 'PERSONAL';
      if (filtroSegmento === 'PROYECTOS' && !esProyIng) return;
      if (filtroSegmento === 'PERSONAL' && esProyIng) return;

      var f = ing.Fecha_Ingreso || ing.fechaIngreso || ing.fecha || '';
      var mOrig = parseFloat(ing.Monto_Original || ing.montoOriginal || ing.monto || 0);
      var mon = String(ing.Moneda_Original || ing.monedaOriginal || 'PEN').toUpperCase();
      var itemTc = parseFloat(ing.Tipo_Cambio || ing.tipoCambio || tc);
      var mPEN = parseFloat(ing.Monto_PEN || ing.montoPEN || (mon === 'USD' ? mOrig * itemTc : mOrig));

      var isReal = ing.Conciliado === true || (ing.Estado_Cobro || ing.Estado_Pago || '').toLowerCase() === 'cobrado' || (ing.Estado || '').toUpperCase() === 'EJECUTADO' || (ing.Estado || '').toUpperCase() === 'CONCILIADO';
      var isProgramado = !isReal;

      if (isReal) {
        if (mon === 'USD') saldoLiquidoUSD += mOrig;
        else saldoLiquidoPEN += mPEN;

        if (window.pertinecePeriodoFinanzas(f, filtroPeriodo)) {
          totalIngresosRealesPEN += mPEN;
        }
      } else {
        if (window.pertinecePeriodoFinanzas(f, filtroPeriodo)) {
          ingresosPendientesPEN += mPEN;
        }
        // Vencimiento en próximos 15 días
        if (f) {
          var p = f.split('T')[0].split('-');
          if (p.length === 3) {
            var fObj = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
            var diffDays = Math.ceil((fObj - hoyDateOnly) / (1000 * 60 * 60 * 24));
            if (diffDays >= -3 && diffDays <= 15) {
              proximosVencimientos.push({
                tipo: 'INGRESO',
                id: ing.ID_Ingreso || ing.id || '',
                concepto: ing.Descripcion_Ingreso || ing.Descripcion || 'Ingreso programado',
                montoPEN: mPEN,
                fecha: f,
                diasRestantes: diffDays,
                entidad: ing.Cuenta_Destino || 'Banco',
                itemRef: ing
              });
            }
          }
        }
      }
    });

    // Procesar GASTOS con filtrado determinista por Proyecto vs Personal
    gastos.forEach(function (g) {
      var idProyG = String(g.ID_Proyecto || g.idProyecto || '').trim().toUpperCase();
      var idTarG = String(g.ID_Tarea || g.idTarea || g.ID_Entidad_Vinculada || g.idEntidadVinculada || '').trim().toUpperCase();
      var idHitG = String(g.ID_Hito || g.idHito || '').trim().toUpperCase();
      var rawTg = String(g.tipoGasto || g.Tipo_Gasto || g.Clasificacion_Origen || g.clasificacionOrigen || '').trim().toLowerCase();

      var esProyecto = (idProyG && idProyG !== 'PERSONAL' && idProyG !== 'VIDA') ||
                       (idTarG && idTarG.startsWith('TAR-')) ||
                       (idHitG && idHitG !== 'PERSONAL' && idHitG !== '') ||
                       rawTg.includes('proy') || rawTg.includes('tarea');
      var esPersonal = !esProyecto;

      if (filtroSegmento === 'PROYECTOS' && !esProyecto) return;
      if (filtroSegmento === 'PERSONAL' && !esPersonal) return;

      var f = g.Fecha_Gasto || g.fechaGasto || g.fecha || '';
      var mOrig = parseFloat(g.Monto_Original || g.montoOriginal || g.monto || 0);
      var mon = String(g.Moneda_Original || g.monedaOriginal || 'PEN').toUpperCase();
      var itemTc = parseFloat(g.Tipo_Cambio || g.tipoCambio || tc);
      var mPEN = parseFloat(g.Monto_PEN || g.montoPEN || (mon === 'USD' ? mOrig * itemTc : mOrig));
      var cat = g.Categoria_Gasto || g.categoriaGasto || g.categoria || 'Otros';
      var idCuota = g.ID_Cuota || g.idCuota || '';

      var isReal = g.Conciliado === true || (g.Estado_Pago || '').toLowerCase() === 'pagado' || (g.Estado || '').toUpperCase() === 'EJECUTADO' || (g.Estado || '').toUpperCase() === 'CONCILIADO';
      var isProgramado = !isReal;

      if (isReal) {
        if (mon === 'USD') saldoLiquidoUSD -= mOrig;
        else saldoLiquidoPEN -= mPEN;

        if (window.pertinecePeriodoFinanzas(f, filtroPeriodo)) {
          totalGastosRealesPEN += mPEN;
          consumoPorCategoria[cat] = (consumoPorCategoria[cat] || 0) + mPEN;

          // Evaluación de Gastos Hormiga:
          // Compras <= S/ 40.00 o en categoría Otros/Antojos sin proyecto formal
          if (esPersonal && (mPEN <= 40 || cat === 'Otros')) {
            totalGastosHormigaMes += mPEN;
          }
        }
      } else {
        if (window.pertinecePeriodoFinanzas(f, filtroPeriodo)) {
          countPendientesMes++;
          if (idCuota || cat === 'Cuota_Credito') {
            compromisosCuotasPendientesPEN += mPEN;
          } else {
            compromisosOtrosPendientesPEN += mPEN;
          }
        }

        // Vencimiento en próximos 15 días
        if (f) {
          var pG = f.split('T')[0].split('-');
          if (pG.length === 3) {
            var fObjG = new Date(parseInt(pG[0]), parseInt(pG[1]) - 1, parseInt(pG[2]));
            var diffDaysG = Math.ceil((fObjG - hoyDateOnly) / (1000 * 60 * 60 * 24));
            if (diffDaysG >= -5 && diffDaysG <= 15) {
              proximosVencimientos.push({
                tipo: 'GASTO',
                id: g.ID_Gasto || g.id || '',
                concepto: g.Descripcion_Gasto || g.descripcionGasto || 'Gasto programado',
                montoPEN: mPEN,
                fecha: f,
                diasRestantes: diffDaysG,
                entidad: idCuota ? 'Crédito Bancario' : (g.Metodo_Pago || 'Proveedor'),
                idCuota: idCuota,
                itemRef: g
              });
            }
          }
        }
      }
    });

    // Compromisos totales pendientes
    var totalCompromisosPendientesPEN = compromisosCuotasPendientesPEN + compromisosOtrosPendientesPEN;

    // Saldo en mano equivalente consolidado
    var saldoEnManoTotalPEN = saldoLiquidoPEN + (saldoLiquidoUSD * tc);

    // Saldo Proyectado a fin de mes = Saldo en Mano + Ingresos pendientes - Compromisos pendientes
    var saldoProyectadoFinMes = saldoEnManoTotalPEN + ingresosPendientesPEN - totalCompromisosPendientesPEN;

    // Capacidad de Ahorro / Superávit del Periodo = Ingresos Totales - Gastos Totales (Reales + Programados)
    var ingresosTotalesPeriodo = totalIngresosRealesPEN + ingresosPendientesPEN;
    var gastosTotalesPeriodo = totalGastosRealesPEN + totalCompromisosPendientesPEN;
    var superavitPeriodo = ingresosTotalesPeriodo - gastosTotalesPeriodo;
    var tasaAhorroPct = ingresosTotalesPeriodo > 0 ? Math.max(0, (superavitPeriodo / ingresosTotalesPeriodo) * 100) : 0;

    // Nivel de Endeudamiento en Cuotas Bancarias (Créditos personales) - Ciclo único O(N)
    var planesActivos = [];
    var compromisoMensualCuotas = 0;
    var saldoPendienteTotalCuotas = 0;
    var capitalAmortizadoTotalCuotas = 0;
    if (filtroSegmento !== 'PROYECTOS') {
      cuotas.forEach(function (p) {
        var st = (p.Estado || 'ACTIVO').toUpperCase();
        if (st === 'ACTIVO' || st === 'ATRASADO') {
          planesActivos.push(p);
          compromisoMensualCuotas += parseFloat(p.Monto_Cuota || p.montoCuota || 0);
          saldoPendienteTotalCuotas += parseFloat(p.Saldo_Pendiente || p.saldoPendiente || 0);
          capitalAmortizadoTotalCuotas += parseFloat(p.Monto_Pagado || p.montoPagado || 0);
        }
      });
    }

    // Ingreso mensual de referencia (ingresos del mes o promedio histórico)
    var ingresoReferencia = ingresosTotalesPeriodo > 0 ? ingresosTotalesPeriodo : (calcularIngresoPromedioMensual() || 3500);
    var ratioEndeudamientoCuotas = ingresoReferencia > 0 ? ((compromisoMensualCuotas / ingresoReferencia) * 100) : 0;

    // Ordenar Próximos Vencimientos por cercanía
    proximosVencimientos.sort(function (a, b) {
      return a.diasRestantes - b.diasRestantes;
    });

    // Control Presupuestario por Proyectos (Burn Rate)
    var presupConsolidado = 0;
    var costoRealConsolidado = 0;
    var proyectosAlerta80 = [];
    proyectos.forEach(function (p) {
      var est = String(p.Estado_Proyecto || '');
      if (est.indexOf('06_Cerrado') === -1 && est.indexOf('05_Cancelado') === -1) {
        var pTope = parseFloat(p.Presupuesto_Tope || 0);
        var cReal = parseFloat(p.Costo_Real_Actual || p.Costo_Real || 0);
        presupConsolidado += pTope;
        costoRealConsolidado += cReal;
        if (pTope > 0 && (cReal / pTope) >= 0.8) {
          proyectosAlerta80.push({ id: p.ID_Proyecto, nombre: p.Nombre_Proyecto, ratio: (cReal / pTope) * 100 });
        }
      }
    });
    var burnRateGlobal = presupConsolidado > 0 ? (costoRealConsolidado / presupConsolidado) * 100 : 0;

    return {
      saldoEnManoTotalPEN: saldoEnManoTotalPEN,
      saldoLiquidoPEN: saldoLiquidoPEN,
      saldoLiquidoUSD: saldoLiquidoUSD,
      totalIngresosRealesPEN: totalIngresosRealesPEN,
      totalGastosRealesPEN: totalGastosRealesPEN,
      saldoProyectadoFinMes: saldoProyectadoFinMes,
      totalCompromisosPendientesPEN: totalCompromisosPendientesPEN,
      compromisosCuotasPendientesPEN: compromisosCuotasPendientesPEN,
      compromisosOtrosPendientesPEN: compromisosOtrosPendientesPEN,
      countPendientesMes: countPendientesMes,
      totalGastosHormigaMes: totalGastosHormigaMes,
      superavitPeriodo: superavitPeriodo,
      tasaAhorroPct: tasaAhorroPct,
      planesActivos: planesActivos,
      compromisoMensualCuotas: compromisoMensualCuotas,
      saldoPendienteTotalCuotas: saldoPendienteTotalCuotas,
      capitalAmortizadoTotalCuotas: capitalAmortizadoTotalCuotas,
      ratioEndeudamientoCuotas: ratioEndeudamientoCuotas,
      consumoPorCategoria: consumoPorCategoria,
      proximosVencimientos: proximosVencimientos,
      burnRateGlobal: burnRateGlobal,
      presupConsolidado: presupConsolidado,
      costoRealConsolidado: costoRealConsolidado,
      proyectosAlerta80: proyectosAlerta80,
      tipoCambioActual: tc
    };
  };

  // ============================================================================
  // SECCIÓN 5: NAVEGACIÓN ENTRE LAS 4 PESTAÑAS ESTRUCTURALES
  // ============================================================================
  window.cambiarTabFinanzas = function (tabId) {
    // Normalizar llamadas de compatibilidad
    if (tabId === 'ingresos') {
      tabId = 'transacciones';
      state.filtroTrxTipo = 'INGRESO';
    } else if (tabId === 'gastos') {
      tabId = 'transacciones';
      state.filtroTrxTipo = 'GASTO';
    } else if (tabId === 'metricas') {
      tabId = 'general';
    }

    state.tabFinanzasActiva = tabId;

    try {
      localStorage.setItem('pmo_finanzas_tab_activa', tabId);
    } catch (eStorage) {
      console.warn('[cambiarTabFinanzas] Error guardando en localStorage:', eStorage);
    }

    // Actualizar botones de pestañas
    document.querySelectorAll('.tab-btn-fin').forEach(function (btn) {
      btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'font-bold', 'shadow-xs');
      btn.classList.add('text-slate-600', 'dark:text-slate-400', 'font-semibold');
    });

    var activeBtn = document.getElementById('tab-btn-fin-' + tabId);
    if (activeBtn) {
      activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'font-bold', 'shadow-xs');
      activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400', 'font-semibold');
    }

    // Ocultar todas las vistas y mostrar la activa
    document.querySelectorAll('.tab-fin-view').forEach(function (view) {
      view.classList.add('hidden');
    });

    var activeView = document.getElementById('vista-fin-tab-' + tabId);
    if (activeView) {
      activeView.classList.remove('hidden');
    }

    // Si entramos a transacciones, sincronizar estado visual de píldoras
    if (tabId === 'transacciones') {
      sincronizarPildorasTransacciones();
    }

    renderTableroFinanciero();
  };

  // ============================================================================
  // SECCIÓN 6: FILTROS ERGONÓMICOS DE LA PESTAÑA TRANSACCIONES & SEGMENTACIÓN
  // ============================================================================
  window.filtrarSegmentoFinanzas = function (segmento) {
    state.filtroSegmentoFinanzas = (segmento || 'TODOS').toUpperCase();
    try {
      localStorage.setItem('pmo_finanzas_segmento', state.filtroSegmentoFinanzas);
    } catch (eStorage) {
      console.warn('[filtrarSegmentoFinanzas] Error guardando en localStorage:', eStorage);
    }
    sincronizarBarrasSegmentacionFinanzas();
    renderTableroFinanciero();
  };
  window.setFiltroSegmentoFinanzas = window.filtrarSegmentoFinanzas;

  // Restaurar y sincronizar filtros de Finanzas guardados en localStorage
  function sincronizarFiltrosFinanzasDesdeStorage() {
    try {
      var tabGuardada = localStorage.getItem('pmo_finanzas_tab_activa');
      if (tabGuardada && ['general', 'transacciones', 'cuotas', 'presupuesto'].indexOf(tabGuardada) !== -1) {
        state.tabFinanzasActiva = tabGuardada;
        document.querySelectorAll('.tab-btn-fin').forEach(function (btn) {
          btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'font-bold', 'shadow-xs');
          btn.classList.add('text-slate-600', 'dark:text-slate-400', 'font-semibold');
        });
        var activeBtn = document.getElementById('tab-btn-fin-' + tabGuardada);
        if (activeBtn) {
          activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'font-bold', 'shadow-xs');
          activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400', 'font-semibold');
        }
        document.querySelectorAll('.tab-fin-view').forEach(function (view) {
          view.classList.add('hidden');
        });
        var activeView = document.getElementById('vista-fin-tab-' + tabGuardada);
        if (activeView) {
          activeView.classList.remove('hidden');
        }
      }

      var segGuardado = localStorage.getItem('pmo_finanzas_segmento');
      if (segGuardado && ['TODOS', 'PROYECTOS', 'PERSONAL'].indexOf(segGuardado.toUpperCase()) !== -1) {
        state.filtroSegmentoFinanzas = segGuardado.toUpperCase();
        if (typeof sincronizarBarrasSegmentacionFinanzas === 'function') {
          sincronizarBarrasSegmentacionFinanzas();
        }
      }

      var periodoGuardado = localStorage.getItem('pmo_finanzas_periodo');
      if (periodoGuardado && ['MES_ACTUAL', 'MES_ANTERIOR', 'ULTIMOS_3_MESES', 'ANIO_ACTUAL', 'TODOS'].indexOf(periodoGuardado) !== -1) {
        state.filtroMesFinanzas = periodoGuardado;
        state.filtroTrxTiempo = periodoGuardado;
        var selPeriodo = document.getElementById('filtro-mes-finanzas');
        if (selPeriodo) selPeriodo.value = periodoGuardado;
      }
    } catch (eStorage) {
      console.warn('[sincronizarFiltrosFinanzasDesdeStorage] Error leyendo de localStorage:', eStorage);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sincronizarFiltrosFinanzasDesdeStorage);
  } else {
    sincronizarFiltrosFinanzasDesdeStorage();
  }

  window.sincronizarBarrasSegmentacionFinanzas = function () {
    var seg = (state.filtroSegmentoFinanzas || 'TODOS').toUpperCase();

    // 1. Barra de Navegación Maestra (Top Header)
    ['todos', 'proyectos', 'personal'].forEach(function (s) {
      var btn = document.getElementById('btn-seg-fin-' + s);
      if (!btn) return;
      var match = (s === 'todos' && seg === 'TODOS') ||
        (s === 'proyectos' && seg === 'PROYECTOS') ||
        (s === 'personal' && seg === 'PERSONAL');

      btn.className = match
        ? 'btn-seg-fin px-3 py-1 rounded-xl text-xs font-bold transition-all shadow-xs bg-white dark:bg-slate-800 text-slate-900 dark:text-white flex items-center gap-1.5'
        : 'btn-seg-fin px-3 py-1 rounded-xl text-xs font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
    });

    // 2. Píldoras de Transacciones (Tab Transacciones)
    ['todos', 'proyectos', 'personal'].forEach(function (s) {
      var pill = document.getElementById('pill-seg-' + s);
      if (!pill) return;
      var match = (s === 'todos' && seg === 'TODOS') ||
        (s === 'proyectos' && seg === 'PROYECTOS') ||
        (s === 'personal' && seg === 'PERSONAL');

      pill.className = match
        ? 'pill-trx-seg px-2.5 py-1 rounded-lg font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs'
        : 'pill-trx-seg px-2.5 py-1 rounded-lg font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white';
    });
  };

  window.filtrarTransaccionesPorTipo = function (tipo) {
    state.filtroTrxTipo = tipo || 'TODOS';
    sincronizarPildorasTransacciones();
    renderTabTransaccionesUnificada();
  };

  window.filtrarTransaccionesPorEstado = function (estado) {

    sincronizarPildorasTransacciones();
    renderTabTransaccionesUnificada();
  };

  window.filtrarTransaccionesPorTiempo = function (tiempo) {

    sincronizarPildorasTransacciones();
    renderTabTransaccionesUnificada();

  window.limpiarBusquedaTransacciones = function () {

    if (inp) inp.value = '';
    state.filtroTrxTexto = '';

  /**
   * Restablecimiento universal y reactivo de filtros de Finanzas (Atajo 'X')
   */
  window.limpiarFiltrosFinanzas = function () {
    state.filtroSegmentoFinanzas = 'TODOS';
    state.filtroTrxTipo = 'TODOS';
    state.filtroTrxEstado = 'TODOS';
    state.filtroTrxTiempo = 'HISTORICO';
    state.filtroTrxTexto = '';
    state.filtroMesFinanzas = 'TODOS';

    var selMes = document.getElementById('filtro-mes-finanzas');
    if (selMes) selMes.value = 'TODOS';

    var inp = document.getElementById('input-busqueda-transacciones') || document.getElementById('input-busqueda-finanzas');
    if (inp) {
      inp.value = '';
      inp.blur();
    }

    if (typeof sincronizarBarrasSegmentacionFinanzas === 'function') {
      sincronizarBarrasSegmentacionFinanzas();
    }
    if (typeof sincronizarPildorasTransacciones === 'function') {
      sincronizarPildorasTransacciones();
    }
    if (typeof renderTabTransaccionesUnificada === 'function') {
      renderTabTransaccionesUnificada();
    }
    if (typeof renderTableroFinanciero === 'function') {
      renderTableroFinanciero();
    }
  };

  function sincronizarPildorasTransacciones() {
    // Sincronizar segmento
    if (typeof sincronizarBarrasSegmentacionFinanzas === 'function') {
      sincronizarBarrasSegmentacionFinanzas();
    }

    // Tipo
    ['todos', 'ingreso', 'gasto'].forEach(function (t) {
      var btn = document.getElementById('pill-tipo-' + t);
      if (!btn) return;
      var match = (t === 'todos' && state.filtroTrxTipo === 'TODOS') ||
        (t === 'ingreso' && state.filtroTrxTipo === 'INGRESO') ||
        (t === 'gasto' && state.filtroTrxTipo === 'GASTO');
      btn.className = match
        ? 'pill-trx-tipo px-2.5 py-1 rounded-lg font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs'
        : 'pill-trx-tipo px-2.5 py-1 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    });

    // Estado
    ['todos', 'real', 'programado'].forEach(function (e) {
      var btn = document.getElementById('pill-estado-' + e);
      if (!btn) return;
      var match = (e === 'todos' && state.filtroTrxEstado === 'TODOS') ||
        (e === 'real' && state.filtroTrxEstado === 'REAL') ||
        (e === 'programado' && state.filtroTrxEstado === 'PROGRAMADO');
      btn.className = match
        ? 'pill-trx-estado px-2.5 py-1 rounded-lg font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs'
        : 'pill-trx-estado px-2.5 py-1 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    });

    // Tiempo
    var mapTiempo = { 'ESTE_MES': 'mes', 'ESTA_SEMANA': 'semana', 'PROXIMOS_30': '30dias', 'HISTORICO': 'todos' };
    ['mes', 'semana', '30dias', 'todos'].forEach(function (ti) {
      var btn = document.getElementById('pill-tiempo-' + ti);
      if (!btn) return;
      var match = mapTiempo[state.filtroTrxTiempo] === ti;
      btn.className = match
        ? 'pill-trx-tiempo px-2 py-1 rounded-lg font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-2xs'
        : 'pill-trx-tiempo px-2 py-1 rounded-lg font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    });
  }

  // ============================================================================
  // SECCIÓN 7: RENDERIZADOR GENERAL DEL TABLERO FINANCIERO (ORQUESTADOR)
  // ============================================================================
  window.renderTableroFinanciero = function () {
    sincronizarBarrasSegmentacionFinanzas();
    var metricas = calcularMetricasSaludFinanciera();

    // 1. ACTUALIZAR TOP CARDS DEL HERO
    var elSaldoMano = document.getElementById('kpi-saldo-en-mano');
    if (elSaldoMano) elSaldoMano.textContent = 'S/ ' + metricas.saldoEnManoTotalPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elSubIngReal = document.getElementById('kpi-sub-ing-real');
    if (elSubIngReal) elSubIngReal.textContent = 'S/ ' + metricas.totalIngresosRealesPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elSubGasReal = document.getElementById('kpi-sub-gas-real');
    if (elSubGasReal) elSubGasReal.textContent = 'S/ ' + metricas.totalGastosRealesPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elBadgeProy = document.getElementById('badge-proy-status');
    if (elBadgeProy) {
      elBadgeProy.textContent = metricas.saldoProyectadoFinMes >= 0 ? 'Superávit' : 'Déficit';
      elBadgeProy.className = metricas.saldoProyectadoFinMes >= 0
        ? 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-300'
        : 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300';
    }

    var elTotalCompromisos = document.getElementById('kpi-total-compromisos-pendientes');
    if (elTotalCompromisos) elTotalCompromisos.textContent = 'S/ ' + metricas.totalCompromisosPendientesPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elBadgePendientes = document.getElementById('badge-count-pendientes');
    if (elBadgePendientes) elBadgePendientes.textContent = metricas.countPendientesMes + ' Pendientes';

    var elSubCuotasPend = document.getElementById('kpi-sub-cuotas-pend');
    if (elSubCuotasPend) elSubCuotasPend.textContent = 'S/ ' + metricas.compromisosCuotasPendientesPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elSubOtrosPend = document.getElementById('kpi-sub-otros-pend');
    if (elSubOtrosPend) elSubOtrosPend.textContent = 'S/ ' + metricas.compromisosOtrosPendientesPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elBimonPEN = document.getElementById('kpi-fin-bimon-pen');
    if (elBimonPEN) elBimonPEN.textContent = 'S/ ' + metricas.saldoLiquidoPEN.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elBimonUSD = document.getElementById('kpi-fin-bimon-usd');
    if (elBimonUSD) elBimonUSD.textContent = '$ ' + metricas.saldoLiquidoUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    var elTcVal = document.getElementById('kpi-fin-tc-val');
    if (elTcVal) elTcVal.textContent = metricas.tipoCambioActual.toFixed(3);

    // 2. ACTUALIZAR LOS 5 KPIS DE IMPACTO DECISIONAL (BENTO GRID)
    // KPI 1: Semáforo de Liquidez
    var dotSem = document.getElementById('dot-semaforo-liquidez');
    var badgeSem = document.getElementById('badge-semaforo-liquidez');
    var valSem = document.getElementById('val-semaforo-liquidez');
    var descSem = document.getElementById('desc-semaforo-liquidez');
    var barSem = document.getElementById('bar-semaforo-liquidez');

    if (valSem) valSem.textContent = 'S/ ' + metricas.saldoProyectadoFinMes.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    if (metricas.saldoProyectadoFinMes >= 1000) {
      if (dotSem) dotSem.className = 'w-3 h-3 rounded-full bg-emerald-500';
      if (badgeSem) {
        badgeSem.textContent = 'Holgado';
        badgeSem.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300';
      }
      if (descSem) descSem.textContent = 'Tus ingresos cubren con holgura los gastos y cuotas restantes del mes.';
      if (barSem) { barSem.style.width = '85%'; barSem.className = 'bg-emerald-500 h-full rounded-full transition-all duration-500'; }
    } else if (metricas.saldoProyectadoFinMes >= 0) {
      if (dotSem) dotSem.className = 'w-3 h-3 rounded-full bg-amber-500';
      if (badgeSem) {
        badgeSem.textContent = 'Ajustado';
        badgeSem.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300';
      }
      if (descSem) descSem.textContent = 'Margen de maniobra estrecho. Evita consumos hormiga o imprevistos.';

    // KPI 2: Alerta Fuga / Gastos Hormiga

      barAhorro.className = metricas.tasaAhorroPct >= 20 ? 'bg-emerald-500 h-full rounded-full transition-all duration-500' : (metricas.tasaAhorroPct >= 10 ? 'bg-amber-500 h-full rounded-full transition-all duration-500' : 'bg-rose-500 h-full rounded-full transition-all duration-500');
    }
    if (badgeAhorro) {
      if (metricas.tasaAhorroPct >= 20) {
        badgeAhorro.textContent = 'Superávit Saludable';
        badgeAhorro.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300';

        badgeAhorro.textContent = 'Aceptable';
        badgeAhorro.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300';
      } else {
        badgeAhorro.textContent = 'Alerta';
        badgeAhorro.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300';

    // KPI 4: Nivel de Endeudamiento en Cuotas
    var valEndeuda = document.getElementById('val-endeudamiento-cuotas');
    var badgeEndeuda = document.getElementById('badge-endeudamiento-cuotas');
    var valCuotasSub = document.getElementById('val-cuotas-compromiso-sub');

    }
    if (badgeEndeuda) {
      if (metricas.ratioEndeudamientoCuotas > 40) {
        badgeEndeuda.textContent = 'Sobrecarga Bancaria';

      } else {
        badgeEndeuda.textContent = 'Saludable';
        badgeEndeuda.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300';
      }
    }

    // KPI 5: Radar de Categorías Críticas
    renderRadarCategoriasCriticas(metricas.consumoPorCategoria);

    // 3. ACTUALIZAR WIDGET DE PRÓXIMOS VENCIMIENTOS (15 DÍAS)
    renderProximosVencimientos(metricas.proximosVencimientos);

    // 4. DESPACHAR CONTENIDO DE LA PESTAÑA ACTIVA
    var tabActiva = state.tabFinanzasActiva || 'general';
    if (tabActiva === 'transacciones') {
      renderTabTransaccionesUnificada();
    } else if (tabActiva === 'cuotas') {
      renderTabCuotas(metricas);
    } else if (tabActiva === 'presupuesto') {
      renderTabPresupuestos(metricas);
    }
  };

  // ============================================================================
  // SECCIÓN 8: RADAR DE CATEGORÍAS CRÍTICAS Y WIDGET DE VENCIMIENTOS
  // ============================================================================
  function renderRadarCategoriasCriticas(consumos) {
    var cont = document.getElementById('lista-radar-categorias-criticas');
    if (!cont) return;
    cont.innerHTML = '';

    var techos = state.presupuestosCategorias || {};
    var cats = Object.keys(consumos);
    if (cats.length === 0) {
      cont.innerHTML = '<div class="col-span-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800/40 text-xs text-slate-400 italic text-center">Sin consumos registrados en este periodo</div>';
      return;
    }

    // Ordenar categorías por mayor consumo
    cats.sort(function (a, b) {
      return consumos[b] - consumos[a];
    });

    var fragment = document.createDocumentFragment();

    // Mostrar las top 4
    cats.slice(0, 4).forEach(function (cat) {
      var monto = consumos[cat];
      var techo = techos[cat] || (monto * 1.3);
      var pct = techo > 0 ? (monto / techo) * 100 : 0;
      var conf = CATEGORIAS_GASTO_CONFIG[cat] || CATEGORIAS_GASTO_CONFIG['Otros'];

      var colorBar = pct >= 100 ? 'bg-rose-500' : (pct >= 80 ? 'bg-amber-500' : 'bg-emerald-500');
      var colorTxt = pct >= 100 ? 'text-rose-600 dark:text-rose-400 font-bold' : (pct >= 80 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-300');

      var item = document.createElement('div');
      item.className = 'p-2.5 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 flex flex-col justify-between';
      item.innerHTML =
        '<div class="flex items-center justify-between text-xs mb-1">' +
        '  <span class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">' +
        '    <span>' + conf.icon + '</span>' +
        '    <span class="truncate max-w-[120px]">' + cat + '</span>' +
        '  </span>' +
        '  <span class="' + colorTxt + ' font-mono text-[11px]">' + pct.toFixed(0) + '%</span>' +
        '</div>' +
        '<div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden my-1">' +
        '  <div class="' + colorBar + ' h-full rounded-full transition-all duration-500" style="width: ' + Math.min(pct, 100) + '%"></div>' +
        '</div>' +
        '<div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">' +
        '  <span>S/ ' + monto.toFixed(0) + '</span>' +
        '  <span>Tope: S/ ' + techo.toFixed(0) + '</span>' +
        '</div>';
      fragment.appendChild(item);
    });

    cont.appendChild(fragment);
  }

  function renderProximosVencimientos(lista) {
    var cont = document.getElementById('lista-proximos-vencimientos-dashboard');
    if (!cont) return;
    cont.innerHTML = '';

    if (!lista || lista.length === 0) {
      cont.innerHTML = '<div class="text-xs text-slate-400 italic p-4 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl col-span-full">Sin compromisos pendientes de liquidación en los próximos 15 días</div>';
      return;
    }

    var fragment = document.createDocumentFragment();

    lista.slice(0, 6).forEach(function (v) {
      var isIngreso = v.tipo === 'INGRESO';
      var isUrgente = v.diasRestantes <= 3;
      var isVencido = v.diasRestantes < 0;

      var borderClass = isVencido
        ? 'border-rose-300 dark:border-rose-800/80 bg-rose-50/30 dark:bg-rose-950/20'
        : (isUrgente
          ? 'border-amber-300 dark:border-amber-800/80 bg-amber-50/30 dark:bg-amber-950/20'
          : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900');

      var labelDias = isVencido
        ? 'Vencido hace ' + Math.abs(v.diasRestantes) + 'd'
        : (v.diasRestantes === 0 ? 'Vence HOY' : 'En ' + v.diasRestantes + ' días');

      var item = document.createElement('div');
      item.className = 'p-3 rounded-xl border ' + borderClass + ' flex flex-col justify-between shadow-2xs transition-all hover:shadow-xs';
      item.innerHTML =
        '<div class="flex items-start justify-between gap-2 mb-1.5">' +
        '  <span class="text-[9px] font-bold px-2 py-0.5 rounded-md ' + (isIngreso ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300') + '">' + (isIngreso ? 'Ingreso Programado' : (v.idCuota ? 'Cuota Bancaria' : 'Gasto Programado')) + '</span>' +
        '  <span class="text-[10px] font-bold ' + (isVencido || isUrgente ? 'text-rose-600 dark:text-rose-400 font-mono animate-pulse' : 'text-slate-400') + '">' + labelDias + '</span>' +
        '</div>' +
        '<div class="font-bold text-xs text-slate-800 dark:text-slate-100 truncate mb-1" title="' + v.concepto + '">' + v.concepto + '</div>' +
        '<div class="flex items-baseline justify-between pt-1 border-t border-slate-100 dark:border-slate-800">' +
        '  <span class="text-[10px] text-slate-400 truncate max-w-[110px]">' + v.entidad + '</span>' +
        '  <span class="font-black font-mono tabular-nums text-xs ' + (isIngreso ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400') + '">S/ ' + v.montoPEN.toFixed(2) + '</span>' +
        '</div>' +
        '<div class="pt-2 mt-1 flex justify-end">' +
        '  <button type="button" onclick="event.stopPropagation(); abrirModalConciliarTransaccion(' + JSON.stringify(v.itemRef).replace(/"/g, '&quot;') + ')" class="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-50 dark:bg-cyan-950/60 hover:bg-cyan-100 text-cyan-700 dark:text-cyan-300 border border-cyan-200 dark:border-cyan-800/60 transition active:scale-95 flex items-center gap-1"><svg class="portal-icon-sm shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>Conciliar</span></button>' +
        '</div>';
      fragment.appendChild(item);
    });

    cont.appendChild(fragment);
  }

  // ============================================================================
  // SECCIÓN 9: PESTAÑA TRANSACCIONES (COEXISTENCIA REAL VS PROGRAMADO)
  // ============================================================================
  window.renderTabTransaccionesUnificada = function () {
    var cont = document.getElementById('lista-transacciones-unificada');
    var tabBadge = document.getElementById('tab-count-transacciones');
    if (!cont) return;
    cont.innerHTML = '';

    var gastos = (window.state && Array.isArray(state.gastos)) ? state.gastos : [];
    var ingresos = (window.state && Array.isArray(state.ingresos)) ? state.ingresos : [];

    var filtroTipo = state.filtroTrxTipo || 'TODOS';
    var filtroEstado = state.filtroTrxEstado || 'TODOS';
    var filtroTiempo = state.filtroMesFinanzas || state.filtroTrxTiempo || 'MES_ACTUAL';
    var filtroTexto = (state.filtroTrxTexto || '').toLowerCase().trim();

    var coleccionUnificada = [];

    // Recopilar Gastos
    if (filtroTipo === 'TODOS' || filtroTipo === 'GASTO') {
      gastos.forEach(function (g) {
        var f = g.Fecha_Gasto || g.fechaGasto || g.fecha || '';
        var isReal = g.Conciliado === true || (g.Estado_Pago || '').toLowerCase() === 'pagado' || (g.Estado || '').toUpperCase() === 'EJECUTADO';
        var isProgramado = !isReal;
        var idProyG = String(g.ID_Proyecto || g.idProyecto || '').trim().toUpperCase();
        var idTarG = String(g.ID_Tarea || g.idTarea || g.ID_Entidad_Vinculada || g.idEntidadVinculada || '').trim().toUpperCase();
        var idHitG = String(g.ID_Hito || g.idHito || '').trim().toUpperCase();
        var rawTg = String(g.tipoGasto || g.Tipo_Gasto || g.Clasificacion_Origen || g.clasificacionOrigen || '').trim().toLowerCase();

        var esProyG = (idProyG && idProyG !== 'PERSONAL' && idProyG !== 'VIDA') ||
                      (idTarG && idTarG.startsWith('TAR-')) ||
                      (idHitG && idHitG !== 'PERSONAL' && idHitG !== '') ||
                      rawTg.includes('proy') || rawTg.includes('tarea');

        var tipoG = esProyG ? 'Tarea Proyecto' : 'Actividad Personal';

        coleccionUnificada.push({
          tipoFlujo: 'GASTO',
          tipoGasto: tipoG,
          id: g.ID_Gasto || g.id || '',
          descripcion: g.Descripcion_Gasto || g.descripcionGasto || g.descripcion || 'Gasto registrado',
          categoria: g.Categoria_Gasto || g.categoriaGasto || g.categoria || 'Otros',
          fecha: f,
          montoOriginal: parseFloat(g.Monto_Original || g.montoOriginal || g.monto || 0),
          monedaOriginal: (g.Moneda_Original || g.monedaOriginal || 'PEN').toUpperCase(),
          tipoCambio: parseFloat(g.Tipo_Cambio || g.tipoCambio || state.tipoCambioActual || 1),
          montoPEN: parseFloat(g.Monto_PEN || g.montoPEN || 0),
          montoReal: parseFloat(g.Monto_Real || g.montoReal || 0),
          isReal: isReal,
          isProgramado: isProgramado,
          conciliado: g.Conciliado === true,
          idCuota: g.ID_Cuota || g.idCuota || '',
          idProyecto: g.ID_Proyecto || g.idProyecto || '',
          metodoPago: g.Metodo_Pago || g.metodoPago || 'Transferencia Bancaria',
          comprobanteUrl: g.Comprobante_URL || g.comprobanteUrl || '',
          rawItem: g
        });
      });
    }

    // Recopilar Ingresos
    if (filtroTipo === 'TODOS' || filtroTipo === 'INGRESO') {
      ingresos.forEach(function (ing) {
        var f = ing.Fecha_Ingreso || ing.fechaIngreso || ing.fecha || '';
        var isReal = ing.Conciliado === true || (ing.Estado_Cobro || ing.Estado_Pago || '').toLowerCase() === 'cobrado' || (ing.Estado || '').toUpperCase() === 'EJECUTADO';
        var isProgramado = !isReal;
        var idOrigenVincIng = String(ing.ID_Origen_Vinculado || ing.idOrigenVinculado || ing.ID_Proyecto_Asociado || ing.idProyectoAsociado || ing.ID_Proyecto || '').trim();
        var tipoOrigenIng = String(ing.Tipo_Origen || ing.tipoOrigen || '').trim().toUpperCase();
        var tipoGastoNormalizado = (tipoOrigenIng === 'PROYECTO' || (idOrigenVincIng && idOrigenVincIng !== 'PERSONAL' && idOrigenVincIng !== 'NINGUNO')) ? 'Proyecto' : 'Personal';

        var descIng = ing.Descripcion_Ingreso || ing.Descripcion || ing.descripcion || ing.Concepto || 'Ingreso registrado';
        var catIng = ing.Categoria_Ingreso || ing.categoriaIngreso || ing.Categoria || ing.Origen_Fuente || ing.origenFuente || ing.fuente || 'Otros';
        var metCobro = ing.Metodo_Cobro || ing.metodoCobro || ing.Metodo_Pago || ing.Cuenta_Destino || ing.cuentaDestino || 'BCP';

        coleccionUnificada.push({
          tipoFlujo: 'INGRESO',
          tipoGasto: tipoGastoNormalizado,
          tipoOrigen: tipoOrigenIng || (tipoGastoNormalizado === 'Proyecto' ? 'PROYECTO' : 'LIBRE_CORRIENTE'),
          idOrigenVinculado: idOrigenVincIng,
          id: ing.ID_Ingreso || ing.id || '',
          descripcion: descIng,
          categoria: catIng,
          fecha: f,
          montoOriginal: parseFloat(ing.Monto_Original || ing.montoOriginal || ing.monto || 0),
          monedaOriginal: (ing.Moneda_Original || ing.monedaOriginal || 'PEN').toUpperCase(),
          tipoCambio: parseFloat(ing.Tipo_Cambio || ing.tipoCambio || state.tipoCambioActual || 1),
          montoPEN: parseFloat(ing.Monto_PEN || ing.montoPEN || 0),
          montoReal: parseFloat(ing.Monto_Real || ing.montoReal || 0),
          isReal: isReal,
          isProgramado: isProgramado,
          conciliado: ing.Conciliado === true,
          idCuota: '',
          idProyecto: idOrigenVincIng,
          metodoPago: metCobro,
          metodoCobro: metCobro,
          comprobanteUrl: '',
          rawItem: ing
        });
      });
    }



    // Filtrar Colección
    var filtradas = coleccionUnificada.filter(function (item) {
      // Regla estricta: todo objeto completado/conciliado con más de 10 días desaparece del canvas activo
      if (typeof esElementoArchivado === 'function' && esElementoArchivado(item.rawItem || item)) {
        return false;
      }

      // Filtro Segmento / Origen
      var filtroSeg = (state.filtroSegmentoFinanzas || 'TODOS').toUpperCase();
      if (filtroSeg === 'PROYECTOS') {
        if (item.tipoFlujo === 'GASTO' && item.tipoGasto !== 'Tarea Proyecto') return false;
        if (item.tipoFlujo === 'INGRESO' && item.tipoGasto !== 'Proyecto') return false;
      } else if (filtroSeg === 'PERSONAL') {
        if (item.tipoFlujo === 'GASTO' && item.tipoGasto !== 'Actividad Personal') return false;
        if (item.tipoFlujo === 'INGRESO' && item.tipoGasto !== 'Personal') return false;
      }

      // Filtro Estado
      if (filtroEstado === 'REAL' && !item.isReal) return false;
      if (filtroEstado === 'PROGRAMADO' && !item.isProgramado) return false;

      // Filtro Temporal (no filtrar transacciones optimistas recién creadas)
      if (!item.rawItem || !item.rawItem._isOptimistic) {
        if (!window.pertinecePeriodoFinanzas(item.fecha, filtroTiempo)) return false;
      }

      // Filtro Búsqueda
      if (filtroTexto) {
        var searchable = (item.descripcion + ' ' + item.categoria + ' ' + item.id + ' ' + item.metodoPago + ' ' + item.idProyecto + ' ' + item.idCuota + ' ' + (item.tipoGasto || '')).toLowerCase();
        if (searchable.indexOf(filtroTexto) === -1) return false;
      }
      return true;
    });

    // Ordenar por fecha descendente
    filtradas.sort(function (a, b) {
      var tA = a.fecha ? new Date(a.fecha).getTime() : 0;
      var tB = b.fecha ? new Date(b.fecha).getTime() : 0;
      return tB - tA;
    });

    if (tabBadge) tabBadge.textContent = filtradas.length;

    if (filtradas.length === 0) {
      cont.innerHTML =
        '<div class="col-span-full text-center py-14 px-4 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl select-none">' +
        '  <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center mx-auto mb-2.5 text-slate-400 dark:text-slate-500 border border-slate-200/60 dark:border-slate-700/60">' +
        '    <svg class="portal-icon-lg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v.5"/><path d="M12 6v.5"/></svg>' +
        '  </div>' +
        '  <div class="text-xs font-semibold text-slate-700 dark:text-slate-300">Sin transacciones registradas</div>' +
        '  <div class="text-[11px] text-slate-400 mt-0.5">No hay movimientos que coincidan con los filtros aplicados</div>' +
        '</div>';
      return;
    }

    var fragment = document.createDocumentFragment();
    filtradas.forEach(function (trx) {
      fragment.appendChild(crearTarjetaTransaccionUnificada(trx));
    });
    cont.appendChild(fragment);
  };

  // Constructor de Tarjeta Inteligente Unificada (Coexistencia Real / Programado)
  function crearTarjetaTransaccionUnificada(trx) {
    var isIngreso = trx.tipoFlujo === 'INGRESO';
    var isReal = trx.isReal;
    var isProgramado = trx.isProgramado;

    var mOrig = trx.montoOriginal;
    var monOrig = trx.monedaOriginal;
    var tc = trx.tipoCambio;
    var mPEN = trx.montoPEN || (monOrig === 'USD' ? mOrig * tc : mOrig);

    var diasRestantes = 0;
    var isVencido = false;
    if (isProgramado && trx.fecha) {
      var hoy = new Date();
      var hoyD = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      var p = trx.fecha.split('T')[0].split('-');
      if (p.length === 3) {
        var fD = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
        diasRestantes = Math.ceil((fD - hoyD) / (1000 * 60 * 60 * 24));
        isVencido = diasRestantes < 0;
      }
    }

    var card = document.createElement('div');
    var borderClass = '';
    var badgeEstado = '';

    var isProyecto = trx.tipoGasto === 'Tarea Proyecto' || trx.tipoGasto === 'Proyecto';
    var accentBorder = isProyecto
      ? 'border-l-[5px] border-l-indigo-500 hover:border-l-indigo-600 dark:border-l-indigo-400'
      : 'border-l-[5px] border-l-emerald-500 hover:border-l-emerald-600 dark:border-l-emerald-400';

    if (isReal) {
      borderClass = 'border border-slate-200/80 dark:border-slate-800/80 bg-white dark:bg-slate-900 shadow-xs hover:shadow-md ' + accentBorder;
      badgeEstado = '<span class="text-[9.5px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 flex items-center gap-1 shadow-2xs">' +
        '<svg class="portal-icon-sm shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>Conciliado</span></span>';
    } else {
      if (isVencido) {
        borderClass = 'border border-dashed border-rose-300 dark:border-rose-800/80 bg-rose-50/25 dark:bg-rose-950/20 shadow-xs hover:shadow-md ' + accentBorder;
        badgeEstado = '<span class="text-[9.5px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-800/60 animate-pulse flex items-center gap-1">' +
          '<svg class="portal-icon-sm shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>Vencido hace ' + Math.abs(diasRestantes) + 'd</span></span>';
      } else {
        borderClass = 'border border-dashed border-amber-300 dark:border-amber-700/80 bg-amber-50/20 dark:bg-amber-950/15 shadow-xs hover:shadow-md ' + accentBorder;
        badgeEstado = '<span class="text-[9.5px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 flex items-center gap-1">' +
          '<svg class="portal-icon-sm shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>' + (diasRestantes === 0 ? 'Vence Hoy' : 'Vence en ' + diasRestantes + 'd') + '</span></span>';
      }
    }

    var colorBarra = isProyecto ? 'bg-indigo-500' : 'bg-emerald-500';

    card.className = 'portal-surface group p-3.5 pl-4 rounded-2xl transition-all duration-150 ease-out hover:-translate-y-0.5 cursor-pointer flex flex-col justify-between relative overflow-hidden select-none ' + borderClass;

    // Indicador visual de transacción archivada (>10 días conciliada)
    if (typeof esElementoArchivado === 'function' && esElementoArchivado(trx.rawItem || trx)) {
      card.classList.add('opacity-60', 'border-dashed');
    }

    card.onclick = function (e) {
      if (e.target.closest('.btn-check-conciliar') || e.target.closest('.btn-link-comprobante')) return;
      abrirDrawerDetalleTransaccion(trx.tipoFlujo.toLowerCase(), trx.id);
    };

    var catConf = isIngreso
      ? (FUENTES_INGRESO_CONFIG[trx.categoria] || FUENTES_INGRESO_CONFIG['Otros'])
      : (CATEGORIAS_GASTO_CONFIG[trx.categoria] || CATEGORIAS_GASTO_CONFIG['Otros']);

    var html = '';
    html += '<div class="absolute left-0 top-0 bottom-0 w-1 ' + colorBarra + ' transition-all duration-150 group-hover:w-1.5"></div>';
    
    // Fila 1: Badges Semánticos y Estado
    html += '<div class="flex items-center justify-between gap-1.5 mb-2 flex-wrap">';
    html += '  <div class="flex items-center gap-1.5 flex-wrap min-w-0">';

    // Distintivo Visual Notorio: Proyecto vs Personal
    if (isProyecto) {

  window.abrirModalConciliarTransaccion = function (item) {
    if (!item) return;

    var elIdGasto = document.getElementById('conciliar-id-gasto');
    var elIdIngreso = document.getElementById('conciliar-id-ingreso');
    var elTipo = document.getElementById('conciliar-tipo');
    var elTxtConcepto = document.getElementById('conciliar-concepto-texto');
    var elTxtMontoEst = document.getElementById('conciliar-monto-estimado');
    var elInpMontoReal = document.getElementById('conciliar-monto-real');
    var elInpFechaReal = document.getElementById('conciliar-fecha-real');
    var elSelMetodo = document.getElementById('conciliar-metodo-pago');

    var isGasto = item.ID_Gasto || item.Categoria_Gasto || item.descripcionGasto;
    var tipoStr = isGasto ? 'GASTO' : 'INGRESO';
    var concepto = item.Descripcion_Gasto || item.Descripcion_Ingreso || item.Descripcion || item.descripcion || 'Transacción';
    var montoEstimado = parseFloat(item.Monto_PEN || item.montoPEN || item.Monto_Original || item.montoOriginal || 0);

    if (elIdGasto) elIdGasto.value = item.ID_Gasto || '';
    if (elIdIngreso) elIdIngreso.value = item.ID_Ingreso || '';
    if (elTipo) elTipo.value = tipoStr;

    if (elTxtConcepto) elTxtConcepto.textContent = concepto;
    if (elTxtMontoEst) elTxtMontoEst.textContent = 'S/ ' + montoEstimado.toFixed(2);
    if (elInpMontoReal) elInpMontoReal.value = montoEstimado.toFixed(2);
    if (elInpFechaReal) elInpFechaReal.value = new Date().toISOString().split('T')[0];

    if (elSelMetodo) {
      elSelMetodo.value = item.Metodo_Pago || item.Cuenta_Destino || 'BCP';
    }

    openModal('modal-conciliar-transaccion');
  };

  // Listener del formulario de Conciliación Manual con Mutación Optimista Inmediata
  var fConciliar = document.getElementById('form-conciliar-transaccion');
  if (fConciliar) {
    fConciliar.addEventListener('submit', function (e) {
      e.preventDefault();

      var idGasto = (document.getElementById('conciliar-id-gasto') || {}).value || '';
      var idIngreso = (document.getElementById('conciliar-id-ingreso') || {}).value || '';
      var tipo = (document.getElementById('conciliar-tipo') || {}).value || 'GASTO';
      var montoReal = parseFloat((document.getElementById('conciliar-monto-real') || {}).value) || 0;
      var fechaReal = (document.getElementById('conciliar-fecha-real') || {}).value || new Date().toISOString().split('T')[0];
      var metodoPago = (document.getElementById('conciliar-metodo-pago') || {}).value || 'BCP';

      var payload = {
        idGasto: idGasto,
        idIngreso: idIngreso,
        tipo: tipo,
        montoReal: montoReal,
        fechaReal: fechaReal,
        metodoPago: metodoPago
      };

      // 1. MUTACIÓN OPTIMISTA INMEDIATA EN MEMORIA
      var itemMutado = null;
      var idCuotaAfectada = '';

      if (idGasto && Array.isArray(state.gastos)) {
        itemMutado = state.gastos.find(function (g) { return (g.ID_Gasto || g.id) === idGasto; });
        if (itemMutado) {
          itemMutado.Conciliado = true;
          itemMutado.Estado_Pago = 'Pagado';
          itemMutado.Monto_PEN = montoReal;
          itemMutado.Monto_Real = montoReal;
          itemMutado.Fecha_Gasto = fechaReal;
          itemMutado.Metodo_Pago = metodoPago;
          idCuotaAfectada = itemMutado.ID_Cuota || '';
        }
      }

      if (idIngreso && Array.isArray(state.ingresos)) {
        itemMutado = state.ingresos.find(function (i) { return (i.ID_Ingreso || i.id) === idIngreso; });
        if (itemMutado) {
          itemMutado.Conciliado = true;
          itemMutado.Estado_Cobro = 'Cobrado';
          itemMutado.estadoCobro = 'Cobrado';
          itemMutado.Estado_Pago = 'Cobrado';
          itemMutado.Estado = 'Cobrado';
          itemMutado.Monto_PEN = montoReal;
          itemMutado.montoPEN = montoReal;
          itemMutado.Monto_Moneda_Base = montoReal;
          itemMutado.Monto_Real = montoReal;
          itemMutado.Fecha_Ingreso = fechaReal;
          itemMutado.fechaIngreso = fechaReal;
          itemMutado.Metodo_Cobro = metodoPago;
          itemMutado.metodoCobro = metodoPago;
          itemMutado.Metodo_Pago = metodoPago;
          itemMutado.Cuenta_Destino = metodoPago;
        }
      }

      // Si pertenece a un plan de cuotas, avanzar el progreso en memoria
      if (idCuotaAfectada && Array.isArray(state.cuotas)) {
        var plan = state.cuotas.find(function (c) { return (c.ID_Cuota || c.id) === idCuotaAfectada; });
        if (plan) {
          plan.Cuotas_Pagadas = (plan.Cuotas_Pagadas || 0) + 1;
          plan.Monto_Pagado = (plan.Monto_Pagado || 0) + montoReal;
          plan.Saldo_Pendiente = Math.max(0, (plan.Saldo_Pendiente || 0) - montoReal);
          if (plan.Cuotas_Pagadas >= plan.Num_Cuotas) plan.Estado = 'COMPLETADO';
        }
      }

      // 2. Cerrar Modal y Recalcular Pantalla Inmediatamente (Sin F5)
      closeModal('modal-conciliar-transaccion');
      renderTableroFinanciero();

      if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('success', 'Transacción Conciliada', 'Liquidado: S/ ' + montoReal.toFixed(2) + ' (' + metodoPago + ')');
      }

      // 3. PERSISTENCIA EN BACKEND Y ACTUALIZACIÓN EN GOOGLE CALENDAR
      callBackend('conciliartransaccion', payload, function (res) {
        if (res && res.success) {
          renderTableroFinanciero();
        } else {
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error en sincronización', (res && res.error) || 'Ocurrió un error al persistir');
          }
        }
      }, function () {
        // En caso de fallo de red
        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('warning', 'Sin conexión inmediata', 'La conciliación se procesará al reconectar.');
        }
      });
    });
  }

  window.renderTabCuotas = function (metricasInput) {

    var planes = (window.state && Array.isArray(state.cuotas)) ? state.cuotas : [];
    var metricas = metricasInput || calcularMetricasSaludFinanciera();

    // Actualizar KPIs de Cuotas
    var elActivas = document.getElementById('kpi-cuotas-activas');
    var elMensual = document.getElementById('kpi-cuotas-mensual');
    var elAmortizado = document.getElementById('kpi-cuotas-amortizado');
    var elDeuda = document.getElementById('kpi-cuotas-deuda');

    if (elActivas) elActivas.textContent = metricas.planesActivos.length;
    if (elMensual) elMensual.textContent = 'S/ ' + metricas.compromisoMensualCuotas.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (elAmortizado) elAmortizado.textContent = 'S/ ' + metricas.capitalAmortizadoTotalCuotas.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (elDeuda) elDeuda.textContent = 'S/ ' + metricas.saldoPendienteTotalCuotas.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    if (tabBadge) tabBadge.textContent = metricas.planesActivos.length;

    if (planes.length === 0) {

        '<div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800/80 flex items-center justify-center mx-auto mb-2 text-slate-400 dark:text-slate-500 border border-slate-200/60 dark:border-slate-700/60"><svg class="portal-icon-lg" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></div>' +
        'Sin planes de cuotas bancarias. Registra tu primer crédito para seguimiento automatizado.' +
        '</div>';
      return;

    var fragment = document.createDocumentFragment();
    planes.forEach(function (plan) {
      fragment.appendChild(crearTarjetaPlanCuotas(plan));

  function crearTarjetaPlanCuotas(plan) {
    var card = document.createElement('div');
    var isCompletado = (plan.Estado || '').toUpperCase() === 'COMPLETADO';
    var isAtrasado = (plan.Estado || '').toUpperCase() === 'ATRASADO';

    var borderColor = isAtrasado ? 'border-rose-300 dark:border-rose-800/80 bg-rose-50/20' :
      (isCompletado ? 'border-emerald-300 dark:border-emerald-800/80 bg-emerald-50/15' : 'border-violet-200 dark:border-violet-800/60 bg-white dark:bg-slate-900');

    card.className = 'portal-surface rounded-2xl border ' + borderColor + ' p-4 shadow-xs hover:shadow-md transition-all flex flex-col justify-between';

    var totalCuotas = parseInt(plan.Num_Cuotas || plan.numCuotas || 1);
    var cuotasPagadas = parseInt(plan.Cuotas_Pagadas || plan.cuotasPagadas || 0);
    var pctAvance = totalCuotas > 0 ? Math.min(100, Math.round((cuotasPagadas / totalCuotas) * 100)) : 0;

    var montoCuota = parseFloat(plan.Monto_Cuota || plan.montoCuota || 0);
    var montoPagado = parseFloat(plan.Monto_Pagado || plan.montoPagado || 0);
    var saldoPendiente = parseFloat(plan.Saldo_Pendiente || plan.saldoPendiente || (montoCuota * (totalCuotas - cuotasPagadas)));

    var idPlan = plan.ID_Cuota || plan.id || '';
    var banco = plan.Entidad_Financiera || plan.entidadFinanciera || 'Banco';
    var concepto = plan.Nombre_Plan || plan.nombrePlan || 'Crédito';

    card.id = 'plan-card-' + idPlan;

    // Generar Cronograma / Racha de Cuotas Visual
    var rachaDots = '';
    var maxDots = Math.min(totalCuotas, 36);
    for (var i = 1; i <= maxDots; i++) {
      if (i <= cuotasPagadas) {
        rachaDots += '<span class="w-3 h-3 rounded-full bg-violet-600 text-white flex items-center justify-center font-bold" title="Cuota ' + i + ' pagada"><svg class="w-2 h-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>';
      } else {
        rachaDots += '<span class="w-3 h-3 rounded-full bg-slate-200 dark:bg-slate-700" title="Cuota ' + i + ' pendiente"></span>';
      }

      '    <div class="flex items-center gap-2">' +

      '      <span class="text-[10px] font-mono text-slate-400">' + idPlan + '</span>' +
      '    </div>' +
      '    <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 mt-1 line-clamp-1" title="' + concepto + '">' + concepto + '</h4>' +
      '  </div>' +
      '  <span id="plan-badge-' + idPlan + '" class="text-[10px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1 ' + (isCompletado ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : (isAtrasado ? 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300' : 'bg-violet-100 text-violet-800 dark:bg-violet-950 dark:text-violet-300')) + '">' + (isCompletado ? '<svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg> Liquidada / Cancelada' : (isAtrasado ? 'Atrasado' : 'Activo')) + '</span>' +
      '</div>' +

      // Cifras Clave (Cuota Fija Banco, Amortizado, Restante)
      '<div class="grid grid-cols-3 gap-2 my-2.5 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 font-mono tabular-nums text-xs">' +

        showCancelButton: true,

    var interesesEstimados = (montoTotal > 0) ? (totalComprometido - montoTotal) : 0;

    var elCuotaPura = document.getElementById('teorico-cuota-pura');

      var backup = state.cuotas ? state.cuotas.slice() : [];
      state.cuotas = state.cuotas.filter(function (c) { return (c.ID_Cuota || c.id) !== idCuota; });
      if (typeof window.sincronizarCacheLocalState === 'function') {
        window.sincronizarCacheLocalState();
      }
      renderTableroFinanciero();

      callBackend('deleteplancuotas', { idCuota: idCuota }, function (res) {
        if (res && (res.success === true || res.success === 'true')) {
          if (typeof window.sincronizarCacheLocalState === 'function') {
            window.sincronizarCacheLocalState();
          }
          if (typeof mostrarToastOperativo === 'function') mostrarToastOperativo('success', 'Plan Eliminado', idCuota);
        } else {
          state.cuotas = backup;
          if (typeof window.sincronizarCacheLocalState === 'function') {
            window.sincronizarCacheLocalState();
          }
          renderTableroFinanciero();
          if (typeof Swal !== 'undefined') {
            Swal.fire({

              text: 'Error del servidor: ' + ((res && res.error) ? res.error : 'Desconocido'),

        if (typeof window.sincronizarCacheLocalState === 'function') {
          window.sincronizarCacheLocalState();
        }
        renderTableroFinanciero();
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'error',
            title: 'Error de conexión',

          });
        }
      });
    };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: '¿Eliminar plan de cuotas?',
        text: 'Se removerán las cuotas futuras asociadas de tu calendario y flujo de caja.',

  function calcularIngresoPromedioMensual() {
    var listaIngresos = (window.state && Array.isArray(state.ingresos)) ? state.ingresos : [];
    if (listaIngresos.length === 0) return 0;

    var meses = {};
    listaIngresos.forEach(function (ing) {
      var f = ing.Fecha_Ingreso || ing.fechaIngreso || ing.fecha || '';
      if (!f) return;
      var mesKey = f.substring(0, 7);
      var monto = parseFloat(ing.Monto_PEN || ing.montoPEN || (ing.Moneda_Original === 'USD' ? (ing.Monto_Original || 0) * (ing.Tipo_Cambio || 3.76) : (ing.Monto_Original || 0)));
      meses[mesKey] = (meses[mesKey] || 0) + monto;
    });

    var keys = Object.keys(meses);
    if (keys.length === 0) return 0;
    var total = 0;
    keys.forEach(function (k) { total += meses[k]; });
    return total / keys.length;
  }

    }

    var backdrop = document.getElementById('drawer-transaccion-backdrop');
    var drawer = document.getElementById('drawer-detalle-transaccion');
    if (backdrop) backdrop.classList.remove('hidden');
    if (drawer) drawer.classList.remove('translate-x-full');
  };

  window.cerrarDrawerDetalleTransaccion = function () {
    var backdrop = document.getElementById('drawer-transaccion-backdrop');
    var drawer = document.getElementById('drawer-detalle-transaccion');
    if (drawer) drawer.classList.add('translate-x-full');
    if (backdrop) {
      setTimeout(function () {
        backdrop.classList.add('hidden');
      }, 300);
    }
  };

  window.editarDesdeDrawer = function () {
    if (state.transaccionDetalleActiva && state.transaccionDetalleActiva.tipo === 'gasto') {
      var id = state.transaccionDetalleActiva.data.ID_Gasto;
      cerrarDrawerDetalleTransaccion();
      setTimeout(function () {
        if (typeof abrirModalEditarGasto === 'function') abrirModalEditarGasto(id);
      }, 300);
    }
  };

  window.eliminarDesdeDrawer = function () {
    if (!state.transaccionDetalleActiva) return;
    var tipo = state.transaccionDetalleActiva.tipo;
    var data = state.transaccionDetalleActiva.data;
    if (!data) return;

    if (tipo === 'gasto') {
      var idGasto = data.ID_Gasto;
      cerrarDrawerDetalleTransaccion();
      setTimeout(function () {
        if (typeof confirmarEliminarGasto === 'function') confirmarEliminarGasto(idGasto);
      }, 200);
    } else if (tipo === 'ingreso') {
      var idIngreso = data.ID_Ingreso;
      cerrarDrawerDetalleTransaccion();
      setTimeout(function () {
        if (typeof confirmarEliminarIngreso === 'function') confirmarEliminarIngreso(idIngreso);
      }, 200);
    }
  };

  // ============================================================================
  // SECCIÓN 15: COMPATIBILIDAD CON ATRIBUTOS Y MÉTODOS HEREDADOS
  // ============================================================================
  window.abrirModalCrearPlanCuotas = function () {
    var form = document.getElementById('form-create-plan-cuotas');
    if (form) form.reset();
    var elFecha = document.getElementById('cuota-fecha-inicio');
    if (elFecha) elFecha.value = new Date().toISOString().split('T')[0];
    var boxTeorico = document.getElementById('box-comparador-teorico');
    if (boxTeorico) boxTeorico.classList.add('hidden');
    openModal('modal-plan-cuotas');
  };

  // Re-hook listener para live updates en comparador teórico informativo
  ['cuota-monto-mensual', 'cuota-num-cuotas', 'cuota-monto-total'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', actualizarComparadorTeorico);
  });
</script>
