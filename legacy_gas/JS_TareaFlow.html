  // ----------------------------------------------------------------------------
  // GUARDAR Y ARCHIVAR TAREA FLOW
  // ----------------------------------------------------------------------------

  function guardarTareaFlow() {
    var inpTitulo = document.getElementById('task-flow-titulo');
    var titulo = inpTitulo ? inpTitulo.value.trim() : '';

    if (!titulo) {
      Swal.fire({
        icon: 'warning',
        title: 'Título requerido',
        text: 'Por favor ingresa un nombre o descripción para la tarea de proyecto.',
        confirmButtonColor: '#4f46e5'
      });
      if (inpTitulo) inpTitulo.focus();
      return;
    }

    if (!taskFlowState.idProyecto) {
      Swal.fire({
        icon: 'warning',
        title: 'Proyecto requerido',
        text: 'Toda tarea debe pertenecer a un proyecto. Por favor selecciona el proyecto en la cabecera.',
        confirmButtonColor: '#4f46e5'
      });
      return;
    }

    // Poka-Yoke Estricto DoD: Bloqueo si la tarea se intenta guardar como Completado con subtareas pendientes
    var estadoSeleccionado = taskFlowState.estado || '02_Por_Hacer';
    if (estadoSeleccionado === '04_Completado' || String(estadoSeleccionado).indexOf('Completado') !== -1) {
      var pasosTemp = Array.isArray(taskFlowState.pasosTemporales) ? taskFlowState.pasosTemporales : [];
      var idTarActual = String(taskFlowState.idTarea || '').trim().toUpperCase();
      var pasosGuardados = (idTarActual && Array.isArray(state.subtareas)) ? state.subtareas.filter(function (s) {
        var idP = String(s.ID_Padre_Vinculado || s.ID_Padre || s.idPadre || '').trim().toUpperCase();
        return idP === idTarActual;
      }) : [];
      var totalPasos = pasosTemp.length + pasosGuardados.length;
      var pasosIncompletos = 0;
      pasosTemp.forEach(function (p) { if (!p.Completada && !p.completado) pasosIncompletos++; });
      pasosGuardados.forEach(function (s) {
        if (!s.Completado && !s.completado && String(s.Completado).toLowerCase() !== 'true' && String(s.Completado) !== '1') pasosIncompletos++;
      });
      if (totalPasos > 0 && pasosIncompletos > 0) {
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            icon: 'warning',
            title: 'DoD Incompleto (Poka-Yoke)',
            html: '<div class="text-xs text-slate-600 dark:text-slate-300 space-y-2 text-left">' +
              '<p>Esta tarea tiene <b>' + pasosIncompletos + ' de ' + totalPasos + '</b> subtareas o pasos pendientes en su checklist.</p>' +
              '<p class="text-indigo-600 dark:text-indigo-400 font-semibold">Por gobernanza PMO, debes verificar el 100% de los pasos antes de marcarla como completada.</p>' +
              '</div>',
            confirmButtonColor: '#4f46e5'
          });
        }
        return;
      }
    }

    var txtNotas = document.getElementById('task-flow-notas');
    var notas = txtNotas ? txtNotas.value.trim() : '';

    var inpLugar = document.getElementById('task-flow-lugar-input');
    var lugar = inpLugar ? inpLugar.value.trim() : '';

    var btnSubmit = document.getElementById('task-flow-btn-submit');
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Guardando...</span>';
    }

    var inpMonto = document.getElementById('task-flow-gasto-monto');
    var montoGasto = inpMonto ? parseFloat(inpMonto.value) || 0 : 0;
    var selMoneda = document.getElementById('task-flow-gasto-moneda');
    var monedaGasto = selMoneda ? selMoneda.value : 'PEN';
    var selCatGasto = document.getElementById('task-flow-gasto-categoria');
    var catGasto = selCatGasto ? selCatGasto.value : 'Servicios_Contratados';
    var inpDescGasto = document.getElementById('task-flow-gasto-desc');
    var descGasto = inpDescGasto ? inpDescGasto.value.trim() : '';

    if (taskFlowState.modo === 'CREAR') {
      var tempId = taskFlowState.idTarea || ('TEMP-TAR-' + Date.now());
      var fProg = taskFlowState.fechaProgramada || new Date().toISOString().split('T')[0];
      var hProg = taskFlowState.horaProgramada || '09:00';

      // Calcular gastos confirmados vinculados (NO se auto-crean gastos de inputs no guardados)
      var totalGastoConfirmado = (state.gastos || []).reduce(function (acc, x) {
        if (taskFlowState.gastosVinculados && taskFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1) {
          return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
        }
        return acc;
      }, 0);

      var nuevaTareaLocal = {
        ID_Tarea: tempId,
        Nombre_Tarea_Actividad: titulo,
        ID_Proyecto: taskFlowState.idProyecto,
        ID_Hito: taskFlowState.idHito || '',
        ID_Dependencia: taskFlowState.idDependencia || '',
        Estado_Tarea: taskFlowState.estado || '02_Por_Hacer',
        Prioridad_Eisenhower: taskFlowState.prioridad || '02_P2_Media',
        Nivel_Energia_Requerido: taskFlowState.energia || 'Medio',
        Lugar_Ejecucion: lugar,
        Recursos_Requeridos: '',
        Fecha_Programada: fProg + (hProg ? (' ' + hProg) : ''),
        Hora_Inicio: hProg,
        Horas_Estimadas: parseFloat(taskFlowState.horasEstimadas) || 1.0,
        Horas_Reales: 0.0,
        Monto_Gasto_Asociado: totalGastoConfirmado,
        Costo_Real_Imputado: totalGastoConfirmado,
        Responsable_Ejecutor: 'Christopher',
        Notas_Impedimentos: notas,
        _isOptimistic: true
      };

      if (!state.tareas) state.tareas = [];
      state.tareas.unshift(nuevaTareaLocal);

      // Si se agregaron pasos temporales en el mismo flujo
      var pasosTemp = Array.isArray(taskFlowState.pasosTemporales) ? taskFlowState.pasosTemporales : [];
      if (pasosTemp.length > 0) {
        if (!state.subtareas) state.subtareas = [];
        pasosTemp.forEach(function (p, idx) {
          state.subtareas.push({
            ID_Subtarea: 'TEMP-STEP-' + tempId + '-' + (idx + 1),
            idSubtarea: 'TEMP-STEP-' + tempId + '-' + (idx + 1),
            ID_Padre_Vinculado: tempId,
            idPadreVinculado: tempId,
            ID_Padre: tempId,
            idPadre: tempId,
            Tipo_Padre: 'TAREA',
            tipoPadre: 'TAREA',
            Numero_Paso: idx + 1,
            numeroPaso: idx + 1,
            Orden_Ejecucion: idx + 1,
            Descripcion_Paso: (p.Titulo_Subtarea || p.Descripcion_Paso || p.titulo || '').trim(),
            descripcionPaso: (p.Titulo_Subtarea || p.Descripcion_Paso || p.titulo || '').trim(),
            Completado: !!p.Completada,
            completado: !!p.Completada,
            Estado: p.Completada ? '02_Completada' : '01_Pendiente'
          });
        });
      }

      // 1. CERRAR MODAL AL INSTANTE (0ms)
      cerrarModalTareaFlow();
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Guardar Tarea</span>';
      }

      // 2. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
      if (typeof recalcularAvanceCascada === 'function') {
        recalcularAvanceCascada(tempId, taskFlowState.idHito, taskFlowState.idProyecto);
      }
      if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
      if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();

      if (state.proyectoDetalleActivo) {
        var idProyActivo = String(state.proyectoDetalleActivo.ID_Proyecto || '').trim();
        if (typeof renderCascadaHitos === 'function') renderCascadaHitos(idProyActivo);
        if (typeof actualizarBentoKPIsProyecto === 'function') {
          actualizarBentoKPIsProyecto(state.proyectoDetalleActivo);
        }
      }
      if (typeof actualizarMetricasDashboard === 'function') actualizarMetricasDashboard();
      if (typeof renderTableroFinanciero === 'function' && totalGastoConfirmado > 0) renderTableroFinanciero();

      // 3. TOAST ESQUINERO OPERATIVO (Discreto, no invasivo)
      if (typeof notificarCreacion === 'function') {
        notificarCreacion('Tarea', titulo, 'f');
      } else if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('success', 'Tarea creada correctamente', titulo);
      }

      // 4. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
      var payloadCreate = {
        nombreTareaActividad: titulo,
        idProyecto: taskFlowState.idProyecto,
        idHito: taskFlowState.idHito,
        idDependencia: taskFlowState.idDependencia,
        estadoTarea: taskFlowState.estado,
        prioridad: taskFlowState.prioridad,
        nivelEnergiaRequerido: taskFlowState.energia,
        lugarEjecucion: lugar,
        recursosRequeridos: '',
        fechaProgramada: taskFlowState.fechaProgramada,
        horaProgramada: taskFlowState.horaProgramada,
        horaInicio: taskFlowState.horaProgramada || '09:00',
        horasEstimadas: taskFlowState.horasEstimadas,
        horasReales: 0.0,
        responsableEjecutor: 'Christopher',
        notasImpedimentos: notas,
        montoGastoAsociado: totalGastoConfirmado,
        costoRealImputado: totalGastoConfirmado
      };

      var draftIdBuscado = taskFlowState.idTareaEdicion;
      var linkedGastosIds = (taskFlowState.gastosVinculados || []).slice();

      callBackend('createTarea', payloadCreate, function (res) {
        if (res && res.success) {
          var realTarea = res.data || {};
          var realId = realTarea.ID_Tarea || res.idTarea;
          if (realId) {
            nuevaTareaLocal.ID_Tarea = realId;
            nuevaTareaLocal._isOptimistic = false;
            if (realTarea.ID_Proyecto) nuevaTareaLocal.ID_Proyecto = realTarea.ID_Proyecto;
            if (realTarea.ID_Hito) nuevaTareaLocal.ID_Hito = realTarea.ID_Hito;

            if (typeof notificarEntidadCreadaDesdeIdea === 'function') {
              notificarEntidadCreadaDesdeIdea('TAREA', realId);
            }

            // Reconciliar subtareas
            (state.subtareas || []).forEach(function (s) {
              if (s.ID_Padre_Vinculado === tempId || s.ID_Padre === tempId) {
                s.ID_Padre_Vinculado = realId;
                s.idPadreVinculado = realId;
                s.ID_Padre = realId;
                s.idPadre = realId;
              }
            });

            // Reconciliar cualquier gasto vinculado atómicamente antes o durante la tarea
            var idsParaReconciliar = [];
            if (draftIdBuscado && draftIdBuscado !== realId) idsParaReconciliar.push(draftIdBuscado);
            if (tempId && tempId !== realId) idsParaReconciliar.push(tempId);

            (state.gastos || []).forEach(function (g) {
              if (idsParaReconciliar.indexOf(g.ID_Tarea) !== -1 || linkedGastosIds.indexOf(g.ID_Gasto) !== -1) {
                var idGastoActual = g.ID_Gasto;
                g.ID_Tarea = realId;
                if (nuevaTareaLocal.ID_Proyecto) g.ID_Proyecto = nuevaTareaLocal.ID_Proyecto;
                if (nuevaTareaLocal.ID_Hito) g.ID_Hito = nuevaTareaLocal.ID_Hito;
                if (idGastoActual && idGastoActual.indexOf('GAS-TMP-') === -1) {
                  callBackend('updateGasto', {
                    idGasto: idGastoActual,
                    idTarea: realId,
                    idProyecto: nuevaTareaLocal.ID_Proyecto || '',
                    idHito: nuevaTareaLocal.ID_Hito || ''
                  }, null, null, { silent: true });
                }
              }
            });

            // Si hubo pasos creados en memoria para esta tarea, persistir silenciosamente
            var pasosParaCrear = (state.subtareas || []).filter(function (s) {
              var sPad = s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre;
              return sPad === realId && (String(s.ID_Subtarea || '').startsWith('SUB-TMP-') || String(s.ID_Subtarea || '').startsWith('TEMP-'));
            });
            if (pasosParaCrear.length > 0) {
              pasosParaCrear.forEach(function (p, idx) {
                var txtPaso = (p.Descripcion_Paso || p.Titulo_Subtarea || p.Titulo || '').trim();
                callBackend('createSubtarea', {
                  idPadre: realId,
                  idPadreVinculado: realId,
                  tipoPadre: 'TAREA',
                  descripcionPaso: txtPaso,
                  titulo: txtPaso,
                  numeroPaso: p.Numero_Paso || (idx + 1),
                  orden: p.Numero_Paso || (idx + 1),
                  completada: !!p.Completado
                }, function (resPaso) {
                  if (resPaso && resPaso.data) {
                    Object.assign(p, resPaso.data);
                  }
                }, null, { silent: true });
              });
            }
          }
        } else {
          // Rollback
          state.tareas = (state.tareas || []).filter(function (t) { return t.ID_Tarea !== tempId; });
          state.subtareas = (state.subtareas || []).filter(function (s) {
            var sPad = s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre;
            return sPad !== tempId;
          });
          if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
          if (state.proyectoDetalleActivo && typeof renderCascadaHitos === 'function') {
            renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
          }
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error al Guardar Tarea', (res && res.error) || 'No se pudo sincronizar.');
          }
        }
      }, function (err) {
        // Rollback
        state.tareas = (state.tareas || []).filter(function (t) { return t.ID_Tarea !== tempId; });
        state.subtareas = (state.subtareas || []).filter(function (s) {
          var sPad = s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre;
          return sPad !== tempId;
        });
        if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
        if (state.proyectoDetalleActivo && typeof renderCascadaHitos === 'function') {
          renderCascadaHitos(String(state.proyectoDetalleActivo.ID_Proyecto || '').trim());
        }
        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
        }
      }, { silent: true });

    } else {
      // MODO EDITAR: ACTUALIZACIÓN INSTANTÁNEA OPTIMISTA
      var idTarea = taskFlowState.idTarea;
      var tarLocal = (state.tareas || []).find(function (t) {
        return String(t.ID_Tarea || '').trim() === String(idTarea).trim();
      });

      var backupTar = tarLocal ? Object.assign({}, tarLocal) : null;

      // Calcular gastos confirmados vinculados (NO se auto-crean gastos de inputs no guardados)
      var totalGastoConfirmado = (state.gastos || []).reduce(function (acc, x) {
        if (String(x.ID_Tarea || '').trim() === String(idTarea).trim() ||
            (taskFlowState.gastosVinculados && taskFlowState.gastosVinculados.indexOf(x.ID_Gasto) !== -1)) {
          return acc + (parseFloat(x.Monto_PEN || x.Monto_Original) || 0);
        }
        return acc;
      }, 0);

      if (tarLocal) {
        tarLocal.Nombre_Tarea_Actividad = titulo;
        tarLocal.ID_Proyecto = taskFlowState.idProyecto;
        tarLocal.ID_Hito = taskFlowState.idHito;
        tarLocal.ID_Dependencia = taskFlowState.idDependencia;
        tarLocal.Estado_Tarea = taskFlowState.estado;
        tarLocal.Prioridad_Eisenhower = taskFlowState.prioridad;
        tarLocal.Nivel_Energia_Requerido = taskFlowState.energia;
        tarLocal.Fecha_Programada = taskFlowState.fechaProgramada + (taskFlowState.horaProgramada ? (' ' + taskFlowState.horaProgramada) : '');
        tarLocal.Hora_Inicio = taskFlowState.horaProgramada;
        tarLocal.Horas_Estimadas = taskFlowState.horasEstimadas;
        tarLocal.Horas_Reales = taskFlowState.horasReales;
        tarLocal.Monto_Gasto_Asociado = totalGastoConfirmado;
        tarLocal.Costo_Real_Imputado = totalGastoConfirmado;
        tarLocal.Notas_Impedimentos = notas;
        tarLocal.Lugar_Ejecucion = lugar;
      }

      // 1. CERRAR MODAL INMEDIATAMENTE
      cerrarModalTareaFlow();
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Guardar Tarea</span>';
      }

      // 2. ACTUALIZACIÓN REACTIVA AL INSTANTE (60 FPS)
      if (typeof recalcularAvanceCascada === 'function') {
        recalcularAvanceCascada(idTarea, taskFlowState.idHito, taskFlowState.idProyecto);
      }
      if (typeof renderSidebarProyectos === 'function') renderSidebarProyectos();
      if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
      if (state.proyectoDetalleActivo) {
        var idProyAct = String(state.proyectoDetalleActivo.ID_Proyecto || '').trim();
        if (typeof renderCascadaHitos === 'function') renderCascadaHitos(idProyAct);
        if (typeof actualizarBentoKPIsProyecto === 'function') {
          actualizarBentoKPIsProyecto(state.proyectoDetalleActivo);
        }
      }
      if (typeof renderTableroFinanciero === 'function' && totalGastoConfirmado > 0) renderTableroFinanciero();

      // 3. TOAST ESQUINERO OPERATIVO
      if (typeof notificarModificacion === 'function') {
        notificarModificacion('Tarea', titulo, 'f');
      } else if (typeof mostrarToastOperativo === 'function') {
        mostrarToastOperativo('info', 'Tarea actualizada correctamente', titulo);
      }

      // 4. PERSISTENCIA SILENCIOSA EN SEGUNDO PLANO
      var payloadUpdate = {
        idTarea: idTarea,
        ID_Tarea: idTarea,
        horaProgramada: taskFlowState.horaProgramada,
        horaInicio: taskFlowState.horaProgramada,
        datos: {
          Nombre_Tarea_Actividad: titulo,
          ID_Proyecto: taskFlowState.idProyecto,
          ID_Hito: taskFlowState.idHito,
          ID_Dependencia: taskFlowState.idDependencia,
          Estado_Tarea: taskFlowState.estado,
          Prioridad_Eisenhower: taskFlowState.prioridad,
          Nivel_Energia_Requerido: taskFlowState.energia,
          Fecha_Programada: taskFlowState.fechaProgramada,
          horaProgramada: taskFlowState.horaProgramada,
          horaInicio: taskFlowState.horaProgramada,
          Horas_Estimadas: taskFlowState.horasEstimadas,
          Horas_Reales: taskFlowState.horasReales,
          Monto_Gasto_Asociado: totalGastoConfirmado,
          Costo_Real_Imputado: totalGastoConfirmado,
          Notas_Impedimentos: notas,
          Lugar_Ejecucion: lugar
        },
        nombreTareaActividad: titulo,
        idProyecto: taskFlowState.idProyecto,
        idHito: taskFlowState.idHito,
        idDependencia: taskFlowState.idDependencia,
        prioridad: taskFlowState.prioridad,
        nivelEnergiaRequerido: taskFlowState.energia,
        fechaProgramada: taskFlowState.fechaProgramada,
        horasEstimadas: taskFlowState.horasEstimadas,
        horasReales: taskFlowState.horasReales,
        montoGastoAsociado: totalGastoConfirmado,
        costoRealImputado: totalGastoConfirmado,
        notasImpedimentos: notas,
        lugarEjecucion: lugar
      };

      callBackend('updateTarea', payloadUpdate, function (res) {
        if (!res || !res.success) {
          if (tarLocal && backupTar) Object.assign(tarLocal, backupTar);
          if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
          if (typeof mostrarToastOperativo === 'function') {
            mostrarToastOperativo('error', 'Error al Actualizar', (res && res.error) || 'No se guardaron los cambios.');
          }
        }
      }, function (err) {
        if (tarLocal && backupTar) Object.assign(tarLocal, backupTar);
        if (typeof aplicarFiltrosCruzados === 'function') aplicarFiltrosCruzados();
        if (typeof mostrarToastOperativo === 'function') {
          mostrarToastOperativo('error', 'Error de Red', (err && err.message) || 'Error de conexión.');
        }
      }, { silent: true });

      // Persistir subtareas creadas en memoria durante la edición
      var pasosNuevosEdit = (state.subtareas || []).filter(function (s) {
        var sPad = s.ID_Padre_Vinculado || s.idPadreVinculado || s.ID_Padre || s.idPadre;
        return sPad === idTarea && (String(s.ID_Subtarea || '').startsWith('SUB-TMP-') || String(s.ID_Subtarea || '').startsWith('TEMP-'));
      });
      if (pasosNuevosEdit.length > 0) {
        pasosNuevosEdit.forEach(function (p, idx) {
          var txtPaso = (p.Descripcion_Paso || p.Titulo_Subtarea || p.Titulo || '').trim();
          callBackend('createSubtarea', {
            idPadre: idTarea,
            idPadreVinculado: idTarea,
            tipoPadre: 'TAREA',
            descripcionPaso: txtPaso,
            titulo: txtPaso,
            numeroPaso: p.Numero_Paso || (idx + 1),
            orden: p.Numero_Paso || (idx + 1),
            completada: !!p.Completado
          }, function (resPaso) {
            if (resPaso && resPaso.data) {
              Object.assign(p, resPaso.data);
            }
          }, null, { silent: true });
        });
      }

      // Persistir subtareas eliminadas durante el modal
      if (Array.isArray(window._pasosEliminadosPendientes) && window._pasosEliminadosPendientes.length > 0) {
        window._pasosEliminadosPendientes.forEach(function (delId) {
          callBackend('deleteSubtarea', { idSubtarea: delId }, null, null, { silent: true });
        });
        window._pasosEliminadosPendientes = [];
      }

      // Persistir reorden de subtareas si se modificó durante el modal
      if (window._reordenSubtareasPendiente) {
        var idPadreReord = window._reordenSubtareasPendiente;
        var pReord = (typeof obtenerSubtareasPadre === 'function') ? obtenerSubtareasPadre(idPadreReord) : [];
        var ordenIds = pReord.map(function (p) { return p.ID_Subtarea; }).filter(function (id) {
          return id && !String(id).startsWith('SUB-TMP-') && !String(id).startsWith('TEMP-');
        });
        if (ordenIds.length > 0) {
          callBackend('reordenarsubtareas', {
            idPadre: idPadreReord,
            idPadreVinculado: idPadreReord,
            ordenIds: ordenIds
          }, null, null, { silent: true });
        }
        window._reordenSubtareasPendiente = null;
      }
    }
  }
