<script>
  function abrirDetalle360(idProyecto) {
    var idBuscado = String(idProyecto || '').trim().toUpperCase();
    var p = state.proyectos.find(function (x) {
      return String(x.ID_Proyecto || '').trim().toUpperCase() === idBuscado;
    });
    if (!p) return;

    state.proyectoDetalleActivo = p;

    document.getElementById('det-idProyecto').textContent = p.ID_Proyecto;
    document.getElementById('det-nombreProyecto').textContent = p.Nombre_Proyecto;
    document.getElementById('det-tipoIniciativa').textContent = p.Tipo_Iniciativa || 'General';
    var stLimpio = String(p.Estado_Proyecto || 'Backlog');
    if (stLimpio.indexOf('_') !== -1) stLimpio = stLimpio.substring(stLimpio.indexOf('_') + 1);
    document.getElementById('det-estadoProyecto').textContent = stLimpio.replace(/_/g, ' ');
    document.getElementById('det-northStarOKR').textContent = p.North_Star_OKR || 'Sin objetivo especificado.';
    document.getElementById('det-criteriosDoD').textContent = p.Criterios_Aceptacion_DoD || 'Sin criterios especificados.';
    document.getElementById('det-fechaInicio').textContent = p.Fecha_Inicio_Plan ? ('Inicio: ' + String(p.Fecha_Inicio_Plan).split('T')[0]) : 'Inicio: -';
    document.getElementById('det-fechaFin').textContent = p.Fecha_Fin_Plan ? ('Fin: ' + String(p.Fecha_Fin_Plan).split('T')[0]) : 'Fin: -';

    var elBadgeNotasProy = document.getElementById('det-badge-notas-proyecto');
    if (elBadgeNotasProy) {
      elBadgeNotasProy.innerHTML = (typeof generarBadgeNotasVinculadas === 'function')
        ? generarBadgeNotasVinculadas(p.ID_Proyecto, 'PROYECTO')
        : '';
    }

    actualizarBentoKPIsProyecto(p);
    actualizarSubpestañasPorFeatureFlags(p);
    cambiarSubpestana360('wbs');
    actualizarBannerCPM360(p);
    actualizarFichaGobernanza360(p);
    renderizarEVMDetalle360(p);
    renderCascadaHitos(p.ID_Proyecto);
    cambiarVistaGlobal('detalle');

    setTimeout(function () {
      if (typeof renderGrafoRedProyecto === 'function') {
        renderGrafoRedProyecto(p.ID_Proyecto);
      }
      if (window.networkDetalle360 && typeof window.networkDetalle360.fit === 'function') {
        window.networkDetalle360.redraw();
        window.networkDetalle360.fit();
      }
      if (window.chartDetalle360 && typeof window.chartDetalle360.resize === 'function') {
        window.chartDetalle360.resize();
      }
      actualizarBannerCPM360(p);
    }, 200);
  }

  function cerrarDetalle360() {
    state.proyectoDetalleActivo = null;
    cambiarVistaGlobal('portafolio');
  }

  function abrirModalCrearTareaProyDirecto() {
    var proyId = state.proyectoDetalleActivo ? state.proyectoDetalleActivo.ID_Proyecto : '';
    if (typeof abrirModalCrearTareaFlow === 'function') {
      abrirModalCrearTareaFlow(proyId, '', '02_Por_Hacer');
    } else if (typeof abrirModalCrearTarea === 'function') {
      abrirModalCrearTarea(proyId, '', '02_Por_Hacer');
    }
  }

  // ============================================================================
  // CÁLCULO Y ACTUALIZACIÓN REACTIVA DEL GRID BENTO DE KPIS 360°
  // ============================================================================
  function actualizarBentoKPIsProyecto(p) {
    var pObj = p;
    if (!pObj || typeof pObj === 'string') {
      var idPStr = typeof p === 'string' ? p.trim().toUpperCase() : '';
      if (!idPStr && state.proyectoDetalleActivo) idPStr = String(state.proyectoDetalleActivo.ID_Proyecto || '').trim().toUpperCase();
      if (!idPStr) {
        var elDetId = document.getElementById('det-idProyecto');
        if (elDetId && elDetId.textContent) idPStr = elDetId.textContent.trim().toUpperCase();
      }
      pObj = (state.proyectos || []).find(function (x) {
        return String(x.ID_Proyecto || '').trim().toUpperCase() === idPStr;
      }) || state.proyectoDetalleActivo;
    }
    if (!pObj) return;
    p = pObj;
    var idP = String(p.ID_Proyecto || '').trim().toUpperCase();

    // 1. Tareas del proyecto (directas y asociadas a hitos)
    var hitosProy = (state.hitos || []).filter(function (h) {
      var hProy = String(h.ID_Proyecto || h.idProyecto || h.id_proyecto || '').trim().toUpperCase();
      var hId = String(h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
      return hProy === idP || (idP !== '' && hId.indexOf(idP) === 0);
    });
    var hitosIds = {};
    hitosProy.forEach(function (h) {
      var hid = String(h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
      if (hid) hitosIds[hid] = true;
    });

    var tareasProy = (state.tareas || []).filter(function (t) {
      var tProy = String(t.ID_Proyecto || t.idProyecto || t.id_proyecto || '').trim().toUpperCase();
      var tHito = String(t.ID_Hito || t.idHito || t.id_hito || '').trim().toUpperCase();
      return (tProy === idP) || (tHito && hitosIds[tHito]) || (tHito && tHito.indexOf(idP) === 0);
    });

    var tareasCompletadas = tareasProy.filter(function (t) {
      var st = String(t.Estado_Tarea || '').toLowerCase();
      return st.indexOf('04_') !== -1 || st.indexOf('completad') !== -1;
    });

    var fHoy = new Date().getTime();
    var tareasVencidas = tareasProy.filter(function (t) {
      var st = String(t.Estado_Tarea || '').toLowerCase();
      var done = st.indexOf('04_') !== -1 || st.indexOf('completad') !== -1;
      if (done) return false;
      if (!t.Fecha_Programada) return false;
      var fProg = new Date(String(t.Fecha_Programada).split(' ')[0]).getTime();
      return !isNaN(fProg) && fProg < fHoy;
    });

    // 2. Cronograma Temporal y Días
    var diasTotales = 0;
    var diasTranscurridos = 0;
    var diasRestantes = null;
    var pctTiempo = 0;
    var fInicioValid = false;
    var fFinValid = false;

    if (p.Fecha_Inicio_Plan && p.Fecha_Fin_Plan) {
      var fIni = new Date(String(p.Fecha_Inicio_Plan).split('T')[0]).getTime();
      var fFin = new Date(String(p.Fecha_Fin_Plan).split('T')[0]).getTime();
      if (!isNaN(fIni) && !isNaN(fFin) && fFin >= fIni) {
        fInicioValid = true;
        fFinValid = true;
        diasTotales = Math.max(1, Math.round((fFin - fIni) / (1000 * 60 * 60 * 24)));
        diasTranscurridos = Math.max(0, Math.round((fHoy - fIni) / (1000 * 60 * 60 * 24)));
        diasRestantes = Math.round((fFin - fHoy) / (1000 * 60 * 60 * 24));
        pctTiempo = Math.min(Math.max(Math.round((diasTranscurridos / diasTotales) * 100), 0), 100);
      }
    }

    var barTiempoEl = document.getElementById('det-tiempo-transcurrido-bar');
    if (barTiempoEl) barTiempoEl.style.width = pctTiempo + '%';

    var diasBadgeEl = document.getElementById('det-tiempo-dias-badge');
    if (diasBadgeEl) {
      if (fInicioValid && fFinValid) {
        diasBadgeEl.textContent = Math.min(diasTranscurridos, diasTotales) + ' / ' + diasTotales + ' días';
      } else {
        diasBadgeEl.textContent = 'Sin fechas límite';
      }
    }

    var pctTiempoLabelEl = document.getElementById('det-tiempo-pct-label');
    if (pctTiempoLabelEl) pctTiempoLabelEl.textContent = pctTiempo + '% tiempo';

    // 3. KPI 1: Salud Operativa (Semáforo dinámico)
    var healthDotColor = 'bg-emerald-500';
    var healthTitle = 'En Plazo';
    var healthDesc = '0 tareas retrasadas';
    var healthBadgeClass = 'badge-sem-emerald';

    if (tareasVencidas.length > 2) {
      healthDotColor = 'bg-rose-500';
      healthTitle = 'Crítico';
      healthDesc = tareasVencidas.length + ' tareas vencidas';
      healthBadgeClass = 'badge-sem-rose';
    } else if (tareasVencidas.length > 0) {
      healthDotColor = 'bg-amber-500';
      healthTitle = 'Precaución';
      healthDesc = tareasVencidas.length + (tareasVencidas.length === 1 ? ' tarea retrasada' : ' tareas retrasadas');
      healthBadgeClass = 'badge-sem-amber';
    }

    var kpiHealthIcon = document.getElementById('det-kpi-health-icon');
    if (kpiHealthIcon) {
      kpiHealthIcon.className = 'w-2.5 h-2.5 rounded-full inline-block ' + healthDotColor;
      kpiHealthIcon.textContent = '';
    }
    var kpiHealthTitle = document.getElementById('det-kpi-health-title');
    if (kpiHealthTitle) kpiHealthTitle.textContent = healthTitle;
    var kpiHealthDesc = document.getElementById('det-kpi-health-desc');
    if (kpiHealthDesc) kpiHealthDesc.textContent = healthDesc;

    var detHealthStatus = document.getElementById('det-healthStatus');
    if (detHealthStatus) {
      detHealthStatus.className = 'w-1.5 h-1.5 rounded-full inline-block ' + healthDotColor;
      detHealthStatus.textContent = '';
    }
    var detHealthTxt = document.getElementById('det-health-txt');
    if (detHealthTxt) detHealthTxt.textContent = healthTitle;
    var detBadgeHealth = document.getElementById('det-badge-health');
    if (detBadgeHealth) detBadgeHealth.className = 'text-xs px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1.5 ' + healthBadgeClass;

    // 4. KPI 2: Ejecución Presupuestaria (Burn Rate)
    var pt = parseFloat(p.Presupuesto_Tope) || 0;
    var ac = parseFloat(p.Costo_Ejecutado_Real_PEN) || 0;
    var moneda = p.Moneda_Base || 'PEN';
    var burnRatePct = (pt > 0) ? Math.round((ac / pt) * 100) : (ac > 0 ? 100 : 0);

    var burnPctEl = document.getElementById('det-burnrate-pct');
    if (burnPctEl) burnPctEl.textContent = burnRatePct + '%';

    var burnBarEl = document.getElementById('det-burnrate-bar');
    if (burnBarEl) {
      burnBarEl.style.width = Math.min(burnRatePct, 100) + '%';
      if (burnRatePct > 100) {
        burnBarEl.className = 'h-full bg-rose-500 rounded-full transition-all duration-500';
      } else if (burnRatePct >= 80) {
        burnBarEl.className = 'h-full bg-amber-500 rounded-full transition-all duration-500';
      } else {
        burnBarEl.className = 'h-full bg-emerald-500 rounded-full transition-all duration-500';
      }
    }

    var burnAlertEl = document.getElementById('det-burnrate-alert');
    if (burnAlertEl) {
      if (burnRatePct > 100) {
        burnAlertEl.textContent = 'Sobregiro (+PEN ' + Math.round(ac - pt).toLocaleString() + ')';
        burnAlertEl.className = 'text-[10px] font-bold font-mono tabular-nums text-rose-600 dark:text-rose-400';
      } else if (burnRatePct >= 80) {
        burnAlertEl.textContent = 'Alerta: Consumo al ' + burnRatePct + '% del tope';
        burnAlertEl.className = 'text-[10px] font-bold font-mono tabular-nums text-amber-600 dark:text-amber-400';
      } else {
        burnAlertEl.textContent = 'Dentro del margen presupuestal';
        burnAlertEl.className = 'text-[10px] font-medium text-emerald-600 dark:text-emerald-400';
      }
    }

    var gastoRealEl = document.getElementById('det-gastoReal');
    if (gastoRealEl) gastoRealEl.textContent = 'PEN ' + Number(ac).toLocaleString();
    var presEl = document.getElementById('det-presupuesto');
    if (presEl) presEl.textContent = moneda + ' ' + Number(pt).toLocaleString();

    // 5. KPI 3: Progreso Físico / Cumplimiento (Con Anillo SVG)
    var avances = (typeof calcularAvancesProyecto === 'function')
      ? calcularAvancesProyecto(p)
      : { avanceReal: Math.round((parseFloat(p.Avance_Real_Pct) || 0) * 100), avanceTotalProyectado: 100 };
    var avReal = avances.avanceReal;

    var ringEl = document.getElementById('det-progreso-ring');
    if (ringEl) {
      ringEl.setAttribute('stroke-dasharray', avReal + ', 100');
    }
    var progTxtEl = document.getElementById('det-progreso-pct-txt');
    if (progTxtEl) progTxtEl.textContent = avReal + '%';

    var ratioTareasEl = document.getElementById('det-tareas-ratio');
    if (ratioTareasEl) {
      ratioTareasEl.textContent = tareasCompletadas.length + ' / ' + tareasProy.length + ' Tareas';
    }
    var progDescEl = document.getElementById('det-progreso-desc');
    if (progDescEl) {
      progDescEl.textContent = 'Meta: ' + (avances.avanceTotalProyectado || avReal) + '% proyectado';
    }

    // 6. KPI 4: Compromisos & Saldo Remanente / CPI
    var saldo = pt - ac;
    var saldoEl = document.getElementById('det-saldo-disponible');
    var saldoLabelEl = document.getElementById('det-compromisos-label');
    if (saldoEl) {
      saldoEl.textContent = 'PEN ' + Number(Math.abs(saldo)).toLocaleString();
      if (saldo < 0) {
        saldoEl.className = 'text-sm font-black font-mono text-rose-600 dark:text-rose-400';
        if (saldoLabelEl) saldoLabelEl.textContent = 'Déficit presupuestario';
      } else {
        saldoEl.className = 'text-sm font-black font-mono text-slate-900 dark:text-slate-100';
        if (saldoLabelEl) saldoLabelEl.textContent = 'Saldo disponible libre';
      }
    }

    var ev = pt * (avReal / 100);
    var cpiVal = (ac > 0 && pt > 0) ? (ev / ac) : 1.0;
    var cpiEl = document.getElementById('det-cpi');
    if (cpiEl) {
      cpiEl.textContent = cpiVal.toFixed(2);
      cpiEl.className = 'font-mono text-xs font-bold ' + (cpiVal >= 1.0 ? 'text-emerald-500' : 'text-rose-500');
    }

    // 7. KPI 5: Velocidad / Días Restantes / SPI
    var diasMetaNum = document.getElementById('det-dias-restantes-num');
    var diasMetaSub = document.getElementById('det-dias-restantes-sub');

    var esCompletado = (String(p.Estado_Proyecto || '').toLowerCase().indexOf('completad') !== -1) || (avReal >= 100);

    if (diasMetaNum) {
      if (esCompletado) {
        diasMetaNum.textContent = 'Finalizado';
        diasMetaNum.className = 'text-base font-black font-mono text-emerald-600 dark:text-emerald-400 leading-tight';
        if (diasMetaSub) diasMetaSub.textContent = 'Proyecto culminado';
      } else if (diasRestantes === null) {
        diasMetaNum.textContent = 'Sin meta';
        diasMetaNum.className = 'text-base font-black font-mono text-slate-400 leading-tight';
        if (diasMetaSub) diasMetaSub.textContent = 'Sin fecha límite';
      } else if (diasRestantes < 0) {
        diasMetaNum.textContent = Math.abs(diasRestantes) + 'd Vencido';
        diasMetaNum.className = 'text-base font-black font-mono text-rose-600 dark:text-rose-400 leading-tight';
        if (diasMetaSub) diasMetaSub.textContent = 'Límite superado';
      } else {
        diasMetaNum.textContent = diasRestantes + ' Días';
        diasMetaNum.className = 'text-base font-black font-mono leading-tight ' +
          (diasRestantes <= 7 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-900 dark:text-slate-100');
        if (diasMetaSub) diasMetaSub.textContent = 'Para la fecha meta';
      }
    }

    var spiVal = 1.0;
    if (fInicioValid && fFinValid && pt > 0 && pctTiempo > 0) {
      var pv = pt * (pctTiempo / 100);
      spiVal = (pv > 0) ? (ev / pv) : 1.0;
    }
    var spiEl = document.getElementById('det-spi');
    if (spiEl) {
      spiEl.textContent = spiVal.toFixed(2);
      spiEl.className = 'font-mono text-xs font-bold ' + (spiVal >= 1.0 ? 'text-emerald-500' : 'text-rose-500');
    }
  }

  // ============================================================================
  // GESTIÓN DE COLAPSO Y ACORDEÓN DE HITOS (MEMORIA DE SESIÓN)
  // ============================================================================
  var hitosColapsados = {};

  function toggleColapsarHito(idHito) {
    if (!idHito) return;
    hitosColapsados[idHito] = !hitosColapsados[idHito];
    var body = document.getElementById('hito-body-' + idHito);
    var chevron = document.getElementById('hito-chevron-' + idHito);
    if (body) {
      if (hitosColapsados[idHito]) {
        body.classList.add('hidden');
      } else {
        body.classList.remove('hidden');
      }
    }
    if (chevron) {
      if (hitosColapsados[idHito]) {
        chevron.classList.add('-rotate-90');
      } else {
        chevron.classList.remove('-rotate-90');
      }
    }
  }

  function expandirHito(idHito) {
    if (!idHito) return;
    hitosColapsados[idHito] = false;
    var body = document.getElementById('hito-body-' + idHito);
    var chevron = document.getElementById('hito-chevron-' + idHito);
    if (body) body.classList.remove('hidden');
    if (chevron) chevron.classList.remove('-rotate-90');
  }

  function toggleTodosLosHitos(expandir) {
    var idProy = state.proyectoDetalleActivo ? state.proyectoDetalleActivo.ID_Proyecto : '';
    if (!idProy) return;
    var hitos = (state.hitos || []).filter(function (h) {
      return String(h.ID_Proyecto || '').trim().toUpperCase() === String(idProy).trim().toUpperCase();
    });
    hitos.forEach(function (h) {
      if (expandir) {
        expandirHito(h.ID_Hito);
      } else {
        hitosColapsados[h.ID_Hito] = true;
        var body = document.getElementById('hito-body-' + h.ID_Hito);
        var chevron = document.getElementById('hito-chevron-' + h.ID_Hito);
        if (body) body.classList.add('hidden');
        if (chevron) chevron.classList.add('-rotate-90');
      }
    });
  }

  /**
   * 4.5. Estructura Cascada de Hitos, Tareas y Gastos en Vista 360°
   */
  function leerCampoRegistro(obj, nombresCanon) {
    if (!obj) return '';
    var i, k, keys, compact, target;
    for (i = 0; i < nombresCanon.length; i++) {
      if (obj[nombresCanon[i]] !== undefined && obj[nombresCanon[i]] !== null && obj[nombresCanon[i]] !== '') {
        return obj[nombresCanon[i]];
      }
    }
    keys = Object.keys(obj);
    for (i = 0; i < nombresCanon.length; i++) {
      target = String(nombresCanon[i]).toLowerCase().replace(/[_\s]/g, '');
      for (k = 0; k < keys.length; k++) {
        compact = String(keys[k]).toLowerCase().replace(/[_\s]/g, '');
        if (compact === target) return obj[keys[k]];
      }
    }
    return '';
  }

  function normalizarGasto(g) {
    var out = g || {};
    out.ID_Gasto = String(leerCampoRegistro(out, ['ID_Gasto', 'ID_GASTO']) || '').trim();
    out.ID_Hito = String(leerCampoRegistro(out, ['ID_Hito', 'ID_HITO']) || '').trim();
    out.ID_Proyecto = String(leerCampoRegistro(out, ['ID_Proyecto', 'ID_PROYECTO']) || '').trim();
    out.ID_Tarea = String(leerCampoRegistro(out, ['ID_Tarea', 'ID_TAREA']) || '').trim();
    out.Descripcion_Gasto = String(leerCampoRegistro(out, ['Descripcion_Gasto', 'Descripcion', 'DESCRIPCION']) || '').trim();
    out.Monto_Original = Number(leerCampoRegistro(out, ['Monto_Original', 'MONTO_ORIGINAL'])) || 0;
    out.Moneda_Original = String(leerCampoRegistro(out, ['Moneda_Original', 'MONEDA_ORIGINAL', 'Moneda']) || 'PEN').trim();
    out.Tipo_Cambio = Number(leerCampoRegistro(out, ['Tipo_Cambio', 'TIPO_CAMBIO'])) || 1;
    var montoPen = Number(leerCampoRegistro(out, ['Monto_PEN', 'MONTO_PEN']));
    out.Monto_PEN = montoPen || (out.Monto_Original * (out.Tipo_Cambio || 1)) || 0;
    out.Fecha_Gasto = leerCampoRegistro(out, ['Fecha_Gasto', 'FECHA_GASTO']);
    out.Metodo_Pago = String(leerCampoRegistro(out, ['Metodo_Pago', 'METODO_PAGO']) || 'Efectivo').trim();
    out.Categoria_Gasto = String(leerCampoRegistro(out, ['Categoria_Gasto', 'Categoria', 'CATEGORIA_GASTO']) || 'General').trim();
    out.Comprobante_URL = String(leerCampoRegistro(out, ['Comprobante_URL', 'comprobanteUrl', 'COMPROBANTE_URL', 'Url_Comprobante']) || '').trim();
    return out;
  }

  function montoPenGasto(g) {
    var n = parseFloat(g && g.Monto_PEN);
    if (isFinite(n) && n !== 0) return n;
    var orig = parseFloat(g && g.Monto_Original) || 0;
    var tc = parseFloat(g && g.Tipo_Cambio) || 1;
    if (isFinite(n)) return n || (orig * tc);
    return orig * tc;
  }

  function gastoEncajaEnHito(g, hitoIdActual, idProyBuscado) {
    if (!g) return false;
    var gHito = String(g.ID_Hito || '').trim().toUpperCase();
    var gProy = String(g.ID_Proyecto || '').trim().toUpperCase();
    var targetHito = String(hitoIdActual || '').trim().toUpperCase();
    var targetProy = String(idProyBuscado || '').trim().toUpperCase();

    if (gHito && gHito === targetHito) return true;
    if (!gHito && gProy === targetProy && targetHito === '') return true;

    return false;
  }

  function gastoEsGeneralDeProyecto(g, idProyBuscado, idsHitosProy) {
    if (!g) return false;
    var gHito = String(g.ID_Hito || '').trim().toUpperCase();
    var gProy = String(g.ID_Proyecto || '').trim().toUpperCase();
    var targetProy = String(idProyBuscado || '').trim().toUpperCase();

    if (!gProy && gHito) {
      var hitoPadre = state.hitos.find(function (h) {
        return String(h.ID_Hito || '').trim().toUpperCase() === gHito;
      });
      if (hitoPadre && hitoPadre.ID_Proyecto) {
        gProy = String(hitoPadre.ID_Proyecto).trim().toUpperCase();
      }
    }

    var perteneceAlProyecto = (gProy === targetProy) || (gHito !== '' && gHito.indexOf(targetProy) === 0);
    if (!perteneceAlProyecto) return false;

    if (!gHito || gHito === targetProy) return true;

    return idsHitosProy.indexOf(gHito) === -1;
  }

  function construirHtmlListaGastos(lista) {
    if (!lista || lista.length === 0) {
      return '<div class="py-6 text-center text-slate-400 dark:text-slate-500 text-xs italic bg-slate-50/50 dark:bg-slate-800/30 rounded-xl border border-dashed border-slate-200 dark:border-slate-800">' +
        '<span>Sin egresos registrados en este hito.</span>' +
        '</div>';
    }
    return '<div class="space-y-2">' + lista.map(function (g) {
      var fGasto = g.Fecha_Gasto ? String(g.Fecha_Gasto).split('T')[0] : '-';
      var metodo = g.Metodo_Pago || 'Efectivo';
      var categoria = g.Categoria_Gasto || 'General';

  /**
   * Calcula la desviación en días para un elemento WBS/Hito en memoria:
   * (fechaReal || fechaHoy) - fechaLimite, sin depender de fórmulas in-sheet.
   */
  function calcularDesviacionDiasHito(h, fHoy) {
    if (!h) return 0;
    var fLim = h.Fecha_Limite || h.Fecha_Limite_Plan || h.fechaLimite;
    if (!fLim) return 0;
    var strLim = String(fLim).includes('T') ? String(fLim).split('T')[0] : String(fLim);
    var dLim = new Date(strLim);
    if (isNaN(dLim.getTime())) return 0;

    var fReal = h.Fecha_Real_Fin || h.fechaRealFin;
    var dFin;
    if (fReal) {
      var strReal = String(fReal).includes('T') ? String(fReal).split('T')[0] : String(fReal);
      dFin = new Date(strReal);
    } else {
      dFin = fHoy ? new Date(fHoy) : new Date();
    }
    if (isNaN(dFin.getTime())) dFin = new Date();

    dLim.setHours(0, 0, 0, 0);
    dFin.setHours(0, 0, 0, 0);
    return Math.round((dFin.getTime() - dLim.getTime()) / (1000 * 60 * 60 * 24));
  }

  function renderCascadaHitos(idProyecto) {
    var container = document.getElementById('contenedor-hitos-cascada');
    if (!container) return;

    var idProyBuscado = String(idProyecto || '').trim().toUpperCase();
    if (!idProyBuscado) {
      if (state.proyectoDetalleActivo && state.proyectoDetalleActivo.ID_Proyecto) {
        idProyBuscado = String(state.proyectoDetalleActivo.ID_Proyecto).trim().toUpperCase();
      } else {
        var elDetId = document.getElementById('det-idProyecto');
        if (elDetId && elDetId.textContent) {
          idProyBuscado = elDetId.textContent.trim().toUpperCase();
        } else if (state.selectedProjectId) {
          idProyBuscado = String(state.selectedProjectId).trim().toUpperCase();
        } else if (state.proyectoActivoId) {
          idProyBuscado = String(state.proyectoActivoId).trim().toUpperCase();
        }
      }
    }
    if (!idProyBuscado) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = '';

    var hitosProy = (state.hitos || []).filter(function (h) {
      var idProyHito = String(h.ID_Proyecto || h.idProyecto || h.id_proyecto || '').trim().toUpperCase();
      var idHito = String(h.ID_Elemento_WBS || h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
      return idProyHito === idProyBuscado || (idProyBuscado !== '' && idHito.indexOf(idProyBuscado) === 0);
    });

    var idsHitosProy = hitosProy.map(function (h) {
      return String(h.ID_Elemento_WBS || h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
    });
    var idsHitosSet = new Set(idsHitosProy);

    var fHoy = new Date().getTime();

    // Preconstrucción en memoria de Mapas Hash O(1) de Tareas y Gastos por Hito
    const tareasPorHito = new Map();
    const tareasGenerales = [];
    const tareaIdToHitoMap = new Map();

    (state.tareas || []).forEach(function (t) {
      if (!t) return;
      var tProy = String(t.ID_Proyecto || t.idProyecto || t.id_proyecto || '').trim().toUpperCase();
      var tHito = String(t.ID_Hito || t.idHito || t.id_hito || '').trim().toUpperCase();
      var idT = String(t.ID_Tarea || t.idTarea || '').trim().toUpperCase();

      if (tHito && idsHitosSet.has(tHito)) {
        if (!tareasPorHito.has(tHito)) tareasPorHito.set(tHito, []);
        tareasPorHito.get(tHito).push(t);
        if (idT) tareaIdToHitoMap.set(idT, tHito);
      } else if (
        (tProy === idProyBuscado && (!tHito || !idsHitosSet.has(tHito))) ||
        (tHito && !idsHitosSet.has(tHito) && tHito.indexOf(idProyBuscado) === 0)
      ) {
        tareasGenerales.push(t);
      }
    });

    const gastosPorHito = new Map();
    const gastosGenerales = [];

    (state.gastos || []).forEach(function (g) {
      if (!g) return;
      var gNorm = normalizarGasto(g);
      var gHito = String(gNorm.ID_Hito || '').trim().toUpperCase();
      var gTarea = String(gNorm.ID_Tarea || gNorm.ID_Entidad_Vinculada || '').trim().toUpperCase();

      if (!gHito && gTarea && tareaIdToHitoMap.has(gTarea)) {
        gHito = tareaIdToHitoMap.get(gTarea);
      }

      if (gHito && idsHitosSet.has(gHito)) {
        if (!gastosPorHito.has(gHito)) gastosPorHito.set(gHito, []);
        gastosPorHito.get(gHito).push(gNorm);
      } else if (gastoEsGeneralDeProyecto(gNorm, idProyBuscado, idsHitosProy)) {
        gastosGenerales.push(gNorm);
      }
    });

    // CASO 1: Si no se registran hitos específicos en el proyecto
    if (hitosProy.length === 0) {
      var avisoSinHitos = document.createElement('div');
      avisoSinHitos.className = 'portal-surface p-4 rounded-2xl border border-dashed border-indigo-200 dark:border-indigo-800/60 flex flex-col sm:flex-row items-center justify-between gap-3 text-slate-600 dark:text-slate-300 text-xs font-medium';
      avisoSinHitos.innerHTML =
        '<div class="flex items-center gap-2">' +
        '<svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>' +
        '<span>No se registran hitos específicos en este proyecto. Puedes crear paquetes de trabajo e hitos para estructurar tu WBS con "+ Nuevo Hito", o gestionar tareas y gastos directamente.</span>' +
        '</div>' +
        '<button type="button" onclick="abrirModalCrearHito()" class="btn-portal-primary text-xs shrink-0 flex items-center gap-1.5 shadow-xs">' +
        '<span>+ Nuevo Hito</span>' +
        '</button>';
      container.appendChild(avisoSinHitos);

      // Renderizar el bloque general manteniendo las 2 columnas intactas (Tareas col-span-7 / Gastos col-span-5)
      renderBloqueGeneralProyecto(container, idProyBuscado, tareasGenerales, gastosGenerales, fHoy);
      return;
    }

    // CASO 2: Si hay hitos registrados -> Agrupación por Fase_Asociada (Nivel 1)
    var hitosOrdenados = (typeof ordenarHitosCronologicamente === 'function')
      ? ordenarHitosCronologicamente(hitosProy)
      : hitosProy;
    var pesosHitos = (typeof obtenerPesosEfectivosHitos === 'function')
      ? obtenerPesosEfectivosHitos(idProyBuscado, hitosOrdenados, (state.tareas || []))
      : {};

    var fasesMap = new Map();
    var fasesOrden = [];

    hitosOrdenados.forEach(function (h) {
      var rawFase = String(h.Fase_Asociada || h.faseAsociada || h.Fase || '').trim();
      var faseKey = rawFase || 'Fase General';

      if (!fasesMap.has(faseKey)) {
        fasesMap.set(faseKey, {
          nombre: faseKey,
          paquetes: [],
          marcadores: [],
          pesoTotal: 0
        });
        fasesOrden.push(faseKey);
      }

      var idClave = String(h.ID_Elemento_WBS || h.ID_Hito || '').trim();
      var tipoWbs = obtenerTipoElementoWBS(h);
      var peso = pesosHitos[idClave] || 0;
      var grupo = fasesMap.get(faseKey);
      grupo.pesoTotal += peso;

      if (tipoWbs === 'HITO_MARCADOR') {
        grupo.marcadores.push(h);
      } else {
        grupo.paquetes.push(h);
      }
    });

        // Ordenamiento determinista de fases según ciclo de vida canónico
    function normalizarTextoFase(str) {
      return String(str || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function extraerIndiceFase(faseStr) {
      var s = String(faseStr || '').trim();
      var m = s.match(/^(?:f|fase\s*)?0*(\d+)(?:[_\s.:\-)].*|$)/i);
      if (m && m[1]) {
        return parseInt(m[1], 10);
      }
      return null;
    }

    var cicloVidaEstandar = [
      'iniciacion',
      'planificacion',
      'diseno',
      'ejecucion',
      'procura',
      'construccion',
      'validacion',
      'pruebas',
      'cierre'
    ];

    function obtenerIndiceCicloVida(faseStr) {
      var norm = normalizarTextoFase(faseStr);
      for (var i = 0; i < cicloVidaEstandar.length; i++) {
        if (norm.indexOf(cicloVidaEstandar[i]) !== -1) {
          return i;
        }
      }
      return -1;
    }

    fasesOrden.sort(function (a, b) {
      var idxA = extraerIndiceFase(a);
      var idxB = extraerIndiceFase(b);
      if (idxA !== null && idxB !== null) {
        if (idxA !== idxB) return idxA - idxB;
      } else if (idxA !== null) {
        return -1;
      } else if (idxB !== null) {
        return 1;
      }

      var cA = obtenerIndiceCicloVida(a);
      var cB = obtenerIndiceCicloVida(b);
      if (cA !== -1 && cB !== -1) {
        if (cA !== cB) return cA - cB;
      } else if (cA !== -1) {
        return -1;
      } else if (cB !== -1) {
        return 1;
      }

      return String(a || '').localeCompare(String(b || ''), undefined, { numeric: true, sensitivity: 'base' });
    });

    var fragmentHitos = document.createDocumentFragment();

    fasesOrden.forEach(function (faseKey, idxFase) {
      var grupo = fasesMap.get(faseKey);
      var faseContainer = document.createElement('div');
      faseContainer.className = 'wbs-fase-seccion space-y-4 mb-6 p-4 md:p-5 rounded-2xl bg-slate-50/50 dark:bg-slate-900/40 border border-slate-200/80 dark:border-slate-800/80 shadow-2xs';

      var pctPesoFase = Math.round(grupo.pesoTotal * 100);
      var countWP = grupo.paquetes.length;
      var countHit = grupo.marcadores.length;
      var totalEntregablesFase = countWP + countHit;
      var textoContadorFase = totalEntregablesFase === 1 ? '1 entregable' : totalEntregablesFase + ' entregables';
      if (countWP > 0 && countHit > 0) {
        textoContadorFase = countWP + ' WP • ' + countHit + ' hitos';
      }

  // ============================================================================
  // MOTOR DE PROPAGACIÓN DE AVANCE CONTINUO EN CASCADA
  // Pasos -> Tarea -> Hito -> Proyecto (Bottom-up Reactivo)
  // ============================================================================

  var _syncProyTimers = {};
  function debouncedSyncProyectoAvance(idProyecto, avancePctDecimal) {
    if (!_syncProyTimers) _syncProyTimers = {};
    if (_syncProyTimers[idProyecto]) clearTimeout(_syncProyTimers[idProyecto]);
    _syncProyTimers[idProyecto] = setTimeout(function () {
      callBackend('updateProyecto', {
        idProyecto: idProyecto,
        avanceRealPct: avancePctDecimal,
        datos: { Avance_Real_Pct: avancePctDecimal }
      }, function (res) {
        if (res && res.success) {
          console.log('[Cascada sync OK] Proyecto ' + idProyecto + ': ' + Math.round(avancePctDecimal * 100) + '%');
        }
      }, function (err) {
        console.warn('[Cascada sync warning]:', err);
      }, { silent: true });
    }, 1200);
  }

  function calcularAvanceTarea(t) {
    if (!t) return 0;
    var tareaObj = (typeof t === 'string')
      ? (state.tareas || []).find(function (x) { return String(x.ID_Tarea || '').trim() === String(t).trim(); })
      : t;
    if (!tareaObj) return 0;

    var idTar = String(tareaObj.ID_Tarea || '').trim();
    var pasos = (state.subtareas || []).filter(function (s) {
      return String(s.Tipo_Padre || '').toUpperCase() === 'TAREA' && String(s.ID_Padre || '').trim() === idTar;
    });

    if (pasos.length > 0) {
      var comp = pasos.filter(function (s) {
        return s.Completada === true || s.Completado === true || String(s.Completada).toLowerCase() === 'true' || String(s.Completado).toLowerCase() === 'true';
      }).length;
      var pct = Math.round((comp / pasos.length) * 100);
      return Math.min(Math.max(pct, 0), 100);
    }

    var est = String(tareaObj.Estado_Tarea || '').toLowerCase();
    if (est.indexOf('04_') !== -1 || est.indexOf('completad') !== -1) return 100;
    if (est.indexOf('03_') !== -1 || est.indexOf('proceso') !== -1) return 50;
    return 0;
  }

  function calcularAvanceHito(h) {
    if (!h) return 0;
    var hitoObj = (typeof h === 'string')
      ? (state.hitos || []).find(function (x) {
          var xId = String(x.ID_Elemento_WBS || x.ID_Hito || '').trim().toUpperCase();
          return xId === String(h).trim().toUpperCase();
        })
      : h;
    if (!hitoObj) return 0;

    var tipoWbs = (typeof obtenerTipoElementoWBS === 'function') ? obtenerTipoElementoWBS(hitoObj) : 'PAQUETE_TRABAJO';
    var estH = String(hitoObj.Estado || hitoObj.Estado_Hito || '').toLowerCase();
    var esDone = estH.indexOf('03_') !== -1 || estH.indexOf('completad') !== -1;

    // Para HITO_MARCADOR: Checkpoint puro de duración cero y sin tareas operativas.
    // El avance es 100% si está completado conforme a DoD y 0% si está pendiente.
    if (tipoWbs === 'HITO_MARCADOR') {
      return esDone ? 100 : 0;
    }

    var idH = String(hitoObj.ID_Elemento_WBS || hitoObj.ID_Hito || hitoObj.idHito || hitoObj.id_hito || '').trim().toUpperCase();
    var tareasHito = (state.tareas || []).filter(function (t) {
      return String(t.ID_Hito || t.idHito || t.id_hito || '').trim().toUpperCase() === idH;
    });

    if (tareasHito.length > 0) {
      var suma = tareasHito.reduce(function (acc, t) {
        return acc + calcularAvanceTarea(t);
      }, 0);
      var pctHito = Math.round(suma / tareasHito.length);
      return Math.min(Math.max(pctHito, 0), 100);
    }

    if (esDone) return 100;
    return 0;
  }

  /**
   * Ordena hitos cronológicamente según:
   * 1. Fecha_Limite_Plan (más temprana primero)
   * 2. Fase_Asociada (orden natural / alfanumérico)
   * 3. ID_Hito (orden alfanumérico)
   */
  function ordenarHitosCronologicamente(hitos) {
    if (!hitos || !Array.isArray(hitos)) return [];
    return hitos.slice().sort(function (a, b) {
      var fA = a.Fecha_Limite_Plan ? new Date(String(a.Fecha_Limite_Plan).split('T')[0]).getTime() : NaN;
      var fB = b.Fecha_Limite_Plan ? new Date(String(b.Fecha_Limite_Plan).split('T')[0]).getTime() : NaN;
      var validA = !isNaN(fA);
      var validB = !isNaN(fB);
      if (validA && validB && fA !== fB) {
        return fA - fB;
      }
      if (validA && !validB) return -1;
      if (!validA && validB) return 1;

      var faseA = String(a.Fase_Asociada || '').trim().toLowerCase();
      var faseB = String(b.Fase_Asociada || '').trim().toLowerCase();
      if (faseA !== faseB) {
        return faseA.localeCompare(faseB, undefined, { numeric: true, sensitivity: 'base' });
      }

      var idA = String(a.ID_Hito || '').trim();
      var idB = String(b.ID_Hito || '').trim();
      return idA.localeCompare(idB, undefined, { numeric: true });
    });
  }

  /**
   * Determina los pesos relativos efectivos de los hitos del proyecto:
   * Criterio C: Si existen pesos manuales en BBDD_Hitos (con suma > 0), se normalizan al 100% (1.0).
   * Criterio A: Si las tareas tienen Horas_Estimadas (con suma > 0), peso = Horas Tareas Hito / Horas Totales Proyecto.
   * Criterio B: Fallback equitativo automático = 1 / N_hitos.
   * Devuelve un diccionario { [ID_Hito]: pesoDecimal } donde la suma de pesos es exactamente 1.0 (100%).
   */
  function obtenerPesosEfectivosHitos(idP, hitosProy, tareasProy) {
    if (!hitosProy || hitosProy.length === 0) return {};

    // Criterio C: Normalización anti-desbordamiento para pesos manuales en BBDD
    var manualWeights = {};
    var totalManual = 0;
    var hasManual = false;

    hitosProy.forEach(function (h) {
      var rawVal = (h.Peso_Ponderado_Pct !== undefined && h.Peso_Ponderado_Pct !== null && h.Peso_Ponderado_Pct !== '')
        ? h.Peso_Ponderado_Pct
        : ((h.Peso_Ponderado !== undefined && h.Peso_Ponderado !== null && h.Peso_Ponderado !== '')
          ? h.Peso_Ponderado
          : h.Peso);
      var val = parseFloat(rawVal);
      if (!isNaN(val) && val > 0) {
        manualWeights[h.ID_Hito] = val;
        totalManual += val;
        hasManual = true;
      } else {
        manualWeights[h.ID_Hito] = 0;
      }
    });

    if (hasManual && totalManual > 0) {
      var pesosManualesNorm = {};
      hitosProy.forEach(function (h) {
        pesosManualesNorm[h.ID_Hito] = manualWeights[h.ID_Hito] / totalManual;
      });
      return pesosManualesNorm;
    }

    // Criterio A: Cálculo por esfuerzo (Horas Estimadas de tareas asociadas)
    var horasPorHito = {};
    var totalHoras = 0;

    hitosProy.forEach(function (h) {
      var idH = String(h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
      var tareasHito = (tareasProy || []).filter(function (t) {
        return String(t.ID_Hito || t.idHito || t.id_hito || '').trim().toUpperCase() === idH;
      });
      var sumHoras = tareasHito.reduce(function (acc, t) {
        var hEst = parseFloat(t.Horas_Estimadas);
        return acc + (!isNaN(hEst) && hEst > 0 ? hEst : 0);
      }, 0);
      horasPorHito[h.ID_Hito] = sumHoras;
      totalHoras += sumHoras;
    });

    if (totalHoras > 0) {
      var pesosHoras = {};
      hitosProy.forEach(function (h) {
        pesosHoras[h.ID_Hito] = horasPorHito[h.ID_Hito] / totalHoras;
      });
      return pesosHoras;
    }

    // Criterio B: Fallback equitativo automático (1 / N)
    var pesoEquitativo = 1 / hitosProy.length;
    var pesosEquitativos = {};
    hitosProy.forEach(function (h) {
      pesosEquitativos[h.ID_Hito] = pesoEquitativo;
    });
    return pesosEquitativos;
  }

  /**
   * Motor Jerárquico de Avance Real y Proyección "% Meta"
   * Erradica incrementos arbitrarios (+20%).
   * % Meta = (Suma de Pesos de Hitos ya completados al 100%) + (Peso del Hito Activo en Curso)
   */
  function calcularAvancesProyecto(p) {
    if (!p) return { avanceReal: 0, avanceTotalProyectado: 0 };
    var proyObj = (typeof p === 'string')
      ? (state.proyectos || []).find(function (x) { return String(x.ID_Proyecto || '').trim().toUpperCase() === String(p).trim().toUpperCase(); })
      : p;
    if (!proyObj) return { avanceReal: 0, avanceTotalProyectado: 0 };

    var idP = String(proyObj.ID_Proyecto || '').trim().toUpperCase();

    var hitosProy = (state.hitos || []).filter(function (h) {
      return String(h.ID_Proyecto || h.idProyecto || h.id_proyecto || '').trim().toUpperCase() === idP;
    });
    var hitosIds = {};
    hitosProy.forEach(function (h) {
      var hid = String(h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase();
      if (hid) hitosIds[hid] = true;
    });

    var tareasProy = (state.tareas || []).filter(function (t) {
      var tProy = String(t.ID_Proyecto || t.idProyecto || t.id_proyecto || '').trim().toUpperCase();
      var tHito = String(t.ID_Hito || t.idHito || t.id_hito || '').trim().toUpperCase();
      return (tProy === idP) || (tHito && hitosIds[tHito]) || (tHito && tHito.indexOf(idP) === 0);
    });

    // Caso 1: Proyecto con Hitos
    if (hitosProy.length > 0) {
      var hitosOrdenados = ordenarHitosCronologicamente(hitosProy);
      var pesos = obtenerPesosEfectivosHitos(idP, hitosOrdenados, tareasProy);

      var avanceRealSuma = 0;
      var pesoCompletados = 0;
      var hitoActivo = null;

      hitosOrdenados.forEach(function (h) {
        var avH = calcularAvanceHito(h);
        var pesoH = pesos[h.ID_Hito] || 0;

        avanceRealSuma += (avH * pesoH);

        if (avH >= 100) {
          pesoCompletados += (pesoH * 100);
        } else if (!hitoActivo) {
          hitoActivo = { hito: h, peso: pesoH, avance: avH };
        }
      });

      var metaCalculada = 0;
      if (!hitoActivo) {
        // Todos los hitos se encuentran cumplidos al 100%
        metaCalculada = 100;
      } else {
        metaCalculada = pesoCompletados + (hitoActivo.peso * 100);
      }

      var avRealFinal = Math.min(Math.max(Math.round(avanceRealSuma), 0), 100);
      var avMetaFinal = Math.min(Math.max(Math.round(metaCalculada), avRealFinal), 100);

      return {
        avanceReal: avRealFinal,
        avanceTotalProyectado: avMetaFinal
      };
    }

    // Caso 2: Proyecto sin Hitos pero con Tareas directas
    if (tareasProy.length > 0) {
      var sumaTar = tareasProy.reduce(function (acc, t) {
        return acc + calcularAvanceTarea(t);
      }, 0);
      var avTarReal = Math.round(sumaTar / tareasProy.length);
      var tareasComp = tareasProy.filter(function (t) {
        return calcularAvanceTarea(t) >= 100;
      }).length;
      var metaTasks = (tareasComp === tareasProy.length)
        ? 100
        : Math.round(((tareasComp + 1) / tareasProy.length) * 100);

      var realFinal = Math.min(Math.max(avTarReal, 0), 100);
      var metaFinal = Math.min(Math.max(metaTasks, realFinal), 100);
      return {
        avanceReal: realFinal,
        avanceTotalProyectado: metaFinal
      };
    }

    // Caso 3: Proyecto sin Hitos ni Tareas (Fallback directo a Avance_Real_Pct)
    var avDirecto = Math.min(Math.max(Math.round((parseFloat(proyObj.Avance_Real_Pct) || 0) * 100), 0), 100);
    return {
      avanceReal: avDirecto,
      avanceTotalProyectado: avDirecto
    };
  }

  function calcularAvanceProyectoCascada(p) {
    var res = calcularAvancesProyecto(p);
    return res ? res.avanceReal : 0;
  }

  function recalcularAvanceCascada(idTarea, idHito, idProyecto) {
    var tareaObj = idTarea
      ? (state.tareas || []).find(function (t) { return String(t.ID_Tarea || '').trim() === String(idTarea).trim(); })
      : null;

    if (tareaObj) {
      if (!idHito) idHito = tareaObj.ID_Hito || tareaObj.idHito || tareaObj.id_hito;
      if (!idProyecto) idProyecto = tareaObj.ID_Proyecto || tareaObj.idProyecto || tareaObj.id_proyecto;
    }

    var hitoObj = idHito
      ? (state.hitos || []).find(function (h) { return String(h.ID_Hito || h.idHito || h.id_hito || '').trim().toUpperCase() === String(idHito).trim().toUpperCase(); })
      : null;

    if (hitoObj && !idProyecto) {
      idProyecto = hitoObj.ID_Proyecto || hitoObj.idProyecto || hitoObj.id_proyecto;
    }

    var proyObj = idProyecto
      ? (state.proyectos || []).find(function (p) { return String(p.ID_Proyecto || '').trim().toUpperCase() === String(idProyecto).trim().toUpperCase(); })
      : null;

    // 1. Tarea
    if (tareaObj) {
      var pctTar = calcularAvanceTarea(tareaObj);
      if (typeof actualizarWidgetSubtareasEnTarjetaDOM === 'function') {
        actualizarWidgetSubtareasEnTarjetaDOM(tareaObj.ID_Tarea);
      }
      if (typeof taskFlowState !== 'undefined' && taskFlowState && taskFlowState.idTarea === tareaObj.ID_Tarea) {
        var badgePasos = document.getElementById('task-flow-pasos-progreso-badge');
        var barPasos = document.getElementById('task-flow-pasos-progreso-bar');
        var pasosTar = (state.subtareas || []).filter(function (s) {
          return String(s.Tipo_Padre || '').toUpperCase() === 'TAREA' && String(s.ID_Padre || '').trim() === tareaObj.ID_Tarea;
        });
        var compPasos = pasosTar.filter(function (s) {
          return s.Completada === true || s.Completado === true || String(s.Completada).toLowerCase() === 'true' || String(s.Completado).toLowerCase() === 'true';
        }).length;
        if (badgePasos) badgePasos.textContent = compPasos + '/' + pasosTar.length + ' pasos (' + pctTar + '%)';
        if (barPasos) barPasos.style.width = pctTar + '%';
      }
    }

    // 2. Hito
    if (hitoObj) {
      var pctH = calcularAvanceHito(hitoObj);
      var barHito = document.getElementById('hito-progreso-bar-' + hitoObj.ID_Hito);
      var badgeHito = document.getElementById('hito-progreso-badge-' + hitoObj.ID_Hito);
      if (barHito) barHito.style.width = pctH + '%';
      if (badgeHito) badgeHito.textContent = pctH + '%';
    }

    // 3. Proyecto
    if (proyObj) {
      var avances = calcularAvancesProyecto(proyObj);
      proyObj.Avance_Real_Pct = avances.avanceReal / 100;

      if (state.proyectoDetalleActivo && String(state.proyectoDetalleActivo.ID_Proyecto || '').trim().toUpperCase() === String(proyObj.ID_Proyecto).trim().toUpperCase()) {
        actualizarBentoKPIsProyecto(proyObj);
      }

      try {
        renderSidebarProyectos();
      } catch (eSidebar) {}

      try {
        if (typeof renderKPIsPortafolio === 'function') {
          renderKPIsPortafolio();
        }
      } catch (eKPI) {}

      debouncedSyncProyectoAvance(proyObj.ID_Proyecto, proyObj.Avance_Real_Pct);
    }
  }

  // ============================================================================
  // GESTIÓN DE SUBPESTAÑAS ERGONÓMICAS EN VISTA DETALLADA 360°
  // ============================================================================
  function cambiarSubpestana360(tabId) {
    var validTabs = ['wbs', 'evm', 'tradeoff', 'gobernanza'];
    if (validTabs.indexOf(tabId) === -1) tabId = 'wbs';

    validTabs.forEach(function (t) {
      var btn = document.getElementById('tab-btn-' + t);
      var panel = document.getElementById('subtab-panel-' + t);
      if (btn) {
        if (t === tabId) {
          btn.className = 'px-4 py-3 text-xs md:text-sm font-bold border-b-2 border-indigo-600 dark:border-indigo-400 text-indigo-600 dark:text-indigo-400 flex items-center gap-2 transition-colors';
        } else {
          btn.className = 'px-4 py-3 text-xs md:text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 flex items-center gap-2 transition-colors';
        }
      }
      if (panel) {
        if (t === tabId) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
        }
      }
    });

    if (tabId === 'wbs') {
      setTimeout(function () {
        if (typeof window.networkDetalle360 !== 'undefined' && window.networkDetalle360 && typeof window.networkDetalle360.redraw === 'function') {
          window.networkDetalle360.redraw();
          window.networkDetalle360.fit();
        }
      }, 150);
    } else if (tabId === 'evm') {
      if (state.proyectoDetalleActivo) {
        renderizarEVMDetalle360(state.proyectoDetalleActivo);
      }
    } else if (tabId === 'tradeoff') {
      if (state.proyectoDetalleActivo) {
        inicializarOActualizarTradeOff(state.proyectoDetalleActivo);
      }
    } else if (tabId === 'gobernanza') {
      if (state.proyectoDetalleActivo) {
        actualizarFichaGobernanza360(state.proyectoDetalleActivo);
      }
    }
  }

  // ============================================================================
  // FEATURE FLAGS DINÁMICOS (LIGHT / MEDIUM / HEAVY)
  // ============================================================================
  function actualizarSubpestañasPorFeatureFlags(p) {
    if (!p) return;
    var arq = String(p.Arquetipo_Proyecto || '').toUpperCase();
    var mag = String(p.Magnitud_Complejidad || '').toUpperCase();

    var isLight = arq.indexOf('1') !== -1 || arq.indexOf('LIGHT') !== -1 || mag === 'BAJA' || mag === 'MICRO';
    var isHeavy = arq.indexOf('3') !== -1 || arq.indexOf('HEAVY') !== -1 || arq.indexOf('TRANSFORMAC') !== -1 || mag === 'ALTA' || mag === 'MUY ALTA';
    var isMedium = !isLight && !isHeavy;

    var btnWbs = document.getElementById('tab-btn-wbs');
    var btnEvm = document.getElementById('tab-btn-evm');
    var btnTradeOff = document.getElementById('tab-btn-tradeoff');
    var btnGob = document.getElementById('tab-btn-gobernanza');

    if (btnWbs) btnWbs.classList.remove('hidden');
    if (btnGob) btnGob.classList.remove('hidden');

    if (isLight) {
      if (btnEvm) btnEvm.classList.add('hidden');
      if (btnTradeOff) btnTradeOff.classList.add('hidden');
    } else if (isMedium) {
      if (btnEvm) btnEvm.classList.remove('hidden');
      if (btnTradeOff) btnTradeOff.classList.add('hidden');
    } else {
      // Heavy: todas las subpestañas activas
      if (btnEvm) btnEvm.classList.remove('hidden');
      if (btnTradeOff) btnTradeOff.classList.remove('hidden');
    }
  }

  // ============================================================================
  // BANNER DE RUTA CRÍTICA (CPM) EN SUBPESTAÑA 1
  // ============================================================================
  function actualizarBannerCPM360(p) {
    if (!p) return;
    var idP = String(p.ID_Proyecto || '').trim().toUpperCase();
    var tareasProy = (state.tareas || []).filter(function (t) {
      var tProy = String(t.ID_Proyecto || t.idProyecto || '').trim().toUpperCase();
      return tProy === idP;
    });

    var depMap = (typeof wbsState !== 'undefined' && wbsState && wbsState.dependenciesMap) ? wbsState.dependenciesMap : {};
    var cpm = (typeof window.calcularCPMCanoico === 'function')
      ? window.calcularCPMCanoico(tareasProy, depMap)
      : { criticalTaskIds: [], maxProjectDuration: 0, criticalTasksCount: 0 };

    var elCount = document.getElementById('cpm-tasks-count');
    var elDur = document.getElementById('cpm-duration-label');
    var elBadge = document.getElementById('cpm-status-badge');

    if (elCount) elCount.textContent = (cpm.criticalTasksCount || 0) + ' actividades';
    if (elDur) elDur.textContent = (cpm.maxProjectDuration || 0) + ' días estimados';
    if (elBadge) {
      if (cpm.criticalTasksCount > 0) {
        elBadge.textContent = 'Ruta Crítica Identificada (' + cpm.criticalTasksCount + ')';
        elBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
      } else {
        elBadge.textContent = 'Sin Tareas Críticas';
        elBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-slate-500/10 text-slate-500 border border-slate-500/20';
      }
    }
  }

  // ============================================================================
  // MOTOR DE GESTIÓN DE VALOR GANADO (EVM) EN TIEMPO REAL - SUBPESTAÑA 2
  // ============================================================================
  function renderizarEVMDetalle360(p) {
    if (!p) return;
    var bac = parseFloat(p.Presupuesto_Tope) || 0;
    var ac = parseFloat(p.Costo_Ejecutado_Real_PEN) || 0;
    var cc = 0;
    var idP = String(p.ID_Proyecto || '').trim().toUpperCase();
    (state.gastos || []).forEach(function (g) {
      var gProy = String(g.ID_Proyecto || '').trim().toUpperCase();
      var gSt = String(g.Estado_Pago || g.Estado || '').toUpperCase();
      if (gProy === idP && (gSt.indexOf('PEND') !== -1 || gSt.indexOf('COMPROMET') !== -1)) {
        cc += parseFloat(g.Monto_PEN || g.Monto || 0) || 0;
      }
    });

    var avances = (typeof calcularAvancesProyecto === 'function')
      ? calcularAvancesProyecto(p)
      : { avanceReal: Math.round((parseFloat(p.Avance_Real_Pct) || 0) * 100) };
    var avRealPct = (avances.avanceReal || 0) / 100;
    var ev = bac * avRealPct;

    var fHoy = new Date().getTime();
    var pctTiempo = 0;
    if (p.Fecha_Inicio_Plan && p.Fecha_Fin_Plan) {
      var fIni = new Date(String(p.Fecha_Inicio_Plan).split('T')[0]).getTime();
      var fFin = new Date(String(p.Fecha_Fin_Plan).split('T')[0]).getTime();
      if (!isNaN(fIni) && !isNaN(fFin) && fFin > fIni) {
        var dTot = Math.max(1, (fFin - fIni) / (1000 * 60 * 60 * 24));
        var dTrans = Math.max(0, (fHoy - fIni) / (1000 * 60 * 60 * 24));
        pctTiempo = Math.min(Math.max(dTrans / dTot, 0), 1);
      }
    } else {
      pctTiempo = avRealPct;
    }
    var pv = bac * pctTiempo;

    var cv = ev - ac;
    var sv = ev - pv;
    var cpi = (ac > 0) ? (ev / ac) : 1.0;
    var spi = (pv > 0) ? (ev / pv) : 1.0;
    var eac = (cpi > 0) ? (bac / cpi) : (ac + (bac - ev));
    var vac = bac - eac;
    var moneda = p.Moneda_Base || 'PEN';

    var elBac = document.getElementById('evm-bac-val');
    if (elBac) elBac.textContent = moneda + ' ' + Math.round(bac).toLocaleString();
    var elPv = document.getElementById('evm-pv-val');
    if (elPv) elPv.textContent = moneda + ' ' + Math.round(pv).toLocaleString();
    var elEv = document.getElementById('evm-ev-val');
    if (elEv) elEv.textContent = moneda + ' ' + Math.round(ev).toLocaleString();
    var elAc = document.getElementById('evm-ac-val');
    if (elAc) elAc.textContent = moneda + ' ' + Math.round(ac).toLocaleString();
    var elCc = document.getElementById('evm-cc-val');
    if (elCc) elCc.textContent = moneda + ' ' + Math.round(cc).toLocaleString();
    var elEac = document.getElementById('evm-eac-val');
    if (elEac) elEac.textContent = moneda + ' ' + Math.round(eac).toLocaleString();

    var elCv = document.getElementById('evm-cv-val');
    if (elCv) {
      elCv.textContent = (cv >= 0 ? '+' : '') + moneda + ' ' + Math.round(cv).toLocaleString();
      elCv.className = 'font-mono text-sm font-bold ' + (cv >= 0 ? 'text-emerald-500' : 'text-rose-500');
    }
    var elSv = document.getElementById('evm-sv-val');
    if (elSv) {
      elSv.textContent = (sv >= 0 ? '+' : '') + moneda + ' ' + Math.round(sv).toLocaleString();
      elSv.className = 'font-mono text-sm font-bold ' + (sv >= 0 ? 'text-emerald-500' : 'text-rose-500');
    }
    var elCpi = document.getElementById('evm-cpi-val');
    if (elCpi) {
      elCpi.textContent = cpi.toFixed(2);
      elCpi.className = 'font-mono text-sm font-bold ' + (cpi >= 0.95 ? 'text-emerald-500' : (cpi >= 0.85 ? 'text-amber-500' : 'text-rose-500'));
    }
    var elSpi = document.getElementById('evm-spi-val');
    if (elSpi) {
      elSpi.textContent = spi.toFixed(2);
      elSpi.className = 'font-mono text-sm font-bold ' + (spi >= 0.95 ? 'text-emerald-500' : (spi >= 0.85 ? 'text-amber-500' : 'text-rose-500'));
    }

    var elDiag = document.getElementById('evm-diagnostico-pmo');
    if (elDiag) {
      var diagTxt = '';
      if (cpi >= 0.95 && spi >= 0.95) {
        diagTxt = '🟢 Saludable: El proyecto avanza conforme al cronograma y dentro del presupuesto establecido (EAC estimada: ' + moneda + ' ' + Math.round(eac).toLocaleString() + ').';
      } else if (cpi >= 0.95 && spi < 0.95) {
        diagTxt = '🟡 Retraso en Cronograma: Costo controlado (CPI=' + cpi.toFixed(2) + '), pero el avance físico marcha rezagado respecto a lo planificado (SPI=' + spi.toFixed(2) + ').';
      } else if (cpi < 0.95 && spi >= 0.95) {
        diagTxt = '🟡 Sobrecosto Moderado: Buen ritmo de ejecución operativa (SPI=' + spi.toFixed(2) + '), pero con sobreconsumo financiero (CPI=' + cpi.toFixed(2) + '). Variación proyectada VAC: ' + moneda + ' ' + Math.round(vac).toLocaleString() + '.';
      } else {
        diagTxt = '🔴 Estado Crítico: Doble desviación en costo y cronograma (CPI=' + cpi.toFixed(2) + ', SPI=' + spi.toFixed(2) + '). Se recomienda convocar auditoría de gobernanza inmediata.';
      }
      elDiag.textContent = diagTxt;
    }

    dibujarCurvaSSVG(bac, pv, ev, ac, pctTiempo, avRealPct);
  }

  // ============================================================================
  // RENDERIZADO VECTORIAL DE CURVA S EN SVG (SUBPESTAÑA 2)
  // ============================================================================
  function dibujarCurvaSSVG(bac, pv, ev, ac, pctTiempo, avRealPct) {
    var svg = document.getElementById('evm-curva-s-svg');
    if (!svg) return;

    var w = 500;
    var h = 200;
    var padLeft = 45;
    var padRight = 20;
    var padTop = 20;
    var padBottom = 35;

    var chartW = w - padLeft - padRight;
    var chartH = h - padTop - padBottom;

    var maxCosto = Math.max(bac, ac, pv, ev, 1);
    var pvPoints = [];
    var steps = 20;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var sVal = 3 * t * t - 2 * t * t * t;
      var x = padLeft + t * chartW;
      var y = (padTop + chartH) - (sVal * bac / maxCosto) * chartH;
      pvPoints.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var pvPathD = 'M ' + pvPoints.join(' L ');

    var evX = padLeft + Math.min(Math.max(pctTiempo, 0), 1) * chartW;
    var evY = (padTop + chartH) - Math.min(ev / maxCosto, 1) * chartH;
    var evPathD = 'M ' + padLeft + ',' + (padTop + chartH) + ' Q ' + ((padLeft + evX) / 2) + ',' + (padTop + chartH) + ' ' + evX.toFixed(1) + ',' + evY.toFixed(1);

    var acY = (padTop + chartH) - Math.min(ac / maxCosto, 1.2) * chartH;
    var acPathD = 'M ' + padLeft + ',' + (padTop + chartH) + ' L ' + evX.toFixed(1) + ',' + acY.toFixed(1);
    var nowX = evX.toFixed(1);

    var svgContent = '';
    svgContent += '<line x1="' + padLeft + '" y1="' + (padTop + chartH) + '" x2="' + (w - padRight) + '" y2="' + (padTop + chartH) + '" stroke="currentColor" class="text-slate-300 dark:text-slate-700" stroke-width="1"/>';
    svgContent += '<line x1="' + padLeft + '" y1="' + padTop + '" x2="' + padLeft + '" y2="' + (padTop + chartH) + '" stroke="currentColor" class="text-slate-300 dark:text-slate-700" stroke-width="1"/>';

    [0.25, 0.5, 0.75, 1.0].forEach(function (g) {
      var gy = (padTop + chartH) - g * chartH;
      svgContent += '<line x1="' + padLeft + '" y1="' + gy + '" x2="' + (w - padRight) + '" y2="' + gy + '" stroke="currentColor" class="text-slate-200 dark:text-slate-800" stroke-dasharray="3,3" stroke-width="1"/>';
      svgContent += '<text x="' + (padLeft - 6) + '" y="' + (gy + 3) + '" text-anchor="end" class="text-[9px] fill-slate-400 font-mono">' + Math.round(g * 100) + '%</text>';
    });

    svgContent += '<line x1="' + nowX + '" y1="' + padTop + '" x2="' + nowX + '" y2="' + (padTop + chartH) + '" stroke="#6366f1" stroke-dasharray="2,2" stroke-width="1.5"/>';
    svgContent += '<text x="' + nowX + '" y="' + (padTop + chartH + 15) + '" text-anchor="middle" class="text-[9px] font-bold fill-indigo-500 font-mono">HOY (' + Math.round(pctTiempo * 100) + '%)</text>';

    svgContent += '<path d="' + pvPathD + '" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>';
    svgContent += '<path d="' + evPathD + '" fill="none" stroke="#10b981" stroke-width="3"/>';
    svgContent += '<path d="' + acPathD + '" fill="none" stroke="#f59e0b" stroke-width="2.5"/>';

    svgContent += '<circle cx="' + nowX + '" cy="' + evY.toFixed(1) + '" r="4" fill="#10b981"/>';
    svgContent += '<circle cx="' + nowX + '" cy="' + acY.toFixed(1) + '" r="4" fill="#f59e0b"/>';

    svg.innerHTML = svgContent;
  }

  // ============================================================================
  // SUBPESTAÑA 3: MATRIZ DE DECISIÓN PONDERADA (TRADE-OFF ANALYSIS)
  // ============================================================================
  var tradeOffLocal = {
    criterios: [
      { id: 'c1', nombre: 'Valor de Negocio / ROI', peso: 30 },
      { id: 'c2', nombre: 'Factibilidad Técnica & Plazo', peso: 25 },
      { id: 'c3', nombre: 'Eficiencia Presupuestal', peso: 25 },
      { id: 'c4', nombre: 'Riesgo & Mitigación', peso: 20 }
    ],
    alternativas: [
      { id: 'a1', nombre: 'Opción 1: Enfoque Modular Escalable' },
      { id: 'a2', nombre: 'Opción 2: Desarrollo Rápido / MVP' },
      { id: 'a3', nombre: 'Opción 3: Contratación de Solución Externa' }
    ],
    matriz: {
      'a1': { 'c1': 4, 'c2': 4, 'c3': 3, 'c4': 4 },
      'a2': { 'c1': 3, 'c2': 5, 'c3': 4, 'c4': 2 },
      'a3': { 'c1': 3, 'c2': 3, 'c3': 2, 'c4': 4 }
    }
  };

  function inicializarOActualizarTradeOff(p) {
    if (!p) return;
    var inpTitulo = document.getElementById('tradeoff-titulo-input');
    if (inpTitulo && !inpTitulo.value) {
      inpTitulo.value = 'Trade-Off: ' + (p.Nombre_Proyecto || 'Evaluación Arquitectónica');
    }
    renderizarCriteriosTradeOff();
    renderizarMatrizTableTradeOff();
    recalcularScoresTradeOff();
    cargarHistorialTradeOff(p.ID_Proyecto);
  }

  function renderizarCriteriosTradeOff() {
    var cont = document.getElementById('tradeoff-criterios-container');
    if (!cont) return;
    var html = '';
    tradeOffLocal.criterios.forEach(function (c) {
      html += '<div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-xs">';
      html += '  <span class="font-medium text-slate-700 dark:text-slate-300 truncate max-w-[200px]">' + c.nombre + '</span>';
      html += '  <div class="flex items-center gap-1.5">';
      html += '    <input type="number" min="0" max="100" step="5" value="' + c.peso + '" onchange="actualizarPesoCriterioTradeOff(\'' + c.id + '\', this.value)" class="w-16 px-2 py-1 text-center font-mono font-bold rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500">';
      html += '    <span class="font-bold text-slate-400">%</span>';
      html += '  </div>';
      html += '</div>';
    });
    cont.innerHTML = html;
  }

  function actualizarPesoCriterioTradeOff(critId, nuevoPeso) {
    var pVal = parseFloat(nuevoPeso) || 0;
    var crit = tradeOffLocal.criterios.find(function (c) { return c.id === critId; });
    if (crit) crit.peso = pVal;
    recalcularScoresTradeOff();
  }

  function renderizarMatrizTableTradeOff() {
    var thead = document.getElementById('tradeoff-matriz-table-header');
    var tbody = document.getElementById('tradeoff-matriz-table-body');
    if (!thead || !tbody) return;

    var htmlTh = '<tr><th class="p-2 text-left font-bold text-slate-500 uppercase">Alternativa</th>';
    tradeOffLocal.criterios.forEach(function (c) {
      htmlTh += '<th class="p-2 text-center font-bold text-slate-500 uppercase">' + c.nombre + ' (' + c.peso + '%)</th>';
    });
    htmlTh += '<th class="p-2 text-center font-bold text-indigo-600 dark:text-indigo-400 uppercase">Score Ponderado</th></tr>';
    thead.innerHTML = htmlTh;

    var htmlTb = '';
    tradeOffLocal.alternativas.forEach(function (alt) {
      htmlTb += '<tr class="border-b border-slate-100 dark:border-slate-800/60">';
      htmlTb += '  <td class="p-2 font-medium text-slate-800 dark:text-slate-200">' + alt.nombre + '</td>';
      tradeOffLocal.criterios.forEach(function (c) {
        var val = (tradeOffLocal.matriz[alt.id] && tradeOffLocal.matriz[alt.id][c.id]) ? tradeOffLocal.matriz[alt.id][c.id] : 3;
        htmlTb += '  <td class="p-2 text-center">';
        htmlTb += '    <select onchange="actualizarNotaTradeOff(\'' + alt.id + '\', \'' + c.id + '\', this.value)" class="px-2 py-1 text-xs font-mono font-bold rounded bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">';
        for (var i = 1; i <= 5; i++) {
          htmlTb += '      <option value="' + i + '" ' + (i === val ? 'selected' : '') + '>' + i + ' - ' + (i === 5 ? 'Excelente' : i === 4 ? 'Bueno' : i === 3 ? 'Aceptable' : i === 2 ? 'Deficiente' : 'Crítico') + '</option>';
        }
        htmlTb += '    </select>';
        htmlTb += '  </td>';
      });
      htmlTb += '  <td class="p-2 text-center font-mono font-bold text-sm text-indigo-600 dark:text-indigo-400" id="tradeoff-score-' + alt.id + '">-</td>';
      htmlTb += '</tr>';
    });
    tbody.innerHTML = htmlTb;
  }

  function actualizarNotaTradeOff(altId, critId, valor) {
    if (!tradeOffLocal.matriz[altId]) tradeOffLocal.matriz[altId] = {};
    tradeOffLocal.matriz[altId][critId] = parseFloat(valor) || 3;
    recalcularScoresTradeOff();
  }

  function recalcularScoresTradeOff() {
    var sumaPesos = tradeOffLocal.criterios.reduce(function (acc, c) { return acc + (parseFloat(c.peso) || 0); }, 0);
    var elSum = document.getElementById('tradeoff-peso-sum');
    var elAlert = document.getElementById('tradeoff-peso-alert');
    if (elSum) elSum.textContent = Math.round(sumaPesos) + '%';
    if (elAlert) {
      if (Math.round(sumaPesos) !== 100) {
        elAlert.classList.remove('hidden');
        elAlert.textContent = 'Atención: La suma de pesos debe ser exactamente 100% (actual: ' + Math.round(sumaPesos) + '%).';
      } else {
        elAlert.classList.add('hidden');
      }
    }

    var factor = (sumaPesos > 0) ? (1 / sumaPesos) : 0.01;
    var mejorAlt = null;
    var maxScore = -1;

    tradeOffLocal.alternativas.forEach(function (alt) {
      var scoreAlt = 0;
      tradeOffLocal.criterios.forEach(function (c) {
        var nota = (tradeOffLocal.matriz[alt.id] && tradeOffLocal.matriz[alt.id][c.id]) ? tradeOffLocal.matriz[alt.id][c.id] : 3;
        scoreAlt += (parseFloat(c.peso) || 0) * nota * factor;
      });
      var elScore = document.getElementById('tradeoff-score-' + alt.id);
      if (elScore) elScore.textContent = scoreAlt.toFixed(2) + ' / 5.0';

      if (scoreAlt > maxScore) {
        maxScore = scoreAlt;
        mejorAlt = alt;
      }
    });

    var elGanadorNombre = document.getElementById('tradeoff-ganador-nombre');
    var elGanadorScore = document.getElementById('tradeoff-ganador-score');
    var elGanadorRazon = document.getElementById('tradeoff-ganador-razon');

    if (mejorAlt && maxScore >= 0) {
      if (elGanadorNombre) elGanadorNombre.textContent = mejorAlt.nombre;
      if (elGanadorScore) elGanadorScore.textContent = maxScore.toFixed(2) + ' / 5.0';
      if (elGanadorRazon) elGanadorRazon.textContent = 'Esta opción maximiza los criterios prioritarios ponderados conforme al arquetipo del proyecto.';
    }
  }

  function guardarDecisionTradeOffActiva() {
    if (!state.proyectoDetalleActivo) return;
    var sumaPesos = tradeOffLocal.criterios.reduce(function (acc, c) { return acc + (parseFloat(c.peso) || 0); }, 0);
    if (Math.round(sumaPesos) !== 100) {
      if (typeof mostrarNotificacionToast === 'function') {
        mostrarNotificacionToast('Error: Los pesos de los criterios deben sumar exactamente 100%.', 'error');
      } else {
        alert('Error: Los pesos deben sumar 100%.');
      }
      return;
    }

    var inpTitulo = document.getElementById('tradeoff-titulo-input');
    var titulo = (inpTitulo && inpTitulo.value.trim()) ? inpTitulo.value.trim() : 'Decisión Multicriterio PMO';
    var p = state.proyectoDetalleActivo;

    var payload = {
      idProyecto: p.ID_Proyecto,
      tituloDecision: titulo,
      arquetipoActivo: p.Arquetipo_Proyecto || 'Corporativo',
      criterios: tradeOffLocal.criterios,
      alternativas: tradeOffLocal.alternativas,
      matriz: tradeOffLocal.matriz
    };

    var btn = document.getElementById('tradeoff-btn-guardar');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Guardando en Sheets...';
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Guardar Decisión en BBDD';
          }
          if (res && res.success) {
            if (typeof mostrarNotificacionToast === 'function') {
              mostrarNotificacionToast('✅ Decisión registrada exitosamente: ' + (res.alternativaRecomendada || ''), 'success');
            }
            cargarHistorialTradeOff(p.ID_Proyecto);
          } else {
            var msg = (res && res.error) ? res.error : 'Error desconocido al guardar';
            if (typeof mostrarNotificacionToast === 'function') {
              mostrarNotificacionToast('❌ ' + msg, 'error');
            }
          }
        })
        .withFailureHandler(function (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'Guardar Decisión en BBDD';
          }
          if (typeof mostrarNotificacionToast === 'function') {
            mostrarNotificacionToast('❌ Error de conexión: ' + err, 'error');
          }
        })
        .guardarDecisionTradeOff(payload);
    } else {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Guardar Decisión en BBDD';
      }
      if (typeof mostrarNotificacionToast === 'function') {
        mostrarNotificacionToast('✅ Decisión guardada en sesión (modo local)', 'success');
      }
    }
  }

  function cargarHistorialTradeOff(idProyecto) {
    if (!idProyecto) return;
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.decisiones) {
            renderHistorialTradeOff(res.decisiones);
          }
        })
        .obtenerDecisionesTradeOff({ idProyecto: idProyecto });
    }
  }

  function renderHistorialTradeOff(decisiones) {
    var tbody = document.getElementById('tradeoff-historial-tbody');
    if (!tbody) return;
    if (!decisiones || decisiones.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-slate-400">Sin decisiones registradas para este proyecto.</td></tr>';
      return;
    }
    var html = '';
    decisiones.forEach(function (d) {
      html += '<tr class="border-b border-slate-100 dark:border-slate-800/60">';
      html += '  <td class="p-2 font-mono text-[11px] text-slate-400">' + (d.ID_Decision || '-') + '</td>';
      html += '  <td class="p-2 font-medium text-slate-800 dark:text-slate-200">' + (d.Titulo_Decision || '-') + '</td>';
      html += '  <td class="p-2 font-bold text-indigo-600 dark:text-indigo-400">' + (d.Alternativa_Recomendada || '-') + '</td>';
      html += '  <td class="p-2 font-mono font-bold text-center">' + (parseFloat(d.Score_Ganador) || 0).toFixed(2) + '</td>';
      html += '  <td class="p-2 font-mono text-[11px] text-slate-400 text-right">' + (String(d.Fecha_Registro || '').split('T')[0] || '-') + '</td>';
      html += '</tr>';
    });
    tbody.innerHTML = html;
  }
