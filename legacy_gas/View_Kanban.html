<!-- ===================================================================== -->
<!-- 2.1. VISTA TABLERO KANBAN                                              -->
<!-- ===================================================================== -->
<div id="vista-kanban-wrapper" class="flex-1 flex h-full w-full overflow-y-auto md:overflow-hidden">
  <aside id="sidebar-portafolio"
    class="sidebar-expanded hidden md:flex flex-col bg-slate-900 text-white border-r border-slate-800 shrink-0 h-full z-40 transition-all duration-300">
    <!-- Cabecera del Sidebar -->
    <div class="p-3 border-b border-slate-800 bg-slate-950/70 shrink-0">
      <div class="flex items-center justify-between gap-2 sidebar-header-row">
        <div class="flex items-center gap-2 min-w-0">
          <span class="hide-on-collapse flex items-center justify-center shrink-0" title="Portafolio de Proyectos">
            <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm text-indigo-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
          </span>
          <div class="hide-on-collapse flex items-center gap-2 min-w-0">
            <h1 class="text-xs font-black tracking-wider uppercase text-slate-100 truncate">Proyectos</h1>
            <span id="badge-total-proyectos-sidebar"
              class="px-2 py-0.5 text-[10px] font-mono font-bold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 shrink-0 transition-all"
              title="Total proyectos activos filtrados">0</span>
          </div>
        </div>
        <!-- Botón de Contraer / Expandir en la cabecera (siempre accesible) -->
        <button type="button" id="btn-toggle-sidebar-header" onclick="toggleSidebarCollapse()"
          title="Contraer / Expandir panel"
          class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition shrink-0 flex items-center justify-center">
          <svg id="icon-toggle-header" class="portal-icon-sm transition-transform duration-200" fill="none"
            stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          </svg>
        </button>
      </div>

      <!-- Barra de Búsqueda / Filtro Rápido en Tiempo Real -->
      <div class="hide-on-collapse mt-2.5 relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-slate-400 text-xs">
          <svg class="portal-icon-sm" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text" id="sidebar-search-proyectos" oninput="filtrarProyectosSidebarEnVivo(this.value)"
          placeholder="Buscar por nombre o PRO-..."
          class="w-full bg-slate-900/90 text-slate-100 placeholder-slate-400 text-xs rounded-lg border border-slate-700/80 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 pl-8 pr-7 py-1.5 transition outline-none" />
        <button type="button" id="btn-clear-search-sidebar" onclick="limpiarBusquedaSidebar()"
          class="hidden absolute inset-y-0 right-0 flex items-center pr-2 text-slate-400 hover:text-slate-200 active:scale-95 transition-transform duration-150 text-xs font-bold"
          title="Limpiar búsqueda">✕</button>
      </div>

      <!-- Filtros rápidos por Cartera / Tipo de Iniciativa -->
      <div class="hide-on-collapse flex items-center gap-1 flex-wrap mt-2 pt-2 border-t border-slate-800/60">
        <button type="button" data-tipo="" onclick="filtrarPorPildoraTipo('')"
          class="pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-indigo-600 text-white transition">Todos</button>
        <button type="button" data-tipo="Personal" onclick="filtrarPorPildoraTipo('Personal')"
          class="pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-400 hover:text-white transition">Personal</button>
        <button type="button" data-tipo="Profesional" onclick="filtrarPorPildoraTipo('Profesional')"
          class="pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-400 hover:text-white transition">Profesional</button>
        <button type="button" data-tipo="Inversiones" onclick="filtrarPorPildoraTipo('Inversiones')"
          class="pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-400 hover:text-white transition">Inversiones</button>
        <button type="button" data-tipo="Social" onclick="filtrarPorPildoraTipo('Social')"
          class="pill-tipo text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-800 text-slate-400 hover:text-white transition">Social</button>
      </div>
    </div>

    <!-- Listado Scrollable de Proyectos -->
    <div id="lista-proyectos-sidebar" class="flex-1 overflow-y-auto p-2.5 space-y-2 kanban-col-body"></div>

    <!-- Pie del Sidebar con Botón Nuevo Proyecto -->
    <div class="p-2.5 border-t border-slate-800 bg-slate-950/80 shrink-0">
      <!-- Botón directo "Nuevo Proyecto" destacado -->
      <button type="button" onclick="abrirWizardProyecto()" title="Crear nuevo proyecto"
        class="w-full py-2 px-3 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs font-bold shadow-md shadow-indigo-900/30 flex items-center justify-center gap-2 transition duration-150 border border-indigo-400/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm text-indigo-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        <span class="hide-on-collapse whitespace-nowrap tracking-wide font-semibold">Nuevo Proyecto</span>
      </button>
    </div>

  </aside>

  <!-- ÁREA CENTRAL DEL TABLERO KANBAN -->
  <main
    class="flex-1 flex flex-col h-full overflow-y-auto md:overflow-hidden bg-slate-100 dark:bg-slate-950 transition-colors duration-200">
    <header
      class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2 shrink-0 flex flex-col gap-2 shadow-2xs transition-colors duration-200 overflow-visible relative">
      <!-- FILA 1: IDENTIDAD, CONTEXTO Y RESUMEN FINANCIERO -->
      <div class="flex items-center gap-3 min-h-[36px] overflow-visible relative w-full">
        <!-- Extremo Izquierdo: Identidad y Segmentación de Contexto Ancladas -->
        <div class="flex items-center gap-3 shrink-0">
          <h2
            class="font-bold text-slate-800 dark:text-slate-100 text-sm md:text-base flex items-center gap-2 shrink-0">
            <span>Tablero Kanban</span>
          </h2>

          <!-- Segmentación rápida con icono y contador (Anclada a la izquierda sin desplazamientos) -->
          <div
            class="hidden sm:inline-flex p-0.5 bg-slate-100 dark:bg-slate-950/70 rounded-lg border border-slate-200 dark:border-slate-800 shadow-2xs shrink-0">
            <button type="button" id="btn-context-todos" onclick="setKanbanContextFilter('TODOS')"
              class="px-2.5 py-1 rounded-md text-xs font-bold transition-all duration-200 flex items-center gap-1.5 bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-xs border border-indigo-100 dark:border-slate-700"
              title="Ver todas las tareas de proyectos y actividades personales">
              <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              <span>Todo</span>
              <span id="badge-context-todos"
                class="text-[10px] px-1.5 py-0.2 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-extrabold border border-indigo-200 dark:border-indigo-800/60">0</span>
            </button>
            <button type="button" id="btn-context-proyectos" onclick="setKanbanContextFilter('PROYECTOS')"
              class="px-2.5 py-1 rounded-md text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 border border-transparent"
              title="Ver únicamente tareas asociadas a proyectos">
              <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
              <span>Proyectos</span>
              <span id="badge-context-proyectos"
                class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-400 font-extrabold border border-transparent">0</span>
            </button>
            <button type="button" id="btn-context-personal" onclick="setKanbanContextFilter('PERSONAL')"
              class="px-2.5 py-1 rounded-md text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 border border-transparent"
              title="Ver únicamente compromisos y actividades personales">
              <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Personal</span>
              <span id="badge-context-personal"
                class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-400 font-extrabold border border-transparent">0</span>
            </button>
          </div>
        </div>

        <!-- Centro Contenido: Chip/Badge del Proyecto Seleccionado y Metadatos -->
        <div id="label-proyecto-activo-container" class="flex items-center gap-2 min-w-0 max-w-[260px] transition-all duration-300 ease-out">
          <span id="label-proyecto-activo"
            class="text-xs px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold border border-slate-200 dark:border-slate-700 truncate max-w-[260px] inline-flex items-center gap-1.5 transition-all duration-200"
            title="Vista Global de todas las tareas">
            <svg xmlns="http://www.w3.org/2000/svg" class="portal-icon-sm shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span class="truncate">Vista Global</span>
          </span>

          <!-- Metadatos Compactos del Proyecto Activo (Solo cuando hay proyecto seleccionado) -->
          <div id="kanban-proy-meta-bar" class="hidden items-center gap-1.5 shrink-0 text-xs transition-opacity duration-200">
            <!-- Health Badge Dinámico con Tooltip -->
            <div id="kanban-proy-health-badge"
              class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold border cursor-help shadow-2xs bg-emerald-50 text-emerald-800 border-emerald-300 dark:bg-emerald-950/70 dark:text-emerald-300 dark:border-emerald-800"
              title="Salud operativa del cronograma">
              <span id="kanban-proy-health-icon" class="w-2 h-2 rounded-full bg-emerald-500 shrink-0 inline-block"></span>
              <span id="kanban-proy-health-label">Saludable</span>
            </div>

            <!-- Semáforo Financiero Dual: Badge CPI Dinámico -->
            <div id="kanban-proy-cpi-badge"
              class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold border cursor-help shadow-2xs font-mono tabular-nums bg-slate-50 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700"
              title="Cost Performance Index: Calculando...">
              <span class="text-[10px] text-slate-400 font-sans font-semibold">CPI</span>
              <span id="kanban-proy-cpi-val">1.00</span>
            </div>

            <!-- Botón Rápido Check-in de Gobernanza -->
            <button type="button" id="btn-quick-checkin" onclick="ejecutarCheckinDesdeKanban()"
              class="hidden px-2 py-0.5 rounded-full text-[10px] font-bold shadow-2xs transition items-center gap-1"
              title="Registrar revisión y check-in de control ahora">
              <span>✓ Check-in</span>
            </button>

            <!-- Botón Acceso Rápido Vista 360 -->
            <button type="button" onclick="abrirDetalle360(state.selectedProjectId)"
              class="px-2 py-0.5 rounded-full bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 text-[10px] font-bold shadow-2xs transition inline-flex items-center gap-1"
              title="Abrir Vista Detallada 360° de este proyecto">
              <svg class="portal-icon-sm shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              <span>Vista 360°</span>
            </button>
          </div>
        </div>

        <!-- Extremo Derecho: Filtros de tiempo + Gasto Global (Anclado con ml-auto para cero saltos) -->
        <div class="ml-auto flex items-center gap-2 shrink-0">
          <!-- Cápsula Compacta Filtro Temporal con Micro-Popover Flotante Glassmorphism -->
          <div class="relative group/timefilter shrink-0 kanban-hover-popover-container" id="container-time-filter">
            <!-- Botón Cápsula que muestra el filtro temporal activo -->
            <button type="button" id="btn-time-capsule" onclick="toggleTimeFilterDropdown(event)"
              class="btn-portal-secondary inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-semibold cursor-pointer select-none"
              title="Filtro de horizonte temporal (Pasa el cursor o presiona para cambiar)">
              <span id="label-time-active-icon" class="text-xs select-none flex items-center justify-center">
                <svg class="portal-icon-sm shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M8 2v4" />
                  <path d="M16 2v4" />
                  <rect width="18" height="18" x="3" y="4" rx="2" />
                  <path d="M3 10h18" />
                </svg>
              </span>
              <span id="label-time-active-text" class="text-xs font-semibold">Todo</span>
              <svg class="portal-icon-sm text-slate-400 group-hover/timefilter:rotate-180 transition-transform duration-200"
                fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
              </svg>
            </button>

            <!-- Micro-Popover Flotante Glassmorphism (Hover en Desktop & Tap en Móvil) -->
            <div id="popover-time-filter"
              class="kanban-hover-popover invisible opacity-0 group-hover/timefilter:visible group-hover/timefilter:opacity-100 transition-all duration-200 absolute right-0 top-full mt-1.5 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200/90 dark:border-slate-700/60 rounded-xl shadow-2xl p-1.5 min-w-[160px] space-y-0.5 pointer-events-none group-hover/timefilter:pointer-events-auto before:content-[''] before:absolute before:-top-2 before:left-0 before:right-0 before:h-2">
              <button type="button" id="btn-time-todo" onclick="setKanbanTimeFilter('TODO')"
                class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center justify-between transition-colors bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 cursor-pointer">
                <span class="flex items-center gap-1.5 select-none"><svg class="portal-icon-sm shrink-0 text-slate-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>Todo</span></span>
                <span id="check-time-todo" class="text-indigo-600 dark:text-indigo-400 font-bold text-xs">✓</span>
              </button>
              <button type="button" id="btn-time-hoy" onclick="setKanbanTimeFilter('HOY')"
                class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white cursor-pointer">
                <span class="flex items-center gap-1.5 select-none"><svg class="portal-icon-sm shrink-0 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Hoy</span></span>
                <span id="check-time-hoy" class="hidden text-indigo-600 dark:text-indigo-400 font-bold text-xs">✓</span>
              </button>
              <button type="button" id="btn-time-semana" onclick="setKanbanTimeFilter('SEMANA')"
                class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white cursor-pointer">
                <span class="flex items-center gap-1.5 select-none"><svg class="portal-icon-sm shrink-0 text-indigo-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg><span>Semana</span></span>
                <span id="check-time-semana"
                  class="hidden text-indigo-600 dark:text-indigo-400 font-bold text-xs">✓</span>
              </button>
              <button type="button" id="btn-time-mes" onclick="setKanbanTimeFilter('MES')"
                class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white cursor-pointer">
                <span class="flex items-center gap-1.5 select-none"><svg class="portal-icon-sm shrink-0 text-purple-500" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M17 14h-6"/><path d="M13 18H7"/><path d="M7 14h.01"/><path d="M17 18h.01"/></svg><span>Mes</span></span>
                <span id="check-time-mes" class="hidden text-indigo-600 dark:text-indigo-400 font-bold text-xs">✓</span>
              </button>
            </div>
          </div>

          <!-- Gasto Contextual (Global si no hay proyecto, o del proyecto si está filtrado) -->
          <div
            class="hidden md:flex items-center text-xs bg-slate-50 dark:bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 font-medium shrink-0">
            <span class="text-slate-500 dark:text-slate-400 text-xs flex items-center">
              <span id="lbl-gasto-contextual-titulo">Gasto Global:</span>
              <b id="lbl-gasto-contextual" class="text-slate-900 dark:text-slate-100 font-bold font-mono ml-1">PEN
                0.00</b>
            </span>
          </div>
        </div>
      </div>

      <!-- FILA 2: BARRA DE FILTROS INTERACTIVA, COMPACTA Y BASADA EN ICONOS (Máximo 1 fila fija) -->
      <div
        class="portal-surface p-2.5 my-2 flex items-center gap-2 text-xs overflow-visible relative min-h-[34px]">
        <!-- Buscador Rápido -->
        <div class="relative min-w-[150px] max-w-[180px] shrink-0">
          <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-slate-400 text-xs">
            <svg class="portal-icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input type="text" id="filter-buscar-tarea" oninput="aplicarFiltrosCruzados()" placeholder="Buscar tarea..."
            title="Buscar por título, código o responsable de tarea"
            class="w-full bg-slate-100/75 dark:bg-slate-900/30 text-slate-700 dark:text-slate-200 placeholder-slate-400 text-xs rounded-xl border border-slate-200/80 dark:border-slate-800/60 focus:border-indigo-500/70 focus:ring-1 focus:ring-indigo-500/50 pl-8 pr-6 py-1 outline-none transition duration-150 hover:bg-slate-200/50 dark:hover:bg-slate-800/60" />
          <button type="button" id="btn-clear-task-search" onclick="limpiarBusquedaTareas()"
            class="hidden absolute inset-y-0 right-0 flex items-center pr-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 active:scale-95 transition-transform duration-150 text-xs font-bold"
            title="Limpiar búsqueda">✕</button>
        </div>
